 en un texto con tokens especiales que termina con el turno del asistente abierto. A la vuelta, parsea el texto en un mensaje, tool_calls y finish_reason. <em>Qué no hace:</em> Los roles no son canales separados: system, user, los resultados de tools y los pasajes recuperados terminan todos como texto en un solo prompt. <a href="lessons/from-base-model-to-assistant.html?lang=es">Lección 07 · De modelo base a asistente</a>, <a href="lessons/the-chat-api-on-the-wire.html?lang=es">Lección 09 · La API de chat en el cable</a></dd><dt id="bp-text-tokenizer">Tokenizador · 100.352 pedazos</dt><dd>Parte el texto en pedazos de un vocabulario fijado antes del entrenamiento, y convierte los pedazos elegidos de vuelta en texto. Las palabras frecuentes son un pedazo; las raras, los códigos y otros idiomas llevan varios. El costo, los límites y el contexto se cuentan en estos pedazos. <em>Qué no hace:</em> Un token no es una palabra: CAU-4021 son cinco, y el mismo runbook lleva cerca de un 28 por ciento más de tokens en español. <a href="lessons/tokens-not-words.html?lang=es">Lección 02 · Tokens, no palabras</a>, <a href="lessons/the-model-remembers-nothing.html?lang=es">Lección 04 · El modelo no recuerda nada</a></dd><dt id="bp-text-model">Granite 4.2 3B · 3.660 millones de pesos, 4 bits</dt><dd>El modelo de lenguaje. Para los tokens de su contexto calcula un puntaje para cada token del vocabulario. La atención deja que cada token pese a todos los anteriores, y la caché KV guarda sus keys y values. Q4_K_M guarda los pesos en unos 5 bits: un archivo de 2,24 GB, que se lee para cada token que escribe. <em>Qué no hace:</em> No guarda ninguna conversación ni sabe nada que no haya visto en el entrenamiento o en el prompt. Devuelve una distribución, no una palabra, y probable no es verdadero. <a href="lessons/one-token-at-a-time.html?lang=es">Lección 01 · De a un token</a>, <a href="lessons/attention.html?lang=es">Lección 06 · Atención</a>, <a href="lessons/from-base-model-to-assistant.html?lang=es">Lección 07 · De modelo base a asistente</a>, <a href="lessons/size-quantization-and-hardware.html?lang=es">Lección 08 · Tamaño, cuantización y hardware</a></dd><dt id="bp-text-sampler">Sampler · temperatura, top_k, top_p, semilla</dt><dd>Elige el próximo token de la distribución: el favorito con temperatura 0, un sorteo si no, después de que top_k, top_p y min_p sacan la cola. Con un schema, una gramática deja pasar solo los tokens que mantienen válido el JSON. Cada token elegido se agrega y el modelo corre otra vez. <em>Qué no hace:</em> Una semilla repite los sorteos solo con el mismo texto, parámetros, servidor y archivo de modelo; no entre máquinas. <a href="lessons/one-token-at-a-time.html?lang=es">Lección 01 · De a un token</a>, <a href="lessons/sampling.html?lang=es">Lección 03 · Muestreo</a>, <a href="lessons/structured-output.html?lang=es">Lección 10 · Salida estructurada</a></dd><dt id="bp-text-indexer">Indexador · app index</dt><dd>Parte cada runbook por sección, encabeza cada chunk con los títulos de su archivo y su sección, escribe su metadata (fuente, sección, idioma, posición, confianza), lo embebe y guarda la fila. <em>Qué no hace:</em> La metadata que no se escribe acá no se puede filtrar después: la etiqueta de confianza de la lección 19 existe por este paso. <a href="lessons/chunk-and-index.html?lang=es">Lección 14 · Partir e indexar</a>, <a href="lessons/prompt-injection.html?lang=es">Lección 19 · Prompt injection</a></dd><dt id="bp-text-retrieval">Recuperación · vector, palabras, híbrida, rerank, filtro</dt><dd>Retrieval.java: embebe la consulta después de una instrucción, busca por distancia coseno, por palabras con full text, o por las dos juntas con reciprocal rank fusion; puede reordenar un conjunto de 20 y filtrar por metadata antes de ordenar. Devuelve k chunks con cómo ganó cada uno su lugar. La tool MCP search_runbooks corre el mismo código. <em>Qué no hace:</em> Siempre hay un top k, aunque nada responda, y una búsqueda por significado no encuentra un código exacto. <a href="lessons/search.html?lang=es">Lección 15 · Buscar</a>, <a href="lessons/rerank-and-filter.html?lang=es">Lección 17 · Reordenar y filtrar</a>, <a href="lessons/evaluate.html?lang=es">Lección 18 · Evaluar</a></dd><dt id="bp-text-ragprompt">Prompt de RAG · fuentes y reglas</dt><dd>Rag.java: numera los chunks recuperados y arma el prompt, instrucción, fuentes, reglas y pregunta, con el RetrievalAugmentationAdvisor de Spring AI. Verifica que cada cita nombre un chunk que mandó, y detecta el no sé. <em>Qué no hace:</em> Una regla en el prompt no es un filtro: un pasaje plantado igual puede darle órdenes al modelo. Si una oración dice lo que dice su chunk se evalúa aparte. <a href="lessons/why-rag.html?lang=es">Lección 13 · Por qué RAG</a>, <a href="lessons/answer-with-sources.html?lang=es">Lección 16 · Responder con fuentes</a>, <a href="lessons/prompt-injection.html?lang=es">Lección 19 · Prompt injection</a></dd><dt id="bp-text-chatclient">ChatClient · Spring AI 2.0.1</dt><dd>La llamada de la app al modelo, con el starter de OpenAI apuntando al servidor de chat: entran mensajes y opciones, salen la respuesta y su uso. entity() pide un record como JSON, los métodos @Tool se vuelven tools, un advisor de memoria vuelve a mandar el historial, y el agente pasa las tools MCP como ToolCallbacks. <em>Qué no hace:</em> Manda lo que le das: sin memoria salvo que un advisor la vuelva a mandar, y sin control del significado más allá de tu propio código. <a href="lessons/spring-ai.html?lang=es">Lección 12 · Spring AI</a>, <a href="lessons/why-rag.html?lang=es">Lección 13 · Por qué RAG</a>, <a href="lessons/answer-with-sources.html?lang=es">Lección 16 · Responder con fuentes</a>, <a href="lessons/a-model-that-uses-mcp.html?lang=es">Lección 23 · Un modelo que usa MCP</a></dd><dt id="bp-text-guard">Guard · aprobar, permitir, presupuesto</dt><dd>Los controles del host sobre las llamadas a tools. Guard.java imprime cada llamada, corta la corrida después de --max-steps llamadas, 6 por defecto, y con --approve frena una llamada que cambia datos hasta que una persona escribe yes. --allow, en Agent.java, ofrece solo las tools que nombra. <em>Qué no hace:</em> No lee intenciones: frena llamadas por tipo y por cantidad, y una respuesta igual puede afirmar una acción que nunca se ejecutó. <a href="lessons/a-model-that-uses-mcp.html?lang=es">Lección 23 · Un modelo que usa MCP</a>, <a href="lessons/security-in-mcp.html?lang=es">Lección 24 · Seguridad en MCP</a></dd><dt id="bp-text-mcpclients">Clientes MCP · Agent.java: un cliente por servidor, JSON-RPC 2.0</dt><dd>Agent.java se conecta a cada servidor que nombra --servers con el cliente MCP de Spring AI, lista sus tools con sus anotaciones y manda tools/call cuando el modelo lo pide. Streamable HTTP, revisión 2025-11-25. <em>Qué no hace:</em> El modelo nunca habla con un servidor: le pide al host, y el host decide si un cliente manda la llamada. <a href="lessons/what-mcp-standardizes.html?lang=es">Lección 20 · Qué estandariza MCP</a>, <a href="lessons/a-model-that-uses-mcp.html?lang=es">Lección 23 · Un modelo que usa MCP</a>, <a href="lessons/security-in-mcp.html?lang=es">Lección 24 · Seguridad en MCP</a></dd><dt id="bp-text-corpus">Corpus · 16 runbooks, 2 notas</dt><dd>Los runbooks de Cauce, los mismos ocho en inglés y en español, las dos notas de proveedor de extra/ y incidents.json, montados de solo lectura en los contenedores. <em>Qué no hace:</em> Nada lo escribe: los cierres van al volumen de estado, los chunks a la base. <a href="lessons/why-rag.html?lang=es">Lección 13 · Por qué RAG</a>, <a href="lessons/chunk-and-index.html?lang=es">Lección 14 · Partir e indexar</a>, <a href="lessons/prompt-injection.html?lang=es">Lección 19 · Prompt injection</a></dd><dt id="bp-text-pgvector">vector_store · pgvector 0.8.7</dt><dd>Una fila por chunk: content, metadata como JSON, embedding vector(1024) con un índice HNSW, y la columna words con un índice GIN para el full text. Sus carriles son la etiqueta de confianza: runbook para los 16 runbooks, external para las notas de la lección 19. <em>Qué no hace:</em> HNSW es aproximado y el planificador puede ignorarlo: con 86 filas compara todas. Un filtro solo funciona sobre metadata escrita al indexar. <a href="lessons/chunk-and-index.html?lang=es">Lección 14 · Partir e indexar</a>, <a href="lessons/search.html?lang=es">Lección 15 · Buscar</a>, <a href="lessons/prompt-injection.html?lang=es">Lección 19 · Prompt injection</a></dd><dt id="bp-text-incidents">Incidentes · INC-2041 a 2044</dt><dd>Los cuatro incidentes de Cauce, leídos de incidents.json en el corpus, más los cierres hechos en los labs, guardados aparte en el volumen de estado que comparten la app y el servidor MCP. <em>Qué no hace:</em> reset reabre lo que cerraron los labs; el archivo del corpus nunca se escribe. <a href="lessons/tool-calling.html?lang=es">Lección 11 · Tool calling</a>, <a href="lessons/what-mcp-standardizes.html?lang=es">Lección 20 · Qué estandariza MCP</a>, <a href="lessons/a-model-that-uses-mcp.html?lang=es">Lección 23 · Un modelo que usa MCP</a></dd><dt id="bp-text-mcpserver">Servidor del curso · Spring, 2025-11-25</dt><dd>El mismo jar de la app con el perfil mcp, en http://mcp:8081/mcp: cuatro tools, un resource, un resource template y un prompt, declarados con @McpTool, @McpResource y @McpPrompt. Con el perfil stdio sirve lo mismo por stdin y stdout. search_runbooks corre la recuperación de la lección 18, solo runbooks. <em>Qué no hace:</em> Habla solo 2025-11-25: un pedido moderno recibe 400. Sus anotaciones son afirmaciones; un cliente las cree solo si confía en el servidor. <a href="lessons/what-mcp-standardizes.html?lang=es">Lección 20 · Qué estandariza MCP</a>, <a href="lessons/two-revisions-on-the-wire.html?lang=es">Lección 21 · Dos revisiones en el cable</a>, <a href="lessons/an-mcp-server-in-spring.html?lang=es">Lección 22 · Un servidor MCP en Spring</a>, <a href="lessons/an-assistant-you-can-defend.html?lang=es">Lección 25 · Un asistente que se puede defender</a></dd><dt id="bp-text-poisoned">Servidor envenenado · una orden en un resultado</dt><dd>El servidor de TypeScript con VARIANT=poisoned: las dos tools de incidentes de solo lectura más get_service_health, que esconde una orden &lt;IMPORTANT&gt; en su descripción y un SYSTEM NOTICE en su resultado. Arranca solo cuando se lo nombra. <em>Qué no hace:</em> No necesita una tool propia para hacer daño: su orden hizo que el modelo llamara a close_incident en el servidor del curso. <a href="lessons/security-in-mcp.html?lang=es">Lección 24 · Seguridad en MCP</a></dd><dt id="bp-text-modern">Servidor moderno · TypeScript, 2026-07-28</dt><dd>Las dos tools de incidentes de solo lectura con el SDK oficial de TypeScript v2, en la revisión 2026-07-28: sin initialize ni sesión; cada pedido lleva su versión en encabezados y en _meta. También responde initialize en 2025-11-25, sin sesión. <em>Qué no hace:</em> Sin estado no es autenticado: el kit no tiene autenticación. Responde 403 a un Origin ajeno. <a href="lessons/two-revisions-on-the-wire.html?lang=es">Lección 21 · Dos revisiones en el cable</a></dd><dt id="bp-text-nomodel">Inspector, mcp-wire · MCP a mano</dt><dd>Dos clientes que prueban un servidor sin un modelo en el medio: el MCP Inspector en modo línea de comandos, y mcp-wire, un comando del cliente del laboratorio que escribe cada pedido a mano y muestra encabezados y cuerpos. <em>Qué no hace:</em> Muestran lo que un servidor ofrece y responde, no lo que un modelo va a hacer con eso. <a href="lessons/what-mcp-standardizes.html?lang=es">Lección 20 · Qué estandariza MCP</a>, <a href="lessons/two-revisions-on-the-wire.html?lang=es">Lección 21 · Dos revisiones en el cable</a>, <a href="lessons/an-mcp-server-in-spring.html?lang=es">Lección 22 · Un servidor MCP en Spring</a></dd></dl></section><section><h3>Qué viaja</h3><dl><dt>Q · Pregunta</dt><dd>Lo que alguien pregunta, en inglés o en español. <em>De dónde viene:</em> Vos, en la línea de comandos del lab o de la app. <em>Dónde termina:</em> Un mensaje de user en el prompt; con RAG, también la consulta de la búsqueda.</dd><dt>P · Prompt</dt><dd>Todo lo que el modelo lee en un pedido: mensajes e historial, fuentes recuperadas y reglas, definiciones de tools, convertido por la plantilla en un solo texto. <em>De dónde viene:</em> El cliente: el lab o la app. <em>Dónde termina:</em> El servidor de chat, donde tiene que entrar en 8192 tokens.</dd><dt>T · Tokens</dt><dd>Los números de los pedazos que cortó el tokenizador: la unidad del contexto, del costo y de los límites. <em>De dónde viene:</em> El tokenizador. <em>Dónde termina:</em> El modelo, y el usage de la respuesta.</dd><dt>V · Vector</dt><dd>1024 números para un texto: una dirección que representa su significado. <em>De dónde viene:</em> El modelo de embeddings. <em>Dónde termina:</em> vector_store, o una comparación por coseno.</dd><dt>C · Chunks</dt><dd>Secciones de los runbooks, encabezadas por sus títulos y con su metadata: la unidad que devuelve la recuperación. <em>De dónde viene:</em> El indexador. <em>Dónde termina:</em> vector_store, y después las fuentes numeradas de un prompt.</dd><dt>A · Respuesta</dt><dd>El texto que escribió el modelo, con su finish_reason y su usage; con RAG, sus citas. <em>De dónde viene:</em> El sampler, de a un token. <em>Dónde termina:</em> El cliente, que puede verificar las citas, no la verdad.</dd><dt>K · Llamada a una tool</dt><dd>El nombre de una tool y sus argumentos como texto JSON, escritos por el modelo. <em>De dónde viene:</em> El modelo, parseado por el endpoint de chat en tool_calls. <em>Dónde termina:</em> La aplicación, que decide si la ejecuta.</dd><dt>R · Resultado de una tool</dt><dd>Lo que devolvió una tool, mandado de vuelta como un mensaje con rol tool. <em>De dónde viene:</em> La aplicación o un servidor MCP. <em>Dónde termina:</em> El contexto del modelo: texto que lee como cualquier otro.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
