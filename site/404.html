<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page not found · Prumathe</title>
<!-- Served by the host for any missing path, so this page carries its own styles and links only to
     the site root. -->
<style>
  :root { color-scheme: light dark; --paper: #f6f5ed; --ink: #183c35; --green: #21664e; --muted: #64756a; --line: #d5dcd0; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0f1f1c; --ink: #e4ede7; --green: #5ec79c; --muted: #9bb0a6; --line: #2d463f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 1rem/1.6 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 36rem; padding: 2rem 1.25rem; }
  .eyebrow { font: 0.7rem ui-monospace, Consolas, monospace; letter-spacing: 2px; color: var(--green); }
  h1 { font: 400 2.25rem/1.15 Georgia, serif; letter-spacing: -1px; margin: 0.5rem 0 1rem; }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  a { display: inline-block; padding: 0.6rem 1rem; border: 1px solid var(--line); border-radius: 6px; background: var(--green); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <span class="eyebrow">404 / PRUMATHE</span>
  <h1>This page could not be found.</h1>
  <p>Esta página no existe. Los cursos están en la portada.</p>
  <a href="/">Go to the home page / Ir a la portada →</a>
</main>
</body>
</html>
