# Se activa cuando esta carpeta se copia como raíz de un repositorio independiente.
name: Validate GitHub course
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm run test:labs
