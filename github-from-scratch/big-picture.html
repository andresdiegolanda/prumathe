<body class="bp-page"><div id="bp"></div><noscript><main class="bp-noscript"><h2>Big picture</h2><p>One change, from Ana&#39;s desk to an accepted history</p><p>Ana and Bruno maintain the Faro library guide. Each has a clone with its own history; GitHub hosts the shared repository and the conversation around a change. This picture puts every piece of the course on one scene.</p><p>Pick a journey: the dot is the change, and its letters are what it carries. Each stop says what is decided there and which lesson goes deeper. Click any piece, or any area, for its card.</p><p>Tags say how to see a stop for yourself: LAB with real Git on your computer, GITHUB in your practice repository, MODEL only in the lessons.</p><section class="bp-text-journey"><h3>A · Record a change</h3><p>working tree, index, commit</p><ol><li><strong>Working tree</strong>: Ana changes the opening hour from 09:00 to 10:00 and starts an unfinished note. Both edits are only on her desk. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a> <code>node lab.mjs local</code></li><li><strong>Staging area</strong>: git add guide.txt prepares that content for the next commit: the content, not just the file name. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a> <code>node lab.mjs staging</code></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[11:00 here]</span>: She edits again, to 11:00. The prepared content is still 10:00 until she adds again. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a></li><li><strong>Staging area</strong> <span class="bp-text-stamp">[10:00 here]</span>: Two comparisons: git diff shows 10:00 to 11:00; git diff --staged shows 09:00 to 10:00. <span class="bp-text-tag">Lab</span> <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[commit]</span>: git commit records the index as a snapshot, with a message, metadata and a link to its parent. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/commits.html?lang=en">Lesson 02 · Commits: snapshots with a reason</a> <code>node lab.mjs snapshots</code></li><li><strong>Commits and branches</strong>: Unchanged content is reused inside, not copied. The message says why: Fix hours after winter schedule change. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/commits.html?lang=en">Lesson 02 · Commits: snapshots with a reason</a></li></ol><p><strong>End of the journey:</strong> Saving, preparing and recording are three different acts. A commit records the index, so prepare exactly the decision you want to explain.</p></section><section class="bp-text-journey"><h3>B · Branches, merges, conflicts</h3><p>names that move, two parents, one question</p><ol><li><strong>Commits and branches</strong>: main names the accepted history. git switch -c hours gives the same commit a second name; no new version is needed. <span class="bp-text-tag">Lab</span> <a href="lessons/branches.html?lang=en">Lesson 04 · Branches are movable names</a> <code>node lab.mjs branches</code></li><li><strong>Working tree</strong>: With hours checked out, Ana changes the hours. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/branches.html?lang=en">Lesson 04 · Branches are movable names</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[hours moved]</span>: Her commit advances hours, where HEAD points; main stays where it was. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/branches.html?lang=en">Lesson 04 · Branches are movable names</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[fast-forward]</span>: If main has not moved, merging hours is a fast-forward: main moves to the tip, with no merge commit. <span class="bp-text-tag">Lab</span> <a href="lessons/merging.html?lang=en">Lesson 05 · Merging histories</a> <code>node lab.mjs merge</code></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[2 parents]</span>: If both lines advanced, Git combines them from their shared ancestor and records a merge commit with two parents. <span class="bp-text-tag">Lab</span> <a href="lessons/merging.html?lang=en">Lesson 05 · Merging histories</a></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[conflict]</span>: Ana wrote 10:00 and Bruno 11:00 on the same line: a conflict. Git cannot decide the library&#39;s schedule. <span class="bp-text-tag">Lab</span> <a href="lessons/conflicts.html?lang=en">Lesson 06 · Conflicts are unanswered questions</a> <code>node lab.mjs conflict</code></li><li><strong>Staging area</strong>: They agree on 10:30, replace the markers with it and add the result. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/conflicts.html?lang=en">Lesson 06 · Conflicts are unanswered questions</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[10:30]</span>: The merge commit records the decision. Then check the meaning: a workshop at 09:30 would now contradict the guide. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/conflicts.html?lang=en">Lesson 06 · Conflicts are unanswered questions</a></li></ol><p><strong>End of the journey:</strong> Branches are names; merging combines histories; a conflict is a question only people can answer. Text that merges cleanly can still say two things at once.</p></section><section class="bp-text-journey"><h3>C · Publish, fetch, integrate</h3><p>three references to main, and a rejected push</p><ol><li><strong>Commits and branches</strong>: Ana has committed 10:00 on main. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a> <code>node lab.mjs sync</code></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[pushed]</span>: git push proposes moving main on GitHub to her commit. It is a fast-forward, so it is accepted. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>origin/main</strong>: Ana&#39;s origin/main records that main on GitHub is now her commit: her last view, until the next fetch or push. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a></li><li><strong>Bruno&#39;s origin/main</strong> <span class="bp-text-stamp">[fetched]</span>: Bruno runs git fetch. His origin/main moves; his main and his files do not. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Bruno&#39;s commits</strong> <span class="bp-text-stamp">[ff-only]</span>: He integrates with git merge --ff-only origin/main: his guide now says 10:00. <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Bruno&#39;s working tree</strong>: He adds a contact file, without fetching again. <em>What the dot carries: Edit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Bruno&#39;s commits</strong>: He commits it on main. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[rejected]</span>: Meanwhile Ana published 11:00. His push is rejected as non-fast-forward: it would drop her commit, and main on GitHub does not move. <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Bruno&#39;s origin/main</strong>: He fetches again. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Bruno&#39;s commits</strong> <span class="bp-text-stamp">[merged]</span>: He merges origin/main: his history now has both authors&#39; work. <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[pushed]</span>: His push now includes Ana&#39;s commit: accepted. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></li></ol><p><strong>End of the journey:</strong> Fetch learns, integration decides, push proposes. The rejected push protected Ana&#39;s work; the fix was to integrate, not to force.</p></section><section class="bp-text-journey"><h3>D · From an issue to a pull request</h3><p>the problem, then a proposal</p><ol><li><strong>Issue</strong>: A visitor arrived at 09:00 and found the library closed. The issue records what was seen, what was expected and who can confirm the real schedule. <em>What the dot carries: Problem statement.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/issues.html?lang=en">Lesson 10 · Issues: agree on the problem</a></li><li><strong>Pull request</strong>: Ana opens a pull request: base main, head winter-hours. Opening it merges nothing. <em>What the dot carries: Problem statement, Proposed difference.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a></li><li><strong>Repository Faro</strong>: Its head is the branch winter-hours she pushed to the repository. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a></li><li><strong>Pull request</strong> <span class="bp-text-stamp">[updated]</span>: Each new commit on winter-hours updates the proposal: the conversation follows evidence that evolves. <em>What the dot carries: Proposed difference.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a></li><li><strong>Pull request</strong>: Its description says the problem, what changes, how it was checked and which issue motivated it. <em>What the dot carries: Proposed difference.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a></li></ol><p><strong>End of the journey:</strong> The issue agrees on the problem; the pull request proposes one difference and keeps changing until it is merged. Neither one changes main by itself.</p></section><section class="bp-text-journey"><h3>E · A contribution from a fork</h3><p>no write access, still a proposal</p><ol><li><strong>Repository Faro</strong>: A volunteer wants to fix the hours but has no write access to Faro. <span class="bp-text-tag">Model</span> <a href="lessons/forks.html?lang=en">Lesson 09 · Fork, clone and branch</a></li><li><strong>Fork</strong> <span class="bp-text-stamp">[forked]</span>: She forks it: another repository on GitHub, under her account, linked to the original in a fork network. <span class="bp-text-tag">GitHub</span> <a href="lessons/forks.html?lang=en">Lesson 09 · Fork, clone and branch</a></li><li><strong>Fork</strong> <span class="bp-text-stamp">[fork only]</span>: Her clone calls the fork origin and the original upstream. Her push updates the fork; the original stays unchanged. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/forks.html?lang=en">Lesson 09 · Fork, clone and branch</a> <code>node lab.mjs forks</code></li><li><strong>Pull request</strong>: She proposes the change from a branch of her fork to main in Faro. <em>What the dot carries: Proposed difference.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/forks.html?lang=en">Lesson 09 · Fork, clone and branch</a></li></ol><p><strong>End of the journey:</strong> A fork gives a contributor a repository of their own to publish to; the original only changes if its maintainers merge the proposal.</p></section><section class="bp-text-journey"><h3>F · Review and automated evidence</h3><p>a check that fails with meaning, then a person</p><ol><li><strong>Pull request</strong>: A new commit on the pull request is an event. <em>What the dot carries: Proposed difference.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=en">Lesson 15 · Actions: automated evidence</a></li><li><strong>Actions</strong> <span class="bp-text-stamp">[fails on 09:00]</span>: It triggers the workflow: a job on a runner, its steps in order. The check expects README to contain 10:00, and it still says 09:00. <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=en">Lesson 15 · Actions: automated evidence</a></li><li><strong>Pull request</strong>: The pull request shows the failing check. <em>What the dot carries: Check result.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=en">Lesson 15 · Actions: automated evidence</a></li><li><strong>Actions</strong> <span class="bp-text-stamp">[passes]</span>: Fix the text and push: this run passes. Green means this assertion passed for this revision, nothing more. <em>What the dot carries: Check result.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=en">Lesson 15 · Actions: automated evidence</a></li><li><strong>Review</strong>: A reviewer reads purpose, change and evidence: is 10:00 the real opening time? Does the workshop notice contradict it? <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=en">Lesson 12 · Review: evidence and agreement</a></li><li><strong>Review</strong> <span class="bp-text-stamp">[approved]</span>: Approve, or request changes. The author cannot approve their own pull request. <em>What the dot carries: Approval.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=en">Lesson 12 · Review: evidence and agreement</a></li><li><strong>Pull request</strong>: A later commit can change what was reviewed; whether the approval still counts is up to the rules. <em>What the dot carries: Approval, Check result.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=en">Lesson 12 · Review: evidence and agreement</a></li></ol><p><strong>End of the journey:</strong> A check proves the assertion it makes, for one revision; a review judges purpose and meaning. Each covers what the other cannot.</p></section><section class="bp-text-journey"><h3>G · Rules and integration</h3><p>conditions at main, three histories</p><ol><li><strong>Pull request</strong>: The proposal is approved and its check is green. <em>What the dot carries: Approval, Check result.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=en">Lesson 16 · Rules: turn agreements into gates</a></li><li><strong>Repository Faro</strong>: Merging would update main. <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=en">Lesson 16 · Rules: turn agreements into gates</a></li><li><strong>Ruleset on main</strong> <span class="bp-text-stamp">[conditions met]</span>: The ruleset on main requires a pull request, an approval and the status check. It names its target branch and who may bypass it. <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=en">Lesson 16 · Rules: turn agreements into gates</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[merge]</span>: Merge commit: two parents keep the meeting point and the individual commits. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/integration-strategies.html?lang=en">Lesson 13 · Same files, different histories</a> <code>node lab.mjs strategies</code></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[squash]</span>: Squash: one new commit with the combined change; the feature commits are not its ancestors. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/integration-strategies.html?lang=en">Lesson 13 · Same files, different histories</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[rebase]</span>: Rebase: the commits are replayed onto main as new commits with new identifiers. All three end with the same files. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/integration-strategies.html?lang=en">Lesson 13 · Same files, different histories</a></li></ol><p><strong>End of the journey:</strong> Rules turn agreements into conditions at the destination. Merge, squash and rebase can produce the same files with three different histories; choose the history you want to keep.</p></section><section class="bp-text-journey"><h3>H · Undo without losing the story</h3><p>revert what is shared, reset what is yours</p><ol><li><strong>Commits and branches</strong>: A commit with the wrong hours was recorded and published. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a> <code>node lab.mjs undo</code></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[reverted]</span>: git revert records a new commit that reverses its effect. The mistake stays in history, as its parent. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[fast-forward]</span>: The correction is published with an ordinary push: nobody has to move main backward. <em>What the dot carries: Commit.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[local only]</span>: On a branch nobody else uses, git reset --soft moves the branch back and keeps the change prepared. <span class="bp-text-tag">Lab</span> <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[can discard]</span>: A hard reset can discard edits. Reflogs record local movements for a while; they are not a backup. <span class="bp-text-tag">Model</span> <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a></li></ol><p><strong>End of the journey:</strong> First say which state you want back. For published work, revert adds a correction others can pull; reset moves a branch and belongs to history nobody else uses.</p></section><section class="bp-text-journey"><h3>I · Tag, release, deploy</h3><p>a fixed name, a story, then running</p><ol><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[v1.0]</span>: git tag -a v1.0 names a chosen commit. When main advances, the tag stays. <em>What the dot carries: Tag v1.0.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a> <code>node lab.mjs tags</code></li><li><strong>Repository Faro</strong>: The tag is pushed to GitHub. <em>What the dot carries: Tag v1.0.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></li><li><strong>Release v1.0</strong>: A release built on the tag adds notes: what changed for users, known limits, how to upgrade. <em>What the dot carries: Tag v1.0.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></li><li><strong>Deployment</strong> <span class="bp-text-stamp">[another step]</span>: Running it is another step, only if something is configured to do it. Record which revision runs in which environment. <span class="bp-text-tag">Model</span> <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></li></ol><p><strong>End of the journey:</strong> The tag names the source point, the release explains it, and a deployment puts it to run. Three steps, three different facts.</p></section><section class="bp-text-journey"><h3>J · History remembers what you remove</h3><p>a fake marker, deleted but not gone</p><ol><li><strong>Working tree</strong>: practice.env holds FAKE_NOT_A_SECRET, an unmistakably fake marker. <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a> <code>node lab.mjs secrets</code></li><li><strong>Staging area</strong>: It is added... <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[recorded]</span>: ...and committed. <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[still tracked]</span>: A .gitignore rule added afterwards does not untrack a file already recorded. <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a></li><li><strong>Commits and branches</strong> <span class="bp-text-stamp">[still in history]</span>: git rm and a new commit remove it from the current snapshot. The older commit still contains it. <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a></li><li><strong>Repository Faro</strong> <span class="bp-text-stamp">[revoke first]</span>: Once pushed, every clone and fork can hold that commit. A real credential must be revoked or rotated first; rewriting one repository cannot reach every copy. <em>What the dot carries: Fake marker.</em> <span class="bp-text-tag">Model</span> <a href="lessons/secrets.html?lang=en">Lesson 18 · History remembers what you remove</a></li></ol><p><strong>End of the journey:</strong> Deleting a file records a new snapshot; older commits still contain it. With a real credential, revoke or rotate it first, then follow the host&#39;s cleanup process.</p></section><section><h3>Areas</h3><dl><dt id="bp-text-zone-ana">Ana&#39;s computer · her clone</dt><dd>Ana&#39;s clone of Faro: her working tree, her staging area, her commits and branches, and origin/main, her last view of main on GitHub. Everything she records here is local until she pushes. <em>What it does not do:</em> Nobody else sees it, and it does not change when Bruno or GitHub change: it learns about new commits only when Ana fetches. <a href="lessons/commits.html?lang=en">Lesson 02 · Commits: snapshots with a reason</a>, <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a>, <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a></dd><dt id="bp-text-zone-github">GitHub · repository Faro</dt><dd>Where the shared repository is hosted, with the conversation around each change: issues, forks, pull requests, reviews, Actions, the ruleset on main and releases. Both clones call it origin. <em>What it does not do:</em> It does not edit anyone&#39;s clone, and being able to read it is not being able to push to it. Merging a pull request or publishing a release deploys nothing by itself. <a href="lessons/git-and-github.html?lang=en">Lesson 01 · Git and GitHub</a>, <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a>, <a href="lessons/rules.html?lang=en">Lesson 16 · Rules: turn agreements into gates</a></dd><dt id="bp-text-zone-bruno">Bruno&#39;s computer · his clone</dt><dd>Bruno&#39;s own clone of the same project: his working tree, his commits and his origin/main. He records his work independently, and his main can diverge from Ana&#39;s. <em>What it does not do:</em> A clone is not a live shared folder: Bruno sees Ana&#39;s commits only after she pushes and he fetches, and fetching moves his origin/main without touching his main or his files. <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a>, <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></dd><dt id="bp-text-zone-env">An environment</dt><dd>Where a chosen revision actually runs, such as a server or a site. A deployment places an artifact there; record which revision runs where. <em>What it does not do:</em> It is not part of Git or of the repository: a tag or a release puts nothing here unless something is configured to deploy it. <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></dd></dl></section><section><h3>Pieces</h3><dl><dt id="bp-text-work">Working tree · guide.txt, as she edits it</dt><dd>The files Ana is editing now. Saving guide.txt changes a file; it records nothing in history. <em>What it does not do:</em> Nobody else sees it, and restoring a file here can discard work that was never recorded. <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a>, <a href="lessons/git-and-github.html?lang=en">Lesson 01 · Git and GitHub</a></dd><dt id="bp-text-index">Staging area · the index: the next snapshot</dt><dd>The content chosen for the next commit. git add copies the file&#39;s current content here. <em>What it does not do:</em> It is not a list of file names: edit the file after git add and the prepared content does not change. <a href="lessons/staging.html?lang=en">Lesson 03 · Three places for a change</a></dd><dt id="bp-text-repo">Commits and branches · snapshots linked to their parents; main, hours and HEAD point at them</dt><dd>Ana&#39;s local history: commits, each a snapshot with a message and links to its parents, and the names that point at them. HEAD says where the next commit goes. <em>What it does not do:</em> A branch is a movable name, not a quality guarantee and not access isolation. A local commit is not on GitHub until it is pushed. <a href="lessons/commits.html?lang=en">Lesson 02 · Commits: snapshots with a reason</a>, <a href="lessons/branches.html?lang=en">Lesson 04 · Branches are movable names</a>, <a href="lessons/merging.html?lang=en">Lesson 05 · Merging histories</a>, <a href="lessons/undo.html?lang=en">Lesson 14 · Undo without losing the story</a></dd><dt id="bp-text-tracking">origin/main · her last view of main on GitHub</dt><dd>A remote-tracking reference: what main looked like on origin the last time Ana fetched. <em>What it does not do:</em> It can be stale while someone else publishes. Her main, her origin/main and main on GitHub are three different references. <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a>, <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></dd><dt id="bp-text-bwork">Bruno&#39;s working tree · the same guide, in another copy</dt><dd>Bruno&#39;s files. They change when he edits them or integrates new history, never because Ana saved something. <em>What it does not do:</em> A clone is not a live shared folder. <a href="lessons/git-and-github.html?lang=en">Lesson 01 · Git and GitHub</a>, <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a></dd><dt id="bp-text-brepo">Bruno&#39;s commits · his main, which can diverge from hers</dt><dd>Bruno&#39;s local history: the same project, recorded independently. It only learns about Ana&#39;s commits through a fetch. <em>What it does not do:</em> Calling the remote origin does not make it official or give him permission to write. <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a>, <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></dd><dt id="bp-text-btracking">Bruno&#39;s origin/main · his last view, maybe stale</dt><dd>Bruno&#39;s remote-tracking reference for main. git fetch updates it. <em>What it does not do:</em> Fetching moves it without touching his main or his files. <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a></dd><dt id="bp-text-origin">Repository Faro · main and the published branches, hosted on GitHub</dt><dd>The hosted repository both clones call origin. A push proposes moving one of its references; it accepts fast-forwards and rejects a history that would drop commits. <em>What it does not do:</em> It does not edit anyone&#39;s clone, and being able to read it is not being able to push to it. <a href="lessons/remotes.html?lang=en">Lesson 07 · Remotes and independent copies</a>, <a href="lessons/sync.html?lang=en">Lesson 08 · Fetch, integrate, publish</a>, <a href="lessons/integration-strategies.html?lang=en">Lesson 13 · Same files, different histories</a></dd><dt id="bp-text-issue">Issue · the problem, agreed</dt><dd>A problem statement: what was observed, what was expected, the context to reproduce it and who can confirm the real answer. <em>What it does not do:</em> Writing it changes no file, and closing it is a workflow event, not proof that anything is correct. <a href="lessons/issues.html?lang=en">Lesson 10 · Issues: agree on the problem</a></dd><dt id="bp-text-fork">Fork · another repository on GitHub</dt><dd>A copy of Faro under another owner, linked in a fork network. Someone without write access can propose a change from a branch there. <em>What it does not do:</em> Updating the fork does not update the original, and availability depends on visibility and organization policy. <a href="lessons/forks.html?lang=en">Lesson 09 · Fork, clone and branch</a></dd><dt id="bp-text-pr">Pull request · base main, head winter-hours</dt><dd>A proposal to bring the head branch&#39;s difference into the base branch, with its conversation, reviews and checks. <em>What it does not do:</em> Opening it merges nothing, and new commits on the head branch keep changing it. <a href="lessons/pull-requests.html?lang=en">Lesson 11 · Pull requests: propose a difference</a></dd><dt id="bp-text-review">Review · comment, approve, ask</dt><dd>A person reads purpose, change and evidence, then comments, approves or requests changes. <em>What it does not do:</em> An approval is not a repository permission, and the author cannot approve their own pull request. <a href="lessons/reviews.html?lang=en">Lesson 12 · Review: evidence and agreement</a></dd><dt id="bp-text-actions">Actions · workflow, job, runner</dt><dd>Automation triggered by events: a workflow&#39;s jobs run on runners, their steps in order. The course&#39;s check looks for 10:00 in README. <em>What it does not do:</em> A green run proves its assertion for that revision, nothing else. A workflow has authority: keep its permissions narrow. <a href="lessons/actions.html?lang=en">Lesson 15 · Actions: automated evidence</a></dd><dt id="bp-text-rules">Ruleset on main · pull request, approval, check</dt><dd>Conditions the destination branch requires before it updates: a pull request, approvals, passing status checks. <em>What it does not do:</em> A rule that targets another branch does not protect main, and whoever may bypass it is part of the rule. <a href="lessons/rules.html?lang=en">Lesson 16 · Rules: turn agreements into gates</a></dd><dt id="bp-text-release">Release v1.0 · a tag plus notes</dt><dd>A release built on a tag: notes about what changed, known limits and upgrade advice, plus downloadable assets. <em>What it does not do:</em> Publishing a release does not deploy anything. <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></dd><dt id="bp-text-deploy">Deployment · what actually runs</dt><dd>A chosen artifact placed in an environment. Record which revision runs where. <em>What it does not do:</em> It happens only if something is configured to do it; the tag alone runs nothing. <a href="lessons/releases.html?lang=en">Lesson 17 · Tags, releases and deployments</a></dd></dl></section><section><h3>What travels</h3><dl><dt>E · Edit</dt><dd>The new opening hour in guide.txt: 10:00 instead of 09:00. <em>Comes from:</em> Someone&#39;s working tree. <em>Ends up:</em> The index, then a commit.</dd><dt>C · Commit</dt><dd>A snapshot of the project with a message, metadata and links to its parents, named by an identifier. <em>Comes from:</em> git commit, from the index. <em>Ends up:</em> A local history, then other repositories through push and fetch.</dd><dt>I · Problem statement</dt><dd>What was observed, what was expected, and how to check it. <em>Comes from:</em> Whoever found the problem. <em>Ends up:</em> An issue, and the pull requests that cite it.</dd><dt>P · Proposed difference</dt><dd>What the head branch would change in the base branch. <em>Comes from:</em> A pushed branch, in the repository or in a fork. <em>Ends up:</em> A pull request, and finally main if it is merged.</dd><dt>K · Check result</dt><dd>Pass or fail of a workflow&#39;s assertion, for one revision. <em>Comes from:</em> An Actions run. <em>Ends up:</em> The pull request, where rules can require it.</dd><dt>A · Approval</dt><dd>A reviewer&#39;s agreement with the proposal as it was when they reviewed it. <em>Comes from:</em> A review by someone other than the author. <em>Ends up:</em> The pull request; rules decide whether it still counts after new commits.</dd><dt>T · Tag v1.0</dt><dd>A name for one chosen commit that does not advance with new work. <em>Comes from:</em> git tag -a, in a local history. <em>Ends up:</em> The repository on GitHub, and the release built on it.</dd><dt>S · Fake marker</dt><dd>FAKE_NOT_A_SECRET: an unmistakably fake value standing in for a credential. <em>Comes from:</em> A file that should never have been tracked. <em>Ends up:</em> Every commit that contains it, and every copy of those commits.</dd></dl></section><hr><h2>Panorama</h2><p>Un cambio, del escritorio de Ana a una historia aceptada</p><p>Ana y Bruno mantienen la guía de la biblioteca Faro. Cada uno tiene un clon con su propia historia; GitHub aloja el repositorio compartido y la conversación alrededor de un cambio. Este dibujo pone en una escena todas las piezas del curso.</p><p>Elegí un recorrido: el punto es el cambio, y sus letras son lo que lleva. Cada parada dice qué se decide ahí y qué lección lo profundiza. Hacé clic en cualquier pieza, o en cualquier zona, para ver su ficha.</p><p>Las etiquetas dicen cómo ver cada parada por tu cuenta: LABORATORIO con Git real en tu computadora, GITHUB en tu repositorio de práctica, MODELO solo en las lecciones.</p><section class="bp-text-journey"><h3>A · Registrar un cambio</h3><p>working tree, index, commit</p><ol><li><strong>Working tree</strong>: Ana cambia el horario de apertura de 09:00 a 10:00 y empieza una nota sin terminar. Las dos ediciones están solo en su escritorio. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a> <code>node lab.mjs local</code></li><li><strong>Staging area</strong>: git add guide.txt prepara ese contenido para el próximo commit: el contenido, no solo el nombre del archivo. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a> <code>node lab.mjs staging</code></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[acá 11:00]</span>: Edita otra vez, a 11:00. El contenido preparado sigue en 10:00 hasta que vuelva a hacer add. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a></li><li><strong>Staging area</strong> <span class="bp-text-stamp">[acá 10:00]</span>: Dos comparaciones: git diff muestra 10:00 a 11:00; git diff --staged muestra 09:00 a 10:00. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[commit]</span>: git commit registra el index como una instantánea, con un mensaje, metadatos y un enlace a su padre. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/commits.html?lang=es">Lección 02 · Commits: instantáneas con un motivo</a> <code>node lab.mjs snapshots</code></li><li><strong>Commits y ramas</strong>: El contenido que no cambió se reutiliza por dentro, no se copia. El mensaje dice por qué: Fix hours after winter schedule change. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/commits.html?lang=es">Lección 02 · Commits: instantáneas con un motivo</a></li></ol><p><strong>Fin del recorrido:</strong> Guardar, preparar y registrar son tres actos distintos. Un commit registra el index, así que prepará exactamente la decisión que querés explicar.</p></section><section class="bp-text-journey"><h3>B · Ramas, merges, conflictos</h3><p>nombres que se mueven, dos padres, una pregunta</p><ol><li><strong>Commits y ramas</strong>: main nombra la historia aceptada. git switch -c hours le da un segundo nombre al mismo commit; no hace falta una versión nueva. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/branches.html?lang=es">Lección 04 · Las ramas son nombres que se mueven</a> <code>node lab.mjs branches</code></li><li><strong>Working tree</strong>: Con hours seleccionada, Ana cambia los horarios. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/branches.html?lang=es">Lección 04 · Las ramas son nombres que se mueven</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[hours avanzó]</span>: Su commit adelanta hours, adonde apunta HEAD; main queda donde estaba. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/branches.html?lang=es">Lección 04 · Las ramas son nombres que se mueven</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[fast-forward]</span>: Si main no se movió, el merge de hours es un fast-forward: main avanza hasta la punta, sin commit de merge. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/merging.html?lang=es">Lección 05 · Merge: unir historias</a> <code>node lab.mjs merge</code></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[2 padres]</span>: Si las dos líneas avanzaron, Git las combina desde su ancestro común y registra un commit de merge con dos padres. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/merging.html?lang=es">Lección 05 · Merge: unir historias</a></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[conflicto]</span>: Ana escribió 10:00 y Bruno 11:00 en la misma línea: un conflicto. Git no puede decidir el horario de la biblioteca. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/conflicts.html?lang=es">Lección 06 · Los conflictos son preguntas sin responder</a> <code>node lab.mjs conflict</code></li><li><strong>Staging area</strong>: Acuerdan 10:30, reemplazan las marcas con eso y hacen add del resultado. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/conflicts.html?lang=es">Lección 06 · Los conflictos son preguntas sin responder</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[10:30]</span>: El commit de merge registra la decisión. Después revisá el sentido: un taller a las 09:30 ahora contradiría la guía. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/conflicts.html?lang=es">Lección 06 · Los conflictos son preguntas sin responder</a></li></ol><p><strong>Fin del recorrido:</strong> Las ramas son nombres; el merge combina historias; un conflicto es una pregunta que solo pueden responder personas. Un texto que se combina sin conflicto puede igual decir dos cosas a la vez.</p></section><section class="bp-text-journey"><h3>C · Publicar, traer, integrar</h3><p>tres referencias a main, y un push rechazado</p><ol><li><strong>Commits y ramas</strong>: Ana hizo commit de 10:00 en main. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a> <code>node lab.mjs sync</code></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[publicado]</span>: git push propone mover main en GitHub a su commit. Es un fast-forward, así que se acepta. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>origin/main</strong>: El origin/main de Ana registra que main en GitHub ahora es su commit: su última vista, hasta el próximo fetch o push. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a></li><li><strong>origin/main de Bruno</strong> <span class="bp-text-stamp">[traído]</span>: Bruno corre git fetch. Su origin/main se mueve; su main y sus archivos, no. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Commits de Bruno</strong> <span class="bp-text-stamp">[ff-only]</span>: Integra con git merge --ff-only origin/main: su guía ahora dice 10:00. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Working tree de Bruno</strong>: Agrega un archivo de contacto, sin volver a hacer fetch. <em>Qué lleva el punto: Edición.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Commits de Bruno</strong>: Hace commit en main. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[rechazado]</span>: Mientras tanto Ana publicó 11:00. Su push se rechaza por non-fast-forward: perdería el commit de ella, y main en GitHub no se mueve. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>origin/main de Bruno</strong>: Vuelve a hacer fetch. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Commits de Bruno</strong> <span class="bp-text-stamp">[integrado]</span>: Hace merge de origin/main: su historia ahora tiene el trabajo de los dos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[publicado]</span>: Su push ahora incluye el commit de Ana: se acepta. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></li></ol><p><strong>Fin del recorrido:</strong> Fetch se entera, integrar decide, push propone. El push rechazado protegió el trabajo de Ana; la solución fue integrar, no forzar.</p></section><section class="bp-text-journey"><h3>D · De un issue a un pull request</h3><p>el problema, después una propuesta</p><ol><li><strong>Issue</strong>: Una persona llegó a las 09:00 y encontró la biblioteca cerrada. El issue registra qué se vio, qué se esperaba y quién puede confirmar el horario real. <em>Qué lleva el punto: Planteo del problema.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/issues.html?lang=es">Lección 10 · Issues: acordar el problema</a></li><li><strong>Pull request</strong>: Ana abre un pull request: base main, head winter-hours. Abrirlo no hace ningún merge. <em>Qué lleva el punto: Planteo del problema, Diferencia propuesta.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a></li><li><strong>Repositorio Faro</strong>: Su head es la rama winter-hours que publicó en el repositorio. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a></li><li><strong>Pull request</strong> <span class="bp-text-stamp">[actualizado]</span>: Cada commit nuevo en winter-hours actualiza la propuesta: la conversación sigue a una evidencia que cambia. <em>Qué lleva el punto: Diferencia propuesta.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a></li><li><strong>Pull request</strong>: Su descripción cuenta el problema, qué cambia, cómo se comprobó y qué issue lo motivó. <em>Qué lleva el punto: Diferencia propuesta.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a></li></ol><p><strong>Fin del recorrido:</strong> El issue acuerda el problema; el pull request propone una diferencia y sigue cambiando hasta el merge. Ninguno cambia main por sí solo.</p></section><section class="bp-text-journey"><h3>E · Una contribución desde un fork</h3><p>sin permiso de escritura, igual una propuesta</p><ol><li><strong>Repositorio Faro</strong>: Una persona voluntaria quiere corregir los horarios pero no tiene permiso de escritura en Faro. <span class="bp-text-tag">Modelo</span> <a href="lessons/forks.html?lang=es">Lección 09 · Fork, clon y rama</a></li><li><strong>Fork</strong> <span class="bp-text-stamp">[fork creado]</span>: Le hace fork: otro repositorio en GitHub, en su cuenta, enlazado al original en una red de forks. <span class="bp-text-tag">GitHub</span> <a href="lessons/forks.html?lang=es">Lección 09 · Fork, clon y rama</a></li><li><strong>Fork</strong> <span class="bp-text-stamp">[solo el fork]</span>: Su clon llama origin al fork y upstream al original. Su push actualiza el fork; el original no cambia. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/forks.html?lang=es">Lección 09 · Fork, clon y rama</a> <code>node lab.mjs forks</code></li><li><strong>Pull request</strong>: Propone el cambio desde una rama de su fork hacia main en Faro. <em>Qué lleva el punto: Diferencia propuesta.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/forks.html?lang=es">Lección 09 · Fork, clon y rama</a></li></ol><p><strong>Fin del recorrido:</strong> Un fork le da a quien contribuye un repositorio propio donde publicar; el original solo cambia si quienes lo mantienen hacen el merge de la propuesta.</p></section><section class="bp-text-journey"><h3>F · Revisión y evidencia automática</h3><p>un control que falla con sentido, después una persona</p><ol><li><strong>Pull request</strong>: Un commit nuevo en el pull request es un evento. <em>Qué lleva el punto: Diferencia propuesta.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=es">Lección 15 · Actions: evidencia automática</a></li><li><strong>Actions</strong> <span class="bp-text-stamp">[falla con 09:00]</span>: Dispara el workflow: un job en un runner, sus steps en orden. El control espera que el README contenga 10:00, y todavía dice 09:00. <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=es">Lección 15 · Actions: evidencia automática</a></li><li><strong>Pull request</strong>: El pull request muestra el control fallido. <em>Qué lleva el punto: Resultado del control.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=es">Lección 15 · Actions: evidencia automática</a></li><li><strong>Actions</strong> <span class="bp-text-stamp">[pasa]</span>: Corregí el texto y hacé push: esta ejecución pasa. Verde significa que esta afirmación pasó para esta revisión, nada más. <em>Qué lleva el punto: Resultado del control.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/actions.html?lang=es">Lección 15 · Actions: evidencia automática</a></li><li><strong>Revisión</strong>: Quien revisa lee propósito, cambio y evidencia: ¿10:00 es el horario real de apertura? ¿El aviso del taller lo contradice? <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=es">Lección 12 · Revisión: evidencia y acuerdo</a></li><li><strong>Revisión</strong> <span class="bp-text-stamp">[aprobado]</span>: Aprobar, o pedir cambios. Quien escribió el pull request no puede aprobarlo. <em>Qué lleva el punto: Aprobación.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=es">Lección 12 · Revisión: evidencia y acuerdo</a></li><li><strong>Pull request</strong>: Un commit posterior puede cambiar lo revisado; si la aprobación sigue valiendo lo deciden las reglas. <em>Qué lleva el punto: Aprobación, Resultado del control.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/reviews.html?lang=es">Lección 12 · Revisión: evidencia y acuerdo</a></li></ol><p><strong>Fin del recorrido:</strong> Un control prueba la afirmación que hace, para una revisión; una revisión juzga el propósito y el sentido. Cada uno cubre lo que el otro no puede.</p></section><section class="bp-text-journey"><h3>G · Reglas e integración</h3><p>condiciones en main, tres historias</p><ol><li><strong>Pull request</strong>: La propuesta está aprobada y su control está en verde. <em>Qué lleva el punto: Aprobación, Resultado del control.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=es">Lección 16 · Reglas: convertir acuerdos en condiciones</a></li><li><strong>Repositorio Faro</strong>: El merge actualizaría main. <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=es">Lección 16 · Reglas: convertir acuerdos en condiciones</a></li><li><strong>Ruleset sobre main</strong> <span class="bp-text-stamp">[condiciones cumplidas]</span>: El ruleset sobre main exige un pull request, una aprobación y el control. Nombra su rama destino y quién lo puede saltear. <span class="bp-text-tag">GitHub</span> <a href="lessons/rules.html?lang=es">Lección 16 · Reglas: convertir acuerdos en condiciones</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[merge]</span>: Commit de merge: dos padres conservan el punto de encuentro y los commits individuales. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/integration-strategies.html?lang=es">Lección 13 · Mismos archivos, historias distintas</a> <code>node lab.mjs strategies</code></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[squash]</span>: Squash: un commit nuevo con el cambio combinado; los commits de la rama no son sus ancestros. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/integration-strategies.html?lang=es">Lección 13 · Mismos archivos, historias distintas</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[rebase]</span>: Rebase: los commits se reaplican sobre main como commits nuevos con identificadores nuevos. Los tres terminan con los mismos archivos. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/integration-strategies.html?lang=es">Lección 13 · Mismos archivos, historias distintas</a></li></ol><p><strong>Fin del recorrido:</strong> Las reglas convierten acuerdos en condiciones en el destino. Merge, squash y rebase pueden dar los mismos archivos con tres historias distintas; elegí la historia que querés conservar.</p></section><section class="bp-text-journey"><h3>H · Deshacer sin perder la historia</h3><p>revert para lo compartido, reset para lo tuyo</p><ol><li><strong>Commits y ramas</strong>: Se registró y publicó un commit con el horario equivocado. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a> <code>node lab.mjs undo</code></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[revertido]</span>: git revert registra un commit nuevo que revierte su efecto. El error queda en la historia, como su padre. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[fast-forward]</span>: La corrección se publica con un push normal: nadie tiene que mover main hacia atrás. <em>Qué lleva el punto: Commit.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[solo local]</span>: En una rama que nadie más usa, git reset --soft mueve la rama hacia atrás y deja el cambio preparado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a></li><li><strong>Working tree</strong> <span class="bp-text-stamp">[puede descartar]</span>: Un reset hard puede descartar ediciones. Los reflogs registran movimientos locales por un tiempo; no son un respaldo. <span class="bp-text-tag">Modelo</span> <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a></li></ol><p><strong>Fin del recorrido:</strong> Primero decí qué estado querés recuperar. Para trabajo publicado, revert agrega una corrección que otros pueden traer; reset mueve una rama y es para historia que nadie más usa.</p></section><section class="bp-text-journey"><h3>I · Tag, release, despliegue</h3><p>un nombre fijo, una historia, y después correr</p><ol><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[v1.0]</span>: git tag -a v1.0 nombra un commit elegido. Cuando main avanza, el tag se queda. <em>Qué lleva el punto: Tag v1.0.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a> <code>node lab.mjs tags</code></li><li><strong>Repositorio Faro</strong>: El tag se publica en GitHub. <em>Qué lleva el punto: Tag v1.0.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></li><li><strong>Release v1.0</strong>: Una release construida sobre el tag agrega notas: qué cambió para quien la usa, límites conocidos, cómo actualizar. <em>Qué lleva el punto: Tag v1.0.</em> <span class="bp-text-tag">GitHub</span> <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></li><li><strong>Despliegue</strong> <span class="bp-text-stamp">[otro paso]</span>: Ejecutarla es otro paso, solo si algo está configurado para hacerlo. Anotá qué revisión corre en qué entorno. <span class="bp-text-tag">Modelo</span> <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></li></ol><p><strong>Fin del recorrido:</strong> El tag nombra el punto de origen, la release lo explica y un despliegue lo pone a correr. Tres pasos, tres hechos distintos.</p></section><section class="bp-text-journey"><h3>J · La historia recuerda lo que quitás</h3><p>un marcador ficticio, borrado pero no ido</p><ol><li><strong>Working tree</strong>: practice.env guarda FAKE_NOT_A_SECRET, un marcador inconfundiblemente falso. <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a> <code>node lab.mjs secrets</code></li><li><strong>Staging area</strong>: Se le hace add... <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[registrado]</span>: ...y commit. <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[sigue seguido]</span>: Una regla de .gitignore agregada después no deja de seguir un archivo ya registrado. <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a></li><li><strong>Commits y ramas</strong> <span class="bp-text-stamp">[sigue en la historia]</span>: git rm y un commit nuevo lo quitan de la instantánea actual. El commit anterior lo sigue conteniendo. <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a></li><li><strong>Repositorio Faro</strong> <span class="bp-text-stamp">[revocar primero]</span>: Una vez publicado, cada clon y cada fork pueden tener ese commit. Una credencial real se revoca o se rota primero; reescribir un repositorio no llega a todas las copias. <em>Qué lleva el punto: Marcador ficticio.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/secrets.html?lang=es">Lección 18 · La historia recuerda lo que quitás</a></li></ol><p><strong>Fin del recorrido:</strong> Borrar un archivo registra una instantánea nueva; los commits anteriores lo siguen conteniendo. Con una credencial real, revocala o rotala primero, y después seguí el proceso de limpieza del servicio.</p></section><section><h3>Zonas</h3><dl><dt id="bp-text-zone-ana">La computadora de Ana · su clon</dt><dd>El clon de Faro de Ana: su working tree, su staging area, sus commits y ramas, y origin/main, su última vista de main en GitHub. Todo lo que registra acá es local hasta que hace push. <em>Qué no hace:</em> Nadie más lo ve, y no cambia cuando cambian Bruno o GitHub: se entera de commits nuevos solo cuando Ana hace fetch. <a href="lessons/commits.html?lang=es">Lección 02 · Commits: instantáneas con un motivo</a>, <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a>, <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a></dd><dt id="bp-text-zone-github">GitHub · repositorio Faro</dt><dd>Donde está alojado el repositorio compartido, con la conversación alrededor de cada cambio: issues, forks, pull requests, revisiones, Actions, el ruleset sobre main y las releases. Los dos clones lo llaman origin. <em>Qué no hace:</em> No edita el clon de nadie, y poder leerlo no es poder hacer push. Hacer merge de un pull request o publicar una release no despliega nada por sí solo. <a href="lessons/git-and-github.html?lang=es">Lección 01 · Git y GitHub</a>, <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a>, <a href="lessons/rules.html?lang=es">Lección 16 · Reglas: convertir acuerdos en condiciones</a></dd><dt id="bp-text-zone-bruno">La computadora de Bruno · su clon</dt><dd>El clon propio de Bruno, del mismo proyecto: su working tree, sus commits y su origin/main. Registra su trabajo por su cuenta, y su main puede divergir del de Ana. <em>Qué no hace:</em> Un clon no es una carpeta compartida en vivo: Bruno ve los commits de Ana solo después de que ella hace push y él hace fetch, y el fetch mueve su origin/main sin tocar su main ni sus archivos. <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a>, <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></dd><dt id="bp-text-zone-env">Un entorno</dt><dd>Donde corre de verdad una revisión elegida, como un servidor o un sitio. Un despliegue pone un artefacto ahí; anotá qué revisión corre dónde. <em>Qué no hace:</em> No es parte de Git ni del repositorio: un tag o una release no ponen nada acá salvo que algo esté configurado para desplegarlo. <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></dd></dl></section><section><h3>Piezas</h3><dl><dt id="bp-text-work">Working tree · guide.txt, tal como lo edita</dt><dd>Los archivos que Ana edita ahora. Guardar guide.txt cambia un archivo; no registra nada en la historia. <em>Qué no hace:</em> Nadie más lo ve, y restaurar un archivo acá puede descartar trabajo que nunca se registró. <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a>, <a href="lessons/git-and-github.html?lang=es">Lección 01 · Git y GitHub</a></dd><dt id="bp-text-index">Staging area · el index: la próxima instantánea</dt><dd>El contenido elegido para el próximo commit. git add copia acá el contenido actual del archivo. <em>Qué no hace:</em> No es una lista de nombres de archivo: si editás el archivo después de git add, el contenido preparado no cambia. <a href="lessons/staging.html?lang=es">Lección 03 · Tres lugares para un cambio</a></dd><dt id="bp-text-repo">Commits y ramas · instantáneas unidas a sus padres; main, hours y HEAD apuntan a ellas</dt><dd>La historia local de Ana: commits, cada uno una instantánea con un mensaje y enlaces a sus padres, y los nombres que apuntan a ellos. HEAD dice adónde va el próximo commit. <em>Qué no hace:</em> Una rama es un nombre que se mueve, no una garantía de calidad ni un aislamiento de permisos. Un commit local no está en GitHub hasta que se hace push. <a href="lessons/commits.html?lang=es">Lección 02 · Commits: instantáneas con un motivo</a>, <a href="lessons/branches.html?lang=es">Lección 04 · Las ramas son nombres que se mueven</a>, <a href="lessons/merging.html?lang=es">Lección 05 · Merge: unir historias</a>, <a href="lessons/undo.html?lang=es">Lección 14 · Deshacer sin perder la historia</a></dd><dt id="bp-text-tracking">origin/main · su última vista de main en GitHub</dt><dd>Una referencia de seguimiento: cómo estaba main en origin la última vez que Ana hizo fetch. <em>Qué no hace:</em> Puede estar desactualizada mientras otra persona publica. Su main, su origin/main y main en GitHub son tres referencias distintas. <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a>, <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></dd><dt id="bp-text-bwork">Working tree de Bruno · la misma guía, en otra copia</dt><dd>Los archivos de Bruno. Cambian cuando él los edita o integra historia nueva, nunca porque Ana guardó algo. <em>Qué no hace:</em> Un clon no es una carpeta compartida en vivo. <a href="lessons/git-and-github.html?lang=es">Lección 01 · Git y GitHub</a>, <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a></dd><dt id="bp-text-brepo">Commits de Bruno · su main, que puede divergir del de ella</dt><dd>La historia local de Bruno: el mismo proyecto, registrado de forma independiente. Solo se entera de los commits de Ana con un fetch. <em>Qué no hace:</em> Que el remoto se llame origin no lo vuelve oficial ni le da permiso para escribir. <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a>, <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></dd><dt id="bp-text-btracking">origin/main de Bruno · su última vista, quizá vieja</dt><dd>La referencia de seguimiento de Bruno para main. git fetch la actualiza. <em>Qué no hace:</em> Hacer fetch la mueve sin tocar su main ni sus archivos. <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a></dd><dt id="bp-text-origin">Repositorio Faro · main y las ramas publicadas, alojadas en GitHub</dt><dd>El repositorio alojado que los dos clones llaman origin. Un push propone mover una de sus referencias; acepta fast-forwards y rechaza una historia que perdería commits. <em>Qué no hace:</em> No edita el clon de nadie, y poder leerlo no es poder hacer push. <a href="lessons/remotes.html?lang=es">Lección 07 · Remotos y copias independientes</a>, <a href="lessons/sync.html?lang=es">Lección 08 · Fetch, integrar, publicar</a>, <a href="lessons/integration-strategies.html?lang=es">Lección 13 · Mismos archivos, historias distintas</a></dd><dt id="bp-text-issue">Issue · el problema, acordado</dt><dd>Un planteo del problema: qué se observó, qué se esperaba, el contexto para reproducirlo y quién puede confirmar la respuesta real. <em>Qué no hace:</em> Escribirlo no cambia ningún archivo, y cerrarlo es un evento de flujo de trabajo, no prueba de que algo esté bien. <a href="lessons/issues.html?lang=es">Lección 10 · Issues: acordar el problema</a></dd><dt id="bp-text-fork">Fork · otro repositorio en GitHub</dt><dd>Una copia de Faro con otro dueño, enlazada en una red de forks. Alguien sin permiso de escritura puede proponer un cambio desde una rama de ahí. <em>Qué no hace:</em> Actualizar el fork no actualiza el original, y que se pueda crear depende de la visibilidad y de la política de la organización. <a href="lessons/forks.html?lang=es">Lección 09 · Fork, clon y rama</a></dd><dt id="bp-text-pr">Pull request · base main, head winter-hours</dt><dd>Una propuesta de llevar la diferencia de la rama head a la rama base, con su conversación, sus revisiones y sus controles. <em>Qué no hace:</em> Abrirlo no hace ningún merge, y los commits nuevos en la rama head lo siguen cambiando. <a href="lessons/pull-requests.html?lang=es">Lección 11 · Pull requests: proponer una diferencia</a></dd><dt id="bp-text-review">Revisión · comentar, aprobar, pedir</dt><dd>Una persona lee propósito, cambio y evidencia, y después comenta, aprueba o pide cambios. <em>Qué no hace:</em> Una aprobación no es un permiso del repositorio, y quien escribió el pull request no puede aprobarlo. <a href="lessons/reviews.html?lang=es">Lección 12 · Revisión: evidencia y acuerdo</a></dd><dt id="bp-text-actions">Actions · workflow, job, runner</dt><dd>Automatización disparada por eventos: los jobs de un workflow corren en runners, y sus steps en orden. El control del curso busca 10:00 en el README. <em>Qué no hace:</em> Una ejecución verde prueba su afirmación para esa revisión, nada más. Un workflow tiene autoridad: limitá sus permisos. <a href="lessons/actions.html?lang=es">Lección 15 · Actions: evidencia automática</a></dd><dt id="bp-text-rules">Ruleset sobre main · pull request, aprobación, control</dt><dd>Condiciones que exige la rama destino antes de actualizarse: un pull request, aprobaciones, controles en verde. <em>Qué no hace:</em> Una regla que apunta a otra rama no protege main, y quien la puede saltear es parte de la regla. <a href="lessons/rules.html?lang=es">Lección 16 · Reglas: convertir acuerdos en condiciones</a></dd><dt id="bp-text-release">Release v1.0 · un tag más notas</dt><dd>Una release construida sobre un tag: notas de qué cambió, límites conocidos y consejos para actualizar, más archivos para descargar. <em>Qué no hace:</em> Publicar una release no despliega nada. <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></dd><dt id="bp-text-deploy">Despliegue · lo que de verdad corre</dt><dd>Un artefacto elegido puesto en un entorno. Anotá qué revisión corre dónde. <em>Qué no hace:</em> Solo ocurre si algo está configurado para hacerlo; el tag solo no ejecuta nada. <a href="lessons/releases.html?lang=es">Lección 17 · Tags, releases y despliegues</a></dd></dl></section><section><h3>Qué viaja</h3><dl><dt>E · Edición</dt><dd>El nuevo horario de apertura en guide.txt: 10:00 en lugar de 09:00. <em>De dónde viene:</em> El working tree de alguien. <em>Dónde termina:</em> El index, y después un commit.</dd><dt>C · Commit</dt><dd>Una instantánea del proyecto con un mensaje, metadatos y enlaces a sus padres, nombrada por un identificador. <em>De dónde viene:</em> git commit, desde el index. <em>Dónde termina:</em> Una historia local, y después otros repositorios con push y fetch.</dd><dt>I · Planteo del problema</dt><dd>Qué se observó, qué se esperaba y cómo comprobarlo. <em>De dónde viene:</em> Quien encontró el problema. <em>Dónde termina:</em> Un issue, y los pull requests que lo citan.</dd><dt>P · Diferencia propuesta</dt><dd>Lo que la rama head cambiaría en la rama base. <em>De dónde viene:</em> Una rama publicada, en el repositorio o en un fork. <em>Dónde termina:</em> Un pull request, y al final main si se hace el merge.</dd><dt>K · Resultado del control</dt><dd>Pasa o falla de una afirmación de un workflow, para una revisión. <em>De dónde viene:</em> Una ejecución de Actions. <em>Dónde termina:</em> El pull request, donde las reglas lo pueden exigir.</dd><dt>A · Aprobación</dt><dd>El acuerdo de quien revisa con la propuesta tal como estaba cuando la revisó. <em>De dónde viene:</em> Una revisión de alguien que no es quien escribió. <em>Dónde termina:</em> El pull request; las reglas deciden si sigue valiendo después de commits nuevos.</dd><dt>T · Tag v1.0</dt><dd>Un nombre para un commit elegido que no avanza con el trabajo nuevo. <em>De dónde viene:</em> git tag -a, en una historia local. <em>Dónde termina:</em> El repositorio en GitHub, y la release construida sobre él.</dd><dt>S · Marcador ficticio</dt><dd>FAKE_NOT_A_SECRET: un valor inconfundiblemente falso en lugar de una credencial. <em>De dónde viene:</em> Un archivo que nunca tendría que haberse seguido. <em>Dónde termina:</em> Cada commit que lo contiene, y cada copia de esos commits.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
