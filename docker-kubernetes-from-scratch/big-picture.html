é no hace:</em> kubectl no ejecuta nada en los nodos; cuando termina, el plano de control sigue reconciliando. <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a>, <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a></dd><dt id="bp-text-image">Imagen · prumathe-signal, 1.0.0</dt><dd>Capas de sistema de archivos más configuración: USER 10001, CMD y APP_VERSION. Es el artefacto, no un proceso en marcha. <em>Qué no hace:</em> Lo que escribe un contenedor nunca la cambia, y una imagen de tu Docker no está en un nodo de Kubernetes hasta que se carga ahí. <a href="lessons/images.html?lang=es">Lección 03 · Imágenes y capas</a>, <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a></dd><dt id="bp-text-toolbox">toolbox · probe.py, un cliente</dt><dd>Un segundo contenedor de la misma imagen que corre probe.py contra app: revisa por separado la resolución del nombre, la conexión, el estado y el texto. <em>Qué no hace:</em> Adentro, localhost es el propio toolbox, no app ni tu computadora. <a href="lessons/networks.html?lang=es">Lección 06 · Nombres en una red</a>, <a href="lessons/debugging.html?lang=es">Lección 12 · Seguí la evidencia</a></dd><dt id="bp-text-app">Contenedor app · server.py, UID 10001</dt><dd>Signal en marcha: un proceso con una vista aislada de procesos, red y archivos, su propia capa escribible, 0,5 CPU y 128 MiB, y un health check sobre /health. <em>Qué no hace:</em> Comparte el kernel de tu computadora, y correr como UID 10001 reduce privilegios sin volver inofensivo un código no confiable. <a href="lessons/containers.html?lang=es">Lección 01 · Un proceso con límites</a>, <a href="lessons/lifecycle.html?lang=es">Lección 02 · Arrancar, parar, borrar</a>, <a href="lessons/compose.html?lang=es">Lección 08 · Describí el sistema local</a>, <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a></dd><dt id="bp-text-volume">Volumen signal-data · montado en /data</dt><dd>Un volumen con nombre que administra Docker y Compose monta en /data. Sobrevive al contenedor que escribió en él. <em>Qué no hace:</em> No es un respaldo, y docker compose down -v lo borra. <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a></dd><dt id="bp-text-browser">Tu navegador · 127.0.0.1:18080</dt><dd>Un cliente afuera de todo contenedor. Llega a Signal por el puerto que Compose publicó en el loopback de tu computadora. <em>Qué no hace:</em> El nombre app no significa nada acá: solo se resuelve dentro de la red del proyecto. <a href="lessons/ports.html?lang=es">Lección 07 · Publicá un puerto a propósito</a></dd><dt id="bp-text-etcd">etcd · el estado guardado</dt><dd>El almacenamiento clave-valor detrás del API server: cada objeto, deseado y observado, vive acá. <em>Qué no hace:</em> Nadie le habla salvo el API server. Los Secrets no están cifrados en él por defecto. <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a>, <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a></dd><dt id="bp-text-scheduler">Scheduler · elige un nodo</dt><dd>Busca Pods sin nodo y asigna cada uno a un nodo donde entren sus requests, junto con restricciones como los taints. <em>Qué no hace:</em> No arranca contenedores, y el uso real no borra los requests declarados: un Pod que no entra en ningún lado queda Pending. <a href="lessons/scheduling.html?lang=es">Lección 21 · Requests, limits y ubicación</a></dd><dt id="bp-text-controllers">Controladores · achican la diferencia</dt><dd>Bucles que comparan el estado deseado con el observado y actúan para reducir la diferencia: el controlador de Deployments maneja ReplicaSets, el de ReplicaSets mantiene la cantidad de Pods. <em>Qué no hace:</em> Un Pod suelto no tiene controlador: si lo borrás, nada lo trae de vuelta. <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a>, <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a>, <a href="lessons/pods.html?lang=es">Lección 14 · El límite del Pod</a></dd><dt id="bp-text-rbac">Autorizador RBAC · Roles y RoleBindings</dt><dd>Cómo decide el API server si alguien puede aplicar un verbo sobre un recurso: un Role enumera permisos, un RoleBinding se los da a un sujeto. <em>Qué no hace:</em> Los permisos RBAC solo se suman; no hay reglas deny. No dice nada de conectividad de red ni de login de la aplicación. <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a></dd><dt id="bp-text-apiserver">API server · todo pedido pasa por acá</dt><dd>La puerta del clúster. Autentica y autoriza cada pedido, valida objetos, los guarda en etcd, y es lo que miran los controladores, el scheduler y los kubelets. <em>Qué no hace:</em> Aceptar un objeto significa que se guardó, no que sus Pods estén listos. <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a>, <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a></dd><dt id="bp-text-deployment">Deployment signal · 2 réplicas, ReplicaSets</dt><dd>Una plantilla de Pod y una cantidad deseada. Cada cambio de plantilla crea un ReplicaSet nuevo; un rolling update pasa los Pods del viejo al nuevo. <em>Qué no hace:</em> rollout undo restaura una plantilla, no una base de datos, datos externos ni un ConfigMap aparte. <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a>, <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a></dd><dt id="bp-text-service">Service signal · puerto 80 a 8080</dt><dd>Un nombre y una IP virtual estables que seleccionan Pods por la label app=signal. Sus EndpointSlices enumeran los destinos listos. <em>Qué no hace:</em> Tipo ClusterIP: accesible solo dentro del clúster. Una respuesta DNS no prueba que la aplicación esté sana. <a href="lessons/services.html?lang=es">Lección 17 · Una entrada estable</a></dd><dt id="bp-text-config">ConfigMap, Secret · signal-settings, demo-token</dt><dd>El ConfigMap signal-settings guarda MESSAGE; el Secret demo-token guarda un token claramente falso. Los Pods los pueden leer como variables de entorno o archivos. <em>Qué no hace:</em> base64 es codificación, no cifrado. Cambiar un ConfigMap no cambia el entorno de un proceso que ya está corriendo. <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a>, <a href="lessons/configuration.html?lang=es">Lección 09 · Configuración y secretos</a></dd><dt id="bp-text-pvc">PVC notebook · 64Mi, ReadWriteOnce</dt><dd>Un pedido de almacenamiento. El provisionador local de kind crea un PersistentVolume para él; el pedido sobrevive a los Pods que lo montan. <em>Qué no hace:</em> ReadWriteOnce significa un nodo, no un Pod. Este almacenamiento es local a kind: borrar el clúster lo pierde. <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a></dd><dt id="bp-text-kubelet">kubelet · ejecuta y prueba Pods</dt><dd>El agente de cada nodo: ejecuta los Pods asignados a su nodo a través del runtime de contenedores, y corre sus probes de arranque, readiness y liveness. <em>Qué no hace:</em> Readiness solo controla el tráfico; liveness reinicia el contenedor. Ninguno reemplaza un Pod borrado: eso es trabajo de un controlador. <a href="lessons/probes.html?lang=es">Lección 20 · Vivo, listo, arrancado</a>, <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a></dd><dt id="bp-text-runtime">containerd · imágenes del nodo</dt><dd>El runtime de contenedores del nodo, con su propio almacén de imágenes. kind load docker-image copia ahí tu imagen local. <em>Qué no hace:</em> Con imagePullPolicy: Never nunca descarga: una imagen faltante falla con ErrImageNeverPull. <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a>, <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a></dd><dt id="bp-text-pods">Pods de signal · 2 réplicas, cada una con su nombre y su IP</dt><dd>Las réplicas en marcha: cada Pod tiene un contenedor de prumathe-signal, un nombre, un UID y una IP propios, requests de 50m de CPU y 32Mi, y tres probes. <em>Qué no hace:</em> La identidad de un Pod es temporal: un reemplazo es un Pod nuevo con otro nombre, y los archivos que escribió no pasan. <a href="lessons/pods.html?lang=es">Lección 14 · El límite del Pod</a>, <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a>, <a href="lessons/scheduling.html?lang=es">Lección 21 · Requests, limits y ubicación</a></dd><dt id="bp-text-writer">Pod writer · notebook en /data</dt><dd>Un Pod suelto que monta el pedido notebook en /data y escribe ahí una marca. <em>Qué no hace:</em> Como está suelto, nada lo recrea cuando se borra; volver a aplicar el manifiesto, sí. <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a></dd></dl></section><section><h3>Qué viaja</h3><dl><dt>I · Imagen</dt><dd>prumathe-signal: capas y configuración, identificadas por un ID de imagen. <em>De dónde viene:</em> docker build, desde el contexto de build. <em>Dónde termina:</em> Tu Docker Engine, y el containerd de un nodo después de kind load.</dd><dt>G · Digest base</dt><dd>El digest sha256 que fija el contenido de la imagen base. <em>De dónde viene:</em> El registro. <em>Dónde termina:</em> El FROM del Dockerfile, y la imagen construida sobre ella.</dd><dt>R · Pedido HTTP</dt><dd>Un GET a Signal, que responde con su mensaje y su versión. <em>De dónde viene:</em> Tu navegador, toolbox, o probe.py dentro de un Pod. <em>Dónde termina:</em> Un proceso que escucha en el puerto 8080.</dd><dt>K · Archivo marca</dt><dd>Un archivo chico escrito en /data para probar qué sobrevive a un reemplazo. <em>De dónde viene:</em> Un contenedor o un Pod. <em>Dónde termina:</em> Un volumen con nombre, o el volumen detrás de un pedido.</dd><dt>M · Estado deseado</dt><dd>Objetos descritos en un manifiesto: kind, metadatos y spec. <em>De dónde viene:</em> kubectl apply, o un comando imperativo. <em>Dónde termina:</em> etcd, a través del API server; los controladores actúan sobre él.</dd><dt>E · MESSAGE</dt><dd>Un valor de ejecución que el proceso lee al arrancar. <em>De dónde viene:</em> Una variable de entorno: Compose, docker run -e, o un ConfigMap. <em>Dónde termina:</em> El entorno de un proceso nuevo.</dd><dt>S · Token falso</dt><dd>Una credencial deliberadamente falsa, para mostrar adónde van los secretos y qué los protege. <em>De dónde viene:</em> demo-token.txt en Compose; el Secret demo-token en Kubernetes. <em>Dónde termina:</em> Un archivo montado, o el objeto Secret detrás de la API.</dd><dt>A · Identidad de quien llama</dt><dd>De quién viene un pedido: acá, el ServiceAccount observer. <em>De dónde viene:</em> kubectl, suplantando con --as. <em>Dónde termina:</em> El API server, que la autentica y le pregunta a RBAC.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
