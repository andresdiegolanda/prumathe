<body class="bp-page"><div id="bp"></div><noscript><main class="bp-noscript"><h2>Big picture</h2><p>From a build context to a Pod behind a Service</p><p>One small HTTP service, Signal, built and run with Docker on your computer, then declared to a Kubernetes cluster that kind runs as containers on that same computer. This picture puts every piece of the course on one scene.</p><p>Pick a journey: the dot is the request, the build or the declared state, and its letters are what it carries. Each stop says what is decided there and which lesson goes deeper. Click any piece for its card.</p><p>Tags say how to see a stop for yourself: LAB with the course&#39;s commands, MODEL only in the lessons.</p><section class="bp-text-journey"><h3>A · Build an image</h3><p>context, cache, a pinned base, defaults</p><ol><li><strong>You</strong>: docker build with the folder app as context, and a tag for the result. <span class="bp-text-tag">Lab</span> <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a> <code>docker build -t prumathe-signal:1.0.0 app</code></li><li><strong>Build context</strong>: The engine receives the context. COPY can only read files from it; .dockerignore leaves out what the image does not need. <span class="bp-text-tag">Lab</span> <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a></li><li><strong>Docker Engine</strong>: Each instruction is a step. Unchanged inputs reuse the cache; changing server.py rebuilds from its COPY on. <span class="bp-text-tag">Lab</span> <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a> <code>docker build --progress=plain -t prumathe-signal:1.0.0 app</code></li><li><strong>Base image</strong> <span class="bp-text-stamp">[by digest]</span>: FROM names the base by digest: exactly that content, whatever the tag points to today. <em>What the dot carries: Base digest.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a> <code>docker pull python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72</code></li><li><strong>Docker Engine</strong>: USER 10001 and CMD become the image&#39;s defaults; APP_VERSION is a build argument with no secret in it. EXPOSE documents 8080 and publishes nothing. <em>What the dot carries: Base digest.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a></li><li><strong>Image</strong> <span class="bp-text-stamp">[1.0.0]</span>: prumathe-signal:1.0.0: layers plus configuration. The tag is a name; another tag can point to the same image ID. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/images.html?lang=en">Lesson 03 · Images and layers</a> <code>docker image inspect --format &#39;{{.Config.User}} {{json .Config.Cmd}}&#39; prumathe-signal:1.0.0</code></li></ol><p><strong>End of the journey:</strong> The image is an artifact with layers and defaults, built from a context you chose and a base pinned by digest. Running it is the next step.</p></section><section class="bp-text-journey"><h3>B · Run Signal with Compose</h3><p>a process, its limits, its health</p><ol><li><strong>You</strong>: docker compose up -d --wait app, in the project prumathe-dk. <span class="bp-text-tag">Lab</span> <a href="lessons/compose.html?lang=en">Lesson 08 · Describe the local system</a> <code>docker compose up -d --wait app</code></li><li><strong>Docker Engine</strong>: Compose asks the engine for the project network, the volume and the container app, with 0.5 CPU and 128 MiB. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/compose.html?lang=en">Lesson 08 · Describe the local system</a></li><li><strong>Container app</strong> <span class="bp-text-stamp">[running]</span>: Its main process is server.py as UID 10001, with an isolated view of processes, network and files, on the host&#39;s kernel. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/containers.html?lang=en">Lesson 01 · A process with boundaries</a></li><li><strong>Container app</strong> <span class="bp-text-stamp">[healthy]</span>: The image&#39;s health check probes /health; --wait returned once the service was healthy. <span class="bp-text-tag">Lab</span> <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a> <code>docker compose exec -T app python /app/probe.py http://127.0.0.1:8080/health ok</code></li><li><strong>Container app</strong> <span class="bp-text-stamp">[unhealthy]</span>: Create /tmp/fail-live and /health answers 503. <span class="bp-text-tag">Lab</span> <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a> <code>docker compose exec -T app touch /tmp/fail-live</code></li><li><strong>Docker Engine</strong> <span class="bp-text-stamp">[still running]</span>: The engine reports unhealthy, and running: it does not restart a container for being unhealthy. <span class="bp-text-tag">Lab</span> <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a> <code>docker inspect --format &#39;{{.State.Health.Status}} {{.State.Running}}&#39; prumathe-dk-app-1</code></li><li><strong>Container app</strong> <span class="bp-text-stamp">[healthy]</span>: Remove the file and the next checks recover. <span class="bp-text-tag">Lab</span> <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a> <code>docker compose exec -T app rm /tmp/fail-live</code></li></ol><p><strong>End of the journey:</strong> A container is a process with boundaries and limits. Healthy is a property one probe measures; running is another, and Docker does not restart a container for being unhealthy.</p></section><section class="bp-text-journey"><h3>C · Names and ports</h3><p>a published port, a service name, localhost</p><ol><li><strong>Your browser</strong>: Your browser asks 127.0.0.1:18080. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/ports.html?lang=en">Lesson 07 · Publish a port deliberately</a></li><li><strong>Container app</strong> <span class="bp-text-stamp">[200]</span>: Compose published loopback port 18080 to container port 8080, where Signal listens on 0.0.0.0. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/ports.html?lang=en">Lesson 07 · Publish a port deliberately</a> <code>docker compose port app 8080</code></li><li><strong>toolbox</strong>: Inside toolbox, localhost is toolbox itself. <span class="bp-text-tag">Lab</span> <a href="lessons/networks.html?lang=en">Lesson 06 · Names on a network</a></li><li><strong>Container app</strong> <span class="bp-text-stamp">[app resolves]</span>: The name app resolves on the project network, so app:8080 reaches Signal from any container on it. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/networks.html?lang=en">Lesson 06 · Names on a network</a> <code>docker compose run --rm --no-deps --entrypoint python toolbox -c &quot;import socket; print(socket.gethostbyname(&#39;app&#39;))&quot;</code></li><li><strong>Container app</strong>: Check one layer at a time: the name, the connection, the status, the text. probe.py asserts the status and the expected text. <span class="bp-text-tag">Lab</span> <a href="lessons/debugging.html?lang=en">Lesson 12 · Follow the evidence</a> <code>docker compose run --rm --no-deps toolbox http://app:8080 hello-compose</code></li><li><strong>toolbox</strong>: A shared network lets the request through; it does not authenticate it. <span class="bp-text-tag">Model</span> <a href="lessons/networks.html?lang=en">Lesson 06 · Names on a network</a></li></ol><p><strong>End of the journey:</strong> The browser uses the published host port; containers on the project network use the service name and the internal port. Reachable is not authorized.</p></section><section class="bp-text-journey"><h3>D · Data that outlives a container</h3><p>a named volume across a replacement</p><ol><li><strong>Container app</strong>: Write a marker in /data, where Compose mounts the named volume signal-data. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a> <code>docker compose exec -T app sh -c &#39;echo volume-survived &gt; /data/marker&#39;</code></li><li><strong>Volume signal-data</strong>: The bytes land in the volume, not in the container&#39;s writable layer. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a></li><li><strong>Docker Engine</strong> <span class="bp-text-stamp">[replaced]</span>: Recreate the container: the old one and its writable layer are removed. <span class="bp-text-tag">Lab</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a> <code>docker compose up -d --wait --force-recreate app</code></li><li><strong>Container app</strong>: The new container mounts the same volume at /data. <span class="bp-text-tag">Lab</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a></li><li><strong>Volume signal-data</strong> <span class="bp-text-stamp">[survived]</span>: The marker is still there. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a> <code>docker compose exec -T app cat /data/marker</code></li><li><strong>Volume signal-data</strong>: docker compose down keeps named volumes; down -v deletes them. Neither a volume nor a bind mount is a backup. <span class="bp-text-tag">Model</span> <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a></li></ol><p><strong>End of the journey:</strong> The writable layer dies with its container; the named volume does not. Keeping data is not backing it up.</p></section><section class="bp-text-journey"><h3>E · Into the cluster</h3><p>a context, two nodes, a loaded image</p><ol><li><strong>kubectl</strong>: Every command names the course kubeconfig and the context kind-prumathe-dk: the destination is explicit. <span class="bp-text-tag">Lab</span> <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk get nodes</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[2 nodes Ready]</span>: The API server answers: a control-plane node and a worker, both Docker containers on your computer. <span class="bp-text-tag">Lab</span> <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk wait --for=condition=Ready nodes --all --timeout=90s</code></li><li><strong>kubelet</strong>: On each node, a kubelet runs the Pods assigned to it through the node&#39;s container runtime. <span class="bp-text-tag">Lab</span> <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a></li><li><strong>containerd</strong>: The worker&#39;s containerd has its own image store: your local image is not there yet. <span class="bp-text-tag">Lab</span> <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a></li><li><strong>Image</strong>: prumathe-signal:1.0.0 exists in your Docker Engine. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a></li><li><strong>containerd</strong> <span class="bp-text-stamp">[loaded]</span>: kind load docker-image copies it into the node. With imagePullPolicy: Never, a missing import fails visibly instead of downloading. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a> <code>kind load docker-image prumathe-signal:1.0.0 --name prumathe-dk</code></li></ol><p><strong>End of the journey:</strong> The cluster runs in containers on your computer: real Kubernetes, one shared failure domain. Its nodes have their own image store.</p></section><section class="bp-text-journey"><h3>F · Declare a Deployment</h3><p>apply, store, reconcile, schedule, run</p><ol><li><strong>kubectl</strong>: apply sends the desired state: a Deployment of two replicas and a Service. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/base.yaml</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[accepted]</span>: The API server authenticates, authorizes and validates the request, then accepts it. Accepted means stored, not running. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a></li><li><strong>etcd</strong>: The objects are stored in etcd. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Model</span> <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a></li><li><strong>Deployment signal</strong>: The Deployment signal: a Pod template labeled app=signal and replicas: 2. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a></li><li><strong>Controllers</strong> <span class="bp-text-stamp">[ReplicaSet]</span>: The Deployment controller creates a ReplicaSet; the ReplicaSet controller creates two Pod objects to match the count. <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get deployment,replicaset,pod -l app=signal</code></li><li><strong>Scheduler</strong> <span class="bp-text-stamp">[worker]</span>: The scheduler finds Pods with no node and binds them where their requests fit: 50m CPU and 32Mi each. <span class="bp-text-tag">Lab</span> <a href="lessons/scheduling.html?lang=en">Lesson 21 · Requests, limits and placement</a></li><li><strong>kubelet</strong>: The worker&#39;s kubelet sees two Pods bound to its node. <span class="bp-text-tag">Lab</span> <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a></li><li><strong>containerd</strong>: containerd starts their containers from the loaded image. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a></li><li><strong>signal Pods</strong> <span class="bp-text-stamp">[2/2 Ready]</span>: The startup probe passes, then readiness: two Pods Ready. <span class="bp-text-tag">Lab</span> <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout status deployment/signal --timeout=90s</code></li></ol><p><strong>End of the journey:</strong> You declared what should exist; the control plane made it so and keeps doing so after kubectl exits. Accepted, scheduled, running and ready are four different moments.</p></section><section class="bp-text-journey"><h3>G · A request through a Service</h3><p>a stable name, ready endpoints, readiness</p><ol><li><strong>signal Pods</strong>: kubectl exec runs probe.py inside a signal Pod: GET http://signal. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/services.html?lang=en">Lesson 17 · A stable front door</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal 1.0.0 200 30</code></li><li><strong>Service signal</strong>: The name signal resolves to the Service&#39;s virtual IP, on port 80. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/services.html?lang=en">Lesson 17 · A stable front door</a></li><li><strong>Service signal</strong> <span class="bp-text-stamp">[2 endpoints]</span>: It selects Pods labeled app=signal; its EndpointSlice lists their addresses and whether each is ready. <span class="bp-text-tag">Lab</span> <a href="lessons/services.html?lang=en">Lesson 17 · A stable front door</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get endpointslices -l kubernetes.io/service-name=signal -o yaml</code></li><li><strong>signal Pods</strong> <span class="bp-text-stamp">[200]</span>: The request reaches a ready Pod on targetPort 8080. <em>What the dot carries: HTTP request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/services.html?lang=en">Lesson 17 · A stable front door</a></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[not ready]</span>: In the lab&#39;s probe Pod, /ready starts failing. The kubelet marks the Pod not ready and leaves its container running. <span class="bp-text-tag">Lab</span> <a href="lessons/probes.html?lang=en">Lesson 20 · Alive, ready, started</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec probe -- touch /tmp/not-ready</code></li><li><strong>Service signal</strong> <span class="bp-text-stamp">[no traffic]</span>: The not-ready Pod is marked not ready in the EndpointSlice: its Service stops sending it traffic. <span class="bp-text-tag">Lab</span> <a href="lessons/probes.html?lang=en">Lesson 20 · Alive, ready, started</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get endpointslices -l kubernetes.io/service-name=probe-entry -o yaml</code></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[ready]</span>: Remove the file and readiness passes again. A failing liveness probe, on /health, would restart the container instead. <span class="bp-text-tag">Lab</span> <a href="lessons/probes.html?lang=en">Lesson 20 · Alive, ready, started</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec probe -- rm /tmp/not-ready</code></li></ol><p><strong>End of the journey:</strong> The Service gives clients a stable name over Pods that come and go; readiness decides which of them receive traffic, without restarting anything.</p></section><section class="bp-text-journey"><h3>H · Pods replaced, Pods pending</h3><p>the count is kept; capacity is real</p><ol><li><strong>kubectl</strong>: Delete the signal Pods. <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab delete pod -l app=signal --wait=true</code></li><li><strong>API server</strong>: The API server records the deletion. <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[stopped]</span>: The kubelet stops their containers. What they wrote in their writable layers is gone. <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a></li><li><strong>Controllers</strong> <span class="bp-text-stamp">[0 of 2]</span>: The ReplicaSet sees 0 of 2 and creates two new Pods: the desired count never changed. <span class="bp-text-tag">Lab</span> <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a></li><li><strong>Scheduler</strong>: The new Pods are bound to the worker. <span class="bp-text-tag">Lab</span> <a href="lessons/scheduling.html?lang=en">Lesson 21 · Requests, limits and placement</a></li><li><strong>signal Pods</strong> <span class="bp-text-stamp">[2/2, new names]</span>: Two Pods again, with new names, UIDs and IPs. The Service keeps finding them by label. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 24 · Deploy, break, recover</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout status deployment/signal --timeout=90s</code></li><li><strong>Scheduler</strong> <span class="bp-text-stamp">[Pending]</span>: Now a Pod that requests 1000 CPUs: no node fits, so it stays Pending and describe shows FailedScheduling with the reason. <span class="bp-text-tag">Lab</span> <a href="lessons/scheduling.html?lang=en">Lesson 21 · Requests, limits and placement</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab describe pod no-room</code></li></ol><p><strong>End of the journey:</strong> Controllers keep the count, not the instances: replacements are new Pods. And a desired count needs real capacity: what fits nowhere waits Pending.</p></section><section class="bp-text-journey"><h3>I · Roll out, roll back</h3><p>a new template, one Pod at a time</p><ol><li><strong>Docker Engine</strong>: Build version 1.1.0. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a> <code>docker build --build-arg APP_VERSION=1.1.0 -t prumathe-signal:1.1.0 app</code></li><li><strong>Image</strong>: prumathe-signal:1.1.0 exists in your Docker Engine. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a></li><li><strong>containerd</strong> <span class="bp-text-stamp">[loaded]</span>: Load it into the node. Forgetting this leaves the new Pods unable to start. <em>What the dot carries: Image.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a> <code>kind load docker-image prumathe-signal:1.1.0 --name prumathe-dk</code></li><li><strong>kubectl</strong>: set image changes the Deployment&#39;s Pod template. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab set image deployment/signal app=prumathe-signal:1.1.0</code></li><li><strong>Controllers</strong> <span class="bp-text-stamp">[surge 1, unavailable 0]</span>: A new template means a new ReplicaSet, scaled up one Pod at a time: maxSurge 1, maxUnavailable 0. <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a></li><li><strong>signal Pods</strong> <span class="bp-text-stamp">[1.1.0]</span>: Each new Pod must be ready before an old one goes. The probe now sees 1.1.0. <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal 1.1.0 200 30</code></li><li><strong>kubectl</strong> <span class="bp-text-stamp">[back to 1.0.0]</span>: rollout undo restores the previous template. It does not undo a migration, external data or a separate ConfigMap. <span class="bp-text-tag">Lab</span> <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout undo deployment/signal</code></li></ol><p><strong>End of the journey:</strong> A rollout replaces Pods through a new ReplicaSet, never below the desired count here. Rollback restores a template, not the data or the configuration around it.</p></section><section class="bp-text-journey"><h3>J · Configuration and secrets</h3><p>read at start, encoded not encrypted</p><ol><li><strong>kubectl</strong>: apply a ConfigMap and a Secret. <em>What the dot carries: MESSAGE, Fake token.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/config.yaml</code></li><li><strong>ConfigMap, Secret</strong>: signal-settings holds MESSAGE. demo-token holds a fake token, base64 encoded, and not encrypted in etcd by default. <em>What the dot carries: MESSAGE, Fake token.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get secret demo-token</code></li><li><strong>kubectl</strong>: set env --from adds references to its keys in the Deployment&#39;s Pod template. <em>What the dot carries: MESSAGE.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab set env deployment/signal --from=configmap/signal-settings</code></li><li><strong>Controllers</strong> <span class="bp-text-stamp">[rollout]</span>: A changed template means a rollout. <span class="bp-text-tag">Lab</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a></li><li><strong>signal Pods</strong> <span class="bp-text-stamp">[hello-kubernetes]</span>: The new Pods read MESSAGE when they start. <em>What the dot carries: MESSAGE.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal hello-kubernetes 200 30</code></li><li><strong>ConfigMap, Secret</strong>: Changing only the ConfigMap would change no running process: environment is read at start. Mounted files can update eventually, if the application rereads them. <span class="bp-text-tag">Model</span> <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a></li></ol><p><strong>End of the journey:</strong> Configuration reaches a process when it starts, so changing it means a rollout. A Secret has its own access controls, but base64 is not encryption.</p></section><section class="bp-text-journey"><h3>K · Storage beyond a Pod</h3><p>a claim that outlives its Pod</p><ol><li><strong>kubectl</strong>: apply a claim and a Pod that uses it. <em>What the dot carries: Desired state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/storage.yaml</code></li><li><strong>PVC notebook</strong> <span class="bp-text-stamp">[Bound]</span>: PVC notebook asks for 64Mi, ReadWriteOnce. kind&#39;s local provisioner creates a volume and binds it. <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get pvc notebook</code></li><li><strong>Pod writer</strong>: Pod writer mounts the claim at /data and writes a marker. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec writer -- sh -c &#39;echo pvc-survived &gt; /data/marker&#39;</code></li><li><strong>Pod writer</strong> <span class="bp-text-stamp">[deleted]</span>: Delete only the Pod. Nothing recreates a bare Pod. <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab delete pod writer --wait=true</code></li><li><strong>PVC notebook</strong> <span class="bp-text-stamp">[still Bound]</span>: The claim and its volume remain. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a></li><li><strong>Pod writer</strong> <span class="bp-text-stamp">[survived]</span>: Apply the manifest again: a new writer Pod with the same claim reads the marker. <em>What the dot carries: Marker file.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec writer -- cat /data/marker</code></li></ol><p><strong>End of the journey:</strong> The claim and its volume outlive the Pod that wrote to them. This storage lives in the local kind environment: it is not replicated and not a backup.</p></section><section class="bp-text-journey"><h3>L · Who may do what</h3><p>a ServiceAccount, a Role, a RoleBinding</p><ol><li><strong>kubectl</strong>: apply the ServiceAccount observer, the Role pod-reader and a RoleBinding between them. <span class="bp-text-tag">Lab</span> <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/rbac.yaml</code></li><li><strong>API server</strong>: Ask as observer: the administrator impersonates it with --as, which needs permission too. <em>What the dot carries: Caller identity.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i list pods --as=system:serviceaccount:dk-lab:observer</code></li><li><strong>RBAC authorizer</strong> <span class="bp-text-stamp">[list pods: yes]</span>: RoleBinding observer-reads-pods gives observer the Role pod-reader: get, list and watch on Pods in dk-lab. <em>What the dot carries: Caller identity.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a></li><li><strong>RBAC authorizer</strong> <span class="bp-text-stamp">[get secrets: no]</span>: Nothing grants secrets, and RBAC has no deny rules: what is not granted is refused. <em>What the dot carries: Caller identity.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i get secrets --as=system:serviceaccount:dk-lab:observer</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[delete pods: no]</span>: Deleting Pods is refused too. Authorization says nothing about network reach or the application&#39;s own login. <span class="bp-text-tag">Lab</span> <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i delete pods --as=system:serviceaccount:dk-lab:observer</code></li></ol><p><strong>End of the journey:</strong> The observer may read Pods in dk-lab and nothing else. Grant the verbs a workload needs; what nobody granted is refused.</p></section><section><h3>Pieces</h3><dl><dt id="bp-text-base">Base image · python:3.14.8-alpine3.24, by digest</dt><dd>The image the Dockerfile starts FROM, stored in a registry and pinned by its digest, so the build always starts from the same content. <em>What it does not do:</em> A tag alone is a name that can move; the digest is what identifies content. The course publishes nothing to a registry. <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a>, <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a></dd><dt id="bp-text-you">You · docker, compose, kind</dt><dd>Where every command starts: docker builds and runs, docker compose describes the local system, kind creates the cluster. <em>What it does not do:</em> The lab never asks you to prune Docker resources that are not the course&#39;s. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/compose.html?lang=en">Lesson 08 · Describe the local system</a></dd><dt id="bp-text-context">Build context · labs/app</dt><dd>The folder sent to the build: Dockerfile, server.py and probe.py. COPY can only read from it; .dockerignore keeps the rest out. <em>What it does not do:</em> A secret placed here or passed as a build argument ends up inside the image. <a href="lessons/dockerfile.html?lang=en">Lesson 04 · Build an image</a></dd><dt id="bp-text-engine">Docker Engine · builds images, runs containers</dt><dd>The daemon behind every docker command: it builds images, keeps them, and creates, starts and stops containers. Compose talks to it too. <em>What it does not do:</em> An unhealthy container is not restarted for being unhealthy; restart policies are about the process exiting. <a href="lessons/containers.html?lang=en">Lesson 01 · A process with boundaries</a>, <a href="lessons/lifecycle.html?lang=en">Lesson 02 · Start, stop, remove</a>, <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a></dd><dt id="bp-text-kubectl">kubectl · context kind-prumathe-dk</dt><dd>The client that sends requests to the API server. Every command of the course names the course kubeconfig and the context kind-prumathe-dk. <em>What it does not do:</em> kubectl does not run anything on the nodes; when it exits, the control plane keeps reconciling. <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a>, <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a></dd><dt id="bp-text-image">Image · prumathe-signal, 1.0.0</dt><dd>Filesystem layers plus configuration: USER 10001, CMD and APP_VERSION. It is the artifact, not a running process. <em>What it does not do:</em> A container&#39;s writes never change it, and an image in your Docker is not on a Kubernetes node until it is loaded there. <a href="lessons/images.html?lang=en">Lesson 03 · Images and layers</a>, <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a></dd><dt id="bp-text-toolbox">toolbox · probe.py, a client</dt><dd>A second container from the same image that runs probe.py against app: it checks name resolution, connection, status and text separately. <em>What it does not do:</em> Inside it, localhost is the toolbox itself, not app and not your computer. <a href="lessons/networks.html?lang=en">Lesson 06 · Names on a network</a>, <a href="lessons/debugging.html?lang=en">Lesson 12 · Follow the evidence</a></dd><dt id="bp-text-app">Container app · server.py, UID 10001</dt><dd>Signal running: a process with an isolated view of processes, network and files, a writable layer of its own, 0.5 CPU and 128 MiB, and a health check on /health. <em>What it does not do:</em> It shares your computer&#39;s kernel, and running as UID 10001 reduces privileges without making untrusted code harmless. <a href="lessons/containers.html?lang=en">Lesson 01 · A process with boundaries</a>, <a href="lessons/lifecycle.html?lang=en">Lesson 02 · Start, stop, remove</a>, <a href="lessons/compose.html?lang=en">Lesson 08 · Describe the local system</a>, <a href="lessons/health-resources.html?lang=en">Lesson 10 · Health and resource limits</a></dd><dt id="bp-text-volume">Volume signal-data · mounted at /data</dt><dd>A named volume that Docker manages and Compose mounts at /data. It outlives the container that wrote to it. <em>What it does not do:</em> It is not a backup, and docker compose down -v deletes it. <a href="lessons/storage.html?lang=en">Lesson 05 · Data that outlives a container</a></dd><dt id="bp-text-browser">Your browser · 127.0.0.1:18080</dt><dd>A client outside every container. It reaches Signal through the port Compose published on your computer&#39;s loopback. <em>What it does not do:</em> The name app means nothing here: it only resolves inside the project network. <a href="lessons/ports.html?lang=en">Lesson 07 · Publish a port deliberately</a></dd><dt id="bp-text-etcd">etcd · the stored state</dt><dd>The key-value store behind the API server: every object, desired and observed, lives here. <em>What it does not do:</em> Nothing talks to it but the API server. Secrets are not encrypted in it by default. <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a>, <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a></dd><dt id="bp-text-scheduler">Scheduler · picks a node</dt><dd>It finds Pods with no node and binds each to a node where its requests fit, along with constraints such as taints. <em>What it does not do:</em> It does not start containers, and live usage does not erase declared requests: a Pod that fits nowhere stays Pending. <a href="lessons/scheduling.html?lang=en">Lesson 21 · Requests, limits and placement</a></dd><dt id="bp-text-controllers">Controllers · close the gap</dt><dd>Loops that compare desired and observed state and act to reduce the difference: the Deployment controller manages ReplicaSets, the ReplicaSet controller keeps the Pod count. <em>What it does not do:</em> A bare Pod has no controller: delete it and nothing brings it back. <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a>, <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a>, <a href="lessons/pods.html?lang=en">Lesson 14 · The Pod boundary</a></dd><dt id="bp-text-rbac">RBAC authorizer · Roles and RoleBindings</dt><dd>How the API server decides whether a caller may perform a verb on a resource: a Role lists permissions, a RoleBinding gives them to a subject. <em>What it does not do:</em> RBAC permissions only add up; there is no deny rule. It says nothing about network reach or application login. <a href="lessons/rbac.html?lang=en">Lesson 23 · Grant only the needed verbs</a></dd><dt id="bp-text-apiserver">API server · every request goes through here</dt><dd>The front door of the cluster. It authenticates and authorizes each request, validates objects, stores them in etcd, and is what controllers, the scheduler and kubelets watch. <em>What it does not do:</em> Accepting an object means it was stored, not that its Pods are ready. <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a>, <a href="lessons/declarative.html?lang=en">Lesson 15 · Desired and observed state</a></dd><dt id="bp-text-deployment">Deployment signal · 2 replicas, ReplicaSets</dt><dd>A Pod template and a desired count. Each template change creates a new ReplicaSet; a rolling update moves Pods from the old one to the new one. <em>What it does not do:</em> rollout undo restores a template, not a database, external data or a separate ConfigMap. <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a>, <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a></dd><dt id="bp-text-service">Service signal · port 80 to 8080</dt><dd>A stable name and virtual IP that select Pods by the label app=signal. Its EndpointSlices list the ready backends. <em>What it does not do:</em> Type ClusterIP: reachable only inside the cluster. A DNS answer does not prove a healthy application. <a href="lessons/services.html?lang=en">Lesson 17 · A stable front door</a></dd><dt id="bp-text-config">ConfigMap, Secret · signal-settings, demo-token</dt><dd>ConfigMap signal-settings holds MESSAGE; Secret demo-token holds a clearly fake token. Pods can read them as environment variables or files. <em>What it does not do:</em> base64 is encoding, not encryption. Changing a ConfigMap does not change the environment of a process already running. <a href="lessons/configmaps-secrets.html?lang=en">Lesson 18 · Inject runtime configuration</a>, <a href="lessons/configuration.html?lang=en">Lesson 09 · Configuration and secrets</a></dd><dt id="bp-text-pvc">PVC notebook · 64Mi, ReadWriteOnce</dt><dd>A claim for storage. kind&#39;s local provisioner creates a PersistentVolume for it; the claim outlives the Pods that mount it. <em>What it does not do:</em> ReadWriteOnce means one node, not one Pod. This storage is local to kind: deleting the cluster loses it. <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a></dd><dt id="bp-text-kubelet">kubelet · runs Pods, probes them</dt><dd>The agent on each node: it runs the Pods bound to its node through the container runtime, and runs their startup, readiness and liveness probes. <em>What it does not do:</em> Readiness only gates traffic; liveness restarts the container. Neither replaces a deleted Pod: that is a controller&#39;s job. <a href="lessons/probes.html?lang=en">Lesson 20 · Alive, ready, started</a>, <a href="lessons/cluster.html?lang=en">Lesson 13 · Meet the cluster</a></dd><dt id="bp-text-runtime">containerd · the node&#39;s images</dt><dd>The container runtime of the node, with its own image store. kind load docker-image copies your local image into it. <em>What it does not do:</em> With imagePullPolicy: Never it never downloads: a missing image fails with ErrImageNeverPull. <a href="lessons/shipping.html?lang=en">Lesson 11 · Tags, digests and delivery</a>, <a href="lessons/rollouts.html?lang=en">Lesson 22 · Change versions with a way back</a></dd><dt id="bp-text-pods">signal Pods · 2 replicas, each with its own name and IP</dt><dd>The running replicas: each Pod has one container from prumathe-signal, a name, a UID and an IP of its own, requests of 50m CPU and 32Mi, and three probes. <em>What it does not do:</em> A Pod&#39;s identity is temporary: a replacement is a new Pod with a new name, and the files it wrote do not carry over. <a href="lessons/pods.html?lang=en">Lesson 14 · The Pod boundary</a>, <a href="lessons/deployments.html?lang=en">Lesson 16 · Keep replicas running</a>, <a href="lessons/scheduling.html?lang=en">Lesson 21 · Requests, limits and placement</a></dd><dt id="bp-text-writer">Pod writer · notebook at /data</dt><dd>A bare Pod that mounts the claim notebook at /data and writes a marker there. <em>What it does not do:</em> Being bare, nothing recreates it when it is deleted; applying the manifest again does. <a href="lessons/persistent-volumes.html?lang=en">Lesson 19 · Storage beyond a Pod</a></dd></dl></section><section><h3>What travels</h3><dl><dt>I · Image</dt><dd>prumathe-signal: layers and configuration, identified by an image ID. <em>Comes from:</em> docker build, from the build context. <em>Ends up:</em> Your Docker Engine, and a node&#39;s containerd after kind load.</dd><dt>G · Base digest</dt><dd>The sha256 digest that pins the base image&#39;s content. <em>Comes from:</em> The registry. <em>Ends up:</em> FROM in the Dockerfile, and the image built on it.</dd><dt>R · HTTP request</dt><dd>A GET to Signal, which answers with its message and its version. <em>Comes from:</em> Your browser, toolbox, or probe.py inside a Pod. <em>Ends up:</em> A process listening on port 8080.</dd><dt>K · Marker file</dt><dd>A small file written to /data to test what survives a replacement. <em>Comes from:</em> A container or a Pod. <em>Ends up:</em> A named volume, or the volume behind a claim.</dd><dt>M · Desired state</dt><dd>Objects described in a manifest: kind, metadata and spec. <em>Comes from:</em> kubectl apply, or an imperative command. <em>Ends up:</em> etcd, through the API server; controllers act on it.</dd><dt>E · MESSAGE</dt><dd>A runtime setting read by the process when it starts. <em>Comes from:</em> An environment variable: Compose, docker run -e, or a ConfigMap. <em>Ends up:</em> The environment of a new process.</dd><dt>S · Fake token</dt><dd>A deliberately fake credential, to show where secrets go and what protects them. <em>Comes from:</em> demo-token.txt in Compose; Secret demo-token in Kubernetes. <em>Ends up:</em> A file mount, or the Secret object behind the API.</dd><dt>A · Caller identity</dt><dd>Who a request comes from: here, the ServiceAccount observer. <em>Comes from:</em> kubectl, impersonating with --as. <em>Ends up:</em> The API server, which authenticates it and asks RBAC.</dd></dl></section><hr><h2>Panorama</h2><p>De un contexto de build a un Pod detrás de un Service</p><p>Un servicio HTTP chico, Signal, construido y ejecutado con Docker en tu computadora, y después declarado a un clúster de Kubernetes que kind corre como contenedores en esa misma computadora. Este dibujo pone en una escena todas las piezas del curso.</p><p>Elegí un recorrido: el punto es el pedido, el build o el estado declarado, y sus letras son lo que lleva. Cada parada dice qué se decide ahí y qué lección lo profundiza. Hacé clic en cualquier pieza para ver su ficha.</p><p>Las etiquetas dicen cómo ver cada parada por tu cuenta: LABORATORIO con los comandos del curso, MODELO solo en las lecciones.</p><section class="bp-text-journey"><h3>A · Construir una imagen</h3><p>contexto, caché, una base fijada, valores por defecto</p><ol><li><strong>Vos</strong>: docker build con la carpeta app como contexto, y un tag para el resultado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a> <code>docker build -t prumathe-signal:1.0.0 app</code></li><li><strong>Contexto de build</strong>: El engine recibe el contexto. COPY solo puede leer archivos de ahí; .dockerignore deja afuera lo que la imagen no necesita. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a></li><li><strong>Docker Engine</strong>: Cada instrucción es un paso. Si los insumos no cambian, se reusa la caché; cambiar server.py reconstruye desde su COPY en adelante. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a> <code>docker build --progress=plain -t prumathe-signal:1.0.0 app</code></li><li><strong>Imagen base</strong> <span class="bp-text-stamp">[por digest]</span>: FROM nombra la base por digest: exactamente ese contenido, apunte adonde apunte hoy el tag. <em>Qué lleva el punto: Digest base.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a> <code>docker pull python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72</code></li><li><strong>Docker Engine</strong>: USER 10001 y CMD pasan a ser los valores por defecto de la imagen; APP_VERSION es un argumento de build sin secretos. EXPOSE documenta 8080 y no publica nada. <em>Qué lleva el punto: Digest base.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a></li><li><strong>Imagen</strong> <span class="bp-text-stamp">[1.0.0]</span>: prumathe-signal:1.0.0: capas más configuración. El tag es un nombre; otro tag puede apuntar al mismo ID de imagen. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/images.html?lang=es">Lección 03 · Imágenes y capas</a> <code>docker image inspect --format &#39;{{.Config.User}} {{json .Config.Cmd}}&#39; prumathe-signal:1.0.0</code></li></ol><p><strong>Fin del recorrido:</strong> La imagen es un artefacto con capas y valores por defecto, construida desde un contexto que elegiste y una base fijada por digest. Ejecutarla es el paso siguiente.</p></section><section class="bp-text-journey"><h3>B · Ejecutar Signal con Compose</h3><p>un proceso, sus límites, su salud</p><ol><li><strong>Vos</strong>: docker compose up -d --wait app, en el proyecto prumathe-dk. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/compose.html?lang=es">Lección 08 · Describí el sistema local</a> <code>docker compose up -d --wait app</code></li><li><strong>Docker Engine</strong>: Compose le pide al engine la red del proyecto, el volumen y el contenedor app, con 0,5 CPU y 128 MiB. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/compose.html?lang=es">Lección 08 · Describí el sistema local</a></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[running]</span>: Su proceso principal es server.py como UID 10001, con una vista aislada de procesos, red y archivos, sobre el kernel del host. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/containers.html?lang=es">Lección 01 · Un proceso con límites</a></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[healthy]</span>: El health check de la imagen prueba /health; --wait volvió cuando el servicio quedó healthy. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a> <code>docker compose exec -T app python /app/probe.py http://127.0.0.1:8080/health ok</code></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[unhealthy]</span>: Creá /tmp/fail-live y /health responde 503. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a> <code>docker compose exec -T app touch /tmp/fail-live</code></li><li><strong>Docker Engine</strong> <span class="bp-text-stamp">[sigue running]</span>: El engine informa unhealthy, y running: no reinicia un contenedor por estar unhealthy. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a> <code>docker inspect --format &#39;{{.State.Health.Status}} {{.State.Running}}&#39; prumathe-dk-app-1</code></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[healthy]</span>: Borrá el archivo y los próximos chequeos se recuperan. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a> <code>docker compose exec -T app rm /tmp/fail-live</code></li></ol><p><strong>Fin del recorrido:</strong> Un contenedor es un proceso con límites. Healthy es una propiedad que mide un probe; running es otra, y Docker no reinicia un contenedor por estar unhealthy.</p></section><section class="bp-text-journey"><h3>C · Nombres y puertos</h3><p>un puerto publicado, un nombre de servicio, localhost</p><ol><li><strong>Tu navegador</strong>: Tu navegador pide 127.0.0.1:18080. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/ports.html?lang=es">Lección 07 · Publicá un puerto a propósito</a></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[200]</span>: Compose publicó el puerto 18080 del loopback hacia el puerto 8080 del contenedor, donde Signal escucha en 0.0.0.0. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/ports.html?lang=es">Lección 07 · Publicá un puerto a propósito</a> <code>docker compose port app 8080</code></li><li><strong>toolbox</strong>: Adentro de toolbox, localhost es el propio toolbox. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/networks.html?lang=es">Lección 06 · Nombres en una red</a></li><li><strong>Contenedor app</strong> <span class="bp-text-stamp">[app resuelve]</span>: El nombre app se resuelve en la red del proyecto, así que app:8080 llega a Signal desde cualquier contenedor de esa red. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/networks.html?lang=es">Lección 06 · Nombres en una red</a> <code>docker compose run --rm --no-deps --entrypoint python toolbox -c &quot;import socket; print(socket.gethostbyname(&#39;app&#39;))&quot;</code></li><li><strong>Contenedor app</strong>: Revisá una capa por vez: el nombre, la conexión, el estado, el texto. probe.py comprueba el estado y el texto esperado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/debugging.html?lang=es">Lección 12 · Seguí la evidencia</a> <code>docker compose run --rm --no-deps toolbox http://app:8080 hello-compose</code></li><li><strong>toolbox</strong>: Una red compartida deja pasar el pedido; no lo autentica. <span class="bp-text-tag">Modelo</span> <a href="lessons/networks.html?lang=es">Lección 06 · Nombres en una red</a></li></ol><p><strong>Fin del recorrido:</strong> El navegador usa el puerto publicado en el host; los contenedores de la red del proyecto usan el nombre de servicio y el puerto interno. Alcanzable no es autorizado.</p></section><section class="bp-text-journey"><h3>D · Datos que sobreviven al contenedor</h3><p>un volumen con nombre a través de un reemplazo</p><ol><li><strong>Contenedor app</strong>: Escribí una marca en /data, donde Compose monta el volumen con nombre signal-data. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a> <code>docker compose exec -T app sh -c &#39;echo volume-survived &gt; /data/marker&#39;</code></li><li><strong>Volumen signal-data</strong>: Los bytes quedan en el volumen, no en la capa escribible del contenedor. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a></li><li><strong>Docker Engine</strong> <span class="bp-text-stamp">[reemplazado]</span>: Recreá el contenedor: el viejo y su capa escribible se borran. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a> <code>docker compose up -d --wait --force-recreate app</code></li><li><strong>Contenedor app</strong>: El contenedor nuevo monta el mismo volumen en /data. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a></li><li><strong>Volumen signal-data</strong> <span class="bp-text-stamp">[sobrevivió]</span>: La marca sigue ahí. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a> <code>docker compose exec -T app cat /data/marker</code></li><li><strong>Volumen signal-data</strong>: docker compose down conserva los volúmenes con nombre; down -v los borra. Ni un volumen ni un bind mount son un respaldo. <span class="bp-text-tag">Modelo</span> <a href="lessons/storage.html?lang=es">Lección 05 · Datos que sobreviven al contenedor</a></li></ol><p><strong>Fin del recorrido:</strong> La capa escribible muere con su contenedor; el volumen con nombre, no. Conservar datos no es respaldarlos.</p></section><section class="bp-text-journey"><h3>E · Entrar al clúster</h3><p>un contexto, dos nodos, una imagen cargada</p><ol><li><strong>kubectl</strong>: Cada comando nombra el kubeconfig del curso y el contexto kind-prumathe-dk: el destino es explícito. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk get nodes</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[2 nodos Ready]</span>: El API server responde: un nodo de control y un worker, los dos contenedores Docker en tu computadora. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk wait --for=condition=Ready nodes --all --timeout=90s</code></li><li><strong>kubelet</strong>: En cada nodo, un kubelet ejecuta los Pods que le asignan a través del runtime de contenedores del nodo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a></li><li><strong>containerd</strong>: El containerd del worker tiene su propio almacén de imágenes: tu imagen local todavía no está ahí. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a></li><li><strong>Imagen</strong>: prumathe-signal:1.0.0 existe en tu Docker Engine. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a></li><li><strong>containerd</strong> <span class="bp-text-stamp">[cargada]</span>: kind load docker-image la copia al nodo. Con imagePullPolicy: Never, una importación faltante falla a la vista en lugar de descargar. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a> <code>kind load docker-image prumathe-signal:1.0.0 --name prumathe-dk</code></li></ol><p><strong>Fin del recorrido:</strong> El clúster corre en contenedores en tu computadora: Kubernetes de verdad, un solo dominio de falla compartido. Sus nodos tienen su propio almacén de imágenes.</p></section><section class="bp-text-journey"><h3>F · Declarar un Deployment</h3><p>aplicar, guardar, reconciliar, ubicar, ejecutar</p><ol><li><strong>kubectl</strong>: apply envía el estado deseado: un Deployment de dos réplicas y un Service. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/base.yaml</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[aceptado]</span>: El API server autentica, autoriza y valida el pedido, y lo acepta. Aceptado significa guardado, no en marcha. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a></li><li><strong>etcd</strong>: Los objetos se guardan en etcd. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a></li><li><strong>Deployment signal</strong>: El Deployment signal: una plantilla de Pod con la label app=signal y replicas: 2. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a></li><li><strong>Controladores</strong> <span class="bp-text-stamp">[ReplicaSet]</span>: El controlador de Deployments crea un ReplicaSet; el de ReplicaSets crea dos objetos Pod para llegar a la cantidad. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get deployment,replicaset,pod -l app=signal</code></li><li><strong>Scheduler</strong> <span class="bp-text-stamp">[worker]</span>: El scheduler encuentra Pods sin nodo y los asigna donde entran sus requests: 50m de CPU y 32Mi cada uno. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/scheduling.html?lang=es">Lección 21 · Requests, limits y ubicación</a></li><li><strong>kubelet</strong>: El kubelet del worker ve dos Pods asignados a su nodo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cluster.html?lang=es">Lección 13 · Conocé el clúster</a></li><li><strong>containerd</strong>: containerd arranca sus contenedores desde la imagen cargada. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a></li><li><strong>Pods de signal</strong> <span class="bp-text-stamp">[2/2 Ready]</span>: Pasa el probe de arranque y después readiness: dos Pods Ready. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/declarative.html?lang=es">Lección 15 · Estado deseado y observado</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout status deployment/signal --timeout=90s</code></li></ol><p><strong>Fin del recorrido:</strong> Declaraste qué tiene que existir; el plano de control lo hizo realidad y lo sigue haciendo después de que termina kubectl. Aceptado, ubicado, en marcha y listo son cuatro momentos distintos.</p></section><section class="bp-text-journey"><h3>G · Un pedido a través de un Service</h3><p>un nombre estable, destinos listos, readiness</p><ol><li><strong>Pods de signal</strong>: kubectl exec corre probe.py dentro de un Pod de signal: GET http://signal. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/services.html?lang=es">Lección 17 · Una entrada estable</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal 1.0.0 200 30</code></li><li><strong>Service signal</strong>: El nombre signal se resuelve a la IP virtual del Service, en el puerto 80. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/services.html?lang=es">Lección 17 · Una entrada estable</a></li><li><strong>Service signal</strong> <span class="bp-text-stamp">[2 destinos]</span>: Selecciona los Pods con la label app=signal; su EndpointSlice enumera sus direcciones y si cada uno está listo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/services.html?lang=es">Lección 17 · Una entrada estable</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get endpointslices -l kubernetes.io/service-name=signal -o yaml</code></li><li><strong>Pods de signal</strong> <span class="bp-text-stamp">[200]</span>: El pedido llega a un Pod listo en targetPort 8080. <em>Qué lleva el punto: Pedido HTTP.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/services.html?lang=es">Lección 17 · Una entrada estable</a></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[no listo]</span>: En el Pod probe del laboratorio, /ready empieza a fallar. El kubelet marca el Pod como no listo y deja su contenedor corriendo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/probes.html?lang=es">Lección 20 · Vivo, listo, arrancado</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec probe -- touch /tmp/not-ready</code></li><li><strong>Service signal</strong> <span class="bp-text-stamp">[sin tráfico]</span>: El Pod no listo queda marcado así en el EndpointSlice: su Service deja de mandarle tráfico. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/probes.html?lang=es">Lección 20 · Vivo, listo, arrancado</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get endpointslices -l kubernetes.io/service-name=probe-entry -o yaml</code></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[listo]</span>: Borrá el archivo y readiness vuelve a pasar. Un probe de liveness que fallara, sobre /health, reiniciaría el contenedor. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/probes.html?lang=es">Lección 20 · Vivo, listo, arrancado</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec probe -- rm /tmp/not-ready</code></li></ol><p><strong>Fin del recorrido:</strong> El Service les da a los clientes un nombre estable sobre Pods que van y vienen; readiness decide cuáles reciben tráfico, sin reiniciar nada.</p></section><section class="bp-text-journey"><h3>H · Pods reemplazados, Pods pendientes</h3><p>la cantidad se mantiene; la capacidad es real</p><ol><li><strong>kubectl</strong>: Borrá los Pods de signal. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab delete pod -l app=signal --wait=true</code></li><li><strong>API server</strong>: El API server registra el borrado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a></li><li><strong>kubelet</strong> <span class="bp-text-stamp">[detenidos]</span>: El kubelet detiene sus contenedores. Lo que escribieron en sus capas escribibles se pierde. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a></li><li><strong>Controladores</strong> <span class="bp-text-stamp">[0 de 2]</span>: El ReplicaSet ve 0 de 2 y crea dos Pods nuevos: la cantidad deseada nunca cambió. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deployments.html?lang=es">Lección 16 · Mantené réplicas en marcha</a></li><li><strong>Scheduler</strong>: Los Pods nuevos se asignan al worker. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/scheduling.html?lang=es">Lección 21 · Requests, limits y ubicación</a></li><li><strong>Pods de signal</strong> <span class="bp-text-stamp">[2/2, nombres nuevos]</span>: Dos Pods otra vez, con nombres, UIDs e IPs nuevos. El Service los sigue encontrando por label. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 24 · Desplegá, rompé, recuperá</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout status deployment/signal --timeout=90s</code></li><li><strong>Scheduler</strong> <span class="bp-text-stamp">[Pending]</span>: Ahora un Pod que pide 1000 CPUs: no entra en ningún nodo, así que queda Pending y describe muestra FailedScheduling con el motivo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/scheduling.html?lang=es">Lección 21 · Requests, limits y ubicación</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab describe pod no-room</code></li></ol><p><strong>Fin del recorrido:</strong> Los controladores mantienen la cantidad, no las instancias: los reemplazos son Pods nuevos. Y una cantidad deseada necesita capacidad real: lo que no entra en ningún lado espera Pending.</p></section><section class="bp-text-journey"><h3>I · Desplegar y volver atrás</h3><p>una plantilla nueva, un Pod por vez</p><ol><li><strong>Docker Engine</strong>: Construí la versión 1.1.0. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a> <code>docker build --build-arg APP_VERSION=1.1.0 -t prumathe-signal:1.1.0 app</code></li><li><strong>Imagen</strong>: prumathe-signal:1.1.0 existe en tu Docker Engine. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a></li><li><strong>containerd</strong> <span class="bp-text-stamp">[cargada]</span>: Cargala en el nodo. Si te olvidás, los Pods nuevos no pueden arrancar. <em>Qué lleva el punto: Imagen.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a> <code>kind load docker-image prumathe-signal:1.1.0 --name prumathe-dk</code></li><li><strong>kubectl</strong>: set image cambia la plantilla de Pod del Deployment. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab set image deployment/signal app=prumathe-signal:1.1.0</code></li><li><strong>Controladores</strong> <span class="bp-text-stamp">[surge 1, unavailable 0]</span>: Una plantilla nueva es un ReplicaSet nuevo, que crece de a un Pod: maxSurge 1, maxUnavailable 0. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a></li><li><strong>Pods de signal</strong> <span class="bp-text-stamp">[1.1.0]</span>: Cada Pod nuevo tiene que estar listo antes de que se vaya uno viejo. El probe ahora ve 1.1.0. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal 1.1.0 200 30</code></li><li><strong>kubectl</strong> <span class="bp-text-stamp">[vuelve a 1.0.0]</span>: rollout undo restaura la plantilla anterior. No deshace una migración, datos externos ni un ConfigMap aparte. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rollouts.html?lang=es">Lección 22 · Cambiá versiones con una vuelta posible</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab rollout undo deployment/signal</code></li></ol><p><strong>Fin del recorrido:</strong> Un rollout reemplaza Pods a través de un ReplicaSet nuevo, acá sin bajar nunca de la cantidad deseada. Volver atrás restaura una plantilla, no los datos ni la configuración de alrededor.</p></section><section class="bp-text-journey"><h3>J · Configuración y secretos</h3><p>se lee al arrancar, codificado y no cifrado</p><ol><li><strong>kubectl</strong>: Aplicá un ConfigMap y un Secret. <em>Qué lleva el punto: MESSAGE, Token falso.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/config.yaml</code></li><li><strong>ConfigMap, Secret</strong>: signal-settings guarda MESSAGE. demo-token guarda un token falso, codificado en base64, y no cifrado en etcd por defecto. <em>Qué lleva el punto: MESSAGE, Token falso.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get secret demo-token</code></li><li><strong>kubectl</strong>: set env --from agrega referencias a sus claves en la plantilla de Pod del Deployment. <em>Qué lleva el punto: MESSAGE.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab set env deployment/signal --from=configmap/signal-settings</code></li><li><strong>Controladores</strong> <span class="bp-text-stamp">[rollout]</span>: Una plantilla cambiada implica un rollout. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a></li><li><strong>Pods de signal</strong> <span class="bp-text-stamp">[hello-kubernetes]</span>: Los Pods nuevos leen MESSAGE al arrancar. <em>Qué lleva el punto: MESSAGE.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec deployment/signal -- python /app/probe.py http://signal hello-kubernetes 200 30</code></li><li><strong>ConfigMap, Secret</strong>: Cambiar solo el ConfigMap no cambiaría ningún proceso en marcha: el entorno se lee al arrancar. Los archivos montados pueden actualizarse con el tiempo, si la aplicación los vuelve a leer. <span class="bp-text-tag">Modelo</span> <a href="lessons/configmaps-secrets.html?lang=es">Lección 18 · Inyectá configuración de ejecución</a></li></ol><p><strong>Fin del recorrido:</strong> La configuración llega a un proceso cuando arranca, así que cambiarla implica un rollout. Un Secret tiene sus propios controles de acceso, pero base64 no es cifrado.</p></section><section class="bp-text-journey"><h3>K · Almacenamiento más allá de un Pod</h3><p>un pedido que sobrevive a su Pod</p><ol><li><strong>kubectl</strong>: Aplicá un pedido y un Pod que lo usa. <em>Qué lleva el punto: Estado deseado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/storage.yaml</code></li><li><strong>PVC notebook</strong> <span class="bp-text-stamp">[Bound]</span>: El PVC notebook pide 64Mi, ReadWriteOnce. El provisionador local de kind crea un volumen y lo vincula. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab get pvc notebook</code></li><li><strong>Pod writer</strong>: El Pod writer monta el pedido en /data y escribe una marca. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec writer -- sh -c &#39;echo pvc-survived &gt; /data/marker&#39;</code></li><li><strong>Pod writer</strong> <span class="bp-text-stamp">[borrado]</span>: Borrá solo el Pod. Nada recrea un Pod suelto. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab delete pod writer --wait=true</code></li><li><strong>PVC notebook</strong> <span class="bp-text-stamp">[sigue Bound]</span>: El pedido y su volumen siguen ahí. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a></li><li><strong>Pod writer</strong> <span class="bp-text-stamp">[sobrevivió]</span>: Volvé a aplicar el manifiesto: un Pod writer nuevo con el mismo pedido lee la marca. <em>Qué lleva el punto: Archivo marca.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/persistent-volumes.html?lang=es">Lección 19 · Almacenamiento más allá de un Pod</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab exec writer -- cat /data/marker</code></li></ol><p><strong>Fin del recorrido:</strong> El pedido y su volumen sobreviven al Pod que escribió en ellos. Este almacenamiento vive en el entorno local de kind: no está replicado ni es un respaldo.</p></section><section class="bp-text-journey"><h3>L · Quién puede hacer qué</h3><p>un ServiceAccount, un Role, un RoleBinding</p><ol><li><strong>kubectl</strong>: Aplicá el ServiceAccount observer, el Role pod-reader y un RoleBinding entre los dos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab apply -f k8s/rbac.yaml</code></li><li><strong>API server</strong>: Preguntá como observer: el administrador lo suplanta con --as, que también requiere permiso. <em>Qué lleva el punto: Identidad de quien llama.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i list pods --as=system:serviceaccount:dk-lab:observer</code></li><li><strong>Autorizador RBAC</strong> <span class="bp-text-stamp">[list pods: sí]</span>: El RoleBinding observer-reads-pods le da a observer el Role pod-reader: get, list y watch sobre Pods en dk-lab. <em>Qué lleva el punto: Identidad de quien llama.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a></li><li><strong>Autorizador RBAC</strong> <span class="bp-text-stamp">[get secrets: no]</span>: Nada otorga secretos, y RBAC no tiene reglas deny: lo que no se otorgó se rechaza. <em>Qué lleva el punto: Identidad de quien llama.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i get secrets --as=system:serviceaccount:dk-lab:observer</code></li><li><strong>API server</strong> <span class="bp-text-stamp">[delete pods: no]</span>: Borrar Pods también se rechaza. La autorización no dice nada de conectividad ni del login propio de la aplicación. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rbac.html?lang=es">Lección 23 · Otorgá solo los verbos necesarios</a> <code>kubectl --kubeconfig kubeconfig --context kind-prumathe-dk -n dk-lab auth can-i delete pods --as=system:serviceaccount:dk-lab:observer</code></li></ol><p><strong>Fin del recorrido:</strong> observer puede leer Pods en dk-lab y nada más. Otorgá los verbos que necesita una carga; lo que nadie otorgó se rechaza.</p></section><section><h3>Piezas</h3><dl><dt id="bp-text-base">Imagen base · python:3.14.8-alpine3.24, por digest</dt><dd>La imagen de la que parte el Dockerfile con FROM, guardada en un registro y fijada por su digest, para que el build siempre empiece del mismo contenido. <em>Qué no hace:</em> Un tag solo es un nombre que se puede mover; lo que identifica el contenido es el digest. El curso no publica nada en un registro. <a href="lessons/shipping.html?lang=es">Lección 11 · Tags, digests y distribución</a>, <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a></dd><dt id="bp-text-you">Vos · docker, compose, kind</dt><dd>Donde empieza cada comando: docker construye y ejecuta, docker compose describe el sistema local, kind crea el clúster. <em>Qué no hace:</em> El laboratorio nunca te pide purgar recursos de Docker que no sean del curso. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/compose.html?lang=es">Lección 08 · Describí el sistema local</a></dd><dt id="bp-text-context">Contexto de build · labs/app</dt><dd>La carpeta que se envía al build: Dockerfile, server.py y probe.py. COPY solo puede leer de ahí; .dockerignore deja afuera lo demás. <em>Qué no hace:</em> Un secreto puesto acá o pasado como argumento de build termina dentro de la imagen. <a href="lessons/dockerfile.html?lang=es">Lección 04 · Construí una imagen</a></dd><dt id="bp-text-engine">Docker Engine · construye imágenes, ejecuta contenedores</dt><dd>El demonio detrás de cada comando docker: construye imágenes, las guarda y crea, arranca y detiene contenedores. Compose también le habla. <em>Qué no hace:</em> A un contenedor unhealthy no lo reinicia por estar unhealthy; las políticas de reinicio tratan de que el proceso termine. <a href="lessons/containers.html?lang=es">Lección 01 · Un proceso con límites</a>, <a href="lessons/lifecycle.html?lang=es">Lección 02 · Arrancar, parar, borrar</a>, <a href="lessons/health-resources.html?lang=es">Lección 10 · Salud y límites de recursos</a></dd><dt id="bp-text-kubectl">kubectl · contexto kind-prumathe-dk</dt><dd>El cliente que envía pedidos al API server. Cada comando del curso nombra el kubeconfig del curso y el contexto kind-prumathe-dk. <em>Qu
