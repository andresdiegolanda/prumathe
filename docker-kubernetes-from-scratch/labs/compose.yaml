name: prumathe-dk
services:
  app:
    image: prumathe-signal:1.0.0
    build: ./app
    environment:
      MESSAGE: hello-compose
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - signal-data:/data
    secrets:
      - demo_token
    mem_limit: 128m
    cpus: 0.5
  toolbox:
    image: prumathe-signal:1.0.0
    profiles: [tools]
    entrypoint: [python, /app/probe.py]
    command: ["http://app:8080", "hello-compose"]
  # Live viewer (lesson 01): http://127.0.0.1:18091. It only reads Docker and, from lesson 13, the
  # course cluster. Start it by naming it, docker compose up -d --wait visor; stop it with
  # docker compose stop visor. DOCKER_GID: the group of the socket, 0 in Docker Desktop.
  visor:
    image: prumathe-visor:1.4.0
    build: ./visor
    profiles: [visor]
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/course:ro
    networks: [visor]
    ports:
      - "127.0.0.1:18091:18091"
    init: true
networks:
  visor: {}
volumes:
  signal-data:
secrets:
  demo_token:
    file: ./demo-token.txt
