apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
  namespace: dk-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dk-lab
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer-reads-pods
  namespace: dk-lab
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: dk-lab
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
