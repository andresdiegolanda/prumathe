apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notebook
  namespace: dk-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: dk-lab
spec:
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 10001
  containers:
    - name: app
      image: prumathe-signal:1.0.0
      imagePullPolicy: Never
      volumeMounts:
        - name: notebook
          mountPath: /data
  volumes:
    - name: notebook
      persistentVolumeClaim:
        claimName: notebook
