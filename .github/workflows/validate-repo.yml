# Controla en cada push lo que ningún curso puede controlar de sí mismo: los archivos y los
# enlaces de fuera de los cursos, el motor común del panorama, los puertos locales, lo que la
# portada repite de cada curso y el tablero (scripts/check.mjs). Cada curso tiene su propio workflow.
name: Validar el repositorio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check.mjs
