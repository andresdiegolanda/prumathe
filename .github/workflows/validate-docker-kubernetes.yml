name: Validar docker-kubernetes-from-scratch
on:
  push:
    paths:
      - 'docker-kubernetes-from-scratch/**'
      - '.github/workflows/validate-docker-kubernetes.yml'
  pull_request:
    paths:
      - 'docker-kubernetes-from-scratch/**'
      - '.github/workflows/validate-docker-kubernetes.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-kubernetes-from-scratch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: docker compose -f labs/compose.yaml config --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: docker-kubernetes-from-scratch-dist
          path: docker-kubernetes-from-scratch/dist
