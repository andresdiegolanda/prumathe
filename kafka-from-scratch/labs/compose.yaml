name: kafka-from-scratch

# Teaching platform, not a deployment template. The brokers run as root (user 0:0) so that the
# named volumes never raise permission questions on any Docker setup; a production image runs
# as its own user. The health check starts a JVM each time, so it runs every 5 s only while the
# broker is starting (start_interval, Docker Engine 25 or newer) and every 30 s afterwards.
x-broker: &broker
  image: apache/kafka:4.1.2
  user: "0:0"
  restart: "no"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 30s
    timeout: 10s
    start_period: 60s
    start_interval: 5s
    retries: 6

x-environment: &environment
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
  KAFKA_LOG_CLEANER_BACKOFF_MS: 1000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  kafka1:
    <<: *broker
    ports: ["127.0.0.1:19092:19092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,HOST://localhost:19092
    volumes: ["kafka1-data:/var/lib/kafka/data"]
  kafka2:
    <<: *broker
    ports: ["127.0.0.1:29092:19092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,HOST://localhost:29092
    volumes: ["kafka2-data:/var/lib/kafka/data"]
  kafka3:
    <<: *broker
    ports: ["127.0.0.1:39092:19092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,HOST://localhost:39092
    volumes: ["kafka3-data:/var/lib/kafka/data"]

  lab:
    profiles: [tools]
    build: .
    image: kafka-course-lab:1.3.0
    environment:
      BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    stdin_open: true
    init: true

  spring:
    profiles: [spring]
    build: ./spring
    image: kafka-course-spring:1.3.0
    environment:
      BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    ports: ["127.0.0.1:18080:8080"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthProbe"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20

  http:
    profiles: [spring]
    image: curlimages/curl:8.12.1
    volumes: ["./spring/requests:/requests:ro"]

  connect:
    profiles: [connect]
    image: apache/kafka:4.1.2
    user: "0:0"
    entrypoint: ["sh", "/course/connect/start.sh"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - ./connect:/course/connect:ro
      - connect-data:/data

  postgres:
    profiles: [database]
    image: postgres:17.4
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course-demo-only
      POSTGRES_DB: course
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 5s
      timeout: 5s
      retries: 20

  secure:
    <<: *broker
    profiles: [security]
    environment:
      CLUSTER_ID: "U2VjdXJlQ291cnNlMDAwMQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@secure:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://secure:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-demo" user_broker="broker-demo" user_admin="admin-demo" user_writer="writer-demo" user_reader="reader-demo";'
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-demo" user_broker="broker-demo";'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:broker;User:admin"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - secure-data:/var/lib/kafka/data
      - ./security:/course/security:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server secure:9092 --command-config /course/security/admin.properties --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 6

  mirror:
    <<: *broker
    profiles: [mirror]
    environment: &single-environment
      CLUSTER_ID: "TWlycm9yQ291cnNlMDAwMQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@mirror:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://mirror:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["mirror-data:/var/lib/kafka/data"]

  share:
    <<: *broker
    profiles: [share]
    environment:
      <<: *single-environment
      CLUSTER_ID: "U2hhcmVDb3Vyc2UwMDAwMQ"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@share:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://share:9092
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    volumes: ["share-data:/var/lib/kafka/data"]

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  connect-data:
  postgres-data:
  secure-data:
  mirror-data:
  share-data:
