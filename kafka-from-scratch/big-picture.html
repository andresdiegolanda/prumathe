<body class="bp-page"><div id="bp"></div><noscript><main class="bp-noscript"><h2>Big picture</h2><p>One order, from the producer to every reader</p><p>The café publishes each order once. Kafka keeps it in a partitioned, replicated log, and every team reads it at its own pace. This picture puts every piece of the course on one scene.</p><p>Pick a journey: the dot is the record or the request, and its letters are what it carries. Each stop says what is decided there and which lesson goes deeper. Click any piece, or any area, for its card.</p><p>Tags say how to see a stop for yourself: LAB in the Docker lab, MODEL only in the lessons.</p><section class="bp-text-journey"><h3>A · Publish an order, then read it</h3><p>Spring, the leader, the replicas, a listener</p><ol><li><strong>HTTP client</strong>: POST /orders/order-42 with a JSON order. The client knows nothing about Kafka. <span class="bp-text-tag">Lab</span> <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a> <code>docker compose --profile spring up -d --build --wait spring</code></li><li><strong>Spring producer</strong>: OrderProducer calls KafkaTemplate.send(topic, orderId, event): the key is the order ID. <span class="bp-text-tag">Lab</span> <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></li><li><strong>Producer client</strong> <span class="bp-text-stamp">[P0]</span>: The partitioner hashes the key&#39;s bytes with murmur2, modulo 3: order-42 goes to partition 0, and stays there while the count is 3. <span class="bp-text-tag">Lab</span> <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a></li><li><strong>Producer client</strong>: JsonSerializer turned the order into bytes. The record waits in a batch for partition 0; linger.ms and batch.size decide when it leaves. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/producer.html?lang=en">Lesson 06 · The producer’s waiting room</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[appended]</span>: The leader of partition 0 appends the batch at the end of its log. The record gets its offset only now. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/partitions.html?lang=en">Lesson 04 · One topic, many logs</a></li><li><strong>Follower replicas</strong>: The followers on the other two brokers fetch the new record. The replicas that keep up form the ISR. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[acks=all ✓]</span>: With acks=all the leader answers once the in-sync replicas have it; the topic&#39;s min.insync.replicas=2 is the floor. <em>What the dot carries: Acknowledgment.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/durability.html?lang=en">Lesson 11 · What does “saved” mean?</a></li><li><strong>HTTP client</strong> <span class="bp-text-stamp">[202]</span>: HTTP 202 Accepted, with topic, partition and offset. Stored, not processed: nobody has read it yet. <em>What the dot carries: Acknowledgment.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></li><li><strong>Orders topic</strong>: The record waits in partition 0. Reading it will not remove it. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/event-log.html?lang=en">Lesson 02 · An event is a fact</a></li><li><strong>Spring listener</strong>: Spring&#39;s listener, in group spring-kitchen, polls it and receives a ConsumerRecord&lt;String, OrderPlaced&gt;. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[committed]</span>: The listener returned normally, so AckMode.RECORD commits the next offset: where the group resumes. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li><li><strong>Spring listener</strong> <span class="bp-text-stamp">[2 records]</span>: Send the same POST again and the topic gets a second record: a new send, even with the same event ID. <span class="bp-text-tag">Lab</span> <a href="lessons/idempotence.html?lang=en">Lesson 16 · Two different kinds of duplicate</a> <code>docker compose run --rm http --fail-with-body http://spring:8080/received</code></li></ol><p><strong>End of the journey:</strong> The order was stored once, copied to the in-sync replicas and read by a group that committed its bookmark. Stored, read and processed are three different facts.</p></section><section class="bp-text-journey"><h3>B · Keys choose a lane</h3><p>order within a partition, none across</p><ol><li><strong>Producer client</strong>: The lab sends three orders with two keys: order-1, order-2, order-1. For each, the partitioner takes murmur2 of the key&#39;s bytes, made positive, modulo 3. <span class="bp-text-tag">Lab</span> <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a> <code>docker compose run --rm lab seed 4</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[order-1: P1]</span>: order-1 lands in partition 1, both times: same key, same partition, in the order they were sent. <span class="bp-text-tag">Lab</span> <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[order-2: P0]</span>: order-2 lands in partition 0. <span class="bp-text-tag">Lab</span> <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a></li><li><strong>Orders topic</strong>: Each partition keeps its own order and its own offsets: offset 0 exists in every lane. Across partitions there is no global order. <span class="bp-text-tag">Lab</span> <a href="lessons/partitions.html?lang=en">Lesson 04 · One topic, many logs</a> <code>docker compose run --rm lab read 4</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[moved]</span>: Expand to four partitions and send again: the modulo changes, so order-1 now lands in partition 2 and order-2 in the new partition 3. Their earlier records stay where they were. <span class="bp-text-tag">Lab</span> <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a> <code>docker compose run --rm lab expand 4 4</code></li><li><strong>Kitchen group</strong>: Partitions also set the ceiling of a group: three partitions keep at most three members of a group busy. <span class="bp-text-tag">Lab</span> <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a></li></ol><p><strong>End of the journey:</strong> Keys draw the ordering boundary. Changing the partition count moves keys; existing records stay where they were.</p></section><section class="bp-text-journey"><h3>C · Two teams, one history</h3><p>each group reads everything, at its own pace</p><ol><li><strong>Orders topic</strong>: Six orders sit in the topic&#39;s three partitions. Reading them will not remove them. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/event-log.html?lang=en">Lesson 02 · An event is a fact</a> <code>docker compose run --rm lab seed 6</code></li><li><strong>Kitchen group</strong>: In the kitchen group, the coordinator gives each partition to one member at a time. The member reads the orders of its partitions. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a> <code>docker compose run --rm lab watch 6 kitchen</code></li><li><strong>Side effects</strong> <span class="bp-text-stamp">[ticket]</span>: It prints the kitchen ticket: an effect outside Kafka. <span class="bp-text-tag">Model</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[kitchen]</span>: Then the kitchen commits the next offset. The coordinator keeps it in __consumer_offsets under the group ID kitchen. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li><li><strong>Billing group</strong>: Billing, another group ID, reads the same orders from the same log. Nothing was taken away. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a> <code>docker compose run --rm lab watch 6 billing</code></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[billing]</span>: Billing commits its own bookmark. Neither group knows how far the other has read. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li></ol><p><strong>End of the journey:</strong> A topic is not a queue that empties. Each group reads the whole retained history and keeps its own bookmark.</p></section><section class="bp-text-journey"><h3>D · A bookmark, not a receipt</h3><p>commit, restart, lag, reset, rebalance</p><ol><li><strong>Kitchen group</strong>: A member reads three records and commits offset 3. That means resume at 3, not record 3 is done. <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a> <code>docker compose run --rm lab consume 7 bookmarks</code></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[resume at 3]</span>: The bookmark is durable: it survives the member. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li><li><strong>Kitchen group</strong>: The member restarts, asks for its committed offset and resumes there. auto.offset.reset does not override a valid bookmark. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[lag]</span>: Lag is the log end offset minus the committed offset: a distance in offsets, not in seconds. <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a> <code>docker compose run --rm lab lag 7 bookmarks</code></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[reset]</span>: To replay, stop the group&#39;s members and move its offsets back on purpose. <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a> <code>docker compose run --rm lab reset 7 bookmarks</code></li><li><strong>Kitchen group</strong> <span class="bp-text-stamp">[rebalance]</span>: A member joins or leaves and the group redistributes partitions; the new owner resumes from the committed offset. A member that does not poll within max.poll.interval.ms loses its partitions. <span class="bp-text-tag">Lab</span> <a href="lessons/rebalances.html?lang=en">Lesson 09 · When the team changes</a> <code>docker compose run --rm lab describe-group team</code></li></ol><p><strong>End of the journey:</strong> The committed offset is where to resume after a restart. Lag is a distance in offsets. Neither proves that the business work finished.</p></section><section class="bp-text-journey"><h3>E · A broker falls</h3><p>a new leader, a smaller ISR, a durability floor</p><ol><li><strong>Orders topic</strong>: The lesson&#39;s topic has one partition with three replicas: kafka1 leads, two followers copy, all three in the ISR. <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a> <code>docker compose run --rm lab describe 9</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[kafka1 down]</span>: Stop kafka1: for a moment the partition has no leader. <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a> <code>docker compose stop kafka1</code></li><li><strong>KRaft controllers</strong> <span class="bp-text-stamp">[2 of 3]</span>: The two remaining controllers are still a majority. They choose a new leader among the in-sync replicas and record it in the metadata log. <em>What the dot carries: Cluster metadata.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/kraft.html?lang=en">Lesson 12 · Who keeps the cluster’s map?</a></li><li><strong>Follower replicas</strong>: An in-sync follower becomes the leader, and the ISR shrinks to two. <em>What the dot carries: Cluster metadata.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[readable]</span>: Clients refresh their metadata and retry against the new leader. The records remain readable. <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a> <code>docker compose run --rm lab read 9</code></li><li><strong>Producer client</strong> <span class="bp-text-stamp">[NotEnoughReplicas]</span>: With acks=all, a write needs at least min.insync.replicas in the ISR. Lesson 11&#39;s topic asks for 3, so with one broker down the write fails; a topic asking for 2 would keep writing. <span class="bp-text-tag">Lab</span> <a href="lessons/durability.html?lang=en">Lesson 11 · What does “saved” mean?</a> <code>docker compose run --rm lab seed 10</code></li><li><strong>KRaft controllers</strong>: Metadata still changes with two of three controllers: a new topic can be created. Lose another one and it cannot. <span class="bp-text-tag">Lab</span> <a href="lessons/kraft.html?lang=en">Lesson 12 · Who keeps the cluster’s map?</a> <code>docker compose run --rm lab create-extra 11</code></li><li><strong>Follower replicas</strong> <span class="bp-text-stamp">[ISR 3]</span>: Start the broker again: it catches up from the leader and rejoins the ISR. <span class="bp-text-tag">Lab</span> <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a> <code>docker compose up -d --wait</code></li></ol><p><strong>End of the journey:</strong> Replicas keep the data readable and the controllers keep the map. min.insync.replicas turns a weaker write into an explicit error.</p></section><section class="bp-text-journey"><h3>F · History has a horizon</h3><p>retention, compaction, tombstones</p><ol><li><strong>Orders topic</strong>: Records go into the active segment of each partition. Older segments can be deleted by time or by size per partition. <span class="bp-text-tag">Lab</span> <a href="lessons/retention.html?lang=en">Lesson 13 · History has a horizon</a> <code>docker compose run --rm lab seed 12</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[start &gt; 0]</span>: When a segment is deleted, the earliest offset moves up. The other offsets keep their numbers. <span class="bp-text-tag">Lab</span> <a href="lessons/retention.html?lang=en">Lesson 13 · History has a horizon</a> <code>docker compose run --rm lab offsets 12</code></li><li><strong>Kitchen group</strong>: A group whose bookmark now points before the start has no valid offset: auto.offset.reset decides where it begins. <span class="bp-text-tag">Model</span> <a href="lessons/retention.html?lang=en">Lesson 13 · History has a horizon</a></li><li><strong>Orders topic</strong>: A compacted topic interprets keys as rows: it eventually keeps at least the latest value of each key. <span class="bp-text-tag">Lab</span> <a href="lessons/compaction.html?lang=en">Lesson 14 · Keep the latest known value</a> <code>docker compose run --rm lab compact-seed 13</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[tombstone]</span>: A null value for key B is a tombstone: the table rebuilt from the topic drops B, even before the cleaner runs. <span class="bp-text-tag">Lab</span> <a href="lessons/compaction.html?lang=en">Lesson 14 · Keep the latest known value</a> <code>docker compose run --rm lab table 13</code></li><li><strong>Orders topic</strong>: The cleaner runs later. It leaves gaps, and the surviving records keep their offsets and their order. <span class="bp-text-tag">Lab</span> <a href="lessons/compaction.html?lang=en">Lesson 14 · Keep the latest known value</a> <code>docker compose run --rm lab read 13</code></li></ol><p><strong>End of the journey:</strong> Retention bounds how far back anyone can replay; compaction keeps the latest value per key. Offsets are never renumbered.</p></section><section class="bp-text-journey"><h3>G · The crash between two actions</h3><p>at least once, then an idempotent effect</p><ol><li><strong>Orders topic</strong>: Three input events wait in the lesson&#39;s topic. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a> <code>docker compose run --rm lab seed 14</code></li><li><strong>Processor</strong>: A consumer in group delivery-demo reads them. Its plan: write an effect for each one, then commit the input offsets. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a> <code>docker compose run --rm lab delivery crash</code></li><li><strong>Output topics</strong> <span class="bp-text-stamp">[effect 1]</span>: The first effect is written to lab14-effects... <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a></li><li><strong>Processor</strong> <span class="bp-text-stamp">[crash]</span>: ...and the process crashes before committing anything. <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a></li><li><strong>Group coordinator</strong> <span class="bp-text-stamp">[not moved]</span>: The group&#39;s bookmark never moved. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></li><li><strong>Processor</strong>: On restart it resumes from the old bookmark and reads the first event again. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a> <code>docker compose run --rm lab delivery resume</code></li><li><strong>Output topics</strong> <span class="bp-text-stamp">[twice]</span>: The first effect is written again: at least once, with a duplicate. <span class="bp-text-tag">Lab</span> <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a> <code>docker compose run --rm lab read-topic lab14-effects</code></li><li><strong>Processor</strong> <span class="bp-text-stamp">[APPLY, SKIP]</span>: An idempotent sink stores the event ID with its effect in one database transaction, and a unique constraint refuses the repeat. The lab shows the idea with an in-memory set. <em>What the dot carries: Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/idempotence.html?lang=en">Lesson 16 · Two different kinds of duplicate</a> <code>docker compose run --rm lab dedup 15</code></li></ol><p><strong>End of the journey:</strong> Commit after the effect and a crash repeats it; commit before and a crash loses it. Choose, then make the effect safe to repeat by event ID.</p></section><section class="bp-text-journey"><h3>H · Exactly once inside Kafka</h3><p>output and offsets in one transaction</p><ol><li><strong>Processor</strong>: The processor has a stable transactional.id. initTransactions fences any older instance with the same ID. <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a> <code>docker compose run --rm lab eos 16</code></li><li><strong>Transaction coordinator</strong>: The transaction coordinator registers it; a transaction begins. <em>What the dot carries: Transaction.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Orders topic</strong>: It reads the input with read_committed and auto-commit off. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Output topics</strong> <span class="bp-text-stamp">[pending]</span>: It writes the outputs. They are in the log, but read_committed readers do not see them yet. <em>What the dot carries: Order record, Transaction.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Transaction coordinator</strong>: sendOffsetsToTransaction puts the next input offsets inside the same transaction. <em>What the dot carries: Committed offset, Transaction.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Group coordinator</strong>: The offsets reach the group coordinator as part of the transaction. <em>What the dot carries: Committed offset.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Transaction coordinator</strong> <span class="bp-text-stamp">[committed]</span>: Commit: the coordinator writes commit markers for the outputs and the offsets. With abort, both would be discarded together. <em>What the dot carries: Transaction.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></li><li><strong>Output topics</strong> <span class="bp-text-stamp">[visible]</span>: Now read_committed readers see the outputs, exactly once per input. <span class="bp-text-tag">Lab</span> <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a> <code>docker compose run --rm lab read 16 read_committed</code></li><li><strong>Processor</strong> <span class="bp-text-stamp">[Kafka only]</span>: The capstone checks one committed output per input and no lag left. That proves the Kafka boundary, not an external effect. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 29 · Ship an order. Survive a failure.</a> <code>docker compose run --rm lab verify 27</code></li></ol><p><strong>End of the journey:</strong> Output records and input offsets commit together, or neither does. The boundary is Kafka to Kafka; an email or a payment stays outside it.</p></section><section class="bp-text-journey"><h3>I · From a database row to an event</h3><p>the outbox closes the dual-write gap</p><ol><li><strong>orders + outbox</strong> <span class="bp-text-stamp">[one transaction]</span>: One database transaction writes the order row and an outbox row with event ID outbox-E42. No Kafka call yet. <em>What the dot carries: Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a> <code>docker compose run --rm lab outbox create</code></li><li><strong>Outbox relay</strong>: The relay polls the unsent outbox rows. <em>What the dot carries: Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[ack]</span>: It publishes the event, and Kafka acknowledges it. <em>What the dot carries: Order record, Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></li><li><strong>Outbox relay</strong> <span class="bp-text-stamp">[crash]</span>: Crash before marking the row sent: the event is in Kafka and the row is still pending. <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a> <code>docker compose run --rm lab outbox crash</code></li><li><strong>orders + outbox</strong>: The next run finds the same pending row, with the same event ID. <em>What the dot carries: Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[2 copies]</span>: It publishes it again: two records share one event ID. <em>What the dot carries: Order record, Event ID.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a> <code>docker compose run --rm lab outbox relay</code></li><li><strong>Kitchen group</strong>: A reader that records event IDs with its effects applies it once and skips the copy. <em>What the dot carries: Event ID.</em> <span class="bp-text-tag">Model</span> <a href="lessons/idempotence.html?lang=en">Lesson 16 · Two different kinds of duplicate</a></li></ol><p><strong>End of the journey:</strong> The order and its event commit together in the database. The relay is at least once, so the stable event ID makes a repeat harmless.</p></section><section class="bp-text-journey"><h3>J · A stream becomes a table</h3><p>count by key, local state, windows</p><ol><li><strong>Orders topic</strong>: Keyed events arrive in the input topic. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a> <code>docker compose run --rm lab seed 20</code></li><li><strong>Processor</strong>: A Kafka Streams topology in a Java process: stream, groupByKey, count. Its application.id names its group and its internal topics. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a> <code>docker compose run --rm lab streams 20</code></li><li><strong>State store</strong>: The count per key lives in the local store order-counts. <em>What the dot carries: Count state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a></li><li><strong>Output topics</strong>: Each change also goes to a changelog topic, so a lost store can be rebuilt. <em>What the dot carries: Count state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a></li><li><strong>Output topics</strong> <span class="bp-text-stamp">[counts]</span>: The updated counts are written to lab20-counts: a stream of table updates. <em>What the dot carries: Count state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a> <code>docker compose run --rm lab read-topic lab20-counts read_committed</code></li><li><strong>Processor</strong> <span class="bp-text-stamp">[grace 5 s]</span>: Windows: a count per 10-second window by the record&#39;s timestamp, with 5 seconds of grace. A record later than that is dropped. <span class="bp-text-tag">Lab</span> <a href="lessons/time-windows.html?lang=en">Lesson 22 · Which minute does it belong to?</a> <code>docker compose run --rm lab windows 21</code></li></ol><p><strong>End of the journey:</strong> Kafka Streams runs inside your Java process. Its state is local and backed by changelog topics; windows close by stream time, not by the wall clock.</p></section><section class="bp-text-journey"><h3>K · Around the cluster</h3><p>Connect, a console, a second cluster</p><ol><li><strong>Kafka Connect</strong>: Kafka Connect starts a source connector. The worker runs its tasks; a task reads a file and produces records. <span class="bp-text-tag">Lab</span> <a href="lessons/connect.html?lang=en">Lesson 19 · Move data without a custom loop</a> <code>docker compose --profile connect up -d connect</code></li><li><strong>Orders topic</strong>: Its records land in the topic like any producer&#39;s. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/connect.html?lang=en">Lesson 19 · Move data without a custom loop</a> <code>docker compose run --rm lab read 18</code></li><li><strong>Kafka Connect</strong> <span class="bp-text-stamp">[tasks too]</span>: Check the tasks too: a connector can be RUNNING while one of its tasks has FAILED. <span class="bp-text-tag">Lab</span> <a href="lessons/connect.html?lang=en">Lesson 19 · Move data without a custom loop</a> <code>docker compose run --rm lab connect-status</code></li><li><strong>Kafbat UI</strong>: Kafbat UI shows brokers, topics, groups and lag. In read-only mode it refuses its own writes; the broker never sees that setting. <span class="bp-text-tag">Lab</span> <a href="lessons/admin-console.html?lang=en">Lesson 25 · Looking is not touching</a> <code>docker compose up -d kafbat</code></li><li><strong>Orders topic</strong> <span class="bp-text-stamp">[no group]</span>: Browsing messages joins no group and commits nothing: looking is not consuming. <span class="bp-text-tag">Lab</span> <a href="lessons/admin-console.html?lang=en">Lesson 25 · Looking is not touching</a></li><li><strong>Second cluster</strong> <span class="bp-text-stamp">[new offsets]</span>: A second cluster receives a copy in its own topic: source offset 0 became destination offset 1. <em>What the dot carries: Order record.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/mirroring.html?lang=en">Lesson 27 · A second cluster is another system</a> <code>docker compose run --rm lab mirror</code></li><li><strong>Second cluster</strong> <span class="bp-text-stamp">[duplicates]</span>: Run the copy again and the records are added again: this copy is at least once. IDs, not offsets, connect copies of the same event. <span class="bp-text-tag">Lab</span> <a href="lessons/mirroring.html?lang=en">Lesson 27 · A second cluster is another system</a></li></ol><p><strong>End of the journey:</strong> Connect moves data without a custom loop, the console looks without touching, and a second cluster is another system with its own offsets.</p></section><section><h3>Areas</h3><dl><dt id="bp-text-zone-writers">Who writes</dt><dd>Everything that puts records into Kafka: the HTTP client and the Spring producer of the café app, the producer client inside every writer, Kafka Connect and the outbox relay. Whoever writes chooses each record&#39;s key; the producer client turns that key into a partition. <em>What it does not do:</em> A writer does not know who reads, or when. The broker&#39;s acknowledgment means the record is stored, not that anyone processed it, and a writer that sends again writes a second record. <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a>, <a href="lessons/producer.html?lang=en">Lesson 06 · The producer’s waiting room</a>, <a href="lessons/connect.html?lang=en">Lesson 19 · Move data without a custom loop</a>, <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></dd><dt id="bp-text-zone-cluster">Kafka cluster · kafka1, kafka2, kafka3</dt><dd>Three nodes, kafka1, kafka2 and kafka3, each a broker and a KRaft controller in the lab. The brokers keep the topics: each partition is an append-only log, replicated with a leader and followers on other brokers. The controllers keep the cluster&#39;s map: topics, partitions, leaders and configuration. <em>What it does not do:</em> It does not push records to readers: each reader asks for them at its own pace, and reading removes nothing. It does not know what a record means, or whether anyone processed it. <a href="lessons/partitions.html?lang=en">Lesson 04 · One topic, many logs</a>, <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a>, <a href="lessons/kraft.html?lang=en">Lesson 12 · Who keeps the cluster’s map?</a></dd><dt id="bp-text-zone-readers">Who reads</dt><dd>Everything that reads the orders: the kitchen and billing groups, the Spring listener, the processors, which read one topic and write others, and the side effects they cause in the outside world. Each group keeps its own committed offsets, so each reads the same history at its own pace. <em>What it does not do:</em> A group does not take records away from other groups. A committed offset says where to resume, not that the work finished, and an effect outside Kafka has to be safe to repeat. <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a>, <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a>, <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a></dd><dt id="bp-text-zone-coord">Also on the brokers</dt><dd>Roles that run on the same brokers, beside the topics: the group coordinator, which tracks each group&#39;s members, assigns partitions and stores committed offsets in __consumer_offsets, and the transaction coordinator, which runs transactions and records them in __transaction_state. <em>What it does not do:</em> They are not separate servers, and they keep no business data. A committed offset is a bookmark, not a receipt, and a Kafka transaction cannot include an email, a payment or another database. <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a>, <a href="lessons/rebalances.html?lang=en">Lesson 09 · When the team changes</a>, <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></dd><dt id="bp-text-zone-dbz">PostgreSQL</dt><dd>The café&#39;s database, outside Kafka. The order row and an outbox row with the event and its stable ID are written in one database transaction; the outbox relay reads that row later and publishes it. <em>What it does not do:</em> It does not call Kafka, and Kafka transactions do not include it. Without the outbox, writing the row and then publishing leaves a crash window between the two. <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></dd><dt id="bp-text-zone-around">Around the cluster</dt><dd>Systems that look at the cluster or copy from it: Kafbat UI, a web console that shows brokers, topics, groups and messages through the same APIs as the command-line tools, and a second cluster that receives a copy of the events. <em>What it does not do:</em> Neither is part of the cluster. The console&#39;s read-only mode is a setting the broker never sees, and the second cluster has its own metadata and its own offsets: an offset there does not match one here. <a href="lessons/admin-console.html?lang=en">Lesson 25 · Looking is not touching</a>, <a href="lessons/mirroring.html?lang=en">Lesson 27 · A second cluster is another system</a></dd><dt id="bp-text-zone-statez">Local state</dt><dd>The state that a Kafka Streams processor keeps on its own disk, such as a count per key. Every change is also written to a changelog topic in the cluster. <em>What it does not do:</em> It is not a shared database that other applications query. If the local copy is lost, the task rebuilds it from the changelog. <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a></dd></dl></section><section><h3>Pieces</h3><dl><dt id="bp-text-client">HTTP client · POST /orders/order-42</dt><dd>Whoever places the order: here, curl in its own container, calling the course&#39;s Spring app. <em>What it does not do:</em> It knows nothing about Kafka: no topic, no partition, no broker address. <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></dd><dt id="bp-text-springout">Spring producer · KafkaTemplate.send</dt><dd>OrderProducer in the Spring Boot app: it calls KafkaTemplate.send(topic, orderId, event) and answers HTTP 202 with the topic, partition and offset the broker returned. <em>What it does not do:</em> A 202 means stored in Kafka, not processed by anyone. A second request is a second record, even with the same event ID. <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></dd><dt id="bp-text-producer">Producer client · serializer, partitioner, batches, acks</dt><dd>The Kafka library inside every writer. It serializes key and value, picks a partition from the key, groups records into batches per partition, sends them and waits for the acknowledgment acks asks for. <em>What it does not do:</em> Idempotence makes its own retries safe; it does not deduplicate two calls to send(), or a restarted application sending again. <a href="lessons/keys-order.html?lang=en">Lesson 05 · Keys choose a lane</a>, <a href="lessons/producer.html?lang=en">Lesson 06 · The producer’s waiting room</a>, <a href="lessons/idempotence.html?lang=en">Lesson 16 · Two different kinds of duplicate</a></dd><dt id="bp-text-connect">Kafka Connect · source connector, tasks</dt><dd>A worker runs connectors; each connector splits its work into tasks. A source connector imports data into Kafka with no custom loop; the lab uses the bundled file connector in standalone mode. <em>What it does not do:</em> A connector reported RUNNING does not prove every task runs: check the tasks, their errors and the data that actually arrives. <a href="lessons/connect.html?lang=en">Lesson 19 · Move data without a custom loop</a></dd><dt id="bp-text-relay">Outbox relay · publishes, then marks sent</dt><dd>A small polling program: it reads unsent outbox rows, publishes each event to Kafka, then marks the row sent. <em>What it does not do:</em> It is at least once: a crash between publishing and marking publishes the same event again. It is not a Debezium deployment. <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></dd><dt id="bp-text-controllers">KRaft controllers · the map, by majority</dt><dd>A quorum that replicates the metadata log: topics, partitions, leaders and configuration. In the lab each of the three nodes is broker and controller; two of three make a majority. <em>What it does not do:</em> It stores no records of your topics. With two controllers lost, metadata cannot change, even if some data still flows. <a href="lessons/kraft.html?lang=en">Lesson 12 · Who keeps the cluster’s map?</a></dd><dt id="bp-text-followers">Follower replicas · copies on other brokers</dt><dd>Each partition has a leader and followers on other brokers that fetch its log. The replicas in sync with the leader form the ISR. <em>What it does not do:</em> Replication factor 3 means three copies of each partition, not three partitions. Replicas are not backups. <a href="lessons/replication.html?lang=en">Lesson 10 · Copies that follow a leader</a>, <a href="lessons/durability.html?lang=en">Lesson 11 · What does “saved” mean?</a></dd><dt id="bp-text-orders">Orders topic · 3 partitions · replication factor 3</dt><dd>A named stream split into partitions. Each partition is an append-only log with its own offsets; its leader takes the writes and serves the reads. In the lab each lesson has its own topic, and the Spring app uses spring-orders. <em>What it does not do:</em> Reading does not remove a record, and there is no order across partitions. Retention and compaction decide how much history stays. <a href="lessons/event-log.html?lang=en">Lesson 02 · An event is a fact</a>, <a href="lessons/partitions.html?lang=en">Lesson 04 · One topic, many logs</a>, <a href="lessons/retention.html?lang=en">Lesson 13 · History has a horizon</a>, <a href="lessons/compaction.html?lang=en">Lesson 14 · Keep the latest known value</a></dd><dt id="bp-text-output">Output topics · results, changelogs</dt><dd>Topics that processors write to: effects, transformed orders, counts, and the changelog that backs a state store. <em>What it does not do:</em> Records of an open or aborted transaction can be in the log and still be hidden from read_committed readers. <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a>, <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a>, <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a></dd><dt id="bp-text-effects">Side effects · a ticket, an email, a payment</dt><dd>What a reader does in the outside world because of an event: print the kitchen ticket, send an email, charge a card. <em>What it does not do:</em> Kafka transactions do not include them. Repeating one has to be safe, or deduplicated by event ID. <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a>, <a href="lessons/idempotence.html?lang=en">Lesson 16 · Two different kinds of duplicate</a></dd><dt id="bp-text-kitchen">Kitchen group · one partition per member</dt><dd>Consumers with group.id kitchen. The group splits the partitions: each partition goes to one member at a time, so three partitions keep at most three members busy. <em>What it does not do:</em> It does not take records away from other groups. A fourth member waits without a partition. <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a>, <a href="lessons/rebalances.html?lang=en">Lesson 09 · When the team changes</a></dd><dt id="bp-text-billing">Billing group · same orders, its own pace</dt><dd>Another application with group.id billing. It reads every retained order independently of the kitchen and keeps its own committed offsets. <em>What it does not do:</em> It does not wait for the kitchen, and the kitchen does not wait for it. <a href="lessons/consumer-groups.html?lang=en">Lesson 07 · One stream, independent teams</a>, <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a></dd><dt id="bp-text-listener">Spring listener · group spring-kitchen</dt><dd>OrderConsumer with @KafkaListener: Spring polls for it and hands it a ConsumerRecord&lt;String, OrderPlaced&gt;. Auto-commit is off; AckMode.RECORD commits after each normal return. <em>What it does not do:</em> Its in-memory /received list is only an observation tool, not a durable record of what was processed. <a href="lessons/spring-java.html?lang=en">Lesson 30 · Read and write with Spring</a></dd><dt id="bp-text-processor">Processor · consume, transform, produce</dt><dd>An application that reads a topic and writes others: the lab&#39;s delivery demo, a transactional read-process-write loop, or a Kafka Streams topology running in its Java process. <em>What it does not do:</em> Its exactly once covers Kafka-to-Kafka only: records out and offsets in, in one transaction. Nothing outside Kafka joins it. <a href="lessons/delivery.html?lang=en">Lesson 15 · The crash between two actions</a>, <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a>, <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a>, <a href="lessons/time-windows.html?lang=en">Lesson 22 · Which minute does it belong to?</a></dd><dt id="bp-text-groupcoord">Group coordinator · __consumer_offsets: a bookmark per group</dt><dd>A broker role: it tracks each group&#39;s members, assigns partitions and stores committed offsets in the internal topic __consumer_offsets. <em>What it does not do:</em> A committed offset says where to resume, not that the business work finished. <a href="lessons/offsets.html?lang=en">Lesson 08 · A bookmark, not a receipt</a>, <a href="lessons/rebalances.html?lang=en">Lesson 09 · When the team changes</a></dd><dt id="bp-text-txcoord">Transaction coordinator · __transaction_state</dt><dd>A broker role that runs transactions: it registers a transactional.id, fences older instances and writes the commit or abort markers. <em>What it does not do:</em> It cannot include an email, a payment or another database in a transaction. <a href="lessons/transactions.html?lang=en">Lesson 17 · Make the boundary atomic</a></dd><dt id="bp-text-db">orders + outbox · one database transaction</dt><dd>The order row and an outbox row with the event and its stable ID, written in the same database transaction. <em>What it does not do:</em> It does not call Kafka. Writing the row and then publishing, without an outbox, leaves a crash window between the two. <a href="lessons/cdc-outbox.html?lang=en">Lesson 20 · From a database to an event</a></dd><dt id="bp-text-console">Kafbat UI · read-only console</dt><dd>A web console that shows brokers, topics, partitions, groups with their lag, and the messages, through the same Admin and consumer APIs as the command-line tools. <em>What it does not do:</em> Read-only is a console setting the broker never sees; what protects the cluster is authentication plus ACLs. <a href="lessons/admin-console.html?lang=en">Lesson 25 · Looking is not touching</a></dd><dt id="bp-text-mirror">Second cluster · new offsets</dt><dd>Another single-broker cluster that receives a copy of the events, with its own topic metadata and offsets. <em>What it does not do:</em> The lab&#39;s one-shot copy is not MirrorMaker 2: no checkpoint translation, no heartbeats, no failover. <a href="lessons/mirroring.html?lang=en">Lesson 27 · A second cluster is another system</a></dd><dt id="bp-text-store">State store · order-counts, on local disk</dt><dd>The local store of a stateful Kafka Streams operator, such as a count per key. Every change is also written to a changelog topic. <em>What it does not do:</em> It is not a shared database: if the local copy is lost, the task restores it from the changelog. <a href="lessons/streams.html?lang=en">Lesson 21 · A stream becomes a table</a></dd></dl></section><section><h3>What travels</h3><dl><dt>R · Order record</dt><dd>One event: a key (order-42), a value with the fact, headers and a timestamp. Kafka stores it as bytes. <em>Comes from:</em> A producer client, serialized. <em>Ends up:</em> The end of one partition&#39;s log, at a new offset.</dd><dt>A · Acknowledgment</dt><dd>The broker&#39;s answer to a write: topic, partition and offset, sent when the replicas that acks asks for have the record. <em>Comes from:</em> The partition leader. <em>Ends up:</em> The producer, and through it the HTTP response.</dd><dt>O · Committed offset</dt><dd>A group&#39;s bookmark per partition: the next offset to read after a restart. <em>Comes from:</em> A consumer&#39;s commit, or a transaction. <em>Ends up:</em> __consumer_offsets, kept by the group coordinator.</dd><dt>M · Cluster metadata</dt><dd>Topics, partitions, the leader and ISR of each partition, configuration. <em>Comes from:</em> The controllers&#39; metadata log, agreed by majority. <em>Ends up:</em> Every broker, and the cache of every client.</dd><dt>X · Transaction</dt><dd>A transactional.id and the records and offsets written under it, committed or aborted together. <em>Comes from:</em> A transactional producer. <em>Ends up:</em> Markers in the logs, written by the transaction coordinator.</dd><dt>E · Event ID</dt><dd>A stable business identity, such as outbox-E42, that survives retries and copies. <em>Comes from:</em> The application, written with the order. <em>Ends up:</em> Every copy of the event; a reader uses it to apply each event once.</dd><dt>S · Count state</dt><dd>The current count per key of a Kafka Streams aggregation. <em>Comes from:</em> The processor&#39;s count operator. <em>Ends up:</em> The local store, its changelog topic and the counts topic.</dd></dl></section><hr><h2>Panorama</h2><p>Un pedido, del productor a cada lector</p><p>El café publica cada pedido una vez. Kafka lo guarda en un log particionado y replicado, y cada equipo lo lee a su ritmo. Este dibujo pone en una escena todas las piezas del curso.</p><p>Elegí un recorrido: el punto es el mensaje o el pedido, y sus letras son lo que lleva. Cada parada dice qué se decide ahí y qué lección lo profundiza. Hacé clic en cualquier pieza, o en cualquier zona, para ver su ficha.</p><p>Las etiquetas dicen cómo ver cada parada por tu cuenta: LABORATORIO en el laboratorio de Docker, MODELO solo en las lecciones.</p><section class="bp-text-journey"><h3>A · Publicar un pedido y leerlo</h3><p>Spring, el líder, las réplicas, un listener</p><ol><li><strong>Cliente HTTP</strong>: POST /orders/order-42 con un pedido en JSON. El cliente no sabe nada de Kafka. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a> <code>docker compose --profile spring up -d --build --wait spring</code></li><li><strong>Productor Spring</strong>: OrderProducer llama a KafkaTemplate.send(topic, orderId, event): la clave es el ID del pedido. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></li><li><strong>Cliente productor</strong> <span class="bp-text-stamp">[P0]</span>: El particionador aplica murmur2 a los bytes de la clave, módulo 3: order-42 va a la partición 0, y ahí se queda mientras sean 3. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a></li><li><strong>Cliente productor</strong>: JsonSerializer convirtió el pedido en bytes. El mensaje espera en un lote para la partición 0; linger.ms y batch.size deciden cuándo sale. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/producer.html?lang=es">Lección 06 · La sala de espera del productor</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[agregado]</span>: El líder de la partición 0 agrega el lote al final de su log. Recién ahora el mensaje recibe su offset. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/partitions.html?lang=es">Lección 04 · Un tópico, varios logs</a></li><li><strong>Réplicas seguidoras</strong>: Las seguidoras de los otros dos brokers copian el mensaje nuevo. Las réplicas que siguen el ritmo forman el ISR. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[acks=all ✓]</span>: Con acks=all el líder responde cuando lo tienen las réplicas sincronizadas; el min.insync.replicas=2 del tópico es el piso. <em>Qué lleva el punto: Confirmación.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/durability.html?lang=es">Lección 11 · ¿Qué significa «guardado»?</a></li><li><strong>Cliente HTTP</strong> <span class="bp-text-stamp">[202]</span>: HTTP 202 Accepted, con tópico, partición y offset. Guardado, no procesado: todavía nadie lo leyó. <em>Qué lleva el punto: Confirmación.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></li><li><strong>Tópico de pedidos</strong>: El mensaje espera en la partición 0. Leerlo no lo va a borrar. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/event-log.html?lang=es">Lección 02 · Un evento es un hecho</a></li><li><strong>Listener de Spring</strong>: El listener de Spring, en el grupo spring-kitchen, lo trae con poll y recibe un ConsumerRecord&lt;String, OrderPlaced&gt;. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[confirmado]</span>: El listener terminó bien, así que AckMode.RECORD confirma el próximo offset: dónde retoma el grupo. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li><li><strong>Listener de Spring</strong> <span class="bp-text-stamp">[2 mensajes]</span>: Mandá el mismo POST otra vez y el tópico recibe un segundo mensaje: un envío nuevo, aunque el ID de evento sea el mismo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/idempotence.html?lang=es">Lección 16 · Dos clases distintas de duplicado</a> <code>docker compose run --rm http --fail-with-body http://spring:8080/received</code></li></ol><p><strong>Fin del recorrido:</strong> El pedido se guardó una vez, se copió a las réplicas sincronizadas y lo leyó un grupo que confirmó su señalador. Guardado, leído y procesado son tres hechos distintos.</p></section><section class="bp-text-journey"><h3>B · Las claves eligen un carril</h3><p>orden dentro de la partición, no entre ellas</p><ol><li><strong>Cliente productor</strong>: El laboratorio manda tres pedidos con dos claves: order-1, order-2, order-1. Para cada uno, el particionador toma murmur2 de los bytes de la clave, lo hace positivo y aplica módulo 3. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a> <code>docker compose run --rm lab seed 4</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[order-1: P1]</span>: order-1 cae en la partición 1, las dos veces: misma clave, misma partición, en el orden en que se enviaron. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[order-2: P0]</span>: order-2 cae en la partición 0. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a></li><li><strong>Tópico de pedidos</strong>: Cada partición conserva su propio orden y sus offsets: el offset 0 existe en cada carril. Entre particiones no hay orden global. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/partitions.html?lang=es">Lección 04 · Un tópico, varios logs</a> <code>docker compose run --rm lab read 4</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[se movieron]</span>: Ampliá a cuatro particiones y volvé a enviar: cambia el módulo, así que order-1 ahora cae en la partición 2 y order-2 en la nueva partición 3. Sus mensajes anteriores se quedan donde estaban. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a> <code>docker compose run --rm lab expand 4 4</code></li><li><strong>Grupo cocina</strong>: Las particiones también ponen el techo de un grupo: tres particiones ocupan como máximo a tres miembros de un grupo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a></li></ol><p><strong>Fin del recorrido:</strong> Las claves marcan el límite del orden. Cambiar la cantidad de particiones mueve claves; los mensajes que ya están se quedan donde estaban.</p></section><section class="bp-text-journey"><h3>C · Dos equipos, una historia</h3><p>cada grupo lee todo, a su ritmo</p><ol><li><strong>Tópico de pedidos</strong>: Seis pedidos están en las tres particiones del tópico. Leerlos no los va a borrar. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/event-log.html?lang=es">Lección 02 · Un evento es un hecho</a> <code>docker compose run --rm lab seed 6</code></li><li><strong>Grupo cocina</strong>: En el grupo cocina, el coordinador le da cada partición a un solo miembro a la vez. El miembro lee los pedidos de sus particiones. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a> <code>docker compose run --rm lab watch 6 kitchen</code></li><li><strong>Efectos</strong> <span class="bp-text-stamp">[ticket]</span>: Imprime el ticket de cocina: un efecto afuera de Kafka. <span class="bp-text-tag">Modelo</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[cocina]</span>: Después la cocina confirma el próximo offset. El coordinador lo guarda en __consumer_offsets con el ID de grupo kitchen. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li><li><strong>Grupo caja</strong>: Caja, con otro ID de grupo, lee los mismos pedidos del mismo log. No se sacó nada. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a> <code>docker compose run --rm lab watch 6 billing</code></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[caja]</span>: Caja confirma su propio señalador. Ningún grupo sabe hasta dónde leyó el otro. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li></ol><p><strong>Fin del recorrido:</strong> Un tópico no es una cola que se vacía. Cada grupo lee toda la historia retenida y guarda su propio señalador.</p></section><section class="bp-text-journey"><h3>D · Un señalador, no un recibo</h3><p>commit, reinicio, lag, reset, rebalanceo</p><ol><li><strong>Grupo cocina</strong>: Un miembro lee tres mensajes y confirma el offset 3. Significa retomá en 3, no el mensaje 3 terminó. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a> <code>docker compose run --rm lab consume 7 bookmarks</code></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[retomar en 3]</span>: El señalador es durable: sobrevive al miembro. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li><li><strong>Grupo cocina</strong>: El miembro reinicia, pide su offset confirmado y retoma ahí. auto.offset.reset no reemplaza un señalador válido. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[lag]</span>: El lag es el offset final del log menos el offset confirmado: una distancia en offsets, no en segundos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a> <code>docker compose run --rm lab lag 7 bookmarks</code></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[reset]</span>: Para releer, detené a los miembros del grupo y mové sus offsets hacia atrás a propósito. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a> <code>docker compose run --rm lab reset 7 bookmarks</code></li><li><strong>Grupo cocina</strong> <span class="bp-text-stamp">[rebalanceo]</span>: Entra o sale un miembro y el grupo redistribuye las particiones; el nuevo dueño retoma desde el offset confirmado. Un miembro que no hace poll dentro de max.poll.interval.ms pierde sus particiones. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rebalances.html?lang=es">Lección 09 · Cuando cambia el equipo</a> <code>docker compose run --rm lab describe-group team</code></li></ol><p><strong>Fin del recorrido:</strong> El offset confirmado es dónde retomar después de reiniciar. El lag es una distancia en offsets. Ninguno prueba que terminó el trabajo de negocio.</p></section><section class="bp-text-journey"><h3>E · Se cae un broker</h3><p>un líder nuevo, un ISR más chico, un piso de durabilidad</p><ol><li><strong>Tópico de pedidos</strong>: El tópico de la lección tiene una partición con tres réplicas: kafka1 es el líder, dos seguidoras copian, las tres en el ISR. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a> <code>docker compose run --rm lab describe 9</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[kafka1 caído]</span>: Detené kafka1: por un momento la partición se queda sin líder. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a> <code>docker compose stop kafka1</code></li><li><strong>Controladores KRaft</strong> <span class="bp-text-stamp">[2 de 3]</span>: Los dos controladores que quedan siguen siendo mayoría. Eligen un líder nuevo entre las réplicas sincronizadas y lo anotan en el log de metadatos. <em>Qué lleva el punto: Metadatos del clúster.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kraft.html?lang=es">Lección 12 · ¿Quién guarda el mapa del clúster?</a></li><li><strong>Réplicas seguidoras</strong>: Una seguidora sincronizada pasa a ser líder, y el ISR baja a dos. <em>Qué lleva el punto: Metadatos del clúster.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[legible]</span>: Los clientes actualizan sus metadatos y reintentan contra el líder nuevo. Los mensajes siguen legibles. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a> <code>docker compose run --rm lab read 9</code></li><li><strong>Cliente productor</strong> <span class="bp-text-stamp">[NotEnoughReplicas]</span>: Con acks=all, una escritura necesita al menos min.insync.replicas en el ISR. El tópico de la lección 11 pide 3, así que con un broker caído la escritura falla; uno que pidiera 2 seguiría escribiendo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/durability.html?lang=es">Lección 11 · ¿Qué significa «guardado»?</a> <code>docker compose run --rm lab seed 10</code></li><li><strong>Controladores KRaft</strong>: Con dos de tres controladores los metadatos todavía cambian: se puede crear un tópico. Si se pierde otro, ya no. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kraft.html?lang=es">Lección 12 · ¿Quién guarda el mapa del clúster?</a> <code>docker compose run --rm lab create-extra 11</code></li><li><strong>Réplicas seguidoras</strong> <span class="bp-text-stamp">[ISR 3]</span>: Arrancá el broker otra vez: se pone al día con el líder y vuelve al ISR. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a> <code>docker compose up -d --wait</code></li></ol><p><strong>Fin del recorrido:</strong> Las réplicas mantienen los datos legibles y los controladores mantienen el mapa. min.insync.replicas convierte una escritura más débil en un error explícito.</p></section><section class="bp-text-journey"><h3>F · La historia tiene un horizonte</h3><p>retención, compactación, tombstones</p><ol><li><strong>Tópico de pedidos</strong>: Los mensajes van al segmento activo de cada partición. Los segmentos viejos se pueden borrar por tiempo o por tamaño de cada partición. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/retention.html?lang=es">Lección 13 · La historia tiene un horizonte</a> <code>docker compose run --rm lab seed 12</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[inicio &gt; 0]</span>: Cuando se borra un segmento, el offset inicial sube. Los demás offsets conservan su número. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/retention.html?lang=es">Lección 13 · La historia tiene un horizonte</a> <code>docker compose run --rm lab offsets 12</code></li><li><strong>Grupo cocina</strong>: Un grupo cuyo señalador ahora apunta antes del inicio no tiene un offset válido: auto.offset.reset decide dónde empieza. <span class="bp-text-tag">Modelo</span> <a href="lessons/retention.html?lang=es">Lección 13 · La historia tiene un horizonte</a></li><li><strong>Tópico de pedidos</strong>: Un tópico compactado interpreta las claves como filas: con el tiempo conserva al menos el último valor de cada clave. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/compaction.html?lang=es">Lección 14 · Conservá el último valor conocido</a> <code>docker compose run --rm lab compact-seed 13</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[tombstone]</span>: Un valor null para la clave B es un tombstone: la tabla reconstruida desde el tópico quita B, aun antes de que pase el limpiador. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/compaction.html?lang=es">Lección 14 · Conservá el último valor conocido</a> <code>docker compose run --rm lab table 13</code></li><li><strong>Tópico de pedidos</strong>: El limpiador pasa después. Deja huecos, y los mensajes que sobreviven conservan sus offsets y su orden. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/compaction.html?lang=es">Lección 14 · Conservá el último valor conocido</a> <code>docker compose run --rm lab read 13</code></li></ol><p><strong>Fin del recorrido:</strong> La retención limita hasta dónde se puede releer; la compactación conserva el último valor por clave. Los offsets nunca se renumeran.</p></section><section class="bp-text-journey"><h3>G · La caída entre dos acciones</h3><p>al menos una vez, después un efecto idempotente</p><ol><li><strong>Tópico de pedidos</strong>: Tres eventos de entrada esperan en el tópico de la lección. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a> <code>docker compose run --rm lab seed 14</code></li><li><strong>Procesador</strong>: Un consumidor del grupo delivery-demo los lee. Su plan: escribir un efecto por cada uno y después confirmar los offsets de entrada. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a> <code>docker compose run --rm lab delivery crash</code></li><li><strong>Tópicos de salida</strong> <span class="bp-text-stamp">[efecto 1]</span>: El primer efecto se escribe en lab14-effects... <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a></li><li><strong>Procesador</strong> <span class="bp-text-stamp">[caída]</span>: ...y el proceso cae antes de confirmar nada. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a></li><li><strong>Coordinador de grupos</strong> <span class="bp-text-stamp">[no se movió]</span>: El señalador del grupo nunca se movió. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></li><li><strong>Procesador</strong>: Al reiniciar retoma desde el señalador viejo y vuelve a leer el primer evento. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a> <code>docker compose run --rm lab delivery resume</code></li><li><strong>Tópicos de salida</strong> <span class="bp-text-stamp">[dos veces]</span>: El primer efecto se escribe otra vez: al menos una vez, con un duplicado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a> <code>docker compose run --rm lab read-topic lab14-effects</code></li><li><strong>Procesador</strong> <span class="bp-text-stamp">[APPLY, SKIP]</span>: Un destino idempotente guarda el ID del evento junto con su efecto en una transacción de base, y una restricción única rechaza la repetición. El laboratorio muestra la idea con un conjunto en memoria. <em>Qué lleva el punto: ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/idempotence.html?lang=es">Lección 16 · Dos clases distintas de duplicado</a> <code>docker compose run --rm lab dedup 15</code></li></ol><p><strong>Fin del recorrido:</strong> Si confirmás después del efecto, una caída lo repite; si confirmás antes, una caída lo pierde. Elegí, y después hacé que el efecto se pueda repetir sin daño usando el ID del evento.</p></section><section class="bp-text-journey"><h3>H · Exactamente una vez dentro de Kafka</h3><p>salida y offsets en una transacción</p><ol><li><strong>Procesador</strong>: El procesador tiene un transactional.id estable. initTransactions bloquea cualquier instancia anterior con el mismo ID. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a> <code>docker compose run --rm lab eos 16</code></li><li><strong>Coordinador de transacciones</strong>: El coordinador de transacciones lo registra; empieza una transacción. <em>Qué lleva el punto: Transacción.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Tópico de pedidos</strong>: Lee la entrada con read_committed y auto-commit apagado. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Tópicos de salida</strong> <span class="bp-text-stamp">[pendiente]</span>: Escribe las salidas. Están en el log, pero quien lee con read_committed todavía no las ve. <em>Qué lleva el punto: Mensaje del pedido, Transacción.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Coordinador de transacciones</strong>: sendOffsetsToTransaction mete los próximos offsets de entrada en la misma transacción. <em>Qué lleva el punto: Offset confirmado, Transacción.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Coordinador de grupos</strong>: Los offsets llegan al coordinador de grupos como parte de la transacción. <em>Qué lleva el punto: Offset confirmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Coordinador de transacciones</strong> <span class="bp-text-stamp">[confirmada]</span>: Commit: el coordinador escribe marcadores de confirmación para las salidas y los offsets. Con abort, se descartarían las dos cosas juntas. <em>Qué lleva el punto: Transacción.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></li><li><strong>Tópicos de salida</strong> <span class="bp-text-stamp">[visible]</span>: Ahora quien lee con read_committed ve las salidas, exactamente una por cada entrada. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a> <code>docker compose run --rm lab read 16 read_committed</code></li><li><strong>Procesador</strong> <span class="bp-text-stamp">[solo Kafka]</span>: El proyecto final comprueba una salida confirmada por entrada y nada de lag. Eso prueba el límite de Kafka, no un efecto externo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 29 · Entregá un pedido. Sobreviví a una falla.</a> <code>docker compose run --rm lab verify 27</code></li></ol><p><strong>Fin del recorrido:</strong> Los mensajes de salida y los offsets de entrada se confirman juntos, o ninguno. El límite es de Kafka a Kafka; un correo o un pago quedan afuera.</p></section><section class="bp-text-journey"><h3>I · De una fila de base a un evento</h3><p>el outbox cierra el hueco de la doble escritura</p><ol><li><strong>pedidos + outbox</strong> <span class="bp-text-stamp">[una transacción]</span>: Una transacción de base escribe la fila del pedido y una fila de outbox con el ID de evento outbox-E42. Todavía no hay llamada a Kafka. <em>Qué lleva el punto: ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a> <code>docker compose run --rm lab outbox create</code></li><li><strong>Relay del outbox</strong>: El relay consulta las filas del outbox sin enviar. <em>Qué lleva el punto: ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[ack]</span>: Publica el evento, y Kafka lo confirma. <em>Qué lleva el punto: Mensaje del pedido, ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></li><li><strong>Relay del outbox</strong> <span class="bp-text-stamp">[caída]</span>: Cae antes de marcar la fila como enviada: el evento está en Kafka y la fila sigue pendiente. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a> <code>docker compose run --rm lab outbox crash</code></li><li><strong>pedidos + outbox</strong>: La corrida siguiente encuentra la misma fila pendiente, con el mismo ID de evento. <em>Qué lleva el punto: ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[2 copias]</span>: Lo publica otra vez: dos mensajes comparten un ID de evento. <em>Qué lleva el punto: Mensaje del pedido, ID del evento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a> <code>docker compose run --rm lab outbox relay</code></li><li><strong>Grupo cocina</strong>: Un lector que guarda los IDs de evento junto con sus efectos lo aplica una vez y saltea la copia. <em>Qué lleva el punto: ID del evento.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/idempotence.html?lang=es">Lección 16 · Dos clases distintas de duplicado</a></li></ol><p><strong>Fin del recorrido:</strong> El pedido y su evento se confirman juntos en la base. El relay es al menos una vez, así que el ID estable del evento vuelve inofensiva una repetición.</p></section><section class="bp-text-journey"><h3>J · Un flujo se convierte en tabla</h3><p>conteo por clave, estado local, ventanas</p><ol><li><strong>Tópico de pedidos</strong>: Llegan eventos con clave al tópico de entrada. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a> <code>docker compose run --rm lab seed 20</code></li><li><strong>Procesador</strong>: Una topología de Kafka Streams en un proceso Java: stream, groupByKey, count. Su application.id nombra su grupo y sus tópicos internos. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a> <code>docker compose run --rm lab streams 20</code></li><li><strong>Store de estado</strong>: El conteo por clave vive en el store local order-counts. <em>Qué lleva el punto: Estado del conteo.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a></li><li><strong>Tópicos de salida</strong>: Cada cambio también va a un tópico changelog, así un store perdido se puede reconstruir. <em>Qué lleva el punto: Estado del conteo.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a></li><li><strong>Tópicos de salida</strong> <span class="bp-text-stamp">[conteos]</span>: Los conteos actualizados se escriben en lab20-counts: un flujo de actualizaciones de tabla. <em>Qué lleva el punto: Estado del conteo.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a> <code>docker compose run --rm lab read-topic lab20-counts read_committed</code></li><li><strong>Procesador</strong> <span class="bp-text-stamp">[gracia 5 s]</span>: Ventanas: un conteo por ventana de 10 segundos según el timestamp del mensaje, con 5 segundos de gracia. Un mensaje más tardío se descarta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/time-windows.html?lang=es">Lección 22 · ¿A qué minuto pertenece?</a> <code>docker compose run --rm lab windows 21</code></li></ol><p><strong>Fin del recorrido:</strong> Kafka Streams corre dentro de tu proceso Java. Su estado es local y está respaldado por tópicos changelog; las ventanas cierran por el tiempo del flujo, no por el reloj de pared.</p></section><section class="bp-text-journey"><h3>K · Alrededor del clúster</h3><p>Connect, una consola, un segundo clúster</p><ol><li><strong>Kafka Connect</strong>: Kafka Connect arranca un conector de origen. El worker ejecuta sus tareas; una tarea lee un archivo y produce mensajes. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/connect.html?lang=es">Lección 19 · Mové datos sin escribir otro loop</a> <code>docker compose --profile connect up -d connect</code></li><li><strong>Tópico de pedidos</strong>: Sus mensajes llegan al tópico como los de cualquier productor. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/connect.html?lang=es">Lección 19 · Mové datos sin escribir otro loop</a> <code>docker compose run --rm lab read 18</code></li><li><strong>Kafka Connect</strong> <span class="bp-text-stamp">[también las tareas]</span>: Revisá también las tareas: un conector puede estar RUNNING con una de sus tareas en FAILED. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/connect.html?lang=es">Lección 19 · Mové datos sin escribir otro loop</a> <code>docker compose run --rm lab connect-status</code></li><li><strong>Kafbat UI</strong>: Kafbat UI muestra brokers, tópicos, grupos y lag. En modo solo lectura rechaza sus propias escrituras; el broker no ve esa opción. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/admin-console.
