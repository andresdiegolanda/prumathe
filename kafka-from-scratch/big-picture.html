html?lang=es">Lección 25 · Mirar no es tocar</a> <code>docker compose up -d kafbat</code></li><li><strong>Tópico de pedidos</strong> <span class="bp-text-stamp">[sin grupo]</span>: Mirar mensajes no se une a ningún grupo ni confirma nada: mirar no es consumir. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/admin-console.html?lang=es">Lección 25 · Mirar no es tocar</a></li><li><strong>Segundo clúster</strong> <span class="bp-text-stamp">[offsets nuevos]</span>: Un segundo clúster recibe una copia en su propio tópico: el offset 0 de origen pasó a ser el offset 1 de destino. <em>Qué lleva el punto: Mensaje del pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/mirroring.html?lang=es">Lección 27 · Un segundo clúster es otro sistema</a> <code>docker compose run --rm lab mirror</code></li><li><strong>Segundo clúster</strong> <span class="bp-text-stamp">[duplicados]</span>: Corré la copia otra vez y los mensajes se agregan de nuevo: esta copia es al menos una vez. Los IDs, no los offsets, unen las copias de un mismo evento. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/mirroring.html?lang=es">Lección 27 · Un segundo clúster es otro sistema</a></li></ol><p><strong>Fin del recorrido:</strong> Connect mueve datos sin escribir otro loop, la consola mira sin tocar, y un segundo clúster es otro sistema con sus propios offsets.</p></section><section><h3>Zonas</h3><dl><dt id="bp-text-zone-writers">Quienes escriben</dt><dd>Todo lo que pone mensajes en Kafka: el cliente HTTP y el productor Spring de la app del café, el cliente productor que va adentro de cada escritor, Kafka Connect y el relay del outbox. Quien escribe elige la clave de cada mensaje; el cliente productor convierte esa clave en una partición. <em>Qué no hace:</em> Quien escribe no sabe quién lee, ni cuándo. La confirmación del broker quiere decir que el mensaje está guardado, no que alguien lo procesó, y un escritor que vuelve a mandar escribe un segundo mensaje. <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a>, <a href="lessons/producer.html?lang=es">Lección 06 · La sala de espera del productor</a>, <a href="lessons/connect.html?lang=es">Lección 19 · Mové datos sin escribir otro loop</a>, <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></dd><dt id="bp-text-zone-cluster">Clúster de Kafka · kafka1, kafka2, kafka3</dt><dd>Tres nodos, kafka1, kafka2 y kafka3, cada uno broker y controlador KRaft en el laboratorio. Los brokers guardan los tópicos: cada partición es un log en el que solo se agrega, replicado con un líder y seguidoras en otros brokers. Los controladores guardan el mapa del clúster: tópicos, particiones, líderes y configuración. <em>Qué no hace:</em> No les empuja los mensajes a los lectores: cada lector los pide a su ritmo, y leer no borra nada. No sabe qué significa un mensaje ni si alguien lo procesó. <a href="lessons/partitions.html?lang=es">Lección 04 · Un tópico, varios logs</a>, <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a>, <a href="lessons/kraft.html?lang=es">Lección 12 · ¿Quién guarda el mapa del clúster?</a></dd><dt id="bp-text-zone-readers">Quienes leen</dt><dd>Todo lo que lee los pedidos: los grupos cocina y caja, el listener de Spring, los procesadores, que leen un tópico y escriben otros, y los efectos que causan en el mundo de afuera. Cada grupo guarda sus propios offsets confirmados, así que cada uno lee la misma historia a su ritmo. <em>Qué no hace:</em> Un grupo no les saca mensajes a los otros grupos. Un offset confirmado dice desde dónde seguir, no que el trabajo terminó, y un efecto fuera de Kafka tiene que poder repetirse sin daño. <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a>, <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a>, <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a></dd><dt id="bp-text-zone-coord">También en los brokers</dt><dd>Roles que corren en los mismos brokers, al lado de los tópicos: el coordinador de grupos, que sigue a los miembros de cada grupo, asigna particiones y guarda los offsets confirmados en __consumer_offsets, y el coordinador de transacciones, que maneja las transacciones y las anota en __transaction_state. <em>Qué no hace:</em> No son servidores aparte, y no guardan datos de negocio. Un offset confirmado es un señalador, no un recibo, y una transacción de Kafka no puede incluir un email, un pago ni otra base de datos. <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a>, <a href="lessons/rebalances.html?lang=es">Lección 09 · Cuando cambia el equipo</a>, <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></dd><dt id="bp-text-zone-dbz">PostgreSQL</dt><dd>La base de datos del café, fuera de Kafka. La fila del pedido y una fila del outbox con el evento y su ID estable se escriben en una sola transacción de base de datos; el relay del outbox lee después esa fila y la publica. <em>Qué no hace:</em> No llama a Kafka, y las transacciones de Kafka no la incluyen. Sin el outbox, escribir la fila y después publicar deja una ventana de caída entre las dos cosas. <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></dd><dt id="bp-text-zone-around">Alrededor del clúster</dt><dd>Sistemas que miran el clúster o copian de él: Kafbat UI, una consola web que muestra brokers, tópicos, grupos y mensajes con las mismas APIs que las herramientas de línea de comandos, y un segundo clúster que recibe una copia de los eventos. <em>Qué no hace:</em> Ninguno es parte del clúster. El modo de solo lectura de la consola es una opción que el broker nunca ve, y el segundo clúster tiene sus propios metadatos y sus propios offsets: un offset de allá no coincide con uno de acá. <a href="lessons/admin-console.html?lang=es">Lección 25 · Mirar no es tocar</a>, <a href="lessons/mirroring.html?lang=es">Lección 27 · Un segundo clúster es otro sistema</a></dd><dt id="bp-text-zone-statez">Estado local</dt><dd>El estado que un procesador de Kafka Streams guarda en su propio disco, como una cuenta por clave. Cada cambio también se escribe en un tópico changelog del clúster. <em>Qué no hace:</em> No es una base de datos compartida que consultan otras aplicaciones. Si se pierde la copia local, la tarea la reconstruye a partir del changelog. <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a></dd></dl></section><section><h3>Piezas</h3><dl><dt id="bp-text-client">Cliente HTTP · POST /orders/order-42</dt><dd>Quien hace el pedido: acá, curl en su propio contenedor, llamando a la app Spring del curso. <em>Qué no hace:</em> No sabe nada de Kafka: ni tópico, ni partición, ni dirección de broker. <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></dd><dt id="bp-text-springout">Productor Spring · KafkaTemplate.send</dt><dd>OrderProducer en la app Spring Boot: llama a KafkaTemplate.send(topic, orderId, event) y responde HTTP 202 con el tópico, la partición y el offset que devolvió el broker. <em>Qué no hace:</em> Un 202 significa guardado en Kafka, no procesado por nadie. Un segundo pedido es un segundo mensaje, aunque tenga el mismo ID de evento. <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></dd><dt id="bp-text-producer">Cliente productor · serializador, particionador, lotes, acks</dt><dd>La biblioteca de Kafka dentro de cada escritor. Serializa clave y valor, elige una partición según la clave, agrupa mensajes en lotes por partición, los envía y espera la confirmación que pida acks. <em>Qué no hace:</em> La idempotencia hace seguros sus propios reintentos; no deduplica dos llamadas a send(), ni una aplicación reiniciada que vuelve a enviar. <a href="lessons/keys-order.html?lang=es">Lección 05 · Las claves eligen un carril</a>, <a href="lessons/producer.html?lang=es">Lección 06 · La sala de espera del productor</a>, <a href="lessons/idempotence.html?lang=es">Lección 16 · Dos clases distintas de duplicado</a></dd><dt id="bp-text-connect">Kafka Connect · conector de origen, tareas</dt><dd>Un worker ejecuta conectores; cada conector reparte su trabajo en tareas. Un conector de origen importa datos a Kafka sin escribir otro loop; el laboratorio usa el conector de archivos incluido, en modo standalone. <em>Qué no hace:</em> Un conector en RUNNING no prueba que corran todas sus tareas: revisá las tareas, sus errores y los datos que llegan de verdad. <a href="lessons/connect.html?lang=es">Lección 19 · Mové datos sin escribir otro loop</a></dd><dt id="bp-text-relay">Relay del outbox · publica y después marca enviado</dt><dd>Un programa chico que consulta: lee filas del outbox sin enviar, publica cada evento en Kafka y después marca la fila como enviada. <em>Qué no hace:</em> Es al menos una vez: si cae entre publicar y marcar, vuelve a publicar el mismo evento. No es un despliegue de Debezium. <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></dd><dt id="bp-text-controllers">Controladores KRaft · el mapa, por mayoría</dt><dd>Un quórum que replica el log de metadatos: tópicos, particiones, líderes y configuración. En el laboratorio cada uno de los tres nodos es broker y controlador; dos de tres forman mayoría. <em>Qué no hace:</em> No guarda mensajes de tus tópicos. Si se pierden dos controladores, los metadatos no pueden cambiar, aunque algunos datos sigan circulando. <a href="lessons/kraft.html?lang=es">Lección 12 · ¿Quién guarda el mapa del clúster?</a></dd><dt id="bp-text-followers">Réplicas seguidoras · copias en otros brokers</dt><dd>Cada partición tiene un líder y seguidoras en otros brokers que copian su log. Las réplicas sincronizadas con el líder forman el ISR. <em>Qué no hace:</em> Factor de replicación 3 significa tres copias de cada partición, no tres particiones. Las réplicas no son backups. <a href="lessons/replication.html?lang=es">Lección 10 · Copias que siguen a un líder</a>, <a href="lessons/durability.html?lang=es">Lección 11 · ¿Qué significa «guardado»?</a></dd><dt id="bp-text-orders">Tópico de pedidos · 3 particiones · factor de replicación 3</dt><dd>Un flujo con nombre dividido en particiones. Cada partición es un log en el que solo se agrega, con sus propios offsets; su líder recibe las escrituras y atiende las lecturas. En el laboratorio cada lección tiene su tópico, y la app Spring usa spring-orders. <em>Qué no hace:</em> Leer no borra un mensaje, y no hay orden entre particiones. La retención y la compactación deciden cuánta historia queda. <a href="lessons/event-log.html?lang=es">Lección 02 · Un evento es un hecho</a>, <a href="lessons/partitions.html?lang=es">Lección 04 · Un tópico, varios logs</a>, <a href="lessons/retention.html?lang=es">Lección 13 · La historia tiene un horizonte</a>, <a href="lessons/compaction.html?lang=es">Lección 14 · Conservá el último valor conocido</a></dd><dt id="bp-text-output">Tópicos de salida · resultados, changelogs</dt><dd>Tópicos donde escriben los procesadores: efectos, pedidos transformados, conteos y el changelog que respalda un store de estado. <em>Qué no hace:</em> Los mensajes de una transacción abierta o abortada pueden estar en el log y seguir ocultos para quien lee con read_committed. <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a>, <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a>, <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a></dd><dt id="bp-text-effects">Efectos · un ticket, un correo, un pago</dt><dd>Lo que un lector hace en el mundo exterior por un evento: imprimir el ticket de cocina, mandar un correo, cobrar una tarjeta. <em>Qué no hace:</em> Las transacciones de Kafka no los incluyen. Repetir uno tiene que ser seguro, o deduplicarse por ID de evento. <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a>, <a href="lessons/idempotence.html?lang=es">Lección 16 · Dos clases distintas de duplicado</a></dd><dt id="bp-text-kitchen">Grupo cocina · una partición por miembro</dt><dd>Consumidores con group.id kitchen. El grupo reparte las particiones: cada una va a un solo miembro a la vez, así que tres particiones ocupan como máximo a tres miembros. <em>Qué no hace:</em> No les saca mensajes a otros grupos. Un cuarto miembro espera sin partición. <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a>, <a href="lessons/rebalances.html?lang=es">Lección 09 · Cuando cambia el equipo</a></dd><dt id="bp-text-billing">Grupo caja · los mismos pedidos, su ritmo</dt><dd>Otra aplicación con group.id billing. Lee todos los pedidos retenidos sin depender de la cocina y guarda sus propios offsets confirmados. <em>Qué no hace:</em> No espera a la cocina, y la cocina no lo espera. <a href="lessons/consumer-groups.html?lang=es">Lección 07 · Un flujo, equipos independientes</a>, <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a></dd><dt id="bp-text-listener">Listener de Spring · grupo spring-kitchen</dt><dd>OrderConsumer con @KafkaListener: Spring hace el poll y le entrega un ConsumerRecord&lt;String, OrderPlaced&gt;. Auto-commit está apagado; AckMode.RECORD confirma después de cada retorno normal. <em>Qué no hace:</em> Su lista /received en memoria es solo una herramienta de observación, no un registro durable de lo procesado. <a href="lessons/spring-java.html?lang=es">Lección 30 · Leé y escribí con Spring</a></dd><dt id="bp-text-processor">Procesador · consume, transforma, produce</dt><dd>Una aplicación que lee un tópico y escribe otros: la demo de entrega del laboratorio, un loop transaccional de lectura, proceso y escritura, o una topología de Kafka Streams corriendo en su proceso Java. <em>Qué no hace:</em> Su exactamente una vez cubre solo de Kafka a Kafka: mensajes que salen y offsets que entran, en una transacción. Nada de afuera de Kafka se suma. <a href="lessons/delivery.html?lang=es">Lección 15 · La caída entre dos acciones</a>, <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a>, <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a>, <a href="lessons/time-windows.html?lang=es">Lección 22 · ¿A qué minuto pertenece?</a></dd><dt id="bp-text-groupcoord">Coordinador de grupos · __consumer_offsets: un señalador por grupo</dt><dd>Un rol de un broker: sigue a los miembros de cada grupo, asigna particiones y guarda los offsets confirmados en el tópico interno __consumer_offsets. <em>Qué no hace:</em> Un offset confirmado dice dónde retomar, no que terminó el trabajo de negocio. <a href="lessons/offsets.html?lang=es">Lección 08 · Un señalador, no un recibo</a>, <a href="lessons/rebalances.html?lang=es">Lección 09 · Cuando cambia el equipo</a></dd><dt id="bp-text-txcoord">Coordinador de transacciones · __transaction_state</dt><dd>Un rol de un broker que lleva las transacciones: registra un transactional.id, bloquea instancias anteriores y escribe los marcadores de commit o abort. <em>Qué no hace:</em> No puede incluir un correo, un pago ni otra base de datos en una transacción. <a href="lessons/transactions.html?lang=es">Lección 17 · Hacé atómico el límite</a></dd><dt id="bp-text-db">pedidos + outbox · una transacción de base</dt><dd>La fila del pedido y una fila de outbox con el evento y su ID estable, escritas en la misma transacción de base de datos. <em>Qué no hace:</em> No llama a Kafka. Escribir la fila y después publicar, sin outbox, deja una ventana de falla entre las dos cosas. <a href="lessons/cdc-outbox.html?lang=es">Lección 20 · De una base de datos a un evento</a></dd><dt id="bp-text-console">Kafbat UI · consola de solo lectura</dt><dd>Una consola web que muestra brokers, tópicos, particiones, grupos con su lag y los mensajes, con las mismas APIs de administración y de consumo que las herramientas de línea de comandos. <em>Qué no hace:</em> Solo lectura es una opción de la consola que el broker no ve; lo que protege el clúster es autenticación más ACLs. <a href="lessons/admin-console.html?lang=es">Lección 25 · Mirar no es tocar</a></dd><dt id="bp-text-mirror">Segundo clúster · offsets nuevos</dt><dd>Otro clúster de un broker que recibe una copia de los eventos, con sus propios metadatos de tópico y offsets. <em>Qué no hace:</em> La copia de una vez del laboratorio no es MirrorMaker 2: ni traducción de checkpoints, ni heartbeats, ni failover. <a href="lessons/mirroring.html?lang=es">Lección 27 · Un segundo clúster es otro sistema</a></dd><dt id="bp-text-store">Store de estado · order-counts, en disco local</dt><dd>El store local de un operador con estado de Kafka Streams, como un conteo por clave. Cada cambio también se escribe en un tópico changelog. <em>Qué no hace:</em> No es una base compartida: si se pierde la copia local, la tarea la restaura desde el changelog. <a href="lessons/streams.html?lang=es">Lección 21 · Un flujo se convierte en tabla</a></dd></dl></section><section><h3>Qué viaja</h3><dl><dt>R · Mensaje del pedido</dt><dd>Un evento: una clave (order-42), un valor con el hecho, headers y un timestamp. Kafka lo guarda como bytes. <em>De dónde viene:</em> Un cliente productor, serializado. <em>Dónde termina:</em> El final del log de una partición, en un offset nuevo.</dd><dt>A · Confirmación</dt><dd>La respuesta del broker a una escritura: tópico, partición y offset, enviada cuando las réplicas que pide acks tienen el mensaje. <em>De dónde viene:</em> El líder de la partición. <em>Dónde termina:</em> El productor y, a través de él, la respuesta HTTP.</dd><dt>O · Offset confirmado</dt><dd>El señalador de un grupo por partición: el próximo offset a leer después de reiniciar. <em>De dónde viene:</em> El commit de un consumidor, o una transacción. <em>Dónde termina:</em> __consumer_offsets, a cargo del coordinador de grupos.</dd><dt>M · Metadatos del clúster</dt><dd>Tópicos, particiones, el líder y el ISR de cada partición, configuración. <em>De dónde viene:</em> El log de metadatos de los controladores, acordado por mayoría. <em>Dónde termina:</em> Cada broker y la caché de cada cliente.</dd><dt>X · Transacción</dt><dd>Un transactional.id y los mensajes y offsets escritos bajo él, confirmados o abortados juntos. <em>De dónde viene:</em> Un productor transaccional. <em>Dónde termina:</em> Marcadores en los logs, escritos por el coordinador de transacciones.</dd><dt>E · ID del evento</dt><dd>Una identidad de negocio estable, como outbox-E42, que sobrevive a reintentos y copias. <em>De dónde viene:</em> La aplicación, escrita junto con el pedido. <em>Dónde termina:</em> Cada copia del evento; un lector la usa para aplicar cada evento una vez.</dd><dt>S · Estado del conteo</dt><dd>El conteo actual por clave de una agregación de Kafka Streams. <em>De dónde viene:</em> El operador count del procesador. <em>Dónde termina:</em> El store local, su tópico changelog y el tópico de conteos.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
