<body class="bp-page"><div id="bp"></div><noscript><main class="bp-noscript"><h2>Big picture</h2><p>One request, from DNS to your origin, and what the edge decides on the way</p><p>Rumbo tracks shipments. Its origin is a Spring Boot API with PostgreSQL; in front of it, one Worker on the edge of Cloudflare, with its bindings. This picture puts every piece of the course on one scene.</p><p>Pick a journey: the dot is the request or the message, and its letters are what it carries. Each stop says what is decided at that piece and which lesson goes deeper. Click any piece for its card: what it is, what it is for, what it does not do, the free plan and the kit.</p><p>Tags say how to see a stop yourself: LAB in the kit, with no account; ACCOUNT with a free Cloudflare account, optional; ZONE with a domain of your own, shown by the lessons as a case study; MODEL only in the lessons.</p><section class="bp-text-journey"><h3>A · Through the edge</h3><p>DNS, anycast, the stages, the Worker, the origin</p><ol><li><strong>Shop app</strong>: The lab plays a client of the API: GET /api/shipments/R-1042, to the edge of the kit on 127.0.0.1:18097. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a> <code>docker compose run --rm lab get /api/shipments/R-1042</code></li><li><strong>DNS</strong> <span class="bp-text-stamp">[proxied]</span>: On Cloudflare the hostname is a proxied record: DNS answers with anycast addresses of Cloudflare, not with the address of the origin. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a> <code>docker compose run --rm lab dns www.cloudflare.com</code></li><li><strong>Anycast</strong> <span class="bp-text-stamp">[colo]</span>: The same addresses are announced from every data center, and routing takes the request to one, usually nearby. /cdn-cgi/trace names it in colo. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/a-request-through-the-edge.html?lang=en">Lesson 01 · A request goes through the edge</a> <code>docker compose run --rm lab trace</code></li><li><strong>TLS</strong>: Leg 1 ends here, with a certificate Cloudflare manages for the zone. The encryption mode of the zone decides how leg 2 reaches the origin. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a></li><li><strong>WAF</strong>: Custom, rate limiting and managed rules run in fixed phases. Nothing matches, so the request goes on. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a></li><li><strong>Cache</strong> <span class="bp-text-stamp">[no-store]</span>: No Access policy on this hostname. The API answers no-store, so no cache on the way may keep it. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a></li><li><strong>Worker</strong>: The gateway of Rumbo, in a V8 isolate. The admin API would be refused here; this route goes on. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[within budget]</span>: The budget of the key: 5 requests every 10 seconds. Without an x-api-key, every client shares the anonymous one. <span class="bp-text-tag">Lab</span> <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a></li><li><strong>cloudflared, Tunnel</strong>: In production the request reaches the origin through connections cloudflared opened from inside. In the kit the Worker calls origin:8080 on the Compose network. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[x-rumbo-edge]</span>: The origin sees x-rumbo-edge and x-rumbo-request-id, added by the Worker. Called directly, with lab origin /echo, it sees neither. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/a-request-through-the-edge.html?lang=en">Lesson 01 · A request goes through the edge</a> <code>docker compose run --rm lab get /echo</code></li><li><strong>Worker</strong>: On the way out the Worker adds x-rumbo-via: edge. After the answer, ctx.waitUntil records the last request in KV without making the client wait. <em>What the dot carries: Response.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a> <code>docker compose run --rm lab get /lab/last-request</code></li><li><strong>TLS</strong> <span class="bp-text-stamp">[cf-ray]</span>: Back over leg 1. A site behind Cloudflare answers with server: cloudflare and a cf-ray, the Ray ID of the request. <em>What the dot carries: Response.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/a-request-through-the-edge.html?lang=en">Lesson 01 · A request goes through the edge</a> <code>docker compose run --rm lab headers</code></li></ol><p><strong>End of the journey:</strong> Every request meets the edge first, in the data center where it arrived: TLS, the rules, the cache and the Worker decide before the origin is called, and each leaves something you can read in a header.</p></section><section class="bp-text-journey"><h3>B · Around the edge</h3><p>a DNS-only record, an open port, a tunnel</p><ol><li><strong>Someone else</strong>: Someone nobody invited: a bot, an attack, or a person who found the address of the origin. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Model</span> <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a></li><li><strong>DNS only</strong> <span class="bp-text-stamp">[real address]</span>: An old DNS-only record leaks it: Cloudflare answers with the real address, and requests go straight to that server, with no cache, no WAF and no Worker on the way. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a> <code>docker compose run --rm lab dns github.com</code></li><li><strong>Open port</strong> <span class="bp-text-stamp">[no edge]</span>: If the origin still listens on a public port, this path never meets the edge. A tunnel adds a way in; it does not close the others. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Model</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[401]</span>: The origin still asks for proof: its panel validates the token itself, so skipping the edge does not skip the check. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab panel --direct</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[:0]</span>: In the kit the origin publishes no port: port 8080 has no address on your machine. Only the edge does. <span class="bp-text-tag">Lab</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a> <code>docker compose port origin 8080</code></li><li><strong>cloudflared, Tunnel</strong>: A way in from the inside: cloudflared, next to the service, opens outbound connections to Cloudflare, and the edge sends the requests for the hostname through them. <span class="bp-text-tag">Lab</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a> <code>docker compose --profile tunnel up -d tunnel</code></li><li><strong>cloudflared, Tunnel</strong> <span class="bp-text-stamp">[trycloudflare.com]</span>: A quick tunnel, with no account: a trycloudflare.com name answers with server: cloudflare and the body of rumbo-origin. In the validation runs it took 14 to 41 seconds. <span class="bp-text-tag">Lab</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a> <code>docker compose run --rm lab tunnel</code></li><li><strong>cloudflared, Tunnel</strong> <span class="bp-text-stamp">[outbound]</span>: Registered tunnel connection: an outbound connection to a data center. A named tunnel keeps four, to two data centers, and survives restarts. <span class="bp-text-tag">Lab</span> <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a> <code>docker compose logs tunnel</code></li></ol><p><strong>End of the journey:</strong> The proxy hides the origin in DNS only. With no open port and an origin that checks who calls, finding its address is not enough.</p></section><section class="bp-text-journey"><h3>C · TLS in two legs</h3><p>the padlock covers leg 1; the mode decides leg 2</p><ol><li><strong>TLS</strong>: Leg 1, from the visitor to the edge, with a certificate Cloudflare manages for the zone. The padlock says nothing about leg 2. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a></li><li><strong>TLS</strong>: Leg 2 depends on the encryption mode of the zone: Off, Flexible, Full, Full (strict) or Strict. lab tls plays the edge on that leg; an impostor answers with a self-signed certificate for the same name. <span class="bp-text-tag">Lab</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a> <code>docker compose --profile tls up -d --wait impostor</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[plain HTTP]</span>: Flexible: leg 2 in plain HTTP. Whoever sits between the edge and the origin can read and change it. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a> <code>docker compose run --rm lab tls flexible</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[impostor accepted]</span>: Full: HTTPS without validating the certificate. A self-signed one is accepted, and so is any server that answers with one: encrypted, to the wrong server. <span class="bp-text-tag">Lab</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a> <code>docker compose run --rm lab tls full impostor</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[accepted]</span>: Full (strict) validates the certificate of the origin, signed by the test CA of the kit, which stands for the authorities it trusts. <span class="bp-text-tag">Lab</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a> <code>docker compose run --rm lab tls strict origin</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[rejected]</span>: The impostor under strict: rejected, DEPTH_ZERO_SELF_SIGNED_CERT. The name was right; nobody trusted signed it. <span class="bp-text-tag">Lab</span> <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a> <code>docker compose run --rm lab tls strict impostor</code></li></ol><p><strong>End of the journey:</strong> Encrypted is not enough: leg 2 must also check who answers. Full (strict) validates the certificate of the origin; Full accepts any.</p></section><section class="bp-text-journey"><h3>D · A Worker in front</h3><p>configuration, isolates, decisions before the origin, tests</p><ol><li><strong>Wrangler</strong>: wrangler.jsonc names the Worker, its entry point, its compatibility date and nine bindings: COUNTERS, DB, FLAGS, LIMITER, MOVES, PG, PROOFS, RETURNS and SHIPMENTS. <span class="bp-text-tag">Lab</span> <a href="lessons/wrangler-and-config.html?lang=en">Lesson 06 · Wrangler and the configuration</a> <code>docker compose run --rm lab config</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[set, 16 characters]</span>: vars are committed with the code; secrets go to the account, and locally to .dev.vars, read when wrangler dev starts. The lab prints only the length. <span class="bp-text-tag">Lab</span> <a href="lessons/wrangler-and-config.html?lang=en">Lesson 06 · Wrangler and the configuration</a> <code>docker compose exec edge sh -c &quot;echo RUMBO_TOKEN=local-only-value &gt; .dev.vars&quot;</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[same id, hits + 1]</span>: A V8 isolate inside a runtime that already runs: a module variable survives some requests. Restart the edge and the id changes: global state is not yours to keep. <span class="bp-text-tag">Lab</span> <a href="lessons/isolates.html?lang=en">Lesson 05 · An isolate, not a container</a> <code>docker compose run --rm lab isolate</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[204, shop.example]</span>: A CORS preflight is answered at the edge, only for the shop that is allowed. <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a> <code>docker compose run --rm lab options /api/shipments/R-1042 https://shop.example</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[no allow-origin]</span>: For another page there is no access-control-allow-origin: a browser there will not let its script read the answer. <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a> <code>docker compose run --rm lab options /api/shipments/R-1042 https://other.example</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: The admin API is refused at the edge: the origin gets no load from it and never sees it. <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>KV</strong>: After an answer, ctx.waitUntil keeps working for up to 30 seconds: the gateway records the last request in KV. The refused and the preflight requests never got that far. <em>What the dot carries: Flag.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a> <code>docker compose run --rm lab get /lab/last-request</code></li><li><strong>The kit</strong> <span class="bp-text-stamp">[6 passed]</span>: Tests run inside workerd with the bindings simulated: health, the admin API, CORS, maintenance, the forward to the origin and the 502 of a dead origin. <span class="bp-text-tag">Lab</span> <a href="lessons/testing-a-worker.html?lang=en">Lesson 08 · Testing a Worker</a> <code>docker compose exec edge npx vitest run</code></li><li><strong>The kit</strong>: The origin is not part of the test: vi.spyOn replaces the global fetch, to answer as the origin would or to fail as a dead one. <span class="bp-text-tag">Lab</span> <a href="lessons/testing-a-worker.html?lang=en">Lesson 08 · Testing a Worker</a> <code>docker compose exec edge grep -n &quot;spyOn&quot; test/gateway.test.ts</code></li></ol><p><strong>End of the journey:</strong> Each decision taken at the edge is one the origin does not have to take, and one it cannot get wrong. Global state is not yours to keep, and the tests run in the same runtime.</p></section><section class="bp-text-journey"><h3>E · Deploy and versions</h3><p>upload, deploy, a gradual split</p><ol><li><strong>The kit</strong> <span class="bp-text-stamp">[1.50 KiB]</span>: A second Worker, rumbo-edge-demo, with no bindings so it fits the free plan: --dry-run builds it and stops. <span class="bp-text-tag">Lab</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose exec edge npx wrangler deploy --dry-run --config deploy/wrangler.jsonc</code></li><li><strong>Wrangler</strong> <span class="bp-text-stamp">[token: active]</span>: With labs/.env, your account id and a token that can edit Workers. Optional, and never printed. <span class="bp-text-tag">Account</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose run --rm lab account</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[v1 at 100%]</span>: wrangler deploy uploads a version and deploys it to 100%: the Worker answers on workers.dev, with no zone of your own. <span class="bp-text-tag">Account</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose run --rm lab wrangler deploy --tag v1</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[v2 not deployed]</span>: versions upload keeps a new version without serving it. A deployment can use only the last 100 uploaded versions. <span class="bp-text-tag">Account</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose run --rm lab wrangler versions upload --tag v2 --var VERSION:v2</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[90% and 10%]</span>: versions deploy splits the traffic by percentage. Running it again moves the split, or rolls back. <span class="bp-text-tag">Account</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose run --rm lab wrangler versions deploy --version-tag v1@90% --version-tag v2@10% -y</code></li><li><strong>TLS</strong> <span class="bp-text-stamp">[mostly v1]</span>: Each request is routed on its own: most get v1, a few v2, and one user can see both, unless version affinity keeps a key on one. <span class="bp-text-tag">Account</span> <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a> <code>docker compose run --rm lab split /version 40</code></li></ol><p><strong>End of the journey:</strong> A version is code and configuration, kept; a deployment says which versions serve requests and in what share. Moving the split is how you roll forward or back.</p></section><section class="bp-text-journey"><h3>F · What the edge keeps</h3><p>Cache-Control, a HIT, the key trap, the Cache API</p><ol><li><strong>Browser</strong>: A customer opens the public tracking page, GET /track/R-1042: the same page for everyone who follows that shipment. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a> <code>docker compose run --rm lab get /track/R-1042</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[max-age=60, public]</span>: The page answers cache-control: max-age=60, public: the same for everyone, safe to share for a minute. A zone would not keep it by default, because it is HTML; Workers Cache would. <em>What the dot carries: Response.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a></li><li><strong>Cache</strong> <span class="bp-text-stamp">[MISS, then HIT]</span>: Workers Cache sits in front of the Worker and follows the Cache-Control of its answers: MISS, then HIT. A HIT does not run the Worker, so it uses no CPU, though it still counts as a request. wrangler dev does not run it, so this needs an account. <em>What the dot carries: Stored copy.</em> <span class="bp-text-tag">Account</span> <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a> <code>docker compose run --rm lab remote /c/public 2</code></li><li><strong>Cache</strong> <span class="bp-text-stamp">[no HIT]</span>: private, no-store or a Set-Cookie: nothing is kept. A 200 with no Cache-Control is kept by heuristic, for up to two hours. <span class="bp-text-tag">Account</span> <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a> <code>docker compose run --rm lab remote /c/cookie 2</code></li><li><strong>Worker</strong>: A profile is personal, but this route marks it public, and the cache key is the URL: it does not include the user. Ana&#39;s profile is now stored. <em>What the dot carries: Response.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cache-key-traps.html?lang=en">Lesson 11 · The cache key and its traps</a> <code>docker compose run --rm lab get /lab/cache/profile -H x-user:ana</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[Beto got Ana]</span>: Beto asks for the same URL and gets the stored entry: Ana&#39;s profile, with her address. The kit plays the trap with the Cache API; the cache of a zone falls into it the same way. <em>What the dot carries: Stored copy.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cache-key-traps.html?lang=en">Lesson 11 · The cache key and its traps</a> <code>docker compose run --rm lab get /lab/cache/profile -H x-user:beto</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[his own answer]</span>: profile-safe answers private, no-store: nothing is kept, and each person gets their own answer. <span class="bp-text-tag">Lab</span> <a href="lessons/cache-key-traps.html?lang=en">Lesson 11 · The cache key and its traps</a> <code>docker compose run --rm lab get /lab/cache/profile-safe -H x-user:beto</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[HIT]</span>: caches.default from the Worker: match, put and delete, under a key it chooses. The rate of a zone is kept for 60 seconds. <em>What the dot carries: Stored copy.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cache-from-a-worker.html?lang=en">Lesson 12 · Cache from a Worker</a> <code>docker compose run --rm lab get &quot;/lab/cache/rate?zone=dub&quot;</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[this data center only]</span>: delete purges only this data center: the Cache API does not replicate. To reach every data center, purge the zone, or Workers Cache by tag. <span class="bp-text-tag">Lab</span> <a href="lessons/cache-from-a-worker.html?lang=en">Lesson 12 · Cache from a Worker</a> <code>docker compose run --rm lab get &quot;/lab/cache/purge?zone=dub&quot;</code></li></ol><p><strong>End of the journey:</strong> The response decides what is kept: public only for what is the same for everyone, private or no-store for anything personal. Purging fixes the past; only a correct Cache-Control fixes the future.</p></section><section class="bp-text-journey"><h3>G · Rules and budgets</h3><p>a rule on the path, its case, a limit per key</p><ol><li><strong>Shop app</strong>: GET /api/admin/users: a route no client should reach. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>WAF</strong>: On a zone, a custom rule starts_with(http.request.uri.path, &quot;/api/admin&quot;) with Block ends the request here: later phases and the Worker never see it. Blocks are sampled as security events. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: The kit has no zone, so the gateway plays the rule: 403 before the origin, answered by the Worker alone. <span class="bp-text-tag">Lab</span> <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[404 from the origin]</span>: /API/admin/users passes: the rule compares exact text, case included, and Spring Boot answers 404. A WAF expression that ignores case uses lower(http.request.uri.path). <span class="bp-text-tag">Lab</span> <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a> <code>docker compose run --rm lab get /API/admin/users</code></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[200 five times, then 429]</span>: A budget per x-api-key: 5 requests every 10 seconds. k1 gets five 200s, then 429 with retry-after: 10. <span class="bp-text-tag">Lab</span> <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a> <code>docker compose run --rm lab limit k1</code></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[its own budget]</span>: k2 has its own budget. The counts are per location and eventually consistent: approximate, not exact. <span class="bp-text-tag">Lab</span> <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a> <code>docker compose run --rm lab limit k2 3</code></li><li><strong>WAF</strong>: A rate limiting rule of the WAF runs in its own phase, before any Worker; the free plan includes one. The binding knows what a rule cannot, such as the tenant behind a key. <span class="bp-text-tag">Zone</span> <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a></li></ol><p><strong>End of the journey:</strong> A rule in the zone runs before any Worker; a rule in code runs only where your Worker runs, and both compare text exactly as written. A budget per key counts what a rule of the zone cannot see.</p></section><section class="bp-text-journey"><h3>H · Identity before the origin</h3><p>Access, a signed JWT, an origin that validates it</p><ol><li><strong>Employee</strong>: Ana, of operations, opens the internal panel, from home, with no VPN. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a></li><li><strong>Access</strong> <span class="bp-text-stamp">[policy: allow]</span>: Cloudflare Access asks who she is: she signs in with the identity provider, and a policy allows the people of operations. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a></li><li><strong>Access</strong>: The edge adds a signed JWT to the requests that pass: the Cf-Access-Jwt-Assertion header and the CF_Authorization cookie. <em>What the dot carries: Request, Signed JWT.</em> <span class="bp-text-tag">Zone</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[401]</span>: The kit has no Access. Without a token, the origin asks for one. <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab panel</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[test issuer]</span>: The edge of the kit serves a test issuer with its own ES256 key and the claims of Access: iss, aud rumbo-panel, Ana&#39;s email, and an expiry five minutes later. <em>What the dot carries: Signed JWT.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab token</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[200]</span>: Spring Security, as a resource server, validates four things: the signature with the published keys, the audience, the issuer and the expiry. <em>What the dot carries: Signed JWT.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab panel --token</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[401]</span>: A token of another application, expired or changed gets 401, and the reason: the audience, Jwt expired, Invalid signature. <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab panel --tampered</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[401]</span>: Called directly, skipping the edge, the origin still asks for proof. With Access only three values change: the URL of the keys, the issuer and the audience. <span class="bp-text-tag">Lab</span> <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a> <code>docker compose run --rm lab panel --direct</code></li></ol><p><strong>End of the journey:</strong> Access checks who the person is at the edge; the origin validates the signed token itself. Reaching the origin another way does not skip the check.</p></section><section class="bp-text-journey"><h3>I · A flag and a counter</h3><p>KV reads fast; a Durable Object counts right</p><ol><li><strong>KV</strong>: Workers KV keeps the maintenance flag of Rumbo: written to central stores, cached in the data centers that read it. <em>What the dot carries: Flag.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/kv.html?lang=en">Lesson 16 · KV: fast reads, eventual writes</a> <code>docker compose exec edge npx wrangler kv key put maintenance on --binding FLAGS --local</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[503]</span>: The gateway reads the flag: on, so it answers 503, maintenance, and the origin is not called. <em>What the dot carries: Flag.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/kv.html?lang=en">Lesson 16 · KV: fast reads, eventual writes</a> <code>docker compose run --rm lab get /api/shipments/R-1042</code></li><li><strong>KV</strong> <span class="bp-text-stamp">[200 again]</span>: Delete it and the next request reaches the origin. Locally the change is seen at once; on Cloudflare, other data centers can take a minute or more. <span class="bp-text-tag">Lab</span> <a href="lessons/kv.html?lang=en">Lesson 16 · KV: fast reads, eventual writes</a> <code>docker compose exec edge npx wrangler kv key delete maintenance --binding FLAGS --local</code></li><li><strong>KV</strong> <span class="bp-text-stamp">[final: 1 of 50]</span>: Not a counter: 50 requests read the same old number, add one and write it back. KV has no atomic operations, and most increments are lost. <span class="bp-text-tag">Lab</span> <a href="lessons/kv.html?lang=en">Lesson 16 · KV: fast reads, eventual writes</a> <code>docker compose run --rm lab race kv</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[final: 50]</span>: A Durable Object per counter, through the binding COUNTERS, lives in one place and handles one call at a time: the 50 increments arrive one after the other. <em>What the dot carries: Object state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/durable-objects.html?lang=en">Lesson 19 · Durable Objects: one place per thing</a> <code>docker compose run --rm lab race do</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[200 of 200]</span>: Its storage is strongly consistent. One object is one place, though, with a soft limit near 1,000 requests a second: split the state into more objects for more load. <span class="bp-text-tag">Lab</span> <a href="lessons/durable-objects.html?lang=en">Lesson 19 · Durable Objects: one place per thing</a> <code>docker compose run --rm lab race do 200</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[exists when asked]</span>: An object exists because it was asked for: shipment R-1043, no movements yet, nobody watching. <span class="bp-text-tag">Lab</span> <a href="lessons/durable-objects.html?lang=en">Lesson 19 · Durable Objects: one place per thing</a> <code>docker compose run --rm lab get /shipments/R-1043/state</code></li></ol><p><strong>End of the journey:</strong> KV is for data read much more than written, and eventual. A counter needs one place that takes one call at a time: a Durable Object.</p></section><section class="bp-text-journey"><h3>J · Data next to the Worker</h3><p>D1 for quotes, R2 for proofs, Hyperdrive to Postgres</p><ol><li><strong>Worker</strong>: The edge computes a shipping quote by itself, without asking the origin. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/d1.html?lang=en">Lesson 17 · D1: SQLite at the edge</a> <code>docker compose run --rm lab quote MAD 2.5</code></li><li><strong>D1</strong> <span class="bp-text-stamp">[16 EUR]</span>: D1 is SQLite at the edge, with prepared statements and bind. Madrid, 2.5 kg: 12.0 + 1.6 x 2.5 = 16, stored as a new quote. <span class="bp-text-tag">Lab</span> <a href="lessons/d1.html?lang=en">Lesson 17 · D1: SQLite at the edge</a></li><li><strong>D1</strong> <span class="bp-text-stamp">[no migrations to apply]</span>: The schema changes with numbered migrations, recorded in d1_migrations: applying twice does nothing. <span class="bp-text-tag">Lab</span> <a href="lessons/d1.html?lang=en">Lesson 17 · D1: SQLite at the edge</a> <code>docker compose exec edge npx wrangler d1 migrations list rumbo-edge --local</code></li><li><strong>R2</strong> <span class="bp-text-stamp">[201]</span>: R2 keeps the proof of delivery as an object, proofs/R-1043.txt, with its etag. Bodies are streams: the Worker passes them on without loading them. <span class="bp-text-tag">Lab</span> <a href="lessons/r2.html?lang=en">Lesson 18 · R2: objects without egress fees</a> <code>docker compose run --rm lab proof put R-1043 signed by Ana</code></li><li><strong>R2</strong> <span class="bp-text-stamp">[same etag]</span>: Reading it out has no egress fee; storage and operations are what count. R-1044 has no proof: 404. <span class="bp-text-tag">Lab</span> <a href="lessons/r2.html?lang=en">Lesson 18 · R2: objects without egress fees</a> <code>docker compose run --rm lab proof get R-1043</code></li><li><strong>Hyperdrive</strong>: /direct reads the shipment from PostgreSQL through Hyperdrive, with an ordinary driver: Spring Boot is not involved. <span class="bp-text-tag">Lab</span> <a href="lessons/hyperdrive.html?lang=en">Lesson 21 · Hyperdrive: your Postgres from the edge</a> <code>docker compose run --rm lab get /direct/shipments/R-1044</code></li><li><strong>PostgreSQL 18</strong> <span class="bp-text-stamp">[3 rows]</span>: The same database the origin uses. On Cloudflare, Hyperdrive pools connections near it and caches reads without invalidating them on writes; in the kit there is no pool and no cache. <span class="bp-text-tag">Lab</span> <a href="lessons/hyperdrive.html?lang=en">Lesson 21 · Hyperdrive: your Postgres from the edge</a> <code>docker compose exec db psql -U rumbo -d rumbo -c &quot;SELECT id, status FROM shipments ORDER BY id&quot;</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[servedBy rumbo-origin]</span>: The same status through the origin: two paths to one database, and the edge chooses. <span class="bp-text-tag">Lab</span> <a href="lessons/hyperdrive.html?lang=en">Lesson 21 · Hyperdrive: your Postgres from the edge</a> <code>docker compose run --rm lab get /api/shipments/R-1044</code></li></ol><p><strong>End of the journey:</strong> Each store has its own guarantee: SQL with migrations in D1, objects with no egress fees in R2, and your own Postgres through Hyperdrive, without moving the data.</p></section><section class="bp-text-journey"><h3>K · A carrier&#39;s webhook</h3><p>202 at once, a queue, an idempotent consumer, an alarm</p><ol><li><strong>Carrier</strong>: A carrier reports a movement: POST /webhooks/movement, event m-1, R-1042, delivered. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a> <code>docker compose run --rm lab webhook m-1 R-1042 delivered</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[202]</span>: The Worker sends the movement to the queue and answers 202 at once: the carrier does not wait for the work. <em>What the dot carries: Movement.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></li><li><strong>Queue</strong>: At least once. The kit delivers a batch every 2 seconds, with max_retries 2 and a dead letter queue, movements-dead. <em>What the dot carries: Movement.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[attempts: 1]</span>: The queue handler of the same Worker takes the batch and posts each movement to the origin. <em>What the dot carries: Movement.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[saved]</span>: The event id is the primary key of the movements table: saved once. <em>What the dot carries: Movement.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></li><li><strong>Durable Object</strong>: The object of shipment R-1042 takes the new status and pushes it over its WebSocket to the browsers watching it. <em>What the dot carries: Object state.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/do-alarms-websockets.html?lang=en">Lesson 20 · Durable Objects over time</a></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[already saved]</span>: The same message twice: the origin answers already saved, and nothing changes. The consumer has to be idempotent. <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a> <code>docker compose run --rm lab webhook m-1 R-1042 delivered</code></li><li><strong>Queue</strong> <span class="bp-text-stamp">[dead letter queue]</span>: A status the origin rejects with 422: retried, three attempts, then movements-dead, in about eight seconds. <span class="bp-text-tag">Lab</span> <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a> <code>docker compose run --rm lab webhook m-2 R-1042 lost in space</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[delayed: true]</span>: No movement in 8 seconds: the alarm of the object marks the shipment delayed and tells its watchers. A final status, delivered, cancels the alarm. <span class="bp-text-tag">Lab</span> <a href="lessons/do-alarms-websockets.html?lang=en">Lesson 20 · Durable Objects over time</a> <code>docker compose run --rm lab live R-1044</code></li></ol><p><strong>End of the journey:</strong> The carrier gets 202 at once and the work happens later, at least once. The event id makes a repeat harmless, a dead letter queue keeps what failed, and the object of the shipment notices silence.</p></section><section class="bp-text-journey"><h3>L · A return that waits</h3><p>steps that survive, a person, one retry</p><ol><li><strong>Shop app</strong>: A return is requested for shipment R-1043: POST /returns/r-1. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a> <code>docker compose run --rm lab return start r-1 R-1043</code></li><li><strong>Worker</strong>: The Worker creates an instance of the Workflow of returns with the id r-1. <em>What the dot carries: Request.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[running]</span>: step.do stores the registration; step.waitForEvent waits for approved. While it waits, nothing runs and nothing is lost. <em>What the dot carries: Return instance.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[running, output null]</span>: Status running, output null: the instance waits for a person, for days if needed. <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a> <code>docker compose run --rm lab return status r-1</code></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[refund: attempts 2]</span>: Ana approves: an approved event with her name. The refund fails once on purpose, and only that step is retried. <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a> <code>docker compose run --rm lab return approve r-1 ana</code></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[complete]</span>: Registered, refunded, approved by ana, notified: the output of every step is stored. <em>What the dot carries: Return instance.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[already_exists]</span>: The same id again is refused: instance.already_exists. A duplicate request is harmless. <span class="bp-text-tag">Lab</span> <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a> <code>docker compose run --rm lab return start r-1 R-1043</code></li></ol><p><strong>End of the journey:</strong> Each step of a Workflow stores its result, so waiting for a person or retrying a failed step loses nothing, and the id of an instance makes a repeated request harmless.</p></section><section class="bp-text-journey"><h3>M · The close at 03:00</h3><p>a Cron Trigger, Hyperdrive, KV</p><ol><li><strong>Cron Trigger</strong>: A Cron Trigger, 0 3 * * *, in UTC: the daily close of Rumbo. After a change, the new schedule can take up to 15 minutes to reach the network. <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a> <code>docker compose exec edge grep -n &quot;crons&quot; wrangler.jsonc</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[scheduled: ok]</span>: wrangler dev does not fire Cron Triggers by itself: lab cron asks the Local Explorer to run the scheduled handler. <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a> <code>docker compose exec edge lab cron</code></li><li><strong>Hyperdrive</strong>: The handler reads the shipments by status from PostgreSQL, through Hyperdrive. <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a></li><li><strong>PostgreSQL 18</strong>: Three shipments, counted by status. <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a></li><li><strong>KV</strong> <span class="bp-text-stamp">[close:last]</span>: The close is stored in KV, under close:last. <em>What the dot carries: Flag.</em> <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[ok]</span>: The other way: /cdn-cgi/local/scheduled, with an optional cron and time. Both answer only on the address of the edge itself, so the lab runs them inside it. <span class="bp-text-tag">Lab</span> <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a> <code>docker compose exec edge curl -s &quot;http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=0+3+*+*+*&quot;</code></li></ol><p><strong>End of the journey:</strong> A Cron Trigger runs the scheduled handler of the Worker at a time in UTC, with the same bindings as a request. Locally you run it by hand.</p></section><section class="bp-text-journey"><h3>N · An edge you can defend</h3><p>what is cached, what protects what, what each store guarantees</p><ol><li><strong>Cache</strong>: What is cached, and why: the public page max-age=60, the API no-store, a profile private, the rate of a zone in the Cache API of each data center. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: The admin API is refused at the edge, as a custom rule would, and the API is limited per key. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>API of Rumbo</strong> <span class="bp-text-stamp">[401]</span>: The origin listens on no public port, a tunnel is its way in, TLS to it is Full (strict), and it validates identity itself. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a> <code>docker compose run --rm lab panel --direct</code></li><li><strong>Queue</strong> <span class="bp-text-stamp">[saved once]</span>: A queue for movements: at least once, an idempotent consumer, a dead letter queue. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a> <code>docker compose run --rm lab webhook c-1 R-1043 delivered</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[final: 50]</span>: A Durable Object per shipment and per counter: one place, one call at a time. KV for flags, D1 for quotes, R2 for proofs, a Workflow for returns. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a> <code>docker compose run --rm lab race do</code></li><li><strong>The kit</strong>: Every claim backed by a span: the refused request answered by the Worker alone, the webhooks with queue send, the consumers with fetch to the origin and the object, and the race. <span class="bp-text-tag">Lab</span> <a href="lessons/capstone.html?lang=en">Lesson 25 · An edge you can defend</a> <code>docker compose exec edge lab spans 6</code></li></ol><p><strong>End of the journey:</strong> Each decision is a header, a rule or a guarantee you can point to, and each claim has a command and a span behind it. All of it fits the free plan for a small load, except what the zone needs; R2 asks for a payment method.</p></section><section><h3>Pieces</h3><dl><dt id="bp-text-browser">Browser · tracks a shipment</dt><dd>A person on a web page. <em>What it is for:</em> The public tracking page: the same for everyone. <em>What it does not do:</em> It does not see the origin: only the edge. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a>, <a href="lessons/do-alarms-websockets.html?lang=en">Lesson 20 · Durable Objects over time</a></dd><dt id="bp-text-shop">Shop app · calls the API</dt><dd>Another system calling the API with its key. <em>What it is for:</em> Orders and tracking from the shop. <em>What it does not do:</em> It does not share the budget of other keys. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a>, <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a></dd><dt id="bp-text-carrier">Carrier · reports every movement</dt><dd>A carrier that posts a webhook per movement. <em>What it is for:</em> Movements arrive in bursts and sometimes twice. <em>What it does not do:</em> It does not wait for the work: it gets 202. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></dd><dt id="bp-text-employee">Employee · uses the internal panel</dt><dd>A person of Rumbo with a login. <em>What it is for:</em> The internal panel, behind Access. <em>What it does not do:</em> It does not reach the panel without identity. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a>, <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a></dd><dt id="bp-text-someone">Someone else · knows the origin address</dt><dd>Whoever was not invited: a bot, an attack, someone who found the address. <em>What it is for:</em> The reason for every layer. <em>What it does not do:</em> Illustrative: the kit plays it with the lab container. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a>, <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a></dd><dt id="bp-text-anycast">Anycast · everywhere</dt><dd>The same addresses announced from every data center. <em>What it is for:</em> Answer from nearby and spread load and attacks. <em>What it does not do:</em> It does not promise the closest city: routing decides. <em>Free plan:</em> Included. <em>In the kit:</em> Not in the kit: the lessons show it from Cloudflare. <a href="lessons/a-request-through-the-edge.html?lang=en">Lesson 01 · A request goes through the edge</a></dd><dt id="bp-text-dns">DNS · of Cloudflare: proxied records</dt><dd>The authoritative DNS of your zone, run by Cloudflare. <em>What it is for:</em> A proxied record answers with anycast addresses, so requests meet the edge first. <em>What it does not do:</em> It hides the origin in DNS only, not everywhere. <em>Free plan:</em> Included. <em>In the kit:</em> Not in the kit: the lessons show it from Cloudflare. <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a></dd><dt id="bp-text-dnsonly">DNS only · straight to a server</dt><dd>A record answered with its real address. <em>What it is for:</em> Mail, verification and services that must not go through the edge. <em>What it does not do:</em> No cache, no WAF, no Workers on its way. <em>Free plan:</em> Included. <em>In the kit:</em> Not in the kit: the lessons show it from Cloudflare. <a href="lessons/proxied-dns.html?lang=en">Lesson 02 · DNS with or without the proxy</a></dd><dt id="bp-text-tls">TLS · leg 1</dt><dd>The end of the encrypted connection of the visitor, with a certificate for your zone. <em>What it is for:</em> Encrypt leg 1; the encryption mode decides leg 2. <em>What it does not do:</em> The padlock says nothing of leg 2: Flexible sends it in plain HTTP. <em>Free plan:</em> Included. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/tls-two-legs.html?lang=en">Lesson 03 · TLS in two legs</a></dd><dt id="bp-text-waf">WAF · rules</dt><dd>Rules on each request, in fixed phases: custom, rate limiting, managed. <em>What it is for:</em> Stop what no code should see, before the Worker. <em>What it does not do:</em> It compares text: a rule without lower() misses another case. <em>Free plan:</em> 5 custom rules, 1 rate limiting rule, the Free Managed Ruleset. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/waf-rules.html?lang=en">Lesson 13 · WAF: rules on the request</a>, <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a></dd><dt id="bp-text-access">Access · identity</dt><dd>A login in front of an application, with policies. <em>What it is for:</em> Internal tools without a VPN; a signed JWT for the origin. <em>What it does not do:</em> It does not close the origin: the origin validates the JWT. <em>Free plan:</em> Zero Trust: free up to 50 users. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a></dd><dt id="bp-text-cache">Cache · Workers Cache</dt><dd>Workers Cache: a cache in front of the Worker, by the Cache-Control of its answers. <em>What it is for:</em> Serve what is the same for everyone without running the Worker. <em>What it does not do:</em> The key has no user: never cache personal answers as public. <em>Free plan:</em> Any plan, no price of its own: each request still counts as a Worker request. <em>In the kit:</em> Not in the kit: the lessons show it from Cloudflare. <a href="lessons/what-the-edge-keeps.html?lang=en">Lesson 10 · What the edge keeps</a>, <a href="lessons/cache-key-traps.html?lang=en">Lesson 11 · The cache key and its traps</a></dd><dt id="bp-text-worker">Worker · rumbo-edge, in a V8 isolate: fetch, queue and scheduled</dt><dd>Your code, in a V8 isolate of the data center that got the request. <em>What it is for:</em> Decide, rewrite, answer or forward; reach the bindings. <em>What it does not do:</em> No global state you can trust; no Java. <em>Free plan:</em> 100,000 requests a day, 10 ms of CPU each. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/isolates.html?lang=en">Lesson 05 · An isolate, not a container</a>, <a href="lessons/worker-in-front.html?lang=en">Lesson 07 · A Worker in front of your API</a>, <a href="lessons/testing-a-worker.html?lang=en">Lesson 08 · Testing a Worker</a></dd><dt id="bp-text-kv">KV · FLAGS</dt><dd>A key-value store, cached near its readers. <em>What it is for:</em> Flags, configuration, allow lists. <em>What it does not do:</em> Not a counter: eventual and without atomic operations. <em>Free plan:</em> 100,000 reads and 1,000 writes a day. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/kv.html?lang=en">Lesson 16 · KV: fast reads, eventual writes</a></dd><dt id="bp-text-d1">D1 · DB, SQLite</dt><dd>A managed SQL database with the SQL of SQLite. <em>What it is for:</em> Tables the edge reads and writes: the quotes of Rumbo. <em>What it does not do:</em> Not your big relational database: one primary per database. <em>Free plan:</em> 10 databases, 5 GB, 5 million rows read a day. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/d1.html?lang=en">Lesson 17 · D1: SQLite at the edge</a></dd><dt id="bp-text-r2">R2 · PROOFS</dt><dd>Object storage with an S3-compatible API. <em>What it is for:</em> Files read by many: the proofs of delivery. <em>What it does not do:</em> No egress fees, but storage and operations are counted. <em>Free plan:</em> 10 GB-month, 1 million Class A, 10 million Class B a month. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/r2.html?lang=en">Lesson 18 · R2: objects without egress fees</a></dd><dt id="bp-text-cacheapi">Cache API · caches.default</dt><dd>The cache of one data center, from your code: caches.default, with match, put and delete. <em>What it is for:</em> Keep what the Worker computed, under a key it chooses: the rates of Rumbo. <em>What it does not do:</em> It does not replicate: delete purges this data center only. <em>Free plan:</em> Any plan. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/cache-key-traps.html?lang=en">Lesson 11 · The cache key and its traps</a>, <a href="lessons/cache-from-a-worker.html?lang=en">Lesson 12 · Cache from a Worker</a></dd><dt id="bp-text-ratelimit">Rate limit · LIMITER</dt><dd>A counter per key in a window of 10 or 60 seconds, from the Worker. <em>What it is for:</em> A budget per API key, user or tenant. <em>What it does not do:</em> Not exact: per location and eventually consistent. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/rate-limiting.html?lang=en">Lesson 14 · Rate limiting</a></dd><dt id="bp-text-cron">Cron Trigger · 0 3 * * *, UTC</dt><dd>A schedule that runs the scheduled handler. <em>What it is for:</em> The daily close of Rumbo at 03:00 UTC. <em>What it does not do:</em> Not in your time zone: in UTC. Changes take up to 15 minutes. <em>Free plan:</em> 5 Cron Triggers per account. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/cron-and-events.html?lang=en">Lesson 24 · Cron and platform events</a></dd><dt id="bp-text-dobj">Durable Object · SHIPMENTS</dt><dd>An instance of your class, one per id, in one place. <em>What it is for:</em> Counters, live state, coordination: one call at a time. <em>What it does not do:</em> Not one global table: one object queues every caller. <em>Free plan:</em> SQLite backend only; 5 GB in total. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/durable-objects.html?lang=en">Lesson 19 · Durable Objects: one place per thing</a>, <a href="lessons/do-alarms-websockets.html?lang=en">Lesson 20 · Durable Objects over time</a></dd><dt id="bp-text-queue">Queue · MOVES</dt><dd>Messages from a producer to a consumer, in batches. <em>What it is for:</em> Answer now, work later, absorb bursts. <em>What it does not do:</em> Not exactly once: duplicates are rare but possible. <em>Free plan:</em> 10,000 operations a day, 24 hours of retention. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></dd><dt id="bp-text-workflow">Workflow · RETURNS</dt><dd>A process of steps whose results are stored. <em>What it is for:</em> Returns that wait days for a person, with retries per step. <em>What it does not do:</em> Not a place for heavy computation: each step is a Worker invocation. <em>Free plan:</em> 3,000 steps a day. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/workflows.html?lang=en">Lesson 23 · Workflows: steps that survive</a></dd><dt id="bp-text-hyperdrive">Hyperdrive · PG, to your Postgres</dt><dd>A pool and a query cache between Workers and your own database. <em>What it is for:</em> Reach PostgreSQL from many data centers without a connection per request. <em>What it does not do:</em> It does not replicate your data, nor invalidate its cache on writes. <em>Free plan:</em> 100,000 queries a day. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/hyperdrive.html?lang=en">Lesson 21 · Hyperdrive: your Postgres from the edge</a></dd><dt id="bp-text-wrangler">Wrangler · 4.162.0</dt><dd>The command line of Workers. <em>What it is for:</em> dev, deploy, versions, tail, d1, kv, r2. <em>What it does not do:</em> It is moving to cf, in open beta since 28 September 2026. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/wrangler-and-config.html?lang=en">Lesson 06 · Wrangler and the configuration</a>, <a href="lessons/deploy-and-observe.html?lang=en">Lesson 09 · Deploy and observe</a></dd><dt id="bp-text-kit">The kit · wrangler dev</dt><dd>wrangler dev in Docker, with the origin and the database of Rumbo. <em>What it is for:</em> Every lesson, with no account. <em>What it does not do:</em> No anycast, no zone, no Workers Cache, no pool in Hyperdrive. <em>Free plan:</em> Free: it runs on your machine. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/testing-a-worker.html?lang=en">Lesson 08 · Testing a Worker</a></dd><dt id="bp-text-cloudflared">cloudflared, Tunnel · outbound connections to Cloudflare</dt><dd>The program next to your service that opens the tunnel. <em>What it is for:</em> Publish without an inbound port or a public IP. <em>What it does not do:</em> It does not close other ways in. <em>Free plan:</em> All plans. <em>In the kit:</em> Partly: the kit runs a stand-in, and the lessons show the rest. <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a></dd><dt id="bp-text-api">API of Rumbo · Spring Boot 4.1 on Java 25: the origin, and its panel</dt><dd>The Spring Boot API of Rumbo: the origin. <em>What it is for:</em> The business: shipments, movements, the panel. <em>What it does not do:</em> It does not trust the edge blindly: it validates tokens. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/access-identity.html?lang=en">Lesson 15 · Access: identity before the origin</a>, <a href="lessons/queues.html?lang=en">Lesson 22 · Queues: at least once</a></dd><dt id="bp-text-postgres">PostgreSQL 18 · shipments, movements</dt><dd>The database of the origin. <em>What it is for:</em> The source of truth for shipments. <em>What it does not do:</em> It is not in Cloudflare: Hyperdrive and the origin reach it. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/hyperdrive.html?lang=en">Lesson 21 · Hyperdrive: your Postgres from the edge</a></dd><dt id="bp-text-openport">Open port · illustrative</dt><dd>A public port the origin still listens on. <em>What it is for:</em> Nothing: it is the risk the tunnel leaves if you forget it. <em>What it does not do:</em> Cloudflare does not protect requests that never reach it. <em>In the kit:</em> It runs in the kit, with no account. <a href="lessons/origin-without-open-ports.html?lang=en">Lesson 04 · An origin with no open ports</a></dd></dl></section><section><h3>What travels</h3><dl><dt>R · Request</dt><dd>An HTTP request: a method, a path and headers, and sometimes a body. <em>Comes from:</em> A client: a browser, the shop, a carrier, an employee, the lab. <em>Ends up:</em> The edge first; the origin only if the edge sends it on.</dd><dt>A · Response</dt><dd>The answer, with the headers each piece added: x-rumbo-via, cf-cache-status, cf-ray. <em>Comes from:</em> The origin, the Worker or the cache. <em>Ends up:</em> The client, back over leg 1.</dd><dt>C · Stored copy</dt><dd>A response kept to answer the next request without running the Worker or calling the origin. <em>Comes from:</em> A response whose Cache-Control allows it. <em>Ends up:</em> The cache in front of the Worker, or the Cache API of one data center.</dd><dt>J · Signed JWT</dt><dd>Who the person is, signed: iss, aud, email and an expiry, in the Cf-Access-Jwt-Assertion header. <em>Comes from:</em> Access, after a login and a policy; in the kit, the test issuer of the course. <em>Ends up:</em> The origin, which validates it itself.</dd><dt>M · Movement</dt><dd>A message: event id, shipment and status, delivered at least once. <em>Comes from:</em> The webhook of a carrier, through the Worker. <em>Ends up:</em> The queue, its consumer, the origin, and the object of the shipment.</dd><dt>F · Flag</dt><dd>A value in KV: the maintenance flag, the last request, the daily close. <em>Comes from:</em> Wrangler, the Worker, or its scheduled handler. <em>Ends up:</em> Every data center that reads it, eventually.</dd><dt>S · Object state</dt><dd>The state of one Durable Object: a counter, or a shipment with its status and watchers. <em>Comes from:</em> Calls to that object, one at a time. <em>Ends up:</em> The storage of the object, strongly consistent.</dd><dt>W · Return instance</dt><dd>One run of the Workflow of returns, with an id and the stored output of each step. <em>Comes from:</em> A request to start a return. <em>Ends up:</em> The Workflow, until every step has finished.</dd></dl></section><hr><h2>Panorama</h2><p>Un pedido, del DNS a tu origen, y lo que decide el borde en el camino</p><p>Rumbo sigue envíos. Su origen es una API de Spring Boot con PostgreSQL; delante, un Worker en el borde de Cloudflare, con sus bindings. Este dibujo pone en una escena todas las piezas del curso.</p><p>Elegí un recorrido: el punto es el pedido o el mensaje, y sus letras son lo que lleva. Cada parada dice qué se decide en esa pieza y qué lección lo profundiza. Hacé clic en cualquier pieza para ver su ficha: qué es, para qué sirve, qué no hace, el plan gratuito y el kit.</p><p>Las etiquetas dicen cómo ver cada parada por tu cuenta: LABORATORIO en el kit, sin cuenta; CUENTA con una cuenta gratuita de Cloudflare, opcional; ZONA con un dominio propio, que las lecciones muestran como caso de estudio; MODELO solo en las lecciones.</p><section class="bp-text-journey"><h3>A · A través del borde</h3><p>DNS, anycast, las etapas, el Worker, el origen</p><ol><li><strong>App de la tienda</strong>: El lab hace de cliente de la API: GET /api/shipments/R-1042, al borde del kit en 127.0.0.1:18097. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a> <code>docker compose run --rm lab get /api/shipments/R-1042</code></li><li><strong>DNS</strong> <span class="bp-text-stamp">[con proxy]</span>: En Cloudflare el nombre es un registro con proxy: el DNS responde con direcciones anycast de Cloudflare, no con la dirección del origen. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a> <code>docker compose run --rm lab dns www.cloudflare.com</code></li><li><strong>Anycast</strong> <span class="bp-text-stamp">[colo]</span>: Las mismas direcciones se anuncian desde todos los data centers, y el ruteo lleva el pedido a uno, en general cercano. /cdn-cgi/trace lo nombra en colo. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/a-request-through-the-edge.html?lang=es">Lección 01 · Un pedido pasa por el borde</a> <code>docker compose run --rm lab trace</code></li><li><strong>TLS</strong>: El tramo 1 termina acá, con un certificado que Cloudflare administra para la zona. El modo de cifrado de la zona decide cómo llega el tramo 2 al origen. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a></li><li><strong>WAF</strong>: Las reglas propias, de rate limiting y administradas corren en fases fijas. Nada coincide, así que el pedido sigue. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a></li><li><strong>Cache</strong> <span class="bp-text-stamp">[no-store]</span>: No hay política de Access en este nombre. La API responde no-store, así que ninguna cache en el camino la puede guardar. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a></li><li><strong>Worker</strong>: El gateway de Rumbo, en un isolate de V8. La API de administración se rechazaría acá; esta ruta sigue. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[dentro del presupuesto]</span>: El presupuesto de la clave: 5 pedidos cada 10 segundos. Sin x-api-key, todos los clientes comparten el anónimo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a></li><li><strong>cloudflared, Tunnel</strong>: En producción el pedido llega al origen por conexiones que cloudflared abrió desde adentro. En el kit el Worker llama a origin:8080 en la red de Compose. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[x-rumbo-edge]</span>: El origen ve x-rumbo-edge y x-rumbo-request-id, que agregó el Worker. Llamado directo, con lab origin /echo, no ve ninguno. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/a-request-through-the-edge.html?lang=es">Lección 01 · Un pedido pasa por el borde</a> <code>docker compose run --rm lab get /echo</code></li><li><strong>Worker</strong>: A la salida el Worker agrega x-rumbo-via: edge. Después de la respuesta, ctx.waitUntil registra el último pedido en KV sin hacer esperar al cliente. <em>Qué lleva el punto: Respuesta.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a> <code>docker compose run --rm lab get /lab/last-request</code></li><li><strong>TLS</strong> <span class="bp-text-stamp">[cf-ray]</span>: De vuelta por el tramo 1. Un sitio detrás de Cloudflare responde con server: cloudflare y un cf-ray, el Ray ID del pedido. <em>Qué lleva el punto: Respuesta.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/a-request-through-the-edge.html?lang=es">Lección 01 · Un pedido pasa por el borde</a> <code>docker compose run --rm lab headers</code></li></ol><p><strong>Fin del recorrido:</strong> Cada pedido se encuentra primero con el borde, en el data center donde llegó: TLS, las reglas, la cache y el Worker deciden antes de llamar al origen, y cada uno deja algo que se puede leer en un encabezado.</p></section><section class="bp-text-journey"><h3>B · Por fuera del borde</h3><p>un registro solo DNS, un puerto abierto, un túnel</p><ol><li><strong>Alguien más</strong>: Alguien a quien nadie invitó: un bot, un ataque, o una persona que encontró la dirección del origen. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a></li><li><strong>Solo DNS</strong> <span class="bp-text-stamp">[dirección real]</span>: Un registro viejo solo DNS la filtra: Cloudflare responde con la dirección real, y los pedidos van directo a ese servidor, sin cache, sin WAF y sin Worker en el camino. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a> <code>docker compose run --rm lab dns github.com</code></li><li><strong>Puerto abierto</strong> <span class="bp-text-stamp">[sin borde]</span>: Si el origen sigue escuchando en un puerto público, este camino nunca pasa por el borde. Un túnel agrega una entrada; no cierra las otras. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[401]</span>: El origen igual pide prueba: su panel valida el token por su cuenta, así que saltear el borde no saltea el control. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab panel --direct</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[:0]</span>: En el kit el origen no publica ningún puerto: el 8080 no tiene dirección en tu máquina. Solo el borde la tiene. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a> <code>docker compose port origin 8080</code></li><li><strong>cloudflared, Tunnel</strong>: Una entrada desde adentro: cloudflared, al lado del servicio, abre conexiones salientes hacia Cloudflare, y el borde manda por ellas los pedidos del nombre. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a> <code>docker compose --profile tunnel up -d tunnel</code></li><li><strong>cloudflared, Tunnel</strong> <span class="bp-text-stamp">[trycloudflare.com]</span>: Un quick tunnel, sin cuenta: un nombre de trycloudflare.com responde con server: cloudflare y el cuerpo de rumbo-origin. En las corridas de validación tardó entre 14 y 41 segundos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a> <code>docker compose run --rm lab tunnel</code></li><li><strong>cloudflared, Tunnel</strong> <span class="bp-text-stamp">[saliente]</span>: Registered tunnel connection: una conexión saliente hacia un data center. Un túnel con nombre mantiene cuatro, hacia dos data centers, y sobrevive reinicios. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a> <code>docker compose logs tunnel</code></li></ol><p><strong>Fin del recorrido:</strong> El proxy esconde el origen solo en el DNS. Con ningún puerto abierto y un origen que controla quién llama, encontrar su dirección no alcanza.</p></section><section class="bp-text-journey"><h3>C · TLS en dos tramos</h3><p>el candado cubre el tramo 1; el modo decide el tramo 2</p><ol><li><strong>TLS</strong>: El tramo 1, del visitante al borde, con un certificado que Cloudflare administra para la zona. El candado no dice nada del tramo 2. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a></li><li><strong>TLS</strong>: El tramo 2 depende del modo de cifrado de la zona: Off, Flexible, Full, Full (strict) o Strict. lab tls hace de borde en ese tramo; un impostor responde con un certificado autofirmado para el mismo nombre. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a> <code>docker compose --profile tls up -d --wait impostor</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[HTTP plano]</span>: Flexible: el tramo 2 en HTTP plano. Quien esté entre el borde y el origen lo puede leer y cambiar. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a> <code>docker compose run --rm lab tls flexible</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[impostor aceptado]</span>: Full: HTTPS sin validar el certificado. Uno autofirmado se acepta, y también cualquier servidor que responda con uno: cifrado, hacia el servidor equivocado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a> <code>docker compose run --rm lab tls full impostor</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[aceptado]</span>: Full (strict) valida el certificado del origen, firmado por la CA de prueba del kit, que representa a las autoridades en las que confía. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a> <code>docker compose run --rm lab tls strict origin</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[rechazado]</span>: El impostor con strict: rechazado, DEPTH_ZERO_SELF_SIGNED_CERT. El nombre era el correcto; no lo firmó nadie de confianza. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a> <code>docker compose run --rm lab tls strict impostor</code></li></ol><p><strong>Fin del recorrido:</strong> Cifrado no alcanza: el tramo 2 también tiene que controlar quién responde. Full (strict) valida el certificado del origen; Full acepta cualquiera.</p></section><section class="bp-text-journey"><h3>D · Un Worker adelante</h3><p>configuración, isolates, decisiones antes del origen, pruebas</p><ol><li><strong>Wrangler</strong>: wrangler.jsonc nombra el Worker, su punto de entrada, su fecha de compatibilidad y nueve bindings: COUNTERS, DB, FLAGS, LIMITER, MOVES, PG, PROOFS, RETURNS y SHIPMENTS. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/wrangler-and-config.html?lang=es">Lección 06 · Wrangler y la configuración</a> <code>docker compose run --rm lab config</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[definido, 16 caracteres]</span>: Las vars se commitean con el código; los secretos van a la cuenta, y en local a .dev.vars, que se lee cuando arranca wrangler dev. El lab muestra solo el largo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/wrangler-and-config.html?lang=es">Lección 06 · Wrangler y la configuración</a> <code>docker compose exec edge sh -c &quot;echo RUMBO_TOKEN=local-only-value &gt; .dev.vars&quot;</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[mismo id, hits + 1]</span>: Un isolate de V8 dentro de un runtime que ya corre: una variable de módulo sobrevive a algunos pedidos. Reiniciá el borde y el id cambia: el estado global no es tuyo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/isolates.html?lang=es">Lección 05 · Un isolate, no un contenedor</a> <code>docker compose run --rm lab isolate</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[204, shop.example]</span>: Una preflight de CORS se responde en el borde, solo para la tienda permitida. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a> <code>docker compose run --rm lab options /api/shipments/R-1042 https://shop.example</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[sin allow-origin]</span>: Para otra página no hay access-control-allow-origin: un navegador ahí no deja que su script lea la respuesta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a> <code>docker compose run --rm lab options /api/shipments/R-1042 https://other.example</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: La API de administración se rechaza en el borde: el origen no recibe su carga y nunca la ve. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>KV</strong>: Después de una respuesta, ctx.waitUntil sigue trabajando hasta 30 segundos: el gateway registra el último pedido en KV. Los pedidos rechazados y las preflight nunca llegaron hasta ahí. <em>Qué lleva el punto: Flag.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a> <code>docker compose run --rm lab get /lab/last-request</code></li><li><strong>El kit</strong> <span class="bp-text-stamp">[6 pasaron]</span>: Las pruebas corren dentro de workerd con los bindings simulados: health, la API de administración, CORS, mantenimiento, el reenvío al origen y el 502 de un origen caído. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/testing-a-worker.html?lang=es">Lección 08 · Probar un Worker</a> <code>docker compose exec edge npx vitest run</code></li><li><strong>El kit</strong>: El origen no es parte de la prueba: vi.spyOn reemplaza el fetch global, para responder como lo haría el origen o fallar como uno caído. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/testing-a-worker.html?lang=es">Lección 08 · Probar un Worker</a> <code>docker compose exec edge grep -n &quot;spyOn&quot; test/gateway.test.ts</code></li></ol><p><strong>Fin del recorrido:</stron
