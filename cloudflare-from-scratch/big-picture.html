g> Cada decisión que se toma en el borde es una que el origen no tiene que tomar, y una que no puede tomar mal. El estado global no es tuyo, y las pruebas corren en el mismo runtime.</p></section><section class="bp-text-journey"><h3>E · Desplegar y versiones</h3><p>subir, desplegar, un reparto gradual</p><ol><li><strong>El kit</strong> <span class="bp-text-stamp">[1,50 KiB]</span>: Un segundo Worker, rumbo-edge-demo, sin bindings para que entre en el plan gratuito: --dry-run lo arma y se detiene. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose exec edge npx wrangler deploy --dry-run --config deploy/wrangler.jsonc</code></li><li><strong>Wrangler</strong> <span class="bp-text-stamp">[token: active]</span>: Con labs/.env, el id de tu cuenta y un token que puede editar Workers. Opcional, y nunca se imprime. <span class="bp-text-tag">Cuenta</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose run --rm lab account</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[v1 al 100%]</span>: wrangler deploy sube una versión y la despliega al 100%: el Worker responde en workers.dev, sin una zona propia. <span class="bp-text-tag">Cuenta</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose run --rm lab wrangler deploy --tag v1</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[v2 sin desplegar]</span>: versions upload guarda una versión nueva sin atender pedidos con ella. Un despliegue puede usar solo las últimas 100 versiones subidas. <span class="bp-text-tag">Cuenta</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose run --rm lab wrangler versions upload --tag v2 --var VERSION:v2</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[90% y 10%]</span>: versions deploy reparte el tráfico por porcentaje. Correrlo de nuevo mueve el reparto, o vuelve atrás. <span class="bp-text-tag">Cuenta</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose run --rm lab wrangler versions deploy --version-tag v1@90% --version-tag v2@10% -y</code></li><li><strong>TLS</strong> <span class="bp-text-stamp">[casi todo v1]</span>: Cada pedido se enruta por su cuenta: la mayoría recibe v1, algunos v2, y una persona puede ver las dos, salvo que la afinidad de versión deje una clave en una. <span class="bp-text-tag">Cuenta</span> <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a> <code>docker compose run --rm lab split /version 40</code></li></ol><p><strong>Fin del recorrido:</strong> Una versión es código y configuración, guardados; un despliegue dice qué versiones atienden pedidos y en qué proporción. Mover el reparto es cómo avanzás o volvés atrás.</p></section><section class="bp-text-journey"><h3>F · Qué guarda el borde</h3><p>Cache-Control, un HIT, la trampa de la clave, la Cache API</p><ol><li><strong>Navegador</strong>: Una clienta abre la página pública de seguimiento, GET /track/R-1042: la misma página para todos los que siguen ese envío. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a> <code>docker compose run --rm lab get /track/R-1042</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[max-age=60, public]</span>: La página responde cache-control: max-age=60, public: igual para todos, segura de compartir por un minuto. Una zona no la guardaría por defecto, porque es HTML; Workers Cache sí. <em>Qué lleva el punto: Respuesta.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a></li><li><strong>Cache</strong> <span class="bp-text-stamp">[MISS, después HIT]</span>: Workers Cache está delante del Worker y sigue el Cache-Control de sus respuestas: MISS, después HIT. Un HIT no corre el Worker, así que no usa CPU, aunque sigue contando como pedido. wrangler dev no lo ejecuta, así que esto necesita una cuenta. <em>Qué lleva el punto: Copia guardada.</em> <span class="bp-text-tag">Cuenta</span> <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a> <code>docker compose run --rm lab remote /c/public 2</code></li><li><strong>Cache</strong> <span class="bp-text-stamp">[sin HIT]</span>: private, no-store o un Set-Cookie: no se guarda nada. Un 200 sin Cache-Control se guarda por heurística, hasta dos horas. <span class="bp-text-tag">Cuenta</span> <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a> <code>docker compose run --rm lab remote /c/cookie 2</code></li><li><strong>Worker</strong>: Un perfil es personal, pero esta ruta lo marca public, y la clave de la cache es la URL: no incluye al usuario. El perfil de Ana queda guardado. <em>Qué lleva el punto: Respuesta.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cache-key-traps.html?lang=es">Lección 11 · La clave de cache y sus trampas</a> <code>docker compose run --rm lab get /lab/cache/profile -H x-user:ana</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[Beto recibió a Ana]</span>: Beto pide la misma URL y recibe la entrada guardada: el perfil de Ana, con su dirección. El kit muestra la trampa con la Cache API; la cache de una zona cae igual. <em>Qué lleva el punto: Copia guardada.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cache-key-traps.html?lang=es">Lección 11 · La clave de cache y sus trampas</a> <code>docker compose run --rm lab get /lab/cache/profile -H x-user:beto</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[su propia respuesta]</span>: profile-safe responde private, no-store: no se guarda nada, y cada persona recibe su propia respuesta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cache-key-traps.html?lang=es">Lección 11 · La clave de cache y sus trampas</a> <code>docker compose run --rm lab get /lab/cache/profile-safe -H x-user:beto</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[HIT]</span>: caches.default desde el Worker: match, put y delete, con una clave que elige. La tarifa de una zona se guarda 60 segundos. <em>Qué lleva el punto: Copia guardada.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cache-from-a-worker.html?lang=es">Lección 12 · Cache desde un Worker</a> <code>docker compose run --rm lab get &quot;/lab/cache/rate?zone=dub&quot;</code></li><li><strong>Cache API</strong> <span class="bp-text-stamp">[solo este data center]</span>: delete purga solo este data center: la Cache API no se replica. Para llegar a todos, purgá la zona, o Workers Cache por tag. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cache-from-a-worker.html?lang=es">Lección 12 · Cache desde un Worker</a> <code>docker compose run --rm lab get &quot;/lab/cache/purge?zone=dub&quot;</code></li></ol><p><strong>Fin del recorrido:</strong> La respuesta decide qué se guarda: public solo para lo que es igual para todos, private o no-store para cualquier cosa personal. Purgar arregla el pasado; solo un Cache-Control correcto arregla el futuro.</p></section><section class="bp-text-journey"><h3>G · Reglas y presupuestos</h3><p>una regla sobre la ruta, sus mayúsculas, un límite por clave</p><ol><li><strong>App de la tienda</strong>: GET /api/admin/users: una ruta a la que ningún cliente debería llegar. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>WAF</strong>: En una zona, una regla propia starts_with(http.request.uri.path, &quot;/api/admin&quot;) con Block termina el pedido acá: las fases siguientes y el Worker nunca lo ven. Los bloqueos quedan, muestreados, como eventos de seguridad. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: El kit no tiene zona, así que el gateway hace de regla: 403 antes del origen, respondido solo por el Worker. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[404 del origen]</span>: /API/admin/users pasa: la regla compara el texto exacto, con mayúsculas, y Spring Boot responde 404. Una expresión del WAF que ignora mayúsculas usa lower(http.request.uri.path). <span class="bp-text-tag">Laboratorio</span> <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a> <code>docker compose run --rm lab get /API/admin/users</code></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[200 cinco veces, después 429]</span>: Un presupuesto por x-api-key: 5 pedidos cada 10 segundos. k1 recibe cinco 200, después 429 con retry-after: 10. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a> <code>docker compose run --rm lab limit k1</code></li><li><strong>Rate limit</strong> <span class="bp-text-stamp">[su propio presupuesto]</span>: k2 tiene su propio presupuesto. Las cuentas son por lugar y eventualmente consistentes: aproximadas, no exactas. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a> <code>docker compose run --rm lab limit k2 3</code></li><li><strong>WAF</strong>: Una regla de rate limiting del WAF corre en su propia fase, antes de cualquier Worker; el plan gratuito incluye una. El binding sabe lo que una regla no, como el tenant detrás de una clave. <span class="bp-text-tag">Zona</span> <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a></li></ol><p><strong>Fin del recorrido:</strong> Una regla en la zona corre antes de cualquier Worker; una regla en código corre solo donde corre tu Worker, y las dos comparan el texto tal como está escrito. Un presupuesto por clave cuenta lo que una regla de la zona no ve.</p></section><section class="bp-text-journey"><h3>H · Identidad antes del origen</h3><p>Access, un JWT firmado, un origen que lo valida</p><ol><li><strong>Empleada</strong>: Ana, de operaciones, abre el panel interno, desde su casa, sin VPN. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a></li><li><strong>Access</strong> <span class="bp-text-stamp">[política: permitir]</span>: Cloudflare Access pregunta quién es: entra con el proveedor de identidad, y una política permite a la gente de operaciones. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a></li><li><strong>Access</strong>: El borde agrega un JWT firmado a los pedidos que pasan: el encabezado Cf-Access-Jwt-Assertion y la cookie CF_Authorization. <em>Qué lleva el punto: Pedido, JWT firmado.</em> <span class="bp-text-tag">Zona</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[401]</span>: El kit no tiene Access. Sin token, el origen pide uno. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab panel</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[emisor de prueba]</span>: El borde del kit sirve un emisor de prueba con su propia clave ES256 y los claims de Access: iss, aud rumbo-panel, el email de Ana y un vencimiento cinco minutos después. <em>Qué lleva el punto: JWT firmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab token</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[200]</span>: Spring Security, como resource server, valida cuatro cosas: la firma con las claves publicadas, la audiencia, el emisor y el vencimiento. <em>Qué lleva el punto: JWT firmado.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab panel --token</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[401]</span>: Un token de otra aplicación, vencido o cambiado recibe 401, y el motivo: la audiencia, Jwt expired, Invalid signature. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab panel --tampered</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[401]</span>: Llamado directo, salteando el borde, el origen igual pide prueba. Con Access solo cambian tres valores: la URL de las claves, el emisor y la audiencia. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a> <code>docker compose run --rm lab panel --direct</code></li></ol><p><strong>Fin del recorrido:</strong> Access controla quién es la persona en el borde; el origen valida el token firmado por su cuenta. Llegar al origen por otro camino no saltea el control.</p></section><section class="bp-text-journey"><h3>I · Una flag y un contador</h3><p>KV lee rápido; un Durable Object cuenta bien</p><ol><li><strong>KV</strong>: Workers KV guarda la flag de mantenimiento de Rumbo: escrita en almacenes centrales, en cache en los data centers que la leen. <em>Qué lleva el punto: Flag.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kv.html?lang=es">Lección 16 · KV: leer rápido, escribir eventual</a> <code>docker compose exec edge npx wrangler kv key put maintenance on --binding FLAGS --local</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[503]</span>: El gateway lee la flag: on, así que responde 503, mantenimiento, y no llama al origen. <em>Qué lleva el punto: Flag.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kv.html?lang=es">Lección 16 · KV: leer rápido, escribir eventual</a> <code>docker compose run --rm lab get /api/shipments/R-1042</code></li><li><strong>KV</strong> <span class="bp-text-stamp">[200 otra vez]</span>: Borrala y el pedido siguiente llega al origen. En local el cambio se ve enseguida; en Cloudflare, otros data centers pueden tardar un minuto o más. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kv.html?lang=es">Lección 16 · KV: leer rápido, escribir eventual</a> <code>docker compose exec edge npx wrangler kv key delete maintenance --binding FLAGS --local</code></li><li><strong>KV</strong> <span class="bp-text-stamp">[final: 1 de 50]</span>: No es un contador: 50 pedidos leen el mismo número viejo, le suman uno y lo vuelven a escribir. KV no tiene operaciones atómicas, y la mayoría de los incrementos se pierden. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/kv.html?lang=es">Lección 16 · KV: leer rápido, escribir eventual</a> <code>docker compose run --rm lab race kv</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[final: 50]</span>: Un Durable Object por contador, por el binding COUNTERS, vive en un lugar y atiende una llamada por vez: los 50 incrementos llegan uno detrás del otro. <em>Qué lleva el punto: Estado del objeto.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/durable-objects.html?lang=es">Lección 19 · Durable Objects: un lugar por cosa</a> <code>docker compose run --rm lab race do</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[200 de 200]</span>: Su almacenamiento es fuertemente consistente. Pero un objeto es un lugar, con un límite blando cerca de 1.000 pedidos por segundo: para más carga, repartí el estado en más objetos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/durable-objects.html?lang=es">Lección 19 · Durable Objects: un lugar por cosa</a> <code>docker compose run --rm lab race do 200</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[existe al pedirlo]</span>: Un objeto existe porque se lo pidió: el envío R-1043, todavía sin movimientos, nadie mirando. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/durable-objects.html?lang=es">Lección 19 · Durable Objects: un lugar por cosa</a> <code>docker compose run --rm lab get /shipments/R-1043/state</code></li></ol><p><strong>Fin del recorrido:</strong> KV es para datos que se leen mucho más de lo que se escriben, y es eventual. Un contador necesita un lugar que atienda una llamada por vez: un Durable Object.</p></section><section class="bp-text-journey"><h3>J · Datos al lado del Worker</h3><p>D1 para cotizaciones, R2 para comprobantes, Hyperdrive a Postgres</p><ol><li><strong>Worker</strong>: El borde calcula una cotización de envío por su cuenta, sin preguntarle al origen. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/d1.html?lang=es">Lección 17 · D1: SQLite en el borde</a> <code>docker compose run --rm lab quote MAD 2.5</code></li><li><strong>D1</strong> <span class="bp-text-stamp">[16 EUR]</span>: D1 es SQLite en el borde, con sentencias preparadas y bind. Madrid, 2,5 kg: 12,0 + 1,6 x 2,5 = 16, guardada como una cotización nueva. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/d1.html?lang=es">Lección 17 · D1: SQLite en el borde</a></li><li><strong>D1</strong> <span class="bp-text-stamp">[sin migraciones pendientes]</span>: El esquema cambia con migraciones numeradas, registradas en d1_migrations: aplicar dos veces no hace nada. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/d1.html?lang=es">Lección 17 · D1: SQLite en el borde</a> <code>docker compose exec edge npx wrangler d1 migrations list rumbo-edge --local</code></li><li><strong>R2</strong> <span class="bp-text-stamp">[201]</span>: R2 guarda el comprobante de entrega como un objeto, proofs/R-1043.txt, con su etag. Los cuerpos son streams: el Worker los pasa sin cargarlos en memoria. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/r2.html?lang=es">Lección 18 · R2: objetos sin costo de salida</a> <code>docker compose run --rm lab proof put R-1043 signed by Ana</code></li><li><strong>R2</strong> <span class="bp-text-stamp">[mismo etag]</span>: Leerlo no tiene costo de salida; lo que cuenta es el almacenamiento y las operaciones. R-1044 no tiene comprobante: 404. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/r2.html?lang=es">Lección 18 · R2: objetos sin costo de salida</a> <code>docker compose run --rm lab proof get R-1043</code></li><li><strong>Hyperdrive</strong>: /direct lee el envío de PostgreSQL por Hyperdrive, con un driver común: Spring Boot no interviene. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/hyperdrive.html?lang=es">Lección 21 · Hyperdrive: tu Postgres desde el borde</a> <code>docker compose run --rm lab get /direct/shipments/R-1044</code></li><li><strong>PostgreSQL 18</strong> <span class="bp-text-stamp">[3 filas]</span>: La misma base que usa el origen. En Cloudflare, Hyperdrive mantiene el pool cerca de ella y guarda lecturas sin invalidarlas cuando hay escrituras; en el kit no hay pool ni cache. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/hyperdrive.html?lang=es">Lección 21 · Hyperdrive: tu Postgres desde el borde</a> <code>docker compose exec db psql -U rumbo -d rumbo -c &quot;SELECT id, status FROM shipments ORDER BY id&quot;</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[servedBy rumbo-origin]</span>: El mismo estado por el origen: dos caminos a una base, y el borde elige. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/hyperdrive.html?lang=es">Lección 21 · Hyperdrive: tu Postgres desde el borde</a> <code>docker compose run --rm lab get /api/shipments/R-1044</code></li></ol><p><strong>Fin del recorrido:</strong> Cada almacén tiene su garantía: SQL con migraciones en D1, objetos sin costo de salida en R2, y tu propio Postgres por Hyperdrive, sin mover los datos.</p></section><section class="bp-text-journey"><h3>K · El webhook de un transportista</h3><p>202 enseguida, una cola, un consumidor idempotente, una alarma</p><ol><li><strong>Transportista</strong>: Un transportista avisa un movimiento: POST /webhooks/movement, evento m-1, R-1042, delivered. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a> <code>docker compose run --rm lab webhook m-1 R-1042 delivered</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[202]</span>: El Worker manda el movimiento a la cola y responde 202 enseguida: el transportista no espera el trabajo. <em>Qué lleva el punto: Movimiento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></li><li><strong>Queue</strong>: Al menos una vez. El kit entrega un lote cada 2 segundos, con max_retries 2 y una cola de mensajes muertos, movements-dead. <em>Qué lleva el punto: Movimiento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[attempts: 1]</span>: El handler queue del mismo Worker toma el lote y manda cada movimiento al origen. <em>Qué lleva el punto: Movimiento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[guardado]</span>: El id del evento es la clave primaria de la tabla de movimientos: guardado una vez. <em>Qué lleva el punto: Movimiento.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></li><li><strong>Durable Object</strong>: El objeto del envío R-1042 toma el estado nuevo y lo manda por su WebSocket a los navegadores que lo miran. <em>Qué lleva el punto: Estado del objeto.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/do-alarms-websockets.html?lang=es">Lección 20 · Durable Objects en el tiempo</a></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[ya guardado]</span>: El mismo mensaje dos veces: el origen responde already saved, y no cambia nada. El consumidor tiene que ser idempotente. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a> <code>docker compose run --rm lab webhook m-1 R-1042 delivered</code></li><li><strong>Queue</strong> <span class="bp-text-stamp">[cola de muertos]</span>: Un estado que el origen rechaza con 422: reintentado, tres intentos, y después movements-dead, en unos ocho segundos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a> <code>docker compose run --rm lab webhook m-2 R-1042 lost in space</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[delayed: true]</span>: Sin movimientos en 8 segundos: la alarma del objeto marca el envío como demorado y avisa a quienes lo miran. Un estado final, delivered, cancela la alarma. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/do-alarms-websockets.html?lang=es">Lección 20 · Durable Objects en el tiempo</a> <code>docker compose run --rm lab live R-1044</code></li></ol><p><strong>Fin del recorrido:</strong> El transportista recibe 202 enseguida y el trabajo pasa después, al menos una vez. El id del evento vuelve inofensiva una repetición, una cola de mensajes muertos guarda lo que falló, y el objeto del envío nota el silencio.</p></section><section class="bp-text-journey"><h3>L · Una devolución que espera</h3><p>pasos que sobreviven, una persona, un reintento</p><ol><li><strong>App de la tienda</strong>: Se pide una devolución del envío R-1043: POST /returns/r-1. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a> <code>docker compose run --rm lab return start r-1 R-1043</code></li><li><strong>Worker</strong>: El Worker crea una instancia del Workflow de devoluciones con el id r-1. <em>Qué lleva el punto: Pedido.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[running]</span>: step.do guarda el registro; step.waitForEvent espera approved. Mientras espera, no corre nada y no se pierde nada. <em>Qué lleva el punto: Instancia de devolución.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[running, output null]</span>: Estado running, output null: la instancia espera a una persona, días si hace falta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a> <code>docker compose run --rm lab return status r-1</code></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[reintegro: attempts 2]</span>: Ana aprueba: un evento approved con su nombre. El reintegro falla una vez a propósito, y solo ese paso se reintenta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a> <code>docker compose run --rm lab return approve r-1 ana</code></li><li><strong>Workflow</strong> <span class="bp-text-stamp">[complete]</span>: Registrada, reintegrada, aprobada por ana, avisada: la salida de cada paso queda guardada. <em>Qué lleva el punto: Instancia de devolución.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[already_exists]</span>: El mismo id otra vez se rechaza: instance.already_exists. Un pedido duplicado es inofensivo. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a> <code>docker compose run --rm lab return start r-1 R-1043</code></li></ol><p><strong>Fin del recorrido:</strong> Cada paso de un Workflow guarda su resultado, así esperar a una persona o reintentar un paso fallido no pierde nada, y el id de una instancia vuelve inofensivo un pedido repetido.</p></section><section class="bp-text-journey"><h3>M · El cierre de las 03:00</h3><p>un Cron Trigger, Hyperdrive, KV</p><ol><li><strong>Cron Trigger</strong>: Un Cron Trigger, 0 3 * * *, en UTC: el cierre diario de Rumbo. Después de un cambio, el horario nuevo puede tardar hasta 15 minutos en llegar a la red. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a> <code>docker compose exec edge grep -n &quot;crons&quot; wrangler.jsonc</code></li><li><strong>Worker</strong> <span class="bp-text-stamp">[scheduled: ok]</span>: wrangler dev no dispara los Cron Triggers solo: lab cron le pide al Local Explorer que corra el handler scheduled. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a> <code>docker compose exec edge lab cron</code></li><li><strong>Hyperdrive</strong>: El handler lee los envíos por estado de PostgreSQL, por Hyperdrive. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a></li><li><strong>PostgreSQL 18</strong>: Tres envíos, contados por estado. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a></li><li><strong>KV</strong> <span class="bp-text-stamp">[close:last]</span>: El cierre se guarda en KV, en close:last. <em>Qué lleva el punto: Flag.</em> <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[ok]</span>: El otro camino: /cdn-cgi/local/scheduled, con un cron y una hora opcionales. Los dos responden solo en la dirección del propio borde, por eso el lab los corre adentro. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a> <code>docker compose exec edge curl -s &quot;http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=0+3+*+*+*&quot;</code></li></ol><p><strong>Fin del recorrido:</strong> Un Cron Trigger corre el handler scheduled del Worker a una hora en UTC, con los mismos bindings que un pedido. En local lo corrés a mano.</p></section><section class="bp-text-journey"><h3>N · Un borde que se puede defender</h3><p>qué se guarda, qué protege qué, qué garantiza cada almacén</p><ol><li><strong>Cache</strong>: Qué se guarda, y por qué: la página pública max-age=60, la API no-store, un perfil private, la tarifa de una zona en la Cache API de cada data center. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a></li><li><strong>Worker</strong> <span class="bp-text-stamp">[403]</span>: La API de administración se rechaza en el borde, como lo haría una regla propia, y la API se limita por clave. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a> <code>docker compose run --rm lab get /api/admin/users</code></li><li><strong>API de Rumbo</strong> <span class="bp-text-stamp">[401]</span>: El origen no escucha en ningún puerto público, un túnel es su entrada, el TLS hacia él es Full (strict), y valida la identidad por su cuenta. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a> <code>docker compose run --rm lab panel --direct</code></li><li><strong>Queue</strong> <span class="bp-text-stamp">[guardado una vez]</span>: Una cola para los movimientos: al menos una vez, un consumidor idempotente, una cola de mensajes muertos. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a> <code>docker compose run --rm lab webhook c-1 R-1043 delivered</code></li><li><strong>Durable Object</strong> <span class="bp-text-stamp">[final: 50]</span>: Un Durable Object por envío y por contador: un lugar, una llamada por vez. KV para flags, D1 para cotizaciones, R2 para comprobantes, un Workflow para devoluciones. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a> <code>docker compose run --rm lab race do</code></li><li><strong>El kit</strong>: Cada afirmación respaldada por un span: el pedido rechazado que respondió solo el Worker, los webhooks con queue send, los consumidores con fetch al origen y el objeto, y la carrera. <span class="bp-text-tag">Laboratorio</span> <a href="lessons/capstone.html?lang=es">Lección 25 · Un borde que se puede defender</a> <code>docker compose exec edge lab spans 6</code></li></ol><p><strong>Fin del recorrido:</strong> Cada decisión es un encabezado, una regla o una garantía que se puede señalar, y cada afirmación tiene un comando y un span detrás. Todo entra en el plan gratuito para una carga chica, salvo lo que necesita la zona; R2 pide un medio de pago.</p></section><section><h3>Piezas</h3><dl><dt id="bp-text-browser">Navegador · sigue un envío</dt><dd>Una persona en una página web. <em>Para qué sirve:</em> La página pública de seguimiento: igual para todos. <em>Qué no hace:</em> No ve el origen: solo el borde. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a>, <a href="lessons/do-alarms-websockets.html?lang=es">Lección 20 · Durable Objects en el tiempo</a></dd><dt id="bp-text-shop">App de la tienda · llama a la API</dt><dd>Otro sistema que llama a la API con su clave. <em>Para qué sirve:</em> Pedidos y seguimiento desde la tienda. <em>Qué no hace:</em> No comparte el presupuesto de otras claves. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a>, <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a></dd><dt id="bp-text-carrier">Transportista · avisa cada movimiento</dt><dd>Un transportista que manda un webhook por movimiento. <em>Para qué sirve:</em> Los movimientos llegan en ráfagas y a veces dos veces. <em>Qué no hace:</em> No espera el trabajo: recibe 202. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></dd><dt id="bp-text-employee">Empleada · entra al panel interno</dt><dd>Una persona de Rumbo con un login. <em>Para qué sirve:</em> El panel interno, detrás de Access. <em>Qué no hace:</em> No llega al panel sin identidad. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a>, <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a></dd><dt id="bp-text-someone">Alguien más · conoce la dirección del origen</dt><dd>Quien no fue invitado: un bot, un ataque, alguien que encontró la dirección. <em>Para qué sirve:</em> La razón de cada capa. <em>Qué no hace:</em> Ilustrativo: el kit lo representa con el contenedor del lab. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a>, <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a></dd><dt id="bp-text-anycast">Anycast · en todos lados</dt><dd>Las mismas direcciones anunciadas desde todos los data centers. <em>Para qué sirve:</em> Responder desde cerca y repartir carga y ataques. <em>Qué no hace:</em> No promete la ciudad más cercana: decide el ruteo. <em>Plan gratuito:</em> Incluido. <em>En el kit:</em> No está en el kit: las lecciones lo muestran desde Cloudflare. <a href="lessons/a-request-through-the-edge.html?lang=es">Lección 01 · Un pedido pasa por el borde</a></dd><dt id="bp-text-dns">DNS · de Cloudflare: registros con proxy</dt><dd>El DNS con autoridad de tu zona, operado por Cloudflare. <em>Para qué sirve:</em> Un registro con proxy responde con direcciones anycast, así los pedidos se encuentran primero con el borde. <em>Qué no hace:</em> Esconde el origen solo en el DNS, no en todos lados. <em>Plan gratuito:</em> Incluido. <em>En el kit:</em> No está en el kit: las lecciones lo muestran desde Cloudflare. <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a></dd><dt id="bp-text-dnsonly">Solo DNS · directo a un servidor</dt><dd>Un registro que se responde con su dirección real. <em>Para qué sirve:</em> Mail, verificaciones y servicios que no tienen que pasar por el borde. <em>Qué no hace:</em> Sin cache, sin WAF, sin Workers en su camino. <em>Plan gratuito:</em> Incluido. <em>En el kit:</em> No está en el kit: las lecciones lo muestran desde Cloudflare. <a href="lessons/proxied-dns.html?lang=es">Lección 02 · DNS con proxy o sin proxy</a></dd><dt id="bp-text-tls">TLS · tramo 1</dt><dd>El final de la conexión cifrada del visitante, con un certificado para tu zona. <em>Para qué sirve:</em> Cifrar el tramo 1; el modo de cifrado decide el tramo 2. <em>Qué no hace:</em> El candado no dice nada del tramo 2: Flexible lo manda en HTTP plano. <em>Plan gratuito:</em> Incluido. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/tls-two-legs.html?lang=es">Lección 03 · TLS en dos tramos</a></dd><dt id="bp-text-waf">WAF · reglas</dt><dd>Reglas sobre cada pedido, en fases fijas: propias, rate limiting, administradas. <em>Para qué sirve:</em> Frenar lo que ningún código debería ver, antes del Worker. <em>Qué no hace:</em> Compara texto: una regla sin lower() no ve otras mayúsculas. <em>Plan gratuito:</em> 5 reglas propias, 1 de rate limiting, el Free Managed Ruleset. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/waf-rules.html?lang=es">Lección 13 · WAF: reglas sobre el pedido</a>, <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a></dd><dt id="bp-text-access">Access · identidad</dt><dd>Un login delante de una aplicación, con políticas. <em>Para qué sirve:</em> Herramientas internas sin VPN; un JWT firmado para el origen. <em>Qué no hace:</em> No cierra el origen: el origen valida el JWT. <em>Plan gratuito:</em> Zero Trust: gratis hasta 50 usuarios. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a></dd><dt id="bp-text-cache">Cache · Workers Cache</dt><dd>Workers Cache: una cache delante del Worker, según el Cache-Control de sus respuestas. <em>Para qué sirve:</em> Servir lo que es igual para todos sin correr el Worker. <em>Qué no hace:</em> La clave no tiene usuario: nunca guardes respuestas personales como públicas. <em>Plan gratuito:</em> Cualquier plan, sin precio propio: cada pedido sigue contando como pedido del Worker. <em>En el kit:</em> No está en el kit: las lecciones lo muestran desde Cloudflare. <a href="lessons/what-the-edge-keeps.html?lang=es">Lección 10 · Qué guarda el borde</a>, <a href="lessons/cache-key-traps.html?lang=es">Lección 11 · La clave de cache y sus trampas</a></dd><dt id="bp-text-worker">Worker · rumbo-edge, en un isolate de V8: fetch, queue y scheduled</dt><dd>Tu código, en un isolate de V8 del data center que recibió el pedido. <em>Para qué sirve:</em> Decidir, reescribir, responder o reenviar; llegar a los bindings. <em>Qué no hace:</em> Sin estado global confiable; sin Java. <em>Plan gratuito:</em> 100.000 pedidos por día, 10 ms de CPU cada uno. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/isolates.html?lang=es">Lección 05 · Un isolate, no un contenedor</a>, <a href="lessons/worker-in-front.html?lang=es">Lección 07 · Un Worker delante de tu API</a>, <a href="lessons/testing-a-worker.html?lang=es">Lección 08 · Probar un Worker</a></dd><dt id="bp-text-kv">KV · FLAGS</dt><dd>Un almacén de clave y valor, en cache cerca de sus lectores. <em>Para qué sirve:</em> Flags, configuración, listas de permitidos. <em>Qué no hace:</em> No es un contador: eventual y sin operaciones atómicas. <em>Plan gratuito:</em> 100.000 lecturas y 1.000 escrituras por día. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/kv.html?lang=es">Lección 16 · KV: leer rápido, escribir eventual</a></dd><dt id="bp-text-d1">D1 · DB, SQLite</dt><dd>Una base SQL administrada con el SQL de SQLite. <em>Para qué sirve:</em> Tablas que el borde lee y escribe: las cotizaciones de Rumbo. <em>Qué no hace:</em> No es tu base relacional grande: una principal por base. <em>Plan gratuito:</em> 10 bases, 5 GB, 5 millones de filas leídas por día. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/d1.html?lang=es">Lección 17 · D1: SQLite en el borde</a></dd><dt id="bp-text-r2">R2 · PROOFS</dt><dd>Almacenamiento de objetos con una API compatible con S3. <em>Para qué sirve:</em> Archivos que leen muchos: los comprobantes de entrega. <em>Qué no hace:</em> Sin costo de salida, pero se cuentan el almacenamiento y las operaciones. <em>Plan gratuito:</em> 10 GB-mes, 1 millón Clase A, 10 millones Clase B por mes. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/r2.html?lang=es">Lección 18 · R2: objetos sin costo de salida</a></dd><dt id="bp-text-cacheapi">Cache API · caches.default</dt><dd>La cache de un data center, desde tu código: caches.default, con match, put y delete. <em>Para qué sirve:</em> Guardar lo que calculó el Worker, bajo una clave que elige: las tarifas de Rumbo. <em>Qué no hace:</em> No se replica: delete purga solo este data center. <em>Plan gratuito:</em> Cualquier plan. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/cache-key-traps.html?lang=es">Lección 11 · La clave de cache y sus trampas</a>, <a href="lessons/cache-from-a-worker.html?lang=es">Lección 12 · Cache desde un Worker</a></dd><dt id="bp-text-ratelimit">Rate limit · LIMITER</dt><dd>Un contador por clave en una ventana de 10 o 60 segundos, desde el Worker. <em>Para qué sirve:</em> Un presupuesto por API key, usuario o tenant. <em>Qué no hace:</em> No es exacto: por lugar y eventualmente consistente. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/rate-limiting.html?lang=es">Lección 14 · Rate limiting</a></dd><dt id="bp-text-cron">Cron Trigger · 0 3 * * *, UTC</dt><dd>Un horario que corre el handler scheduled. <em>Para qué sirve:</em> El cierre diario de Rumbo a las 03:00 UTC. <em>Qué no hace:</em> No en tu zona horaria: en UTC. Los cambios tardan hasta 15 minutos. <em>Plan gratuito:</em> 5 Cron Triggers por cuenta. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/cron-and-events.html?lang=es">Lección 24 · Cron y eventos de la plataforma</a></dd><dt id="bp-text-dobj">Durable Object · SHIPMENTS</dt><dd>Una instancia de tu clase, una por id, en un lugar. <em>Para qué sirve:</em> Contadores, estado en vivo, coordinación: una llamada por vez. <em>Qué no hace:</em> No es una tabla global: un objeto hace hacer cola a todos. <em>Plan gratuito:</em> Solo backend SQLite; 5 GB en total. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/durable-objects.html?lang=es">Lección 19 · Durable Objects: un lugar por cosa</a>, <a href="lessons/do-alarms-websockets.html?lang=es">Lección 20 · Durable Objects en el tiempo</a></dd><dt id="bp-text-queue">Queue · MOVES</dt><dd>Mensajes de un productor a un consumidor, en lotes. <em>Para qué sirve:</em> Responder ahora, trabajar después, absorber ráfagas. <em>Qué no hace:</em> No es exactamente una vez: los duplicados son raros pero posibles. <em>Plan gratuito:</em> 10.000 operaciones por día, 24 horas de retención. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></dd><dt id="bp-text-workflow">Workflow · RETURNS</dt><dd>Un proceso de pasos cuyos resultados se guardan. <em>Para qué sirve:</em> Devoluciones que esperan días a una persona, con reintentos por paso. <em>Qué no hace:</em> No es lugar para cálculo pesado: cada paso es una invocación de Worker. <em>Plan gratuito:</em> 3.000 pasos por día. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/workflows.html?lang=es">Lección 23 · Workflows: pasos que sobreviven</a></dd><dt id="bp-text-hyperdrive">Hyperdrive · PG, a tu Postgres</dt><dd>Un pool y una cache de consultas entre Workers y tu propia base. <em>Para qué sirve:</em> Llegar a PostgreSQL desde muchos data centers sin una conexión por pedido. <em>Qué no hace:</em> No replica tus datos, ni invalida su cache cuando hay escrituras. <em>Plan gratuito:</em> 100.000 consultas por día. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/hyperdrive.html?lang=es">Lección 21 · Hyperdrive: tu Postgres desde el borde</a></dd><dt id="bp-text-wrangler">Wrangler · 4.162.0</dt><dd>La línea de comandos de Workers. <em>Para qué sirve:</em> dev, deploy, versions, tail, d1, kv, r2. <em>Qué no hace:</em> Se está pasando a cf, en beta abierta desde el 28 de septiembre de 2026. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/wrangler-and-config.html?lang=es">Lección 06 · Wrangler y la configuración</a>, <a href="lessons/deploy-and-observe.html?lang=es">Lección 09 · Desplegar y observar</a></dd><dt id="bp-text-kit">El kit · wrangler dev</dt><dd>wrangler dev en Docker, con el origen y la base de Rumbo. <em>Para qué sirve:</em> Cada lección, sin cuenta. <em>Qué no hace:</em> Sin anycast, sin zona, sin Workers Cache, sin pool en Hyperdrive. <em>Plan gratuito:</em> Gratis: corre en tu máquina. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/testing-a-worker.html?lang=es">Lección 08 · Probar un Worker</a></dd><dt id="bp-text-cloudflared">cloudflared, Tunnel · conexiones salientes hacia Cloudflare</dt><dd>El programa al lado de tu servicio que abre el túnel. <em>Para qué sirve:</em> Publicar sin puerto de entrada ni IP pública. <em>Qué no hace:</em> No cierra otras entradas. <em>Plan gratuito:</em> Todos los planes. <em>En el kit:</em> En parte: el kit corre un reemplazo, y las lecciones muestran el resto. <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a></dd><dt id="bp-text-api">API de Rumbo · Spring Boot 4.1 sobre Java 25: el origen, y su panel</dt><dd>La API de Spring Boot de Rumbo: el origen. <em>Para qué sirve:</em> El negocio: envíos, movimientos, el panel. <em>Qué no hace:</em> No confía ciegamente en el borde: valida tokens. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/access-identity.html?lang=es">Lección 15 · Access: identidad antes del origen</a>, <a href="lessons/queues.html?lang=es">Lección 22 · Queues: al menos una vez</a></dd><dt id="bp-text-postgres">PostgreSQL 18 · envíos, movimientos</dt><dd>La base del origen. <em>Para qué sirve:</em> La fuente de verdad de los envíos. <em>Qué no hace:</em> No está en Cloudflare: llegan Hyperdrive y el origen. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/hyperdrive.html?lang=es">Lección 21 · Hyperdrive: tu Postgres desde el borde</a></dd><dt id="bp-text-openport">Puerto abierto · ilustrativo</dt><dd>Un puerto público en el que el origen sigue escuchando. <em>Para qué sirve:</em> Nada: es el riesgo que deja el túnel si te olvidás. <em>Qué no hace:</em> Cloudflare no protege pedidos que nunca le llegan. <em>En el kit:</em> Corre en el kit, sin cuenta. <a href="lessons/origin-without-open-ports.html?lang=es">Lección 04 · Un origen sin puertos abiertos</a></dd></dl></section><section><h3>Qué viaja</h3><dl><dt>R · Pedido</dt><dd>Un pedido HTTP: un método, una ruta y encabezados, y a veces un cuerpo. <em>De dónde viene:</em> Un cliente: un navegador, la tienda, un transportista, una empleada, el lab. <em>Dónde termina:</em> Primero el borde; el origen solo si el borde lo deja seguir.</dd><dt>A · Respuesta</dt><dd>La respuesta, con los encabezados que sumó cada pieza: x-rumbo-via, cf-cache-status, cf-ray. <em>De dónde viene:</em> El origen, el Worker o la cache. <em>Dónde termina:</em> El cliente, de vuelta por el tramo 1.</dd><dt>C · Copia guardada</dt><dd>Una respuesta guardada para contestar el pedido siguiente sin correr el Worker ni llamar al origen. <em>De dónde viene:</em> Una respuesta cuyo Cache-Control lo permite. <em>Dónde termina:</em> La cache delante del Worker, o la Cache API de un data center.</dd><dt>J · JWT firmado</dt><dd>Quién es la persona, firmado: iss, aud, email y un vencimiento, en el encabezado Cf-Access-Jwt-Assertion. <em>De dónde viene:</em> Access, después de un login y una política; en el kit, el emisor de prueba del curso. <em>Dónde termina:</em> El origen, que lo valida por su cuenta.</dd><dt>M · Movimiento</dt><dd>Un mensaje: id de evento, envío y estado, entregado al menos una vez. <em>De dónde viene:</em> El webhook de un transportista, a través del Worker. <em>Dónde termina:</em> La cola, su consumidor, el origen y el objeto del envío.</dd><dt>F · Flag</dt><dd>Un valor en KV: la flag de mantenimiento, el último pedido, el cierre diario. <em>De dónde viene:</em> Wrangler, el Worker, o su handler scheduled. <em>Dónde termina:</em> Cada data center que la lee, eventualmente.</dd><dt>S · Estado del objeto</dt><dd>El estado de un Durable Object: un contador, o un envío con su estado y quienes lo miran. <em>De dónde viene:</em> Llamadas a ese objeto, de a una. <em>Dónde termina:</em> El almacenamiento del objeto, fuertemente consistente.</dd><dt>W · Instancia de devolución</dt><dd>Una ejecución del Workflow de devoluciones, con un id y la salida guardada de cada paso. <em>De dónde viene:</em> Un pedido para empezar una devolución. <em>Dónde termina:</em> El Workflow, hasta que termina cada paso.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
