name: prumathe-entra
services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: course_admin
      POSTGRES_PASSWORD: local-admin-only
    volumes:
      - entra-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U course_admin -d procurement]
      interval: 5s
      timeout: 3s
      retries: 20
  issuer:
    image: node:24.22.0-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    working_dir: /lab
    command: [node, issuer.mjs]
    volumes:
      - ./fixture/issuer.mjs:/lab/issuer.mjs:ro
    ports: ["127.0.0.1:18096:9000"]
  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/procurement
      DB_USER: app_runtime
      DB_PASSWORD: local-runtime-only
      AUTH_MODE: ${AUTH_MODE:-fixture}
      TENANT_ID: ${TENANT_ID:-11111111-1111-4111-8111-111111111111}
      API_CLIENT_ID: ${API_CLIENT_ID:-22222222-2222-4222-8222-222222222222}
      SPA_CLIENT_ID: ${SPA_CLIENT_ID:-33333333-3333-4333-8333-333333333333}
    ports: ["127.0.0.1:18095:8080"]
    depends_on:
      db: {condition: service_healthy}
      issuer: {condition: service_started}
volumes:
  entra-data:
