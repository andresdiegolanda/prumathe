<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Big picture · Microsoft Entra from scratch | Prumathe</title><meta name="description" content="From Windows sign-in to a protected row: every piece of the course on one scene, and journeys that follow a request stop by stop."><link rel="icon" href="assets/favicon.svg"><script src="assets/theme.js"></script><link rel="stylesheet" href="assets/course.css"><link rel="stylesheet" href="assets/big-picture.css"></head><body class="bp-page"><div id="bp"></div><noscript><main class="bp-noscript"><h2>Big picture</h2><p>From Windows sign-in to a protected row</p><p>One purchase request, from Alice&#39;s browser to a row in PostgreSQL, and every piece that can say no on the way. Entra issues the evidence, Spring checks it, PostgreSQL checks again. On a Windows device joined to Entra the story starts earlier: Windows gets a token for the device before the app is opened.</p><p>Pick a journey: the dot is the request and its letters are what it carries. Each stop says what is decided there and which lesson goes deeper. Click any piece for its card.</p><p>Tags say how to see a stop for yourself: KIT in the local lab, TENANT with a real Entra tenant, WINDOWS on a device joined to that tenant, MODEL only in the lessons.</p><section class="bp-text-journey"><h3>A · Sign in: a code and PKCE</h3><p>a code worth nothing alone</p><ol><li><strong>Alice</strong>: Alice opens the app and chooses Sign in. Nothing has been checked yet: the page is public code running in her browser. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Angular app</strong>: The app calls loginRedirect with the API&#39;s two scopes. It will never see Alice&#39;s password. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL makes a fresh verifier, hashes it into an S256 challenge and keeps the verifier in this tab. It adds a state and a nonce to tie the answer to this request. The kit tests the hash relationship only: a different verifier never reproduces the challenge. <em>What the dot carries: PKCE verifier.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a> <code>node lab.mjs pkce</code></li><li><strong>Sign-in endpoint</strong> <span class="bp-text-stamp">[signed in]</span>: The tab goes to the tenant&#39;s /authorize with the client ID, the redirect URI, the scopes and the challenge. Entra signs Alice in and applies the tenant&#39;s policies. Only the challenge travels here. The verifier never leaves the browser until redemption. <em>What the dot carries: PKCE verifier.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a></li><li><strong>App registrations</strong> <span class="bp-text-stamp">[URI ✓]</span>: Entra checks the request against the registrations: is this redirect URI registered for this client, and does the API expose these scopes? <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=en">Lesson 04 · Two registrations, one application experience</a></li><li><strong>Sign-in endpoint</strong>: If consent is needed, Entra asks for it. Then it redirects to /redirect with a one-time authorization code. <em>What the dot carries: Authorization code.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a></li><li><strong>MSAL Browser</strong>: The /redirect page runs only the MSAL bridge, which hands the code to the app&#39;s MSAL instance. A captured code is useless without the verifier. <em>What the dot carries: Authorization code, PKCE verifier.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[S256 ✓]</span>: MSAL redeems the code with the original verifier. Entra hashes the verifier and compares it with the challenge it saw at /authorize. <em>What the dot carries: Authorization code, PKCE verifier.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a></li><li><strong>Signing keys</strong>: Entra signs the new tokens with its private key. Only the public half is ever published. <span class="bp-text-tag">Tenant</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></li><li><strong>Token endpoint</strong>: Three tokens come back: an ID token for the app, an access token for the purchase API and a refresh token for MSAL. <em>What the dot carries: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/three-token-jobs.html?lang=en">Lesson 06 · Three token jobs</a></li><li><strong>MSAL Browser</strong>: MSAL matches the answer with the state and nonce it sent, sets Alice as the active account and stores the three tokens. <em>What the dot carries: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Token cache</strong>: They wait in this tab&#39;s sessionStorage: gone when the tab closes, but readable by any script running in this origin. <em>What the dot carries: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li></ol><p><strong>End of the journey:</strong> Alice is signed in to the app and MSAL holds three tokens. Nothing has reached the API yet: a sign-in is not an authorization. Journey B sends the first request.</p></section><section class="bp-text-journey"><h3>B · Read my own request: 200</h3><p>four checks, then one row</p><ol><li><strong>Angular app</strong>: Alice asks for request 41. Before calling the API, the app asks MSAL for a token for exactly the API&#39;s scopes. In the kit, fixture mode, the app asks the token dispenser instead; from the API boundary on, everything is the same. <span class="bp-text-tag">Kit</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>MSAL Browser</strong>: acquireTokenSilent looks in the cache first, for this account and these scopes. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Token cache</strong>: A valid access token for this API is there. No network call is needed. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL hands it to the app. Had it expired, MSAL would renew it with the refresh token: journey H. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Angular app</strong>: The app attaches the token to one fixed URL, http://localhost:18095/api/requests/41, and to no other destination. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>CORS and bearer filter</strong>: First CORS: the browser&#39;s preflight asks whether localhost:18094 may send an Authorization header, and the API names that exact origin. Then the bearer filter takes the token. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a> <code>node lab.mjs cors</code></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[valid]</span>: The decoder checks the signature with the cached public key, then issuer, expiry and not-before, audience, tenant, version 2.0, the allowed client and a well-formed oid. <em>What the dot carries: Access token, Public signing keys.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a> <code>node lab.mjs tokens</code></li><li><strong>Authorities converter</strong>: Claims become authorities: scp gives SCOPE_Requests.Read and SCOPE_Requests.Approve. Alice has no role, so there is no ROLE_Approver. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[scope ✓]</span>: Reading needs SCOPE_Requests.Read. Alice has it. <span class="bp-text-tag">Kit</span> <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a></li><li><strong>Controller</strong>: In one transaction, the controller sets app.tenant and app.subject from tid and oid, and app.approver from the role. All three are transaction-local. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></li><li><strong>Connection pool</strong>: It borrows one of three pooled connections. Every one of them is app_runtime, never the administrator. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=en">Lesson 15 · PostgreSQL authenticates the API</a></li><li><strong>app_runtime</strong>: PostgreSQL authenticates app_runtime: no superuser, no BYPASSRLS, SELECT and UPDATE of the status column only. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=en">Lesson 15 · PostgreSQL authenticates the API</a> <code>node lab.mjs database</code></li><li><strong>RLS policy</strong> <span class="bp-text-stamp">[RLS ✓]</span>: The SQL already says id = 41 and tenant and owner from the token. The policy adds its own condition: same tenant, and owner or approver. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a> <code>node lab.mjs rls</code></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[1 row]</span>: Row 41 is Alice&#39;s, in Alice&#39;s tenant: it matches both the query and the policy. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a></li><li><strong>Controller</strong>: The row comes back. COMMIT ends the transaction, and the context disappears with it. <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></li><li><strong>Angular app</strong> <span class="bp-text-stamp">[200]</span>: HTTP 200 with request 41. The app shows it; it decided nothing. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a> <code>node lab.mjs boundary</code></li></ol><p><strong>End of the journey:</strong> One read crossed four independent checks: the token, the operation, the endpoint&#39;s query and the row policy. Removing any one of them is a test that should fail.</p></section><section class="bp-text-journey"><h3>C · Approve a colleague&#39;s request</h3><p>200 once, then 404</p><ol><li><strong>node lab.mjs</strong>: The lab asks for the approver case: Alice&#39;s identity, with the Approver role. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a> <code>node lab.mjs atomic</code></li><li><strong>Token dispenser</strong>: The dispenser signs it with the kit&#39;s key: scp lists both scopes, roles lists Approver. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a></li><li><strong>node lab.mjs</strong>: Two POST /api/requests/42/approve leave at the same moment. Request 42 is Bob&#39;s, and PENDING. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></li><li><strong>CORS and bearer filter</strong>: No browser, so no Origin and no preflight: CORS plays no part. The bearer filter takes the token. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[valid]</span>: In fixture mode the decoder trusts the kit&#39;s key, and only it. Signature, issuer, time and contract: valid. <em>What the dot carries: Test token, Public signing keys.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></li><li><strong>Authorities converter</strong>: SCOPE_Requests.Approve from scp, and ROLE_Approver from roles. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[scope + role ✓]</span>: Approval needs SCOPE_Requests.Approve and ROLE_Approver, both. An OR here would let an app-only token act as a person. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a></li><li><strong>Controller</strong>: One statement checks and changes together: UPDATE purchase_request SET status = &#39;APPROVED&#39; WHERE id = 42 AND the tenant matches AND owner_oid is not the caller AND status = &#39;PENDING&#39;. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></li><li><strong>RLS policy</strong> <span class="bp-text-stamp">[WITH CHECK ✓]</span>: Through a pooled app_runtime connection. The policy&#39;s WITH CHECK lets an approver change a row of their tenant. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[1 row, then 0]</span>: The first UPDATE turns 42 into APPROVED. The second finds no PENDING row: 0 rows changed. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></li><li><strong>Controller</strong> <span class="bp-text-stamp">[200 and 404]</span>: One row changed: 200 APPROVED. No row: 404, the same answer as for a request that does not exist. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[200 + 404]</span>: The lab sees exactly one 200 and one 404, and PostgreSQL says APPROVED. Approving her own request 41 also gives 404: the owner may not approve. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a> <code>node lab.mjs roles</code></li></ol><p><strong>End of the journey:</strong> A role is one condition among several. The method rule checks scope and role; one SQL statement checks tenant, not-the-owner and PENDING together, so a race cannot approve twice.</p></section><section class="bp-text-journey"><h3>D · 401: the token is not accepted</h3><p>nine broken tokens, one gate</p><ol><li><strong>node lab.mjs</strong>: The lab asks the dispenser for broken tokens, one case at a time. <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a> <code>node lab.mjs signature</code></li><li><strong>Token dispenser</strong>: Each case breaks one thing: expired, valid only in the future, signed by a stranger&#39;s key, another issuer, another audience, an ID token, another client, no oid, another tenant. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></li><li><strong>node lab.mjs</strong>: Each one goes out as GET /api/requests/41. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>CORS and bearer filter</strong>: The bearer filter passes the token to the decoder. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[rejected]</span>: Each case fails exactly one check: signature, issuer, exp or nbf, aud (the ID token too: its audience is the SPA), tid, azp or oid. Reading a payload proves nothing: the decoder verifies before it trusts a single claim, and its keys come from configuration, never from the token. <em>What the dot carries: Test token, Public signing keys.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a> <code>node lab.mjs time</code></li><li><strong>CORS and bearer filter</strong> <span class="bp-text-stamp">[401]</span>: The filter chain answers 401 with WWW-Authenticate: Bearer. No controller ran and no SQL was sent. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a> <code>node lab.mjs http</code></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[401 ✓]</span>: The lab expects 401 for every case, and still 200 for Alice&#39;s valid token. <span class="bp-text-tag">Kit</span> <a href="lessons/debug-without-leaking.html?lang=en">Lesson 22 · Debug without leaking credentials</a> <code>node lab.mjs audience</code></li></ol><p><strong>End of the journey:</strong> 401 means the API did not accept the credential. Signing in again does not fix a wrong audience: configuration does. Every fix keeps its negative test.</p></section><section class="bp-text-journey"><h3>E · 403: accepted, not allowed</h3><p>a genuine token missing one authority</p><ol><li><strong>node lab.mjs</strong>: Two genuine tokens that each lack something: no-role has the scopes but not Approver; app-only has Approver but no scp, because no user signed in. <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a> <code>node lab.mjs delegation</code></li><li><strong>Token dispenser</strong>: Both are signed with the kit&#39;s key, for the right audience, tenant and client. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></li><li><strong>node lab.mjs</strong>: Each one asks to approve request 42. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>CORS and bearer filter</strong>: The bearer filter takes the token. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[valid]</span>: Both pass every check. Authentication succeeds. <em>What the dot carries: Test token, Public signing keys.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></li><li><strong>Authorities converter</strong>: no-role yields only SCOPE_ authorities. app-only yields ROLE_Approver and no SCOPE_ at all. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[403]</span>: Approval needs SCOPE_Requests.Approve and ROLE_Approver. Each token misses one of the two. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a> <code>node lab.mjs roles</code></li><li><strong>CORS and bearer filter</strong> <span class="bp-text-stamp">[403]</span>: The filter chain turns the refusal into 403. The controller never ran. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[403 ✓]</span>: Both get 403. A token with only Requests.Read gets 403 to approve and still 200 to read: scopes are per operation. <span class="bp-text-tag">Kit</span> <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a> <code>node lab.mjs scopes</code></li></ol><p><strong>End of the journey:</strong> 403: the API knows who is calling and refuses this operation. A hidden button never protected anything; this rule does.</p></section><section class="bp-text-journey"><h3>F · 404: Alice asks for Bob&#39;s request</h3><p>identity from the token, never the URL</p><ol><li><strong>Angular app</strong>: Alice types 42 instead of 41. The page lets her: the input is not the boundary. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a></li><li><strong>CORS and bearer filter</strong>: A genuine token for Alice reaches the API. <em>What the dot carries: Test token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[scope ✓]</span>: Valid, with SCOPE_Requests.Read: the operation is allowed. Allowed to read is not allowed to read everything. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>Controller</strong>: The id comes from the URL; tenant and owner come only from the token: WHERE id = 42 AND tenant_id = tid AND owner_oid = Alice&#39;s oid. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a></li><li><strong>RLS policy</strong>: Even a query that forgot its WHERE would be filtered here: the row is not Alice&#39;s, and she is not an approver. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[0 rows]</span>: No row matches. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a></li><li><strong>Controller</strong> <span class="bp-text-stamp">[404]</span>: No row: 404, the same answer as for a number that does not exist, so the API does not reveal which requests exist. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a></li><li><strong>Angular app</strong> <span class="bp-text-stamp">[404]</span>: Alice sees 404. Bob, with his own token, gets 200 for 42. Request 43 lives in another tenant: Alice gets 404 for it, and a token from that tenant gets 401. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a> <code>node lab.mjs owner</code></li></ol><p><strong>End of the journey:</strong> Ownership is an authorization rule, enforced with identity taken from the validated token and never from the request. RLS repeats it underneath.</p></section><section class="bp-text-journey"><h3>G · RLS, the second boundary</h3><p>the database without the API</p><ol><li><strong>node lab.mjs</strong>: The lab connects to PostgreSQL directly and switches to app_runtime, the role the API uses. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a> <code>node lab.mjs rls</code></li><li><strong>RLS policy</strong> <span class="bp-text-stamp">[0 rows]</span>: No context has been set, so the policy compares tenant_id with NULL: no row qualifies. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[count 0]</span>: SELECT count(*) returns 0. Not an error: an empty, safe answer. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>RLS policy</strong>: Now inside a transaction with Alice&#39;s tenant and subject set, the lab runs a SELECT with no WHERE at all. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[41 only]</span>: Only row 41 comes back. Bob&#39;s 42 and the other tenant&#39;s 43 stay invisible. <em>What the dot carries: Transaction context.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></li><li><strong>RLS policy</strong> <span class="bp-text-stamp">[context gone]</span>: After COMMIT, the same connection sees 0 rows again: set_config(name, value, true) belonged to that transaction only. <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a> <code>node lab.mjs pool</code></li><li><strong>app_runtime</strong> <span class="bp-text-stamp">[no bypass]</span>: And the role itself is neither superuser nor BYPASSRLS, the table forces RLS, and app_runtime may not rewrite owner_oid. <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=en">Lesson 15 · PostgreSQL authenticates the API</a> <code>node lab.mjs database</code></li></ol><p><strong>End of the journey:</strong> RLS is a second boundary, not the first: it trusts the context the API sets. What it buys is that a forgotten WHERE returns nothing instead of everything.</p></section><section class="bp-text-journey"><h3>H · A removed role meets an older token</h3><p>expiry, renewal and sign-out</p><ol><li><strong>Administrator</strong>: Alice approved requests yesterday. Today the administrator removes her Approver assignment. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Enterprise applications</strong>: The assignment is gone from the API&#39;s enterprise application. Nothing is pushed to tokens already issued. <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[next tokens]</span>: Entra will leave roles: Approver out of the next access token it issues for Alice. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Token cache</strong>: Meanwhile, Alice&#39;s cached access token still says roles: Approver, and stays valid until its exp. <em>What the dot carries: Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[still allowed]</span>: Her next approval arrives with that token. The API validates locally: signature, time and claims are fine, and the old role still passes. Spring does not re-read assignments on every request. Faster withdrawal has to be designed: shorter lifetimes, a check against a source of truth, or continuous access evaluation where it applies. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>MSAL Browser</strong>: Later the access token expires. Before the next call, acquireTokenSilent sees that and uses the refresh token. <em>What the dot carries: Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[no role]</span>: Entra issues a new access token. The assignment is gone, so roles is empty. <em>What the dot carries: Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/three-token-jobs.html?lang=en">Lesson 06 · Three token jobs</a></li><li><strong>MSAL Browser</strong>: MSAL caches the new token and gives it to the app. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Method rule</strong> <span class="bp-text-stamp">[403]</span>: The same approval now gets 403: the token is valid, the role is not in it. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a></li><li><strong>Angular app</strong>: Alice signs out. logoutRedirect clears MSAL&#39;s cache for her account. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li><li><strong>Sign-in endpoint</strong> <span class="bp-text-stamp">[session ended]</span>: Entra ends her session at its sign-out endpoint. Tokens already issued are not recalled: they stay valid until they expire. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li></ol><p><strong>End of the journey:</strong> Three different things: a token&#39;s lifetime, a session and an assignment. Renewal connects them; nothing withdraws a token already issued, so lifetimes matter.</p></section><section class="bp-text-journey"><h3>I · Set up the tenant</h3><p>two registrations, consent, one role</p><ol><li><strong>Administrator</strong>: In the Entra admin center, the administrator registers two applications, not one: the token&#39;s recipient must be visible. <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=en">Lesson 04 · Two registrations, one application experience</a></li><li><strong>App registrations</strong>: The API registration: Application ID URI api://API_CLIENT_ID, delegated scopes Requests.Read and Requests.Approve, the user app role Approver, v2 access tokens. The SPA registration: a public client with the redirect URI http://localhost:18094/redirect, no secret. <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=en">Lesson 04 · Two registrations, one application experience</a></li><li><strong>Enterprise applications</strong>: Each registration gets a service principal in the tenant: its enterprise application. <span class="bp-text-tag">Tenant</span> <a href="lessons/tenant-app-principal.html?lang=en">Lesson 03 · Tenant, application, service principal</a></li><li><strong>Enterprise applications</strong>: There the administrator assigns Approver to one test user, and grants consent if users may not consent themselves. <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[scp, roles]</span>: From now on, an access token for that user and this API lists the consented scopes in scp and Approver in roles. <span class="bp-text-tag">Tenant</span> <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a></li><li><strong>Signing keys</strong>: Spring will verify those tokens with the keys published for the fixed tenant issuer. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=en">Lesson 19 · Connect a real Entra tenant</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[Entra mode]</span>: With AUTH_MODE=entra, the decoder trusts only https://login.microsoftonline.com/TENANT_ID/v2.0 and its keys. The kit&#39;s key is no longer trusted. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=en">Lesson 19 · Connect a real Entra tenant</a> <code>node configure.mjs entra TENANT_ID SPA_CLIENT_ID API_CLIENT_ID ALICE_OID BOB_OID</code></li><li><strong>Token dispenser</strong> <span class="bp-text-stamp">[401]</span>: A test token now gets 401. The probe proves the switch, not that a real person signed in. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=en">Lesson 19 · Connect a real Entra tenant</a> <code>node tenant-probe.mjs</code></li></ol><p><strong>End of the journey:</strong> Registrations are configuration, not proof. The tenant workbook records only what you observed: a sign-in, an own read, a role denial and a permitted approval.</p></section><section class="bp-text-journey"><h3>J · What CORS and PKCE do not stop</h3><p>a script inside, a caller outside</p><ol><li><strong>Injected script</strong>: A script slips into the page through unsafe rendering or a compromised dependency. It runs with the page&#39;s origin. <span class="bp-text-tag">Model</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>MSAL Browser</strong> <span class="bp-text-stamp">[same origin]</span>: It can ask MSAL for a token just as the app does. PKCE protected the code exchange; it does nothing against code already running in the page. <span class="bp-text-tag">Model</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>Injected script</strong>: Now it holds a valid access token. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Model</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>Angular app</strong>: Or it simply drives the app&#39;s own code to send requests. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Model</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>CORS and bearer filter</strong> <span class="bp-text-stamp">[looks valid]</span>: The API sees a valid token from an allowed origin. Nothing distinguishes this request from Alice&#39;s own. Defenses: a strict CSP, safe rendering, maintained dependencies. A backend for frontend keeps tokens on a server behind an HttpOnly cookie, yet a script can still act through that session. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Model</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[no Origin]</span>: CORS is a rule that browsers follow. The lab calls with no Origin header at all, and the API answers as it would anyone: 401 without a token, 200 with a valid one. <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a> <code>node lab.mjs cors</code></li><li><strong>CORS and bearer filter</strong> <span class="bp-text-stamp">[preflight 403]</span>: A preflight from https://stranger.invalid gets 403: a browser would block that page. CORS never replaced the token. <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a> <code>node lab.mjs cors</code></li></ol><p><strong>End of the journey:</strong> CORS and PKCE each close one door. Neither protects the API from a caller that holds a valid token: validation and authorization do, and prevention keeps scripts out.</p></section><section class="bp-text-journey"><h3>K · Another API, another audience</h3><p>no forwarding; on-behalf-of</p><ol><li><strong>Controller</strong>: Suppose the controller must read Alice&#39;s manager from Microsoft Graph. <span class="bp-text-tag">Model</span> <a href="lessons/workloads-and-downstream-apis.html?lang=en">Lesson 20 · Users, workloads and downstream APIs</a></li><li><strong>Another API</strong> <span class="bp-text-stamp">[wrong aud]</span>: Forwarding the incoming token fails: its audience is the purchase API, and Graph must reject it. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Model</span> <a href="lessons/workloads-and-downstream-apis.html?lang=en">Lesson 20 · Users, workloads and downstream APIs</a></li><li><strong>Controller</strong>: The right design: a confidential middle tier uses the on-behalf-of flow at Entra&#39;s token endpoint to get a token whose audience is Graph. <span class="bp-text-tag">Model</span> <a href="lessons/workloads-and-downstream-apis.html?lang=en">Lesson 20 · Users, workloads and downstream APIs</a></li><li><strong>Another API</strong> <span class="bp-text-stamp">[not in the kit]</span>: That token is for Graph, under Graph&#39;s consent. A nightly job with no user would instead use client credentials and its own endpoint policy. <span class="bp-text-tag">Model</span> <a href="lessons/workloads-and-downstream-apis.html?lang=en">Lesson 20 · Users, workloads and downstream APIs</a></li></ol><p><strong>End of the journey:</strong> A token is for one audience. Reaching another API on the user&#39;s behalf is a separate design, with its own consent and threat model; the kit leaves it as an exercise.</p></section><section class="bp-text-journey"><h3>L · Windows sign-in: the PRT</h3><p>the device gets a token first</p><ol><li><strong>Alice</strong>: Alice signs in to Windows on a device joined to the tenant, with her work password or with Windows Hello for Business. No app is open yet. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>CloudAP</strong>: LogonUI hands the credentials to LSA, which passes them to CloudAP and its Microsoft Entra plugin. The plugin gets a nonce from Entra and builds a request with the credentials and the nonce. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>TPM</strong>: The request is signed with the private device key, inside the TPM. The key never leaves it. <em>What the dot carries: Device keys.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[device ✓]</span>: Entra checks the credentials, the nonce and the signature against the public device key, and that the device is valid in the tenant. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Devices</strong>: It issues the PRT, and a session key encrypted with the device&#39;s public transport key. A sign-in with Windows Hello for Business gives the PRT an MFA claim, refreshed together with the PRT. <em>What the dot carries: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>CloudAP</strong>: Both reach CloudAP. Only this device can open the session key: that needs the private transport key. <em>What the dot carries: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>TPM</strong>: The TPM decrypts the session key with the transport key and wraps it again with its own key. <em>What the dot carries: Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>CloudAP</strong> <span class="bp-text-stamp">[PRT cached]</span>: CloudAP stores the PRT and the wrapped session key in its cache, inside LSA. Nothing has reached the browser. Run as the signed-in user, dsregcmd /status shows AzureAdPrt : YES and when the PRT was last renewed. Its output names the device, the tenant and the user: keep it private. <em>What the dot carries: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a> <code>dsregcmd /status</code></li></ol><p><strong>End of the journey:</strong> Before any app is opened, CloudAP holds a PRT for Alice and a session key that only this TPM can use. Neither ever reaches the browser or the app: journey M shows what the browser gets instead.</p></section><section class="bp-text-journey"><h3>M · Open the app: no password</h3><p>the browser borrows the device session</p><ol><li><strong>Angular app</strong>: On the same device, Alice opens the app in Edge, whose profile is signed in to her work account, and chooses Sign in. <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL makes a verifier and its challenge, as in journey A, and starts loginRedirect with prompt=select_account. <em>What the dot carries: PKCE verifier.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a></li><li><strong>Browser</strong>: The browser navigates the tab to /authorize. It recognizes an Entra sign-in URL and asks Windows for a PRT cookie, passing the nonce from the URL. Edge does this for a profile signed in to the work account; Chrome needs the Microsoft Single Sign On extension. Private windows skip it. <em>What the dot carries: PKCE verifier.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>CloudAP</strong>: CloudAP builds a PRT cookie for that nonce from the PRT in its cache. The PRT itself stays there. <em>What the dot carries: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>TPM</strong>: The TPM signs the PRT cookie with the session key. <em>What the dot carries: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Browser</strong>: The PRT cookie goes back to the browser, not to the page: MSAL and any injected script never see it. <em>What the dot carries: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Sign-in endpoint</strong>: The request reaches /authorize with the client, the scopes and the challenge, and the PRT cookie in the x-ms-RefreshTokenCredential header. <em>What the dot carries: PKCE verifier, PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[device ✓]</span>: Entra validates the session key signature and the nonce, and checks that the device is valid in the tenant. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Sign-in endpoint</strong> <span class="bp-text-stamp">[no password]</span>: Alice is signed in from the device session. The app asked for select_account, so Entra shows its account picker; choosing her account needs no password. Entra returns the code, and a session cookie for its own site. <em>What the dot carries: Authorization code, Entra session cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Browser</strong>: The browser keeps Entra&#39;s session cookie for login.microsoftonline.com, bound to this device, and follows the redirect to /redirect with the code. <em>What the dot carries: Authorization code, Entra session cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>MSAL Browser</strong>: From here it is journey A: the MSAL bridge hands the code over, and MSAL redeems it with the verifier. <em>What the dot carries: Authorization code, PKCE verifier.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[S256 ✓]</span>: Entra checks the verifier against the challenge and issues the ID, access and refresh tokens. <em>What the dot carries: Authorization code, PKCE verifier.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a></li><li><strong>Token cache</strong>: The three tokens land in sessionStorage, exactly as without Windows. The PRT changed how Alice proved who she is, not what the app holds. <em>What the dot carries: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li></ol><p><strong>End of the journey:</strong> Every credential stayed in its place: the PRT and its session key in CloudAP, the PRT cookie on one request, Entra&#39;s session cookie in the browser, the app&#39;s tokens in sessionStorage. The API still receives only an access token for its audience.</p></section><section class="bp-text-journey"><h3>N · A day later: three clocks</h3><p>24 hours, 4 hours, 90 days</p><ol><li><strong>Token cache</strong>: The tab stayed open overnight. Its refresh token was issued yesterday, and a refresh token issued to a SPA lasts 24 hours from issue, a window that does not slide. <em>What the dot carries: Refresh token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>MSAL Browser</strong> <span class="bp-text-stamp">[expired]</span>: acquireTokenSilent finds the access token expired, and the refresh token too. <em>What the dot carries: Refresh token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Sign-in endpoint</strong> <span class="bp-text-stamp">[blocked]</span>: MSAL tries a hidden iframe to /authorize. Where the browser blocks third-party cookies, that silent attempt fails and MSAL raises InteractionRequiredAuthError. <span class="bp-text-tag">Model</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Angular app</strong>: The app answers with an interactive redirect, never with a loop of silent retries. <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></li><li><strong>Browser</strong>: A top-level navigation to /authorize. The browser asks CloudAP for a fresh PRT cookie, for the new nonce. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>CloudAP</strong> <span class="bp-text-stamp">[PRT valid]</span>: The PRT is still good: CloudAP renews it at Windows sign-in every 4 hours, and a PRT stays valid for 90 days while the device is used. <em>What the dot carries: Primary Refresh Token (PRT).</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Sign-in endpoint</strong> <span class="bp-text-stamp">[no password]</span>: With the PRT cookie and Entra&#39;s session cookie, Entra returns a new code without asking for a password. New tokens follow, as in journey M. <em>What the dot carries: PRT cookie, Entra session cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[what ends it]</span>: The PRT stops working when Alice or the device is deleted or disabled in Entra, or when she changes her password, if the PRT came from it. From then on it gets her nothing. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></li><li><strong>Token cache</strong>: None of that reaches tokens already issued: the access token in sessionStorage stays valid until its exp, as in journey H. <em>What the dot carries: Access token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></li></ol><p><strong>End of the journey:</strong> Three clocks run at once: the SPA refresh token (24 hours, not sliding), the PRT (renewed at Windows sign-in every 4 hours, valid 90 days) and each access token&#39;s exp. Losing the PRT stops new sign-ins; it does not withdraw tokens already issued.</p></section><section><h3>Pieces</h3><dl><dt id="bp-text-cache">Token cache · sessionStorage of this tab</dt><dd>Where MSAL keeps the ID, access and refresh tokens, and the PKCE verifier while a sign-in is in flight. Session storage disappears with the tab. <em>What it does not do:</em> It is not a vault: any script running in this origin can read it. Session storage reduces how long tokens persist, not who in the page can reach them. The PRT and Entra&#39;s own session cookie are never here. <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a>, <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></dd><dt id="bp-text-msal">MSAL Browser · PublicClientApplication</dt><dd>Microsoft&#39;s library inside the page. It runs the authorization code flow with PKCE, handles the redirect, caches tokens and renews them silently. <em>What it does not do:</em> It keeps no secret, because a browser cannot, and it makes no business decision. It cannot tell the app&#39;s own code from a script injected into the same page. <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a>, <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a></dd><dt id="bp-text-script">Injected script</dt><dd>Code that should not be in the page: an XSS payload or a compromised dependency. It runs with the page&#39;s origin and with every power the page has. <em>What it does not do:</em> It does not need a password and it does not break PKCE: it acts with what the page can already do. Only prevention addresses it: a strict CSP, safe rendering, maintained dependencies. <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></dd><dt id="bp-text-spa">Angular app · presents, decides nothing</dt><dd>The single-page application on localhost:18094. It loads public configuration, starts sign-in, asks for a token before each call and sends it to one fixed API URL. <em>What it does not do:</em> It enforces no permission. A hidden button is a convenience: anyone can change the bundle, or call the API without it. <a href="lessons/four-boundaries.html?lang=en">Lesson 01 · Four components, four responsibilities</a>, <a href="lessons/angular-and-msal.html?lang=en">Lesson 09 · Angular and MSAL</a></dd><dt id="bp-text-person">Alice · a person with a work account</dt><dd>The person the system acts for. Entra authenticates her when she signs in to Windows on a joined device, and when the app signs her in; after that, the API only ever sees evidence about her: a token with her tenant ID and object ID. <em>What it does not do:</em> She never gives her password to the app, and nothing she can change in her browser decides what she may read or approve. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/authentication-and-authorization.html?lang=en">Lesson 02 · Authentication and authorization</a>, <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-tpm">TPM · private keys</dt><dd>The Trusted Platform Module, a hardware component. It keeps the private device key, which signs the PRT request, and the private transport key, which opens the session key that Entra sends. Then it wraps the session key with a key of its own. <em>What it does not do:</em> It never hands out a private key, and no other component of Windows can use the session key it protects. Where a device has no usable TPM, the keys cannot be bound to hardware. <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-cloudap">CloudAP · in LSA, Entra plugin</dt><dd>The Windows sign-in provider inside the Local Security Authority (LSA). Its Microsoft Entra plugin turns Alice&#39;s Windows sign-in into a PRT, keeps the PRT and the session key in its cache, renews the PRT at Windows sign-in every 4 hours, and builds a PRT cookie when the browser asks for one. <em>What it does not do:</em> It never hands the PRT or the session key to the browser or to an application. Native applications ask WAM, the Windows token broker, which uses the same PRT and keeps their refresh tokens encrypted with DPAPI; this browser app does not. <em>See it:</em> dsregcmd /status, run as the signed-in user: AzureAdPrt : YES under SSO State, and the time of the last renewal. The output names the device, the tenant and the user. <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-browser">Browser · navigation, Entra&#39;s cookies, SSO</dt><dd>The browser itself, not the page. It navigates the tab to Entra and back and keeps Entra&#39;s session cookie for login.microsoftonline.com. On a device joined to Entra, when it opens an Entra sign-in URL it asks Windows for a PRT cookie: Edge does it for a profile signed in to the work account, Chrome through the Microsoft Single Sign On extension. <em>What it does not do:</em> Page scripts, MSAL included, never see the PRT cookie or Entra&#39;s cookies: they belong to another site. Private windows do not ask Windows for a PRT cookie. <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-authorize">Sign-in endpoint · /authorize</dt><dd>Where the browser goes to sign in. Entra authenticates the person, applies the tenant&#39;s policies, asks for consent when needed and returns a one-time code to a registered redirect URI. On a device joined to Entra, the browser can bring a PRT cookie instead of a password. Entra sets its own session cookie; sign-out ends that session at a sibling endpoint. <em>What it does not do:</em> In this flow it never hands tokens to the page, and it does not know the purchase rules: who owns request 42 is not Entra&#39;s business. <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a>, <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a>, <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-devices">Devices · issues the PRT</dt><dd>Entra&#39;s record of each joined device: the public halves of its device key and transport key, registered at join, and whether the device is enabled. When CloudAP signs in, Entra checks the credentials, the nonce and the device signature against it, and issues the PRT with a session key that only that device can open. <em>What it does not do:</em> The app never calls it: only the device&#39;s sign-in broker does. A known device proves which computer is asking, not who may approve a purchase. <a href="lessons/windows-sign-in-and-prt.html?lang=en">Lesson 10 · Windows sign-in and the Primary Refresh Token</a></dd><dt id="bp-text-registrations">App registrations · SPA: redirect URI · API: scopes, role</dt><dd>Two application objects. The API one defines the resource: its Application ID URI, the delegated scopes Requests.Read and Requests.Approve, the user app role Approver and v2 access tokens. The SPA one defines a public client and its redirect URI. <em>What it does not do:</em> A registration is configuration, not proof of anything at runtime. The SPA registration holds no secret, and must not. <a href="lessons/two-registrations.html?lang=en">Lesson 04 · Two registrations, one application experience</a>, <a href="lessons/tenant-app-principal.html?lang=en">Lesson 03 · Tenant, application, service principal</a></dd><dt id="bp-text-tokenep">Token endpoint · /token</dt><dd>Redeems the authorization code with the PKCE verifier, renews with the refresh token, and issues signed tokens: an ID token for the client, an access token for the API. <em>What it does not do:</em> It never sees the API&#39;s requests. Once a token is issued, the API checks it on its own, and nothing recalls it. <a href="lessons/authorization-code-pkce.html?lang=en">Lesson 05 · Follow the authorization code</a>, <a href="lessons/three-token-jobs.html?lang=en">Lesson 06 · Three token jobs</a>, <a href="lessons/token-lifecycle.html?lang=en">Lesson 18 · Expiry, renewal and sign-out</a></dd><dt id="bp-text-keys">Signing keys · JWKS</dt><dd>Entra signs tokens with private keys and publishes the public halves, with the issuer metadata, so any resource can verify a signature. Keys rotate. <em>What it does not do:</em> A public key cannot sign. And a resource finds the keys from its configured issuer, never from a URL written inside a token. <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></dd><dt id="bp-text-enterprise">Enterprise applications · consent, role assignment</dt><dd>The service principals: how each application exists in this tenant. Consent grants, and the assignment of Approver to users, live here. <em>What it does not do:</em> An assignment does not reach into tokens already issued; it shapes the next ones. <a href="lessons/tenant-app-principal.html?lang=en">Lesson 03 · Tenant, application, service principal</a>, <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a>, <a href="lessons/scopes-and-consent.html?lang=en">Lesson 07 · Scopes and consent</a></dd><dt id="bp-text-admin">Administrator · Entra admin center</dt><dd>A person with directory permissions who registers the two applications, grants consent and assigns the Approver role. <em>What it does not do:</em> A directory administrator role is not purchase approval: administering the tenant and approving requests are different authorities. <a href="lessons/two-registrations.html?lang=en">Lesson 04 · Two registrations, one application experience</a>, <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a>, <a href="lessons/connect-a-real-tenant.html?lang=en">Lesson 19 · Connect a real Entra tenant</a></dd><dt id="bp-text-filters">CORS and bearer filter · the front door</dt><dd>The front door of the API. CORS answers preflights for the exact origin localhost:18094; the bearer filter takes the token from the Authorization header and asks the decoder. The chain writes every 401 and 403. <em>What it does not do:</em> There is no session and no cookie login, so CSRF protection is off on purpose. CORS authenticates nobody. <a href="lessons/read-the-http-result.html?lang=en">Lesson 13 · Read a denial correctly</a>, <a href="lessons/browser-threats-and-bff.html?lang=en">Lesson 21 · Browser threats and architecture choices</a></dd><dt id="bp-text-decoder">JwtDecoder · verify, then trust</dt><dd>Verifies the signature with the configured issuer&#39;s public keys, then issuer and time, then the API&#39;s contract: audience, tenant, version 2.0, the allowed client (azp) and a well-formed oid. <em>What it does not do:</em> It never takes an issuer or a key URL from the token, and it does not authorize: a valid token can still get 403 or 404. <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></dd><dt id="bp-text-converter">Authorities converter · scp, roles</dt><dd>Turns the validated token into Spring authorities: each scp value becomes SCOPE_ plus its name, and the recognized role Approver becomes ROLE_Approver. <em>What it does not do:</em> It maps nothing else: no directory role, no group and no browser state becomes a purchase permission. <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></dd><dt id="bp-text-rule">Method rule · @PreAuthorize</dt><dd>One requirement per operation. Read needs SCOPE_Requests.Read. Approve needs SCOPE_Requests.Approve and ROLE_Approver, both. Exact strings, with hasAuthority. <em>What it does not do:</em> It does not know who owns a row: that is the job of the query, and of the policy underneath. <a href="lessons/roles-and-resource-rules.html?lang=en">Lesson 08 · Roles and resource rules</a>, <a href="lessons/claims-to-authorities.html?lang=en">Lesson 12 · From claims to Spring authorities</a></dd><dt id="bp-text-controller">Controller · one transaction, one SQL</dt><dd>Opens a transaction, sets app.tenant, app.subject and app.approver with set_config(name, value, true), and runs one parameterized statement whose tenant and owner come from the validated token. <em>What it does not do:</em> It never takes identity from the URL, a header or the body: only the number of the request comes from the caller. <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a>, <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></dd><dt id="bp-text-pool">Connection pool · 3 connections</dt><dd>Hikari keeps three connections open and lends one for each transaction. Every connection logs in as app_runtime. <em>What it does not do:</em> It does not clear session settings between borrowers: that is why the context is set inside the transaction and dies with it. <a href="lessons/postgres-identity.html?lang=en">Lesson 15 · PostgreSQL authenticates the API</a>, <a href="lessons/transactions-and-pools.html?lang=en">Lesson 17 · Transactions, pools and races</a></dd><dt id="bp-text-runner">node lab.mjs · no browser</dt><dd>The kit&#39;s test runner on your computer. It calls the API with named test tokens, inspects PostgreSQL roles and policies, and asserts every expected status. <em>What it does not do:</em> It refuses to run against Entra mode, and it never tests a real sign-in. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/debug-without-leaking.html?lang=en">Lesson 22 · Debug without leaking credentials</a>, <a href="lessons/capstone.html?lang=en">Lesson 24 · Capstone: defend one request</a></dd><dt id="bp-text-dispenser">Token dispenser · :18096</dt><dd>A tiny service that signs JWTs with the kit&#39;s own key, one per named case: alice, bob, approver, expired, forged, no-scope, app-only and more. It serves that public key as /jwks, and in fixture mode the Angular app asks it for tokens instead of MSAL. <em>What it does not do:</em> It is not an OpenID provider and not Entra: it authenticates nobody. Never expose it beyond your machine. <a href="lessons/before-you-start.html?lang=en">Lesson 00 · Before you start</a>, <a href="lessons/validate-the-token.html?lang=en">Lesson 11 · Validate before trusting</a></dd><dt id="bp-text-graph">Another API · Microsoft Graph</dt><dd>A downstream resource with its own audience and its own permissions. <em>What it does not do:</em> It must not accept a token issued for the purchase API. The kit makes no downstream call. <a href="lessons/workloads-and-downstream-apis.html?lang=en">Lesson 20 · Users, workloads and downstream APIs</a></dd><dt id="bp-text-table">purchase_request · 41 Alice · 42 Bob · 43 another tenant</dt><dd>The practice rows: 41 is Alice&#39;s, 42 is Bob&#39;s, 43 belongs to another tenant. Each has a tenant, an owner oid and a status, PENDING or APPROVED. <em>What it does not do:</em> Nothing in a row says who may see it: the query and the policy decide that. <a href="lessons/ownership-and-idor.html?lang=en">Lesson 14 · Ownership is an authorization rule</a>, <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></dd><dt id="bp-text-role">app_runtime · no BYPASSRLS</dt><dd>The database principal of the API: neither superuser nor BYPASSRLS, it may SELECT the table and UPDATE only the status column. Migrations use another role. <em>What it does not do:</em> It knows nothing about Alice: PostgreSQL authenticates the connection, not the browser user. The API&#39;s token never reaches the database. <a href="lessons/postgres-identity.html?lang=en">Lesson 15 · PostgreSQL authenticates the API</a></dd><dt id="bp-text-policy">RLS policy · request_boundary</dt><dd>Row-level security on purchase_request, forced even for the table owner. To read: same tenant, and owner or approver. To change: same tenant and approver. <em>What it does not do:</em> It trusts the context strings the API sets. It is a second boundary, not cryptographic proof. <a href="lessons/row-level-security.html?lang=en">Lesson 16 · Row-level security as a second boundary</a></dd></dl></section><section><h3>Tokens, keys, cookies</h3><dl><dt>D · Device keys</dt><dd>Two key pairs Windows creates when the device joins Entra. The device key signs the device&#39;s requests; the transport key lets Entra encrypt the session key for this device only. <em>Comes from:</em> The device itself, when it joins Entra. <em>Ends up:</em> The private halves stay in the TPM; the public halves are registered with the device in Entra. <em>Where it is, moment by moment:</em> When the device joins: Windows creates both pairs and registers the public halves with Entra. From then on: The private halves stay in the TPM and never leave it. At every PRT request: The TPM signs with the private device key; Entra checks the signature with the public half.</dd><dt>P · Primary Refresh Token (PRT)</dt><dd>A token Entra issues to the device&#39;s sign-in broker, not to an application. With it, CloudAP can get Alice a session at Entra without asking her for credentials again. <em>Comes from:</em> Entra, at Windows sign-in, after checking the credentials, the nonce and the device. <em>Ends up:</em> CloudAP&#39;s cache inside LSA, on this device only: valid 90 days, renewed while the device is used. <em>Where it is, moment by moment:</em> At Windows sign-in: Entra issues it to CloudAP, which keeps it in its cache inside LSA. While Alice works: It stays in that cache. CloudAP renews it at Windows sign-in every 4 hours. When an app signs in: It still stays in CloudAP: the browser only receives a PRT cookie made from it. When it stops working: After 90 days without renewal, or when Entra invalidates it: user or device deleted or disabled, or a password change if the PRT came from the password.</dd><dt>S · Session key</dt><dd>A key Entra issues with the PRT. Requests that use the PRT are signed with it, which proves they come from the device that received the PRT. <em>Comes from:</em> Entra, with the PRT, encrypted with the device&#39;s public transport key. <em>Ends up:</em> CloudAP&#39;s cache, wrapped by the TPM; no other component can use it. <em>Where it is, moment by moment:</em> At Windows sign-in: It arrives encrypted for the transport key. The TPM decrypts it and wraps it again with its own key. Afterwards: CloudAP keeps the wrapped key next to the PRT. On each use: The TPM signs with it, for example a PRT cookie. The key itself never leaves the device.</dd><dt>W · PRT cookie</dt><dd>A value CloudAP builds for one sign-in request, with the nonce Entra put in the sign-in URL, signed with the session key. Entra accepts it as proof that Alice is signed in on this device. <em>Comes from:</em> CloudAP, when the browser opens an Entra sign-in URL. <em>Ends up:</em> The x-ms-RefreshTokenCredential header of that one request to /authorize. <em>Where it is, moment by moment:</em> When the tab goes to Entra: The browser asks CloudAP for it, with the nonce from the URL. Moments later: CloudAP builds it and the TPM signs it with the session key. For one request: It travels in the x-ms-RefreshTokenCredential header to /authorize. Page scripts never see it. Afterwards: It is tied to that nonce: the next sign-in asks for a new one.</dd><dt>E · Entra session cookie</dt><dd>The cookie Entra sets for its own site after a sign-in. Later visits to /authorize can skip the credentials. When the sign-in used a PRT cookie, it is bound to the device&#39;s session key, so a copy does not work from another device. <em>Comes from:</em> /authorize, after Alice signs in. <em>Ends up:</em> The browser&#39;s cookies for login.microsoftonline.com, out of reach of the app&#39;s scripts. <em>Where it is, moment by moment:</em> After sign-in: Entra sets it for login.microsoftonline.com. It lives in the browser&#39;s cookie store, not in sessionStorage. At the next visit to /authorize: The browser sends it back, and Entra can answer without asking for credentials. At sign-out: Entra ends that session at its sign-out endpoint.</dd><dt>C · Authorization code</dt><dd>A one-time code that Entra returns to the registered redirect URI after sign-in. Short-lived, and useless without the verifier. <em>Comes from:</em> Entra&#39;s sign-in endpoint, after sign-in. <em>Ends up:</em> Redeemed once by MSAL at the token endpoint. <em>Where it is, moment by moment:</em> After sign-in: In the redirect from /authorize back to /redirect. Moments later: The MSAL bridge hands it to MSAL, which redeems it at /token with the verifier. After redemption: Worthless: a code is redeemed once.</dd><dt>V · PKCE verifier</dt><dd>A random secret MSAL creates for each sign-in, and its S256 hash, the challenge. The hash travels first; the verifier only at redemption. <em>Comes from:</em> MSAL, in the browser. <em>Ends up:</em> The token endpoint compares it with the challenge. <em>Where it is, moment by moment:</em> Before /authorize: MSAL creates it and keeps it in the tab while the sign-in is in flight. Only its hash goes to /authorize. At /token: Sent once, with the code. Entra hashes it and compares. Afterwards: Not needed again: the next sign-in makes a new one.</dd><dt>I · ID token</dt><dd>The sign-in result for the app: who signed in, for this client. Its audience is the SPA, not the API. <em>Comes from:</em> Entra&#39;s token endpoint. <em>Ends up:</em> MSAL&#39;s cache, to show the account. The API rejects it. <em>Where it is, moment by moment:</em> At /token: Issued with the access and refresh tokens. Then: In the tab&#39;s sessionStorage, where MSAL reads the account from it. When the tab closes: Gone with sessionStorage.</dd><dt>A · Access token</dt><dd>A signed JWT for the purchase API: audience, tenant, oid, scp, roles and time limits. A bearer credential: whoever holds it can use it. <em>Comes from:</em> Entra&#39;s token endpoint, for the API&#39;s scopes. <em>Ends up:</em> The Authorization header of each call; Spring checks it every time. <em>Where it is, moment by moment:</em> At /token: Issued for the API&#39;s scopes and audience. Until it expires: In the tab&#39;s sessionStorage, where acquireTokenSilent finds it. On each call: Copied into the Authorization header of one request. The API validates it and keeps nothing: there is no session. After sign-out: Gone from the tab, yet any copy stays valid until its exp.</dd><dt>R · Refresh token</dt><dd>Lets MSAL get new tokens from Entra without a new sign-in, within the tenant&#39;s policies. Issued to a SPA, it lasts 24 hours from issue, a window that does not slide. <em>Comes from:</em> Entra&#39;s token endpoint, at sign-in. <em>Ends up:</em> MSAL&#39;s cache; only Entra ever receives it back. <em>Where it is, moment by moment:</em> At /token: Issued with the other tokens. For 24 hours: In the tab&#39;s sessionStorage. MSAL sends it only to /token, to renew. After 24 hours: Expired. MSAL tries a hidden iframe to /authorize; where third-party cookies are blocked that fails, and a redirect gets a new code.</dd><dt>K · Public signing keys</dt><dd>The public halves of the signing keys, published as JWKS. With them anyone can verify a signature; nobody can sign. <em>Comes from:</em> Entra&#39;s metadata; in fixture mode, the kit&#39;s /jwks. <em>Ends up:</em> The decoder&#39;s cache, refreshed when a new key ID appears. <em>Where it is, moment by moment:</em> Published: In Entra&#39;s metadata for the tenant&#39;s issuer. In the API: Cached by the decoder, and fetched again when a token names an unknown key ID.</dd><dt>T · Test token</dt><dd>A JWT signed by the kit&#39;s own key, with one thing changed per case: expired, forged, another audience, no scope, no user... <em>Comes from:</em> The token dispenser at :18096. <em>Ends up:</em> The API in fixture mode. In Entra mode it gets 401. <em>Where it is, moment by moment:</em> On request: Signed by the dispenser for one named case. For one call: Held by the lab runner, which sends it in the Authorization header. Afterwards: Nothing keeps it: the API stores no token.</dd><dt>X · Transaction context</dt><dd>app.tenant, app.subject and app.approver, set with set_config(name, value, true). They exist only inside the current transaction. <em>Comes from:</em> The controller, from tid, oid and ROLE_Approver. <em>Ends up:</em> Read by the RLS policy; erased by COMMIT or ROLLBACK. <em>Where it is, moment by moment:</em> Inside the transaction: Set by the controller on the borrowed connection. During the SQL: Read by the RLS policy. At COMMIT or ROLLBACK: Erased: the next borrower of the connection sees none of it.</dd></dl></section></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
