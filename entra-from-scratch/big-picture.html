again with its own key. Afterwards: CloudAP keeps the wrapped key next to the PRT. On each use: The TPM signs with it, for example a PRT cookie. The key itself never leaves the device.</dd><dt>W · PRT cookie</dt><dd>A value CloudAP builds for one sign-in request, with the nonce Entra put in the sign-in URL, signed with the session key. Entra accepts it as proof that Alice is signed in on this device. <em>Comes from:</em> CloudAP, when the browser opens an Entra sign-in URL. <em>Ends up:</em> The x-ms-RefreshTokenCredential header of that one request to /authorize. <em>Where it is, moment by moment:</em> When the tab goes to Entra: The browser asks CloudAP for it, with the nonce from the URL. Moments later: CloudAP builds it and the TPM signs it with the session key. For one request: It travels in the x-ms-RefreshTokenCredential header to /authorize. Page scripts never see it. Afterwards: It is tied to that nonce: the next sign-in asks for a new one.</dd><dt>E · Entra session cookie</dt><dd>The cookie Entra sets for its own site after a sign-in. Later visits to /authorize can skip the credentials. When the sign-in used a PRT cookie, it is bound to the device&#39;s session key, so a copy does not work from another device. <em>Comes from:</em> /authorize, after Alice signs in. <em>Ends up:</em> The browser&#39;s cookies for login.microsoftonline.com, out of reach of the app&#39;s scripts. <em>Where it is, moment by moment:</em> After sign-in: Entra sets it for login.microsoftonline.com. It lives in the browser&#39;s cookie store, not in sessionStorage. At the next visit to /authorize: The browser sends it back, and Entra can answer without asking for credentials. At sign-out: Entra ends that session at its sign-out endpoint.</dd><dt>C · Authorization code</dt><dd>A one-time code that Entra returns to the registered redirect URI after sign-in. Short-lived, and useless without the verifier. <em>Comes from:</em> Entra&#39;s sign-in endpoint, after sign-in. <em>Ends up:</em> Redeemed once by MSAL at the token endpoint. <em>Where it is, moment by moment:</em> After sign-in: In the redirect from /authorize back to /redirect. Moments later: The MSAL bridge hands it to MSAL, which redeems it at /token with the verifier. After redemption: Worthless: a code is redeemed once.</dd><dt>V · PKCE verifier</dt><dd>A random secret MSAL creates for each sign-in, and its S256 hash, the challenge. The hash travels first; the verifier only at redemption. <em>Comes from:</em> MSAL, in the browser. <em>Ends up:</em> The token endpoint compares it with the challenge. <em>Where it is, moment by moment:</em> Before /authorize: MSAL creates it and keeps it in the tab while the sign-in is in flight. Only its hash goes to /authorize. At /token: Sent once, with the code. Entra hashes it and compares. Afterwards: Not needed again: the next sign-in makes a new one.</dd><dt>I · ID token</dt><dd>The sign-in result for the app: who signed in, for this client. Its audience is the SPA, not the API. <em>Comes from:</em> Entra&#39;s token endpoint. <em>Ends up:</em> MSAL&#39;s cache, to show the account. The API rejects it. <em>Where it is, moment by moment:</em> At /token: Issued with the access and refresh tokens. Then: In the tab&#39;s sessionStorage, where MSAL reads the account from it. When the tab closes: Gone with sessionStorage.</dd><dt>A · Access token</dt><dd>A signed JWT for the purchase API: audience, tenant, oid, scp, roles and time limits. A bearer credential: whoever holds it can use it. <em>Comes from:</em> Entra&#39;s token endpoint, for the API&#39;s scopes. <em>Ends up:</em> The Authorization header of each call; Spring checks it every time. <em>Where it is, moment by moment:</em> At /token: Issued for the API&#39;s scopes and audience. Until it expires: In the tab&#39;s sessionStorage, where acquireTokenSilent finds it. On each call: Copied into the Authorization header of one request. The API validates it and keeps nothing: there is no session. After sign-out: Gone from the tab, yet any copy stays valid until its exp.</dd><dt>R · Refresh token</dt><dd>Lets MSAL get new tokens from Entra without a new sign-in, within the tenant&#39;s policies. Issued to a SPA, it lasts 24 hours from issue, a window that does not slide. <em>Comes from:</em> Entra&#39;s token endpoint, at sign-in. <em>Ends up:</em> MSAL&#39;s cache; only Entra ever receives it back. <em>Where it is, moment by moment:</em> At /token: Issued with the other tokens. For 24 hours: In the tab&#39;s sessionStorage. MSAL sends it only to /token, to renew. After 24 hours: Expired. MSAL tries a hidden iframe to /authorize; where third-party cookies are blocked that fails, and a redirect gets a new code.</dd><dt>K · Public signing keys</dt><dd>The public halves of the signing keys, published as JWKS. With them anyone can verify a signature; nobody can sign. <em>Comes from:</em> Entra&#39;s metadata; in fixture mode, the kit&#39;s /jwks. <em>Ends up:</em> The decoder&#39;s cache, refreshed when a new key ID appears. <em>Where it is, moment by moment:</em> Published: In Entra&#39;s metadata for the tenant&#39;s issuer. In the API: Cached by the decoder, and fetched again when a token names an unknown key ID.</dd><dt>T · Test token</dt><dd>A JWT signed by the kit&#39;s own key, with one thing changed per case: expired, forged, another audience, no scope, no user... <em>Comes from:</em> The token dispenser at :18096. <em>Ends up:</em> The API in fixture mode. In Entra mode it gets 401. <em>Where it is, moment by moment:</em> On request: Signed by the dispenser for one named case. For one call: Held by the lab runner, which sends it in the Authorization header. Afterwards: Nothing keeps it: the API stores no token.</dd><dt>X · Transaction context</dt><dd>app.tenant, app.subject and app.approver, set with set_config(name, value, true). They exist only inside the current transaction. <em>Comes from:</em> The controller, from tid, oid and ROLE_Approver. <em>Ends up:</em> Read by the RLS policy; erased by COMMIT or ROLLBACK. <em>Where it is, moment by moment:</em> Inside the transaction: Set by the controller on the borrowed connection. During the SQL: Read by the RLS policy. At COMMIT or ROLLBACK: Erased: the next borrower of the connection sees none of it.</dd></dl></section><hr><div lang="es-AR"><h2>Panorama</h2><p>Del inicio de sesión de Windows a una fila protegida</p><p>Una solicitud de compra, desde el navegador de Alice hasta una fila de PostgreSQL, y cada pieza que puede decir que no en el camino. Entra emite la evidencia, Spring la verifica y PostgreSQL vuelve a verificar. En un Windows unido a Entra la historia empieza antes: Windows consigue un token para el dispositivo antes de que se abra la app.</p><p>Elegí un recorrido: el punto es el pedido y sus letras son lo que lleva. Cada parada dice qué se decide ahí y qué lección profundiza. Hacé clic en cualquier pieza, o en cualquier zona, para ver su ficha.</p><p>Las etiquetas dicen cómo ver una parada por tu cuenta: KIT en el laboratorio local, TENANT con un tenant real de Entra, WINDOWS en un dispositivo unido a ese tenant, MODELO solo en las lecciones.</p><section class="bp-text-journey"><h3>A · Inicio de sesión de Windows: el PRT</h3><p>el dispositivo consigue un token primero</p><ol><li><strong>Alice</strong>: Alice inicia sesión en Windows en un dispositivo unido al tenant, con su contraseña de trabajo o con Windows Hello for Business. Todavía no hay ninguna app abierta. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Login de Windows</strong>: La pantalla de inicio de sesión, LogonUI, toma las credenciales y se las pasa a LSA, la Local Security Authority. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>CloudAP</strong>: Dentro de LSA, CloudAP se las pasa a su plugin de Microsoft Entra, que le pide un nonce a Entra y arma un pedido con las credenciales y el nonce. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>TPM</strong>: El pedido se firma con la clave privada del dispositivo, dentro del TPM. La clave nunca sale de ahí. <em>Qué lleva el punto: Claves del dispositivo.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[dispositivo ✓]</span>: Entra verifica las credenciales, el nonce y la firma contra la clave pública del dispositivo, y que el dispositivo sea válido en el tenant. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Devices</strong>: Emite el PRT, y una session key cifrada con la clave pública de transporte del dispositivo. Un inicio de sesión con Windows Hello for Business le da al PRT un claim de MFA, que se renueva junto con el PRT. <em>Qué lleva el punto: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>CloudAP</strong>: Los dos llegan a CloudAP. Solo este dispositivo puede abrir la session key: hace falta la clave privada de transporte. <em>Qué lleva el punto: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>TPM</strong>: El TPM descifra la session key con la clave de transporte y la vuelve a envolver con su propia clave. <em>Qué lleva el punto: Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>CloudAP</strong> <span class="bp-text-stamp">[PRT en caché]</span>: CloudAP guarda el PRT y la session key envuelta en su caché, dentro de LSA. Al navegador no llegó nada. Ejecutado como el usuario con la sesión iniciada, dsregcmd /status muestra AzureAdPrt : YES y cuándo se renovó el PRT por última vez. Su salida nombra el dispositivo, el tenant y el usuario: guardala en privado. <em>Qué lleva el punto: Primary Refresh Token (PRT), Session key.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a> <code>dsregcmd /status</code></li></ol><p><strong>Fin del recorrido:</strong> Antes de que se abra cualquier app, CloudAP tiene un PRT para Alice y una session key que solo este TPM puede usar. Ninguno de los dos llega nunca al navegador ni a la app: el recorrido B muestra lo que recibe el navegador en su lugar.</p></section><section class="bp-text-journey"><h3>B · Abrir la app: sin contraseña</h3><p>el navegador toma prestada la sesión del dispositivo</p><ol><li><strong>App Angular</strong>: En el mismo dispositivo, Alice abre la app en Edge, con un perfil que tiene iniciada la sesión de su cuenta de trabajo, y elige Sign in. <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL arma un verifier y su challenge, que el recorrido D sigue en detalle, y arranca loginRedirect con prompt=select_account. <em>Qué lleva el punto: Verifier de PKCE.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a></li><li><strong>Navegador</strong>: El navegador lleva la pestaña a /authorize. Reconoce una URL de inicio de sesión de Entra y le pide a Windows una PRT cookie, pasándole el nonce de la URL. Edge lo hace con un perfil que tiene iniciada la sesión de la cuenta de trabajo; Chrome necesita la extensión Microsoft Single Sign On. Las ventanas privadas lo saltean. <em>Qué lleva el punto: Verifier de PKCE.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>CloudAP</strong>: CloudAP arma una PRT cookie para ese nonce a partir del PRT de su caché. El PRT mismo se queda ahí. <em>Qué lleva el punto: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>TPM</strong>: El TPM firma la PRT cookie con la session key. <em>Qué lleva el punto: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Navegador</strong>: La PRT cookie vuelve al navegador, no a la página: MSAL y cualquier script inyectado nunca la ven. <em>Qué lleva el punto: PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Endpoint de login</strong>: El pedido llega a /authorize con el cliente, los scopes y el challenge, y la PRT cookie en el header x-ms-RefreshTokenCredential. <em>Qué lleva el punto: Verifier de PKCE, PRT cookie.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[dispositivo ✓]</span>: Entra valida la firma de la session key y el nonce, y verifica que el dispositivo sea válido en el tenant. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Endpoint de login</strong> <span class="bp-text-stamp">[sin contraseña]</span>: Alice queda con la sesión iniciada a partir de la sesión del dispositivo. La app pidió select_account, así que Entra muestra su selector de cuentas; elegir su cuenta no pide contraseña. Entra devuelve el code, y una cookie de sesión para su propio sitio. <em>Qué lleva el punto: Authorization code, Cookie de sesión de Entra.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Navegador</strong>: El navegador guarda la cookie de sesión de Entra para login.microsoftonline.com, atada a este dispositivo, y sigue el redirect a /redirect con el code. <em>Qué lleva el punto: Authorization code, Cookie de sesión de Entra.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>MSAL Browser</strong>: Desde acá es el recorrido D: el bridge de MSAL entrega el code, y MSAL lo canjea con el verifier. <em>Qué lleva el punto: Authorization code, Verifier de PKCE.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[S256 ✓]</span>: Entra compara el verifier con el challenge y emite el ID token, el access token y el refresh token. <em>Qué lleva el punto: Authorization code, Verifier de PKCE.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a></li><li><strong>Caché de tokens</strong>: Los tres tokens llegan al sessionStorage, igual que sin Windows. El PRT cambió cómo probó Alice quién es, no lo que guarda la app. <em>Qué lleva el punto: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li></ol><p><strong>Fin del recorrido:</strong> Cada credencial se quedó en su lugar: el PRT y su session key en CloudAP, la PRT cookie en un solo pedido, la cookie de sesión de Entra en el navegador, los tokens de la app en sessionStorage. La API sigue recibiendo solo un access token para su audiencia.</p></section><section class="bp-text-journey"><h3>C · Un día después: tres relojes</h3><p>24 horas, 4 horas, 90 días</p><ol><li><strong>Caché de tokens</strong>: La pestaña quedó abierta toda la noche. Su refresh token se emitió ayer, y un refresh token emitido para una SPA dura 24 horas desde que se emite, en una ventana que no se corre. <em>Qué lleva el punto: Refresh token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>MSAL Browser</strong> <span class="bp-text-stamp">[vencido]</span>: acquireTokenSilent encuentra vencido el access token, y también el refresh token. <em>Qué lleva el punto: Refresh token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Endpoint de login</strong> <span class="bp-text-stamp">[bloqueado]</span>: MSAL prueba un iframe oculto contra /authorize. Donde el navegador bloquea las cookies de terceros, ese intento sin interacción falla y MSAL lanza InteractionRequiredAuthError. <span class="bp-text-tag">Modelo</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>App Angular</strong>: La app responde con un redirect interactivo, nunca con una serie de reintentos sin interacción. <span class="bp-text-tag">Windows</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Navegador</strong>: Una navegación de nivel superior a /authorize. El navegador le pide a CloudAP una PRT cookie nueva, para el nonce nuevo. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>CloudAP</strong> <span class="bp-text-stamp">[PRT vigente]</span>: El PRT sigue sirviendo: CloudAP lo renueva al iniciar sesión en Windows cada 4 horas, y un PRT vale 90 días mientras se usa el dispositivo. <em>Qué lleva el punto: Primary Refresh Token (PRT).</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Endpoint de login</strong> <span class="bp-text-stamp">[sin contraseña]</span>: Con la PRT cookie y la cookie de sesión de Entra, Entra devuelve un code nuevo sin pedir contraseña. Siguen los tokens nuevos, como en el recorrido B. <em>Qué lleva el punto: PRT cookie, Cookie de sesión de Entra.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Devices</strong> <span class="bp-text-stamp">[qué lo termina]</span>: El PRT deja de servir cuando Alice o el dispositivo se borran o se deshabilitan en Entra, o cuando ella cambia su contraseña, si el PRT salió de ella. Desde ese momento no le consigue nada. <span class="bp-text-tag">Windows</span> <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></li><li><strong>Caché de tokens</strong>: Nada de eso llega a los tokens ya emitidos: el access token del sessionStorage sigue valiendo hasta su exp, como en el recorrido K. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Windows</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li></ol><p><strong>Fin del recorrido:</strong> Corren tres relojes a la vez: el refresh token de la SPA (24 horas, sin correrse), el PRT (se renueva al iniciar sesión en Windows cada 4 horas, vale 90 días) y el exp de cada access token. Perder el PRT frena los inicios de sesión nuevos; no retira los tokens ya emitidos.</p></section><section class="bp-text-journey"><h3>D · Iniciar sesión: un code y PKCE</h3><p>un code que solo no vale nada</p><ol><li><strong>Alice</strong>: Alice abre la app y elige Sign in. Todavía no se verificó nada: la página es código público que corre en su navegador. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>App Angular</strong>: La app llama a loginRedirect con los dos scopes de la API. Nunca va a ver la contraseña de Alice. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL arma un verifier nuevo, calcula su hash para obtener un challenge S256 y guarda el verifier en esta pestaña. Agrega un state y un nonce para atar la respuesta a este pedido. El kit prueba solo la relación del hash: un verifier distinto nunca reproduce el challenge. <em>Qué lleva el punto: Verifier de PKCE.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a> <code>node lab.mjs pkce</code></li><li><strong>Endpoint de login</strong> <span class="bp-text-stamp">[sesión iniciada]</span>: La pestaña va al /authorize del tenant con el client ID, la redirect URI, los scopes y el challenge. Entra le inicia la sesión a Alice y aplica las políticas del tenant. Acá viaja solo el challenge. El verifier no sale del navegador hasta el canje. <em>Qué lleva el punto: Verifier de PKCE.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a></li><li><strong>App registrations</strong> <span class="bp-text-stamp">[URI ✓]</span>: Entra contrasta el pedido con los registros: ¿esta redirect URI está registrada para este cliente, y la API expone estos scopes? <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a></li><li><strong>Endpoint de login</strong>: Si hace falta consentimiento, Entra lo pide. Después redirige a /redirect con un authorization code de un solo uso. <em>Qué lleva el punto: Authorization code.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a></li><li><strong>MSAL Browser</strong>: La página /redirect ejecuta solo el bridge de MSAL, que le pasa el code a la instancia de MSAL de la app. Un code capturado no sirve sin el verifier. <em>Qué lleva el punto: Authorization code, Verifier de PKCE.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[S256 ✓]</span>: MSAL canjea el code con el verifier original. Entra calcula el hash del verifier y lo compara con el challenge que vio en /authorize. <em>Qué lleva el punto: Authorization code, Verifier de PKCE.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a></li><li><strong>Claves de firma</strong>: Entra firma los tokens nuevos con su clave privada. Solo se publica la mitad pública. <span class="bp-text-tag">Tenant</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></li><li><strong>Token endpoint</strong>: Vuelven tres tokens: un ID token para la app, un access token para la API de compras y un refresh token para MSAL. <em>Qué lleva el punto: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/three-token-jobs.html?lang=es">Lección 06 · Tres trabajos de los tokens</a></li><li><strong>MSAL Browser</strong>: MSAL compara la respuesta con el state y el nonce que mandó, marca a Alice como la cuenta activa y guarda los tres tokens. <em>Qué lleva el punto: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Caché de tokens</strong>: Esperan en el sessionStorage de esta pestaña: desaparecen cuando se cierra la pestaña, pero cualquier script que corra en este origen los puede leer. <em>Qué lleva el punto: ID token, Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li></ol><p><strong>Fin del recorrido:</strong> Alice tiene la sesión iniciada en la app y MSAL guarda tres tokens. Todavía no llegó nada a la API: un inicio de sesión no es una autorización. El recorrido E manda el primer pedido.</p></section><section class="bp-text-journey"><h3>E · Leer mi propia solicitud: 200</h3><p>cuatro verificaciones, después una fila</p><ol><li><strong>App Angular</strong>: Alice pide la solicitud 41. Antes de llamar a la API, la app le pide a MSAL un token para exactamente los scopes de la API. En el kit, en modo fixture, la app se lo pide al emisor de tokens; desde el límite de la API en adelante, todo es igual. <span class="bp-text-tag">Kit</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>MSAL Browser</strong>: acquireTokenSilent busca primero en la caché, para esta cuenta y estos scopes. <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Caché de tokens</strong>: Ahí hay un access token válido para esta API. No hace falta ninguna llamada de red. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>MSAL Browser</strong>: MSAL se lo entrega a la app. Si hubiera vencido, MSAL lo renovaría con el refresh token: recorrido K. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>App Angular</strong>: La app agrega el token a una URL fija, http://localhost:18095/api/requests/41, y a ningún otro destino. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>CORS y filtro bearer</strong>: Primero CORS: el preflight del navegador pregunta si localhost:18094 puede mandar un header Authorization, y la API nombra ese origen exacto. Después el filtro bearer toma el token. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a> <code>node lab.mjs cors</code></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[válido]</span>: El decoder verifica la firma con la clave pública en caché, después el issuer, el vencimiento y el not-before, la audiencia, el tenant, la versión 2.0, el cliente permitido y un oid bien formado. <em>Qué lleva el punto: Access token, Claves públicas de firma.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a> <code>node lab.mjs tokens</code></li><li><strong>Conversor de authorities</strong>: Los claims se convierten en authorities: scp da SCOPE_Requests.Read y SCOPE_Requests.Approve. Alice no tiene rol, así que no hay ROLE_Approver. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[scope ✓]</span>: Leer necesita SCOPE_Requests.Read. Alice lo tiene. <span class="bp-text-tag">Kit</span> <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a></li><li><strong>Controlador</strong>: En una transacción, el controlador fija app.tenant y app.subject a partir de tid y oid, y app.approver a partir del rol. Los tres son locales a la transacción. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></li><li><strong>Pool de conexiones</strong>: Toma prestada una de las tres conexiones del pool. Todas son app_runtime, nunca el administrador. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a></li><li><strong>app_runtime</strong>: PostgreSQL autentica a app_runtime: sin superusuario, sin BYPASSRLS, solo SELECT y UPDATE de la columna de estado. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a> <code>node lab.mjs database</code></li><li><strong>Política RLS</strong> <span class="bp-text-stamp">[RLS ✓]</span>: El SQL ya dice id = 41, y el tenant y el dueño salen del token. La política agrega su propia condición: el mismo tenant, y ser dueño o aprobador. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a> <code>node lab.mjs rls</code></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[1 fila]</span>: La fila 41 es de Alice, en el tenant de Alice: cumple tanto la consulta como la política. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></li><li><strong>Controlador</strong>: Vuelve la fila. El COMMIT termina la transacción, y el contexto desaparece con ella. <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></li><li><strong>App Angular</strong> <span class="bp-text-stamp">[200]</span>: HTTP 200 con la solicitud 41. La app la muestra; no decidió nada. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a> <code>node lab.mjs boundary</code></li></ol><p><strong>Fin del recorrido:</strong> Una lectura cruzó cuatro verificaciones independientes: el token, la operación, la consulta del endpoint y la política de filas. Sacar cualquiera de ellas es una prueba que tendría que fallar.</p></section><section class="bp-text-journey"><h3>F · Aprobar la solicitud de un colega</h3><p>200 una vez, después 404</p><ol><li><strong>node lab.mjs</strong>: El lab pide el caso approver: la identidad de Alice, con el rol Approver. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a> <code>node lab.mjs atomic</code></li><li><strong>Emisor de tokens</strong>: El emisor lo firma con la clave del kit: scp trae los dos scopes, roles trae Approver. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a></li><li><strong>node lab.mjs</strong>: Salen dos POST /api/requests/42/approve en el mismo momento. La solicitud 42 es de Bob, y está PENDING. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></li><li><strong>CORS y filtro bearer</strong>: Sin navegador no hay Origin ni preflight: CORS no participa. El filtro bearer toma el token. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[válido]</span>: En modo fixture el decoder confía en la clave del kit, y solo en ella. Firma, issuer, tiempo y contrato: válidos. <em>Qué lleva el punto: Token de prueba, Claves públicas de firma.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></li><li><strong>Conversor de authorities</strong>: SCOPE_Requests.Approve a partir de scp, y ROLE_Approver a partir de roles. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[scope + rol ✓]</span>: Aprobar necesita SCOPE_Requests.Approve y ROLE_Approver, los dos. Un OR acá dejaría que un token app-only actúe como una persona. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a></li><li><strong>Controlador</strong>: Una sola sentencia verifica y cambia a la vez: UPDATE purchase_request SET status = &#39;APPROVED&#39; WHERE id = 42 AND el tenant coincide AND owner_oid no es quien llama AND status = &#39;PENDING&#39;. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></li><li><strong>Política RLS</strong> <span class="bp-text-stamp">[WITH CHECK ✓]</span>: A través de una conexión app_runtime del pool. El WITH CHECK de la política deja que un aprobador cambie una fila de su tenant. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[1 fila, después 0]</span>: El primer UPDATE pasa la 42 a APPROVED. El segundo no encuentra ninguna fila PENDING: cambian 0 filas. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></li><li><strong>Controlador</strong> <span class="bp-text-stamp">[200 y 404]</span>: Cambió una fila: 200 APPROVED. Ninguna fila: 404, la misma respuesta que para una solicitud que no existe. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[200 + 404]</span>: El lab ve exactamente un 200 y un 404, y PostgreSQL dice APPROVED. Aprobar su propia solicitud 41 también da 404: el dueño no puede aprobar. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a> <code>node lab.mjs roles</code></li></ol><p><strong>Fin del recorrido:</strong> Un rol es una condición entre varias. La regla del método verifica scope y rol; una sola sentencia SQL verifica juntos el tenant, que no sea el dueño y PENDING, así que una carrera no puede aprobar dos veces.</p></section><section class="bp-text-journey"><h3>G · 401: el token no se acepta</h3><p>nueve tokens rotos, una puerta</p><ol><li><strong>node lab.mjs</strong>: El lab le pide al emisor tokens rotos, un caso por vez. <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a> <code>node lab.mjs signature</code></li><li><strong>Emisor de tokens</strong>: Cada caso rompe una sola cosa: vencido, válido solo en el futuro, firmado con la clave de un desconocido, otro issuer, otra audiencia, un ID token, otro cliente, sin oid, otro tenant. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></li><li><strong>node lab.mjs</strong>: Cada uno sale como GET /api/requests/41. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>CORS y filtro bearer</strong>: El filtro bearer le pasa el token al decoder. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[rechazado]</span>: Cada caso falla exactamente una verificación: firma, issuer, exp o nbf, aud (también el ID token: su audiencia es la SPA), tid, azp u oid. Leer un payload no prueba nada: el decoder verifica antes de confiar en un solo claim, y sus claves salen de la configuración, nunca del token. <em>Qué lleva el punto: Token de prueba, Claves públicas de firma.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a> <code>node lab.mjs time</code></li><li><strong>CORS y filtro bearer</strong> <span class="bp-text-stamp">[401]</span>: La cadena de filtros responde 401 con WWW-Authenticate: Bearer. No se ejecutó ningún controlador y no se mandó ningún SQL. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a> <code>node lab.mjs http</code></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[401 ✓]</span>: El lab espera 401 para cada caso, y sigue esperando 200 para el token válido de Alice. <span class="bp-text-tag">Kit</span> <a href="lessons/debug-without-leaking.html?lang=es">Lección 22 · Depurá sin filtrar credenciales</a> <code>node lab.mjs audience</code></li></ol><p><strong>Fin del recorrido:</strong> 401 significa que la API no aceptó la credencial. Volver a iniciar sesión no arregla una audiencia equivocada: la arregla la configuración. Cada arreglo conserva su prueba negativa.</p></section><section class="bp-text-journey"><h3>H · 403: aceptado, no permitido</h3><p>un token genuino al que le falta una authority</p><ol><li><strong>node lab.mjs</strong>: Dos tokens genuinos a los que les falta algo a cada uno: no-role tiene los scopes pero no Approver; app-only tiene Approver pero no scp, porque no inició sesión ningún usuario. <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a> <code>node lab.mjs delegation</code></li><li><strong>Emisor de tokens</strong>: Los dos están firmados con la clave del kit, para la audiencia, el tenant y el cliente correctos. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></li><li><strong>node lab.mjs</strong>: Cada uno pide aprobar la solicitud 42. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>CORS y filtro bearer</strong>: El filtro bearer toma el token. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[válido]</span>: Los dos pasan todas las verificaciones. La autenticación se cumple. <em>Qué lleva el punto: Token de prueba, Claves públicas de firma.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></li><li><strong>Conversor de authorities</strong>: no-role da solo authorities SCOPE_. app-only da ROLE_Approver y ningún SCOPE_. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[403]</span>: Aprobar necesita SCOPE_Requests.Approve y ROLE_Approver. A cada token le falta una de las dos. <span class="bp-text-tag">Kit</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a> <code>node lab.mjs roles</code></li><li><strong>CORS y filtro bearer</strong> <span class="bp-text-stamp">[403]</span>: La cadena de filtros convierte el rechazo en 403. El controlador nunca se ejecutó. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[403 ✓]</span>: Los dos reciben 403. Un token con solo Requests.Read recibe 403 para aprobar y sigue recibiendo 200 para leer: los scopes son por operación. <span class="bp-text-tag">Kit</span> <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a> <code>node lab.mjs scopes</code></li></ol><p><strong>Fin del recorrido:</strong> 403: la API sabe quién llama y rechaza esta operación. Un botón oculto nunca protegió nada; esta regla sí.</p></section><section class="bp-text-journey"><h3>I · 404: Alice pide la solicitud de Bob</h3><p>la identidad sale del token, nunca de la URL</p><ol><li><strong>App Angular</strong>: Alice escribe 42 en lugar de 41. La página la deja: el campo de texto no es el límite. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></li><li><strong>CORS y filtro bearer</strong>: Un token genuino de Alice llega a la API. <em>Qué lleva el punto: Token de prueba.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[scope ✓]</span>: Válido, con SCOPE_Requests.Read: la operación está permitida. Tener permiso para leer no es tener permiso para leer todo. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>Controlador</strong>: El id sale de la URL; el tenant y el dueño salen solo del token: WHERE id = 42 AND tenant_id = tid AND owner_oid = el oid de Alice. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></li><li><strong>Política RLS</strong>: Hasta una consulta que se olvidó el WHERE quedaría filtrada acá: la fila no es de Alice, y ella no es aprobadora. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[0 filas]</span>: Ninguna fila coincide. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></li><li><strong>Controlador</strong> <span class="bp-text-stamp">[404]</span>: Ninguna fila: 404, la misma respuesta que para un número que no existe, así la API no revela qué solicitudes existen. <span class="bp-text-tag">Kit</span> <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></li><li><strong>App Angular</strong> <span class="bp-text-stamp">[404]</span>: Alice ve 404. Bob, con su propio token, recibe 200 para la 42. La solicitud 43 vive en otro tenant: Alice recibe 404, y un token de ese tenant recibe 401. <span class="bp-text-tag">Kit</span> <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a> <code>node lab.mjs owner</code></li></ol><p><strong>Fin del recorrido:</strong> La propiedad es una regla de autorización, que se aplica con la identidad tomada del token validado y nunca del pedido. RLS la repite debajo.</p></section><section class="bp-text-journey"><h3>J · RLS, el segundo límite</h3><p>la base de datos sin la API</p><ol><li><strong>node lab.mjs</strong>: El lab se conecta directo a PostgreSQL y pasa a app_runtime, el rol que usa la API. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a> <code>node lab.mjs rls</code></li><li><strong>Política RLS</strong> <span class="bp-text-stamp">[0 filas]</span>: No se fijó ningún contexto, así que la política compara tenant_id con NULL: ninguna fila califica. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[count 0]</span>: SELECT count(*) devuelve 0. No es un error: es una respuesta vacía y segura. <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>Política RLS</strong>: Ahora, dentro de una transacción con el tenant y el sujeto de Alice fijados, el lab ejecuta un SELECT sin ningún WHERE. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>purchase_request</strong> <span class="bp-text-stamp">[solo la 41]</span>: Vuelve solo la fila 41. La 42 de Bob y la 43 del otro tenant siguen invisibles. <em>Qué lleva el punto: Contexto de la transacción.</em> <span class="bp-text-tag">Kit</span> <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></li><li><strong>Política RLS</strong> <span class="bp-text-stamp">[sin contexto]</span>: Después del COMMIT, la misma conexión vuelve a ver 0 filas: set_config(name, value, true) era solo de esa transacción. <span class="bp-text-tag">Kit</span> <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a> <code>node lab.mjs pool</code></li><li><strong>app_runtime</strong> <span class="bp-text-stamp">[sin bypass]</span>: Y el rol en sí no es superusuario ni BYPASSRLS, la tabla fuerza RLS, y app_runtime no puede reescribir owner_oid. <span class="bp-text-tag">Kit</span> <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a> <code>node lab.mjs database</code></li></ol><p><strong>Fin del recorrido:</strong> RLS es un segundo límite, no el primero: confía en el contexto que fija la API. Lo que aporta es que un WHERE olvidado no devuelve nada en lugar de devolver todo.</p></section><section class="bp-text-journey"><h3>K · Un rol quitado contra un token anterior</h3><p>vencimiento, renovación y cierre de sesión</p><ol><li><strong>Administrador</strong>: Ayer Alice aprobó solicitudes. Hoy el administrador le quita la asignación de Approver. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>Enterprise applications</strong>: La asignación ya no está en la enterprise application de la API. No se empuja nada a los tokens ya emitidos. <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[próximos tokens]</span>: Entra va a dejar afuera roles: Approver en el próximo access token que emita para Alice. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>Caché de tokens</strong>: Mientras tanto, el access token de Alice en caché sigue diciendo roles: Approver, y vale hasta su exp. <em>Qué lleva el punto: Access token, Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[todavía permitido]</span>: Su próxima aprobación llega con ese token. La API valida localmente: la firma, el tiempo y los claims están bien, y el rol viejo todavía pasa. Spring no vuelve a leer las asignaciones en cada pedido. Un retiro más rápido hay que diseñarlo: duraciones más cortas, una consulta a una fuente de verdad, o continuous access evaluation donde aplique. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>MSAL Browser</strong>: Más tarde vence el access token. Antes de la próxima llamada, acquireTokenSilent lo nota y usa el refresh token. <em>Qué lleva el punto: Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[sin rol]</span>: Entra emite un access token nuevo. La asignación ya no está, así que roles viene vacío. <em>Qué lleva el punto: Refresh token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/three-token-jobs.html?lang=es">Lección 06 · Tres trabajos de los tokens</a></li><li><strong>MSAL Browser</strong>: MSAL guarda el token nuevo en caché y se lo da a la app. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></li><li><strong>Regla del método</strong> <span class="bp-text-stamp">[403]</span>: La misma aprobación ahora recibe 403: el token es válido, pero el rol no está en él. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a></li><li><strong>App Angular</strong>: Alice cierra sesión. logoutRedirect limpia la caché de MSAL para su cuenta. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li><li><strong>Endpoint de login</strong> <span class="bp-text-stamp">[sesión terminada]</span>: Entra termina su sesión en su endpoint de cierre de sesión. Los tokens ya emitidos no se retiran: siguen valiendo hasta que vencen. <span class="bp-text-tag">Tenant</span> <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></li></ol><p><strong>Fin del recorrido:</strong> Tres cosas distintas: la vida de un token, una sesión y una asignación. La renovación las conecta; nada retira un token ya emitido, por eso las duraciones importan.</p></section><section class="bp-text-journey"><h3>L · Configurar el tenant</h3><p>dos registros, consentimiento, un rol</p><ol><li><strong>Administrador</strong>: En el Entra admin center, el administrador registra dos aplicaciones, no una: el destinatario del token tiene que quedar a la vista. <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a></li><li><strong>App registrations</strong>: El registro de la API: Application ID URI api://API_CLIENT_ID, scopes delegados Requests.Read y Requests.Approve, el app role de usuario Approver, access tokens v2. El registro de la SPA: un cliente público con la redirect URI http://localhost:18094/redirect, sin secreto. <span class="bp-text-tag">Tenant</span> <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a></li><li><strong>Enterprise applications</strong>: Cada registro recibe un service principal en el tenant: su enterprise application. <span class="bp-text-tag">Tenant</span> <a href="lessons/tenant-app-principal.html?lang=es">Lección 03 · Tenant, aplicación, service principal</a></li><li><strong>Enterprise applications</strong>: Ahí el administrador le asigna Approver a un usuario de prueba, y otorga el consentimiento si los usuarios no pueden consentir por su cuenta. <span class="bp-text-tag">Tenant</span> <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a></li><li><strong>Token endpoint</strong> <span class="bp-text-stamp">[scp, roles]</span>: Desde ahora, un access token para ese usuario y esta API trae los scopes consentidos en scp y Approver en roles. <span class="bp-text-tag">Tenant</span> <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a></li><li><strong>Claves de firma</strong>: Spring va a verificar esos tokens con las claves publicadas para el issuer fijo del tenant. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a></li><li><strong>JwtDecoder</strong> <span class="bp-text-stamp">[Modo Entra]</span>: Con AUTH_MODE=entra, el decoder confía solo en https://login.microsoftonline.com/TENANT_ID/v2.0 y en sus claves. La clave del kit deja de ser de confianza. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a> <code>node configure.mjs entra TENANT_ID SPA_CLIENT_ID API_CLIENT_ID ALICE_OID BOB_OID</code></li><li><strong>Emisor de tokens</strong> <span class="bp-text-stamp">[401]</span>: Un token de prueba ahora recibe 401. La sonda prueba el cambio, no que una persona real haya iniciado sesión. <span class="bp-text-tag">Tenant</span> <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a> <code>node tenant-probe.mjs</code></li></ol><p><strong>Fin del recorrido:</strong> Los registros son configuración, no prueba. El recorrido del tenant registra solo lo que observaste: un inicio de sesión, una lectura propia, un rechazo por rol y una aprobación permitida.</p></section><section class="bp-text-journey"><h3>M · Lo que CORS y PKCE no frenan</h3><p>un script adentro, alguien que llama desde afuera</p><ol><li><strong>Script inyectado</strong>: Un script se mete en la página por un renderizado inseguro o una dependencia comprometida. Corre con el origen de la página. <span class="bp-text-tag">Modelo</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>MSAL Browser</strong> <span class="bp-text-stamp">[mismo origen]</span>: Le puede pedir un token a MSAL igual que la app. PKCE protegió el canje del code; no hace nada contra código que ya corre en la página. <span class="bp-text-tag">Modelo</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>Script inyectado</strong>: Ahora tiene un access token válido. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>App Angular</strong>: O simplemente maneja el código propio de la app para mandar pedidos. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>CORS y filtro bearer</strong> <span class="bp-text-stamp">[parece válido]</span>: La API ve un token válido desde un origen permitido. Nada distingue este pedido de uno de la propia Alice. Defensas: una CSP estricta, un renderizado seguro y dependencias mantenidas. Un backend for frontend guarda los tokens en un servidor detrás de una cookie HttpOnly, pero un script igual puede actuar a través de esa sesión. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></li><li><strong>node lab.mjs</strong> <span class="bp-text-stamp">[sin Origin]</span>: CORS es una regla que cumplen los navegadores. El lab llama sin ningún header Origin, y la API responde como le respondería a cualquiera: 401 sin token, 200 con uno válido. <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a> <code>node lab.mjs cors</code></li><li><strong>CORS y filtro bearer</strong> <span class="bp-text-stamp">[preflight 403]</span>: Un preflight desde https://stranger.invalid recibe 403: un navegador bloquearía esa página. CORS nunca reemplazó al token. <span class="bp-text-tag">Kit</span> <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a> <code>node lab.mjs cors</code></li></ol><p><strong>Fin del recorrido:</strong> CORS y PKCE cierran una puerta cada uno. Ninguno protege la API de alguien que tiene un token válido: eso lo hacen la validación y la autorización, y la prevención deja afuera a los scripts.</p></section><section class="bp-text-journey"><h3>N · Otra API, otra audiencia</h3><p>sin reenviar; on-behalf-of</p><ol><li><strong>Controlador</strong>: Supongamos que el controlador tiene que leer el jefe de Alice desde Microsoft Graph. <span class="bp-text-tag">Modelo</span> <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></li><li><strong>Otra API</strong> <span class="bp-text-stamp">[aud equivocada]</span>: Reenviar el token entrante falla: su audiencia es la API de compras, y Graph lo tiene que rechazar. <em>Qué lleva el punto: Access token.</em> <span class="bp-text-tag">Modelo</span> <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></li><li><strong>Controlador</strong>: El diseño correcto: un servicio intermedio confidencial usa el flujo on-behalf-of en el token endpoint de Entra para obtener un token cuya audiencia sea Graph. <span class="bp-text-tag">Modelo</span> <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></li><li><strong>Otra API</strong> <span class="bp-text-stamp">[no está en el kit]</span>: Ese token es para Graph, bajo el consentimiento de Graph. Un proceso nocturno sin usuario usaría en cambio client credentials y su propia política de endpoints. <span class="bp-text-tag">Modelo</span> <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></li></ol><p><strong>Fin del recorrido:</strong> Un token es para una audiencia. Llegar a otra API en nombre del usuario es otro diseño, con su propio consentimiento y su propio modelo de amenazas; el kit lo deja como ejercicio.</p></section><section><h3>Zonas</h3><dl><dt id="bp-text-zone-device">Tu computadora</dt><dd>La computadora de Alice: Windows con su TPM, el navegador y la pestaña donde corre la aplicación. En un dispositivo unido a Entra, el primer token del día se obtiene acá, al iniciar sesión en Windows, antes de que se abra ninguna app. <em>Qué no hace:</em> Nada de lo que hay acá decide qué puede hacer Alice en la aplicación. La computadora la controla su usuario, o quien controle esa sesión: la API y PostgreSQL vuelven a decidir en el servidor, con sus propias reglas. <a href="lessons/four-boundaries.html?lang=es">Lección 01 · Cuatro componentes, cuatro responsabilidades</a>, <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-zone-windows">Windows</dt><dd>El sistema operativo de un dispositivo unido al tenant. Al iniciar sesión en Windows, LogonUI le pasa las credenciales de Alice a LSA, cuyo proveedor CloudAP le inicia la sesión en Entra y guarda el Primary Refresh Token en su caché, protegido con el TPM. Acá empieza el single sign-on a la app. <em>Qué no hace:</em> Windows nunca le entrega el PRT al navegador ni a una aplicación, y no decide nada sobre las solicitudes de compra. En un dispositivo que no está unido a Entra no hay PRT, y el navegador pide credenciales. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-zone-tab">Pestaña del navegador · localhost:18094</dt><dd>La página de la aplicación, servida desde localhost:18094: Angular, MSAL y la caché de tokens en el sessionStorage de esta pestaña. La página inicia la sesión, le pide un token a MSAL antes de cada llamada y lo manda a la API. <em>Qué no hace:</em> La pestaña no es un límite de la API. Todo script que corre en ella comparte su origen y sus poderes, incluido uno inyectado, y el usuario puede cambiar la página o llamar a la API sin ella. <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a>, <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></dd><dt id="bp-text-zone-entra">Microsoft Entra ID · tu tenant</dt><dd>Tu tenant es la instancia propia de Microsoft Entra ID de tu organización: un directorio, identificado por su tenant ID, con sus usuarios, grupos, dispositivos y aplicaciones. Acá cada aplicación tiene su registro y su service principal, se guardan los consentimientos y las asignaciones de roles, se autentica a las personas y a los dispositivos según las políticas del tenant, y se emiten los tokens desde /authorize y /token, firmados con claves que Entra publica. La API confía solo en tokens cuyo issuer es este tenant: https://login.microsoftonline.com/TENANT_ID/v2.0. <em>Qué no hace:</em> No conoce los datos de la aplicación: de quién es la solicitud 42, si está pendiente y quién la puede aprobar lo deciden la API y PostgreSQL. Una vez que emitió un token, no ve los pedidos que lo llevan y no lo puede retirar. Otro tenant es otro directorio, con otros usuarios: sus tokens traen otro issuer y otro tid, y la API los rechaza. <a href="lessons/tenant-app-principal.html?lang=es">Lección 03 · Tenant, aplicación, service principal</a>, <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a>, <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a></dd><dt id="bp-text-zone-admin">Admin del tenant</dt><dd>Una persona con permisos sobre el directorio que trabaja en el Entra admin center. Antes de cualquier pedido, registra la API y la SPA, expone los scopes, otorga el consentimiento cuando los usuarios no pueden darlo y les asigna el rol Approver a los usuarios. <em>Qué no hace:</em> El administrador no está en el camino de ningún pedido y no aprueba ninguna compra. Un rol de administrador del directorio no vuelve aprobador a nadie en esta aplicación: eso es el app role Approver, asignado en la API. <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a>, <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a>, <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a></dd><dt id="bp-text-zone-beyond">Fuera del kit</dt><dd>Recursos que el curso nombra pero el kit nunca llama, como Microsoft Graph: otra API, con su propia audiencia y sus propios permisos. Muestran por dónde seguiría un diseño: on-behalf-of para actuar en nombre de un usuario, client credentials para un proceso sin usuario. <em>Qué no hace:</em> Nada de esto corre en el kit ni en las actividades; el recorrido que llega acá es un modelo. Un token emitido para la API de compras no vale acá. <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></dd><dt id="bp-text-zone-api">La API · Spring Boot · localhost:18095</dt><dd>El resource server de Spring Boot en localhost:18095. Cada pedido cruza la cadena de filtros de seguridad, después la regla del método y después un controlador que abre una transacción y ejecuta un SQL cuyo tenant y cuyo dueño salen del token validado. Acá se toman las decisiones de negocio. <em>Qué no hace:</em> No guarda sesión ni tokens: cada pedido se juzga por su cuenta. No autentica personas; verifica la evidencia que emitió Entra, y nunca le reenvía ese token a la base de datos. <a href="lessons/four-boundaries.html?lang=es">Lección 01 · Cuatro componentes, cuatro responsabilidades</a>, <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a>, <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a></dd><dt id="bp-text-zone-chain">Cadena de filtros de seguridad</dt><dd>La parte de Spring Security que cruza cada pedido antes de cualquier controlador: CORS para el origen exacto, el filtro bearer, el JwtDecoder que verifica el token y el conversor que transforma sus claims en authorities. Escribe cada 401 y cada 403. <em>Qué no hace:</em> No sabe de quién es una fila ni si una solicitud está pendiente: eso se decide después, en el controlador y en PostgreSQL. El CORS que tiene es una regla que cumplen los navegadores, no autenticación. <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a>, <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a>, <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a></dd><dt id="bp-text-zone-kit">Solo en el kit</dt><dd>Piezas que existen solo en el lab local: el emisor de tokens, que firma tokens de prueba con la clave propia del kit, y lab.mjs, el ejecutor que manda pedidos y verifica PostgreSQL. Con ellas podés ver decidir a la API y a la base de datos sin un tenant. <em>Qué no hace:</em> Ninguna de las dos es Entra ni autentica a nadie. En modo Entra, la API deja de confiar en la clave del kit y el ejecutor se niega a correr. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a></dd><dt id="bp-text-zone-db">PostgreSQL 18</dt><dd>La base de datos de las solicitudes de compra. La API se conecta como app_runtime, un rol restringido, a través de un pool de conexiones; el row-level security filtra cada fila con el tenant y el sujeto que la API fija en cada transacción. <em>Qué no hace:</em> Nunca ve un token ni al usuario del navegador: autentica el rol de base de datos de la API. Su política confía en el contexto que fija la API; es un segundo límite, no el primero. <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a>, <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a>, <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></dd></dl></section><section><h3>Piezas</h3><dl><dt id="bp-text-cache">Caché de tokens · sessionStorage de esta pestaña</dt><dd>Donde MSAL guarda el ID token, el access token y el refresh token, y el verifier de PKCE mientras un inicio de sesión está en curso. El sessionStorage desaparece con la pestaña. <em>Qué no hace:</em> No es una bóveda: cualquier script que corra en este origen lo puede leer. El sessionStorage acorta cuánto duran los tokens, no quién los puede alcanzar en la página. El PRT y la cookie de sesión de Entra nunca están acá. <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a>, <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></dd><dt id="bp-text-msal">MSAL Browser · PublicClientApplication</dt><dd>La biblioteca de Microsoft dentro de la página. Ejecuta el flujo authorization code con PKCE, procesa el redirect, guarda los tokens en caché y los renueva sin interacción. <em>Qué no hace:</em> No guarda ningún secreto, porque un navegador no puede, y no toma decisiones de negocio. No puede distinguir el código propio de la app de un script inyectado en la misma página. <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a>, <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a></dd><dt id="bp-text-script">Script inyectado</dt><dd>Código que no debería estar en la página: un payload de XSS o una dependencia comprometida. Corre con el origen de la página y con todo el poder que ella tiene. <em>Qué no hace:</em> No necesita una contraseña ni rompe PKCE: actúa con lo que la página ya puede hacer. Solo lo frena la prevención: una CSP estricta, un renderizado seguro y dependencias mantenidas. <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></dd><dt id="bp-text-spa">App Angular · presenta, no decide nada</dt><dd>La aplicación de una sola página en localhost:18094. Carga configuración pública, inicia la sesión, pide un token antes de cada llamada y lo envía a una URL fija de la API. <em>Qué no hace:</em> No hace cumplir ningún permiso. Un botón oculto es una comodidad: cualquiera puede cambiar el bundle, o llamar a la API sin él. <a href="lessons/four-boundaries.html?lang=es">Lección 01 · Cuatro componentes, cuatro responsabilidades</a>, <a href="lessons/angular-and-msal.html?lang=es">Lección 09 · Angular y MSAL</a></dd><dt id="bp-text-person">Alice · una persona con una cuenta de trabajo</dt><dd>La persona para la que actúa el sistema. Entra la autentica cuando inicia sesión en Windows en un dispositivo unido, y cuando la app le inicia la sesión; después, la API solo ve evidencia sobre ella: un token con su tenant ID y su object ID. <em>Qué no hace:</em> Nunca le da su contraseña a la app, y nada que pueda cambiar en su navegador decide qué puede leer o aprobar. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/authentication-and-authorization.html?lang=es">Lección 02 · Autenticación y autorización</a>, <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-logon">Login de Windows · LogonUI, LSA</dt><dd>La pantalla de inicio de sesión de Windows, LogonUI. Toma las credenciales de Alice, su contraseña de trabajo o Windows Hello for Business, y se las pasa a LSA, la Local Security Authority, donde CloudAP le inicia la sesión en Entra. <em>Qué no hace:</em> No habla con Entra por su cuenta, y la app nunca ve lo que Alice escribe acá. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-tpm">TPM · claves privadas</dt><dd>El Trusted Platform Module, un componente de hardware. Guarda la clave privada del dispositivo, que firma el pedido del PRT, y la clave privada de transporte, que abre la session key que manda Entra. Después envuelve la session key con una clave propia. <em>Qué no hace:</em> Nunca entrega una clave privada, y ningún otro componente de Windows puede usar la session key que protege. Donde un dispositivo no tiene un TPM utilizable, las claves no se pueden atar al hardware. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-cloudap">CloudAP · en LSA, plugin de Entra</dt><dd>El proveedor de inicio de sesión de Windows dentro de la Local Security Authority (LSA). Su plugin de Microsoft Entra convierte el inicio de sesión de Alice en Windows en un PRT, guarda el PRT y la session key en su caché, renueva el PRT al iniciar sesión en Windows cada 4 horas y arma una PRT cookie cuando el navegador la pide. <em>Qué no hace:</em> Nunca le entrega el PRT ni la session key al navegador ni a una aplicación. Las aplicaciones nativas le piden a WAM, el intermediario de tokens de Windows, que usa el mismo PRT y guarda sus refresh tokens cifrados con DPAPI; esta app de navegador no. <em>Cómo verlo:</em> dsregcmd /status, ejecutado como el usuario con la sesión iniciada: AzureAdPrt : YES en SSO State, y la hora de la última renovación. La salida nombra el dispositivo, el tenant y el usuario. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-browser">Navegador · navegación, cookies de Entra, SSO</dt><dd>El navegador mismo, no la página. Lleva la pestaña a Entra y de vuelta, y guarda la cookie de sesión de Entra para login.microsoftonline.com. En un dispositivo unido a Entra, cuando abre una URL de inicio de sesión de Entra le pide a Windows una PRT cookie: Edge lo hace con un perfil que tiene iniciada la sesión de la cuenta de trabajo, y Chrome, con la extensión Microsoft Single Sign On. <em>Qué no hace:</em> Los scripts de la página, MSAL incluido, nunca ven la PRT cookie ni las cookies de Entra: son de otro sitio. Las ventanas privadas no le piden a Windows una PRT cookie. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-authorize">Endpoint de login · /authorize</dt><dd>Adonde va el navegador para iniciar sesión. Entra autentica a la persona, aplica las políticas del tenant, pide consentimiento cuando hace falta y devuelve un code de un solo uso a una redirect URI registrada. En un dispositivo unido a Entra, el navegador puede traer una PRT cookie en lugar de una contraseña. Entra fija su propia cookie de sesión; cerrar sesión termina esa sesión en un endpoint hermano. <em>Qué no hace:</em> En este flujo nunca le entrega tokens a la página, y no conoce las reglas de compra: de quién es la solicitud 42 no es asunto de Entra. <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a>, <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a>, <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-devices">Devices · emite el PRT</dt><dd>El registro que Entra tiene de cada dispositivo unido: las mitades públicas de su clave de dispositivo y de su clave de transporte, registradas al unirlo, y si el dispositivo está habilitado. Cuando CloudAP inicia sesión, Entra verifica contra ese registro las credenciales, el nonce y la firma del dispositivo, y emite el PRT con una session key que solo ese dispositivo puede abrir. <em>Qué no hace:</em> La app nunca lo llama: solo lo hace el intermediario de inicio de sesión del dispositivo. Un dispositivo conocido prueba qué computadora pregunta, no quién puede aprobar una compra. <a href="lessons/windows-sign-in-and-prt.html?lang=es">Lección 10 · Inicio de sesión de Windows y Primary Refresh Token</a></dd><dt id="bp-text-registrations">App registrations · SPA: redirect URI · API: scopes, rol</dt><dd>Dos objetos de aplicación. El de la API define el recurso: su Application ID URI, los scopes delegados Requests.Read y Requests.Approve, el app role de usuario Approver y los access tokens v2. El de la SPA define un cliente público y su redirect URI. <em>Qué no hace:</em> Un registro es configuración, no prueba de nada en tiempo de ejecución. El registro de la SPA no guarda ningún secreto, y no tiene que guardarlo. <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a>, <a href="lessons/tenant-app-principal.html?lang=es">Lección 03 · Tenant, aplicación, service principal</a></dd><dt id="bp-text-tokenep">Token endpoint · /token</dt><dd>Canjea el authorization code con el verifier de PKCE, renueva con el refresh token y emite tokens firmados: un ID token para el cliente y un access token para la API. <em>Qué no hace:</em> Nunca ve los pedidos a la API. Una vez emitido un token, la API lo verifica por su cuenta, y nada lo retira. <a href="lessons/authorization-code-pkce.html?lang=es">Lección 05 · Seguí el authorization code</a>, <a href="lessons/three-token-jobs.html?lang=es">Lección 06 · Tres trabajos de los tokens</a>, <a href="lessons/token-lifecycle.html?lang=es">Lección 18 · Vencimiento, renovación y cierre de sesión</a></dd><dt id="bp-text-keys">Claves de firma · JWKS</dt><dd>Entra firma los tokens con claves privadas y publica las mitades públicas, con los metadatos del issuer, para que cualquier recurso pueda verificar una firma. Las claves rotan. <em>Qué no hace:</em> Una clave pública no puede firmar. Y un recurso encuentra las claves a partir de su issuer configurado, nunca de una URL escrita dentro de un token. <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></dd><dt id="bp-text-enterprise">Enterprise applications · consentimiento, asignación de roles</dt><dd>Los service principals: cómo existe cada aplicación en este tenant. Acá viven los consentimientos y la asignación de Approver a usuarios. <em>Qué no hace:</em> Una asignación no llega a los tokens ya emitidos; da forma a los siguientes. <a href="lessons/tenant-app-principal.html?lang=es">Lección 03 · Tenant, aplicación, service principal</a>, <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a>, <a href="lessons/scopes-and-consent.html?lang=es">Lección 07 · Scopes y consentimiento</a></dd><dt id="bp-text-admin">Administrador · Entra admin center</dt><dd>Una persona con permisos de directorio que registra las dos aplicaciones, otorga el consentimiento y asigna el rol Approver. <em>Qué no hace:</em> Un rol de administrador del directorio no es aprobación de compras: administrar el tenant y aprobar solicitudes son autoridades distintas. <a href="lessons/two-registrations.html?lang=es">Lección 04 · Dos registros, una experiencia de aplicación</a>, <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a>, <a href="lessons/connect-a-real-tenant.html?lang=es">Lección 19 · Conectá un tenant real de Entra</a></dd><dt id="bp-text-filters">CORS y filtro bearer · la puerta de entrada</dt><dd>La puerta de entrada de la API.
