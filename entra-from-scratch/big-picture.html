CORS responde los preflights para el origen exacto localhost:18094; el filtro bearer toma el token del header Authorization y se lo pasa al decoder. La cadena escribe cada 401 y cada 403. <em>Qué no hace:</em> No hay sesión ni login con cookie, así que la protección CSRF está apagada a propósito. CORS no autentica a nadie. <a href="lessons/read-the-http-result.html?lang=es">Lección 13 · Leé bien un rechazo</a>, <a href="lessons/browser-threats-and-bff.html?lang=es">Lección 21 · Amenazas en el navegador y decisiones de arquitectura</a></dd><dt id="bp-text-decoder">JwtDecoder · verificar, después confiar</dt><dd>Verifica la firma con las claves públicas del issuer configurado, después el issuer y el tiempo, y después el contrato de la API: audiencia, tenant, versión 2.0, el cliente permitido (azp) y un oid bien formado. <em>Qué no hace:</em> Nunca toma un issuer ni una URL de claves del token, y no autoriza: un token válido igual puede recibir 403 o 404. <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></dd><dt id="bp-text-converter">Conversor de authorities · scp, roles</dt><dd>Convierte el token validado en authorities de Spring: cada valor de scp pasa a ser SCOPE_ más su nombre, y el rol reconocido Approver pasa a ser ROLE_Approver. <em>Qué no hace:</em> No mapea nada más: ningún rol de directorio, ningún grupo y ningún estado del navegador se convierte en un permiso de compra. <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></dd><dt id="bp-text-rule">Regla del método · @PreAuthorize</dt><dd>Un requisito por operación. Leer necesita SCOPE_Requests.Read. Aprobar necesita SCOPE_Requests.Approve y ROLE_Approver, los dos. Textos exactos, con hasAuthority. <em>Qué no hace:</em> No sabe de quién es una fila: eso le toca a la consulta, y a la política de abajo. <a href="lessons/roles-and-resource-rules.html?lang=es">Lección 08 · Roles y reglas del recurso</a>, <a href="lessons/claims-to-authorities.html?lang=es">Lección 12 · De los claims a las authorities de Spring</a></dd><dt id="bp-text-controller">Controlador · una transacción, un SQL</dt><dd>Abre una transacción, fija app.tenant, app.subject y app.approver con set_config(name, value, true) y ejecuta una sentencia parametrizada cuyo tenant y cuyo dueño salen del token validado. <em>Qué no hace:</em> Nunca toma la identidad de la URL, de un header ni del cuerpo: de quien llama sale solo el número de la solicitud. <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a>, <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></dd><dt id="bp-text-pool">Pool de conexiones · 3 conexiones</dt><dd>Hikari mantiene tres conexiones abiertas y presta una para cada transacción. Todas las conexiones entran como app_runtime. <em>Qué no hace:</em> No limpia los settings de sesión entre un préstamo y otro: por eso el contexto se fija dentro de la transacción y muere con ella. <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a>, <a href="lessons/transactions-and-pools.html?lang=es">Lección 17 · Transacciones, pools y carreras</a></dd><dt id="bp-text-runner">node lab.mjs · sin navegador</dt><dd>El ejecutor de pruebas del kit, en tu computadora. Llama a la API con tokens de prueba con nombre, inspecciona los roles y las políticas de PostgreSQL y verifica cada estado esperado. <em>Qué no hace:</em> Se niega a correr contra el modo Entra, y nunca prueba un inicio de sesión real. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/debug-without-leaking.html?lang=es">Lección 22 · Depurá sin filtrar credenciales</a>, <a href="lessons/capstone.html?lang=es">Lección 24 · Trabajo final: defendé un pedido</a></dd><dt id="bp-text-dispenser">Emisor de tokens · :18096</dt><dd>Un servicio chiquito que firma JWT con la clave propia del kit, uno por caso con nombre: alice, bob, approver, expired, forged, no-scope, app-only y más. Publica esa clave pública en /jwks, y en modo fixture la app Angular le pide los tokens a él en lugar de a MSAL. <em>Qué no hace:</em> No es un proveedor OpenID ni es Entra: no autentica a nadie. Nunca lo expongas fuera de tu máquina. <a href="lessons/before-you-start.html?lang=es">Lección 00 · Antes de empezar</a>, <a href="lessons/validate-the-token.html?lang=es">Lección 11 · Validá antes de confiar</a></dd><dt id="bp-text-graph">Otra API · Microsoft Graph</dt><dd>Un recurso de más abajo, con su propia audiencia y sus propios permisos. <em>Qué no hace:</em> No tiene que aceptar un token emitido para la API de compras. El kit no hace ninguna llamada hacia abajo. <a href="lessons/workloads-and-downstream-apis.html?lang=es">Lección 20 · Usuarios, workloads y APIs de más abajo</a></dd><dt id="bp-text-table">purchase_request · 41 Alice · 42 Bob · 43 otro tenant</dt><dd>Las filas de práctica: la 41 es de Alice, la 42 es de Bob, la 43 es de otro tenant. Cada una tiene un tenant, el oid de un dueño y un estado, PENDING o APPROVED. <em>Qué no hace:</em> Nada en una fila dice quién la puede ver: eso lo deciden la consulta y la política. <a href="lessons/ownership-and-idor.html?lang=es">Lección 14 · La propiedad es una regla de autorización</a>, <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></dd><dt id="bp-text-role">app_runtime · sin BYPASSRLS</dt><dd>El principal de base de datos de la API: no es superusuario ni BYPASSRLS, puede hacer SELECT de la tabla y UPDATE solo de la columna de estado. Las migraciones usan otro rol. <em>Qué no hace:</em> No sabe nada de Alice: PostgreSQL autentica la conexión, no al usuario del navegador. El token de la API nunca llega a la base de datos. <a href="lessons/postgres-identity.html?lang=es">Lección 15 · PostgreSQL autentica a la API</a></dd><dt id="bp-text-policy">Política RLS · request_boundary</dt><dd>Row-level security sobre purchase_request, forzada incluso para el dueño de la tabla. Para leer: el mismo tenant, y ser dueño o aprobador. Para cambiar: el mismo tenant y ser aprobador. <em>Qué no hace:</em> Confía en los textos de contexto que fija la API. Es un segundo límite, no una prueba criptográfica. <a href="lessons/row-level-security.html?lang=es">Lección 16 · Row-level security como segundo límite</a></dd></dl></section><section><h3>Tokens, claves, cookies</h3><dl><dt>D · Claves del dispositivo</dt><dd>Dos pares de claves que Windows crea cuando el dispositivo se une a Entra. La clave del dispositivo firma sus pedidos; la clave de transporte le permite a Entra cifrar la session key solo para este dispositivo. <em>De dónde viene:</em> El dispositivo mismo, cuando se une a Entra. <em>Dónde termina:</em> Las mitades privadas quedan en el TPM; las públicas se registran con el dispositivo en Entra. <em>Dónde está, momento a momento:</em> Cuando el dispositivo se une: Windows crea los dos pares y registra las mitades públicas en Entra. Desde entonces: Las mitades privadas quedan en el TPM y nunca salen de ahí. En cada pedido del PRT: El TPM firma con la clave privada del dispositivo; Entra verifica la firma con la mitad pública.</dd><dt>P · Primary Refresh Token (PRT)</dt><dd>Un token que Entra le emite al intermediario de inicio de sesión del dispositivo, no a una aplicación. Con él, CloudAP le puede conseguir a Alice una sesión en Entra sin volver a pedirle credenciales. <em>De dónde viene:</em> Entra, al iniciar sesión en Windows, después de verificar las credenciales, el nonce y el dispositivo. <em>Dónde termina:</em> La caché de CloudAP dentro de LSA, solo en este dispositivo: vale 90 días y se renueva mientras se usa el dispositivo. <em>Dónde está, momento a momento:</em> Al iniciar sesión en Windows: Entra se lo emite a CloudAP, que lo guarda en su caché dentro de LSA. Mientras Alice trabaja: Se queda en esa caché. CloudAP lo renueva al iniciar sesión en Windows cada 4 horas. Cuando una app inicia sesión: Sigue en CloudAP: el navegador solo recibe una PRT cookie hecha a partir de él. Cuando deja de servir: A los 90 días sin renovarse, o cuando Entra lo invalida: usuario o dispositivo borrado o deshabilitado, o un cambio de contraseña si el PRT salió de la contraseña.</dd><dt>S · Session key</dt><dd>Una clave que Entra emite con el PRT. Los pedidos que usan el PRT se firman con ella, y eso prueba que vienen del dispositivo que recibió el PRT. <em>De dónde viene:</em> Entra, con el PRT, cifrada con la clave pública de transporte del dispositivo. <em>Dónde termina:</em> La caché de CloudAP, envuelta por el TPM; ningún otro componente la puede usar. <em>Dónde está, momento a momento:</em> Al iniciar sesión en Windows: Llega cifrada para la clave de transporte. El TPM la descifra y la vuelve a envolver con su propia clave. Después: CloudAP guarda la clave envuelta junto al PRT. En cada uso: El TPM firma con ella, por ejemplo una PRT cookie. La clave misma nunca sale del dispositivo.</dd><dt>W · PRT cookie</dt><dd>Un valor que CloudAP arma para un único pedido de inicio de sesión, con el nonce que Entra puso en la URL de inicio de sesión, firmado con la session key. Entra lo acepta como prueba de que Alice tiene la sesión iniciada en este dispositivo. <em>De dónde viene:</em> CloudAP, cuando el navegador abre una URL de inicio de sesión de Entra. <em>Dónde termina:</em> El header x-ms-RefreshTokenCredential de ese único pedido a /authorize. <em>Dónde está, momento a momento:</em> Cuando la pestaña va a Entra: El navegador se la pide a CloudAP, con el nonce de la URL. Un momento después: CloudAP la arma y el TPM la firma con la session key. Para un solo pedido: Viaja en el header x-ms-RefreshTokenCredential hacia /authorize. Los scripts de la página nunca la ven. Después: Está atada a ese nonce: el próximo inicio de sesión pide una nueva.</dd><dt>E · Cookie de sesión de Entra</dt><dd>La cookie que Entra fija para su propio sitio después de un inicio de sesión. Las visitas siguientes a /authorize pueden saltear las credenciales. Si el inicio de sesión usó una PRT cookie, queda atada a la session key del dispositivo, así que una copia no sirve desde otro dispositivo. <em>De dónde viene:</em> /authorize, después de que Alice inicia sesión. <em>Dónde termina:</em> Las cookies del navegador para login.microsoftonline.com, fuera del alcance de los scripts de la app. <em>Dónde está, momento a momento:</em> Después del inicio de sesión: Entra la fija para login.microsoftonline.com. Vive en el almacén de cookies del navegador, no en sessionStorage. En la próxima visita a /authorize: El navegador la manda de vuelta, y Entra puede responder sin pedir credenciales. Al cerrar sesión: Entra termina esa sesión en su endpoint de cierre de sesión.</dd><dt>C · Authorization code</dt><dd>Un code de un solo uso que Entra devuelve a la redirect URI registrada después del inicio de sesión. Dura poco y no sirve sin el verifier. <em>De dónde viene:</em> El endpoint de inicio de sesión de Entra, después del inicio de sesión. <em>Dónde termina:</em> MSAL lo canjea una vez en el token endpoint. <em>Dónde está, momento a momento:</em> Después del inicio de sesión: En el redirect de /authorize de vuelta a /redirect. Un momento después: El bridge de MSAL se lo pasa a MSAL, que lo canjea en /token con el verifier. Después del canje: Ya no sirve: un code se canjea una sola vez.</dd><dt>V · Verifier de PKCE</dt><dd>Un secreto al azar que MSAL crea para cada inicio de sesión, y su hash S256, el challenge. Primero viaja el hash; el verifier, solo en el canje. <em>De dónde viene:</em> MSAL, en el navegador. <em>Dónde termina:</em> El token endpoint lo compara con el challenge. <em>Dónde está, momento a momento:</em> Antes de /authorize: MSAL lo crea y lo guarda en la pestaña mientras el inicio de sesión está en curso. A /authorize va solo su hash. En /token: Se manda una vez, con el code. Entra calcula su hash y compara. Después: No se vuelve a necesitar: el próximo inicio de sesión hace uno nuevo.</dd><dt>I · ID token</dt><dd>El resultado del inicio de sesión para la app: quién inició sesión, para este cliente. Su audiencia es la SPA, no la API. <em>De dónde viene:</em> El token endpoint de Entra. <em>Dónde termina:</em> La caché de MSAL, para mostrar la cuenta. La API lo rechaza. <em>Dónde está, momento a momento:</em> En /token: Se emite con el access token y el refresh token. Después: En el sessionStorage de la pestaña, de donde MSAL lee la cuenta. Cuando se cierra la pestaña: Desaparece con el sessionStorage.</dd><dt>A · Access token</dt><dd>Un JWT firmado para la API de compras: audiencia, tenant, oid, scp, roles y límites de tiempo. Una credencial bearer: quien la tiene la puede usar. <em>De dónde viene:</em> El token endpoint de Entra, para los scopes de la API. <em>Dónde termina:</em> El header Authorization de cada llamada; Spring lo verifica cada vez. <em>Dónde está, momento a momento:</em> En /token: Se emite para los scopes y la audiencia de la API. Hasta que vence: En el sessionStorage de la pestaña, donde lo encuentra acquireTokenSilent. En cada llamada: Se copia en el header Authorization de un pedido. La API lo valida y no guarda nada: no hay sesión. Después de cerrar sesión: Ya no está en la pestaña, pero cualquier copia sigue valiendo hasta su exp.</dd><dt>R · Refresh token</dt><dd>Le permite a MSAL obtener tokens nuevos de Entra sin un nuevo inicio de sesión, dentro de las políticas del tenant. Emitido para una SPA, dura 24 horas desde que se emite, en una ventana que no se corre. <em>De dónde viene:</em> El token endpoint de Entra, al iniciar sesión. <em>Dónde termina:</em> La caché de MSAL; solo Entra lo vuelve a recibir. <em>Dónde está, momento a momento:</em> En /token: Se emite con los otros tokens. Durante 24 horas: En el sessionStorage de la pestaña. MSAL lo manda solo a /token, para renovar. Pasadas 24 horas: Vencido. MSAL prueba un iframe oculto contra /authorize; donde las cookies de terceros están bloqueadas eso falla, y un redirect consigue un code nuevo.</dd><dt>K · Claves públicas de firma</dt><dd>Las mitades públicas de las claves de firma, publicadas como JWKS. Con ellas cualquiera puede verificar una firma; nadie puede firmar. <em>De dónde viene:</em> Los metadatos de Entra; en modo fixture, el /jwks del kit. <em>Dónde termina:</em> La caché del decoder, que se refresca cuando aparece un key ID nuevo. <em>Dónde está, momento a momento:</em> Publicadas: En los metadatos de Entra para el issuer del tenant. En la API: En la caché del decoder, que las vuelve a buscar cuando un token nombra un key ID desconocido.</dd><dt>T · Token de prueba</dt><dd>Un JWT firmado con la clave propia del kit, con una sola cosa cambiada por caso: vencido, falsificado, otra audiencia, sin scope, sin usuario... <em>De dónde viene:</em> El emisor de tokens en :18096. <em>Dónde termina:</em> La API en modo fixture. En modo Entra recibe 401. <em>Dónde está, momento a momento:</em> A pedido: Lo firma el emisor para un caso con nombre. Durante una llamada: Lo tiene el ejecutor del lab, que lo manda en el header Authorization. Después: Nadie lo guarda: la API no almacena ningún token.</dd><dt>X · Contexto de la transacción</dt><dd>app.tenant, app.subject y app.approver, fijados con set_config(name, value, true). Existen solo dentro de la transacción actual. <em>De dónde viene:</em> El controlador, a partir de tid, oid y ROLE_Approver. <em>Dónde termina:</em> Lo lee la política RLS; lo borra el COMMIT o el ROLLBACK. <em>Dónde está, momento a momento:</em> Dentro de la transacción: Lo fija el controlador en la conexión prestada. Durante el SQL: Lo lee la política RLS. En el COMMIT o el ROLLBACK: Se borra: quien tome la conexión después no ve nada de él.</dd></dl></section></div></main></noscript><script src="assets/curriculum.js"></script><script src="assets/big-picture-data.js"></script><script src="assets/big-picture.js"></script></body></html>
